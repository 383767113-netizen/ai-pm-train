<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI PM 面试训练</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--sub:#6b7280;
  --accent:#1d4ed8;--accent-dim:#dbeafe;--green:#059669;--green-dim:#d1fae5;
  --amber:#d97706;--amber-dim:#fef3c7;--red:#dc2626;--red-dim:#fee2e2;
  --radius:8px;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}

/* Top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;margin-right:auto}
.topbar-nav{display:flex;gap:2px}
.topbar-nav button{height:34px;padding:0 14px;border:none;border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .12s;display:flex;align-items:center;gap:5px}
.topbar-nav button:hover{background:#f1f5f9;color:var(--text)}
.topbar-nav button.active{background:var(--accent);color:#fff}
.topbar-nav button svg{width:14px;height:14px;flex-shrink:0}
.topbar-nav .nav-label{display:none}
.main{padding:12px 12px 24px;max-width:900px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* Study panel */
.study-tabs{display:flex;gap:0;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.study-tabs button{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.study-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.study-sidebar{background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius);padding:8px 0;margin-bottom:12px;max-height:200px;overflow-y:auto}
.study-sidebar-header{padding:6px 14px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.study-sidebar-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .1s;display:flex;align-items:center;gap:8px;border-radius:4px;margin:1px 6px}
.study-sidebar-item:active{background:#e5e7eb}
.study-sidebar-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.study-sidebar-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.study-sidebar-item.active .dot{background:var(--accent)}
.study-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;overflow-y:auto;max-height:60vh;font-size:14px;line-height:1.75}
.study-content h2{font-size:18px;font-weight:700;margin:0 0 8px}
.study-content h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--sub)}
.study-content p{margin:6px 0}
.study-content ol,.study-content ul{margin:6px 0 6px 18px}
.study-content li{margin:3px 0;line-height:1.6}
.study-content blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:#f8fafc;color:var(--sub);font-size:13px;font-style:italic}
.study-content table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.study-content th,.study-content td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.study-content th{background:#f8fafc;font-weight:600;font-size:11px;color:var(--sub)}
.study-content strong{color:var(--text)}
.study-content pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid var(--border);max-height:50vh;overflow-y:auto}
.study-content code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:12px}

/* Quiz panel */
.quiz-header{margin-bottom:12px}
.quiz-header h2{font-size:18px;font-weight:700;margin-bottom:2px}
.quiz-header p{font-size:12px;color:var(--sub)}
.section-pills{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.section-pill{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:15px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .12s;display:flex;align-items:center}
.section-pill:active{border-color:var(--sub)}
.section-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-pill.done{border-color:var(--green);color:var(--green)}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.quiz-card h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.q-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:var(--accent-dim);color:var(--accent)}
.quiz-card .q-text{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--text)}
.quiz-card .q-hint{font-size:11px;color:var(--sub);margin-bottom:8px;padding:6px 10px;background:#fefce8;border-radius:4px;border-left:3px solid var(--amber)}
.quiz-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.6;resize:vertical;-webkit-appearance:none}
.quiz-card textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}

/* Buttons */
.btn{height:40px;padding:0 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;gap:6px;-webkit-appearance:none}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center}
.btn-primary:active{opacity:.85}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:32px;padding:0 10px;font-size:12px}

/* Results */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.result-score{font-size:36px;font-weight:800}
.result-score.good{color:var(--green)}.result-score.ok{color:var(--amber)}.result-score.bad{color:var(--red)}
.result-meta{font-size:12px;color:var(--sub)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.result-stat{text-align:center;padding:10px;background:#f8fafc;border-radius:var(--radius)}
.result-stat .num{font-size:16px;font-weight:700}
.result-stat .lbl{font-size:10px;color:var(--sub);margin-top:2px}
.feedback-item{padding:10px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:12px;line-height:1.5}
.feedback-item.pass{background:var(--green-dim);border:1px solid #a7f3d0}
.feedback-item.fail{background:var(--red-dim);border:1px solid #fecaca}
.feedback-item .fb-title{font-weight:600;margin-bottom:3px}
.feedback-item .caught{color:var(--green);font-weight:500}
.feedback-item .missed{color:var(--red);font-weight:500}
.analysis-box{padding:12px;background:#f8fafc;border-radius:var(--radius);font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}

/* Progress */
.progress-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.progress-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.progress-stat .val{font-size:24px;font-weight:700}
.progress-stat .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.chart-container h3{font-size:13px;font-weight:600;margin-bottom:10px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px;overflow-x:auto}
.chart-bar{flex:1;min-width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.chart-label{text-align:center;font-size:9px;color:var(--sub);margin-top:4px}
.weakpoint-table{width:100%;border-collapse:collapse;font-size:11px}
.weakpoint-table th{text-align:left;padding:6px 8px;background:#f8fafc;font-size:10px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border)}
.weakpoint-table td{padding:6px 8px;border-bottom:1px solid var(--border);line-height:1.4}
.score-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.score-badge.bad{background:var(--red-dim);color:var(--red)}
.score-badge.warn{background:var(--amber-dim);color:var(--amber)}
.empty{padding:32px;text-align:center;color:var(--sub);font-size:13px}
.history-item{padding:10px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.history-item:active{background:#f1f5f9}

/* Desktop overrides */
@media(min-width:768px){
  .main{padding:20px 24px;max-width:1100px}
  .study-layout-desktop{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .study-sidebar-desktop{background:#fafbfc;border-right:1px solid var(--border);padding:10px 0;overflow-y:auto}
  .study-content-desktop{padding:28px 36px;overflow-y:auto;max-height:calc(100vh - 120px)}
  .topbar-nav .nav-label{display:inline}
  .section-pill{height:32px;padding:0 12px;font-size:12px}
  .quiz-card{padding:18px 22px}
  .quiz-card textarea{min-height:100px}
  .progress-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <span class="topbar-brand">AI PM 面试训练</span>
  <nav class="topbar-nav">
    <button id="nav-study" class="active" onclick="switchPanel('study')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span class="nav-label">学习</span>
    </button>
    <button id="nav-quiz" onclick="switchPanel('quiz')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span class="nav-label">自检</span>
    </button>
    <button id="nav-progress" onclick="switchPanel('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
      <span class="nav-label">进度</span>
    </button>
  </nav>
</header>
<main class="main">

<div id="panel-study" class="panel active">
  <div class="study-tabs" id="study-tabs">
    <button class="active" onclick="switchStudyTab('product')">产品逐字稿</button>
    <button onclick="switchStudyTab('resume')">简历逐字稿</button>
    <button onclick="switchStudyTab('quick')">辅助速查</button>
  </div>
  <div id="study-sidebar-mob" class="study-sidebar"></div>
  <div id="study-content" class="study-content">
    <div class="empty">从上方选择一个章节开始学习</div>
  </div>
</div>

<div id="panel-quiz" class="panel">
  <div class="quiz-header">
    <h2>板块自检测试</h2>
    <p>每学完一个板块就做对应的题目，系统自动评分</p>
  </div>
  <div class="section-pills" id="section-pills"></div>
  <div id="quiz-body"><div class="empty">选择上方板块开始测试</div></div>
  <div id="quiz-result" class="result-card" style="display:none"></div>
</div>

<div id="panel-progress" class="panel">
  <div class="progress-grid" id="progress-stats"></div>
  <div class="chart-container">
    <h3>各板块得分</h3>
    <div class="chart-bars" id="progress-chart"></div>
  </div>
  <div class="chart-container">
    <h3>薄弱点</h3>
    <div id="weak-table-container"><div class="empty">暂无数据</div></div>
  </div>
  <div class="chart-container">
    <h3>历史记录</h3>
    <div id="history-list"><div class="empty">暂无记录</div></div>
  </div>
</div>
</main>
</div>

<script>
var _C = {"p1": "## 餐饮商户 AI 营销经营助手——面试逐字稿 学习笔记\n\n> **学习方法**：先理解整体故事线，再逐段精读，最后脱稿模拟面试。不要死记硬背逐字稿文字，而是记住每个模块的回答思路和关键数据。\n\n---\n\n## 故事线（面试叙事主线）\n\n```\n商户入驻 → 但不会经营 → 我在一线反复看到这个问题\n  → 判断AI适合解决 → 主导设计产品\n  → 核心功能：需求诊断→竞品分析→套餐设计→文案视觉→审核→复盘\n  → 最大挑战：菜品真实性（40%→85%）\n  → 验证结果：效率+质量+经营+组织四层成果\n  → 反思：不要只做生成，要做任务完成闭环\n```\n\n---\n\n## 一、产品背景：为什么做这个产品\n\n### 回答思路（记住6步递进结构）\n\n1. 交代业务场景：字节本地生活，餐饮商户拓展/入驻/装修/套餐/活动/复盘\n2. 「入驻 ≠ 会经营」：入驻后还要商圈研究、货盘规划、套餐设计、定价、文案、视觉、推广\n3. 按用户类型拆解问题：中小商户缺团队 / 连锁商户批量+本地化矛盾 / 内部运营交付效率\n4. 原方式不可规模化：依赖人工查询、个人经验、临时沟通、逐版修改\n5. 为什么适合AI：非结构化信息（需求描述/评价/参考图）→大模型；结构化数据（价格/成本/规则）→规则系统；最终方案→人工确认\n6. 产品定位：不是单一图片生成器，而是B端AI营销经营辅助产品\n\n### 记忆结构（6句话）\n\n> 业务场景真实存在 → 商户入驻后仍不会经营 → 中小商户缺团队，连锁商户难批量 → 人工服务成本高且无法复制 → AI适合处理理解、分析和生成 → 产品定位为经营策略与内容生产一体化助手\n\n### 面试官考察方向（5个判断点）\n\n1. **需求是不是真实需求**：是否在真实工作中反复发现，还是看到大模型流行后强行找场景\n2. **是否理解目标用户**：MVP阶段主要用户是内部商务和运营，商户是资料提供者和方案确认者\n3. **为什么需要AI而不是普通系统**：普通系统不能理解模糊表达、总结评价、理解参考图、生成多版本内容\n4. **产品价值是否足够清晰**：三层价值——对商户降低门槛 / 对运营降低重复成本 / 对平台提高效率和经营质量\n5. **是否具备商业化价值**：AI服务可作为商户入驻增值服务，也可作为商务拓展的「钩子」\n\n### 注意事项（5条红线）\n\n1. **不要一上来就讲技术**：错误 →「因为大模型发展快所以想做AI」。正确 →「我先在商户服务中发现了需求沟通、套餐设计和内容生产三个高频问题，再判断哪些环节适合用AI」\n2. **不要把项目只讲成图片生成**：完整价值是「需求理解→市场策略→套餐设计→文案及视觉生产→质量审核→数据复盘」\n3. **不要说商户完全不会运营**：部分商户有经验但缺系统方法和专业人力。更准确的表达：「不同商户线上运营能力差异较大，中小商户普遍缺少专业团队」\n4. **不要声称AI可以自动完成最终经营决策**：套餐定价、商户成本、活动资源和最终上线内容都需要人工确认\n5. **需要明确实际项目边界**：「项目已完成需求验证、方案设计、商户试点和团队内部复用，核心场景通过现有AI能力进行了验证；完整系统化能力属于产品化方案和后续迭代方向」\n\n### 产品背景逐字稿（原文完整版）\n\n我在字节跳动本地生活业务担任商务经理，日常主要负责餐饮商户的拓展、平台入驻、门店装修、套餐规划、营销活动和后续经营复盘。\n\n在这个过程中，我发现一个比较典型的问题，就是商户完成入驻以后，并不代表已经具备线上经营能力。平台给了商户一个经营入口，但商户还需要解决卖什么套餐、怎么定价、怎么装修门店、怎么做营销内容以及怎么根据数据继续优化这些问题。\n\n对中小餐饮商户来说，他们通常没有完整的线上运营团队，老板可能很懂菜品和线下经营，但不一定熟悉平台用户、团购套餐和线上内容。他们提出的需求也比较模糊，比如会说「帮我把菜做得好看一点」「套餐设计得更有吸引力」或者「参考附近卖得好的商家」，但是很难进一步说明目标用户、价格策略、视觉风格和内容使用场景。\n\n对连锁商户来说，问题不完全一样。总部希望所有门店保持统一的品牌形象，但不同城市、不同商圈和不同门店又需要结合本地用户做差异化套餐和内容。如果完全依赖人工逐店处理，周期和成本都会比较高。\n\n对内部商务和运营人员来说，也存在明显的效率问题。商圈竞品、套餐价格、用户评价需要人工在不同渠道中搜索和整理，门店头图、菜品图和文案又要重复制作，很多经验沉淀在个人手里，很难快速复制给其他同事。\n\n我当时判断，这个场景比较适合AI，不是单纯因为AI能够生成图片，而是因为整个流程中存在大量非结构化但又可以标准化的任务。比如商户的模糊需求可以被拆成结构化参数，用户评价可以被AI归类总结，参考图片可以被多模态模型理解，文案和视觉素材可以批量生成。但是像菜品价格、成本、套餐内容和平台合规这些，仍然需要用结构化数据和规则来控制。最终方案由人工确认。\n\n所以我当时是把产品定位成一款面向内部商务、运营以及餐饮商户的B端AI营销经营辅助产品，而不是单一图片生成工具。\n\n### 产品背景高频QA\n\n**Q：商户为什么不能自己写Prompt？**\nA：商户不熟悉平台用户、套餐设计、视觉规则和内容规范，他们通常只能表达表层需求，很难说出「目标用户是25-35岁双人用餐场景，主色调暖色，突出牛肉纹理」这类具体要求。产品需要帮商户把模糊需求翻译成可执行参数。\n\n**Q：为什么不用现成的设计工具？**\nA：现成设计工具不解决需求诊断、竞品分析和套餐策略问题，也不理解菜品真实性约束。商户仍然需要自行完成调研、策略和设计，工具之间互相割裂。\n\n**Q：商务工作为什么让你有机会做AI产品？**\nA：商务拓展需要深度理解商户需求和行业问题，同时需要向内部反馈共性需求、协调产品和运营资源。我恰恰在长期服务商户的过程中，把共性问题提炼成了产品方案。\n\n---\n\n## 二、产品功能：产品具体解决什么问题\n\n### 回答思路\n\n你看到的23页需求文档，面试时不需要全讲。记住5个核心模块的「一句话价值+关键设计」：\n\n| 模块 | 一句话价值 | 关键设计 |\n|------|----------|---------|\n| 需求诊断 | 把模糊需求变成结构化参数 | 表单+上传+多模态识别+人工确认事实字段 |\n| 竞品分析 | 从零散信息到可执行策略 | 标准化竞品档案+价格带/套餐/评价/视觉四维分析 |\n| 套餐设计 | 把菜品变成有策略的套餐组合 | 菜品池+成本约束+引流/主推/利润三档+规则算价 |\n| 文案视觉 | 批量生产真实且品牌一致的内容 | 三层Prompt+3版样片确认+事实字段锁定+批量生成 |\n| 质量审核 | AI生产内容不可直接上线 | 分级审核（通过/建议修改/禁止上线）+高风险阻断 |\n\n### 面试官考察方向\n\n- 每个功能为什么这样设计\n- 设计取舍：为什么MVP不做A而做B\n- 是否理解核心难点（菜品真实性是最大难点）\n\n### 需求诊断模块逐字稿\n\n第一个核心功能是商户需求智能诊断。\n\n我们没有让商户直接写Prompt，而是通过结构化表单收集商户地址、菜系、客单价、核心菜品、目标用户和营销目标，并支持上传菜单、菜品原图、品牌Logo和参考图。\n\n多模态能力帮助识别菜单、菜品和参考图，大语言模型将自然语言需求拆成品牌、用户、场景、视觉和真实性参数。\n\n但价格、菜品和营业时间等事实字段必须经过人工确认，最终形成统一需求基线。\n\n### 需求诊断高频QA\n\n**Q：为什么不让商户直接写Prompt？**\nA：商户不熟悉平台用户和内容规范，直接写Prompt反而增加错误风险。结构化表单让商户表达他们能表达的信息，模型负责翻译和拆解。\n\n**Q：商户填表单也很麻烦怎么办？**\nA：可以通过菜单拍照自动解析、历史资料复用和参考案例推荐降低填写成本，但关键信息仍需要确认。\n\n---\n\n### 竞品分析模块逐字稿\n\n第二个功能是商圈竞品分析。\n\n运营人员导入周边商户的套餐、价格、销量和评价，系统分析商圈价格带、热销套餐结构、用户关注点和竞品视觉策略，并给出可解释的市场机会，而不是只输出一个竞品名单。\n\n### 套餐设计模块逐字稿\n\n第三个功能是套餐设计。\n\n系统基于真实菜品池、成本、目标用户和竞品数据，生成引流款、主推款和利润款三档方案。\n\n价格和毛利通过结构化规则测算，大模型主要负责套餐定位、市场差异和卖点表达，最终由商户和运营确认。\n\n如果商户没有提供成本，系统只给市场参考区间，不做利润承诺。\n\n### 文案视觉模块逐字稿\n\n第四个功能是文案和视觉内容生产。\n\n文案支持套餐标题、卖点、门店介绍、达人脚本和活动文案。商户名称、价格、菜品和活动时间属于强事实字段，只能引用确认数据。\n\n视觉部分支持菜品图、门店头图、套餐封面和活动海报。系统先理解真实菜品图和参考图中的食材、构图、光线和色调，再生成候选方案。\n\n项目中最关键的挑战是菜品真实性。初期图片视觉上比较好看，但经常出现食材变化、分量失真、摆盘错误和不同批次风格漂移。\n\n我将问题分成真实性、视觉和品牌一致性几类，先后测试了5类方案，最终形成三层提示词：\n- 第一层：菜品、用户和使用场景\n- 第二层：色调、构图、光线和餐具\n- 第三层：核心食材、分量、烹饪状态和禁止元素\n\n同时，批量生成前先输出3版风格样片，由商户确认一版作为单店风格基准，后续素材统一继承。这样可以有效控制不同批次之间的风格漂移。\n\n在评测上，我们不只看好不好看，而是判断菜品主体、核心食材、分量、烹饪状态、品牌风格和是否可以上线。\n\n经过优化，菜品还原合格率从40%提升到85%，单项目平均修改轮次从5轮下降到2到3轮，单版素材平均生产时间从30分钟缩短到10分钟。\n\n### 文案视觉高频QA\n\n**Q：为什么是3版样片而不是5版或1版？**\nA：1版选择太少，商户可能不满意但说不清原因。5版太多，商户容易选择困难。3版恰好足够展示风格差异，又不会让商户眼花缭乱。\n\n**Q：三层Prompt具体怎么设计的？**\nA：第一层定义要生成什么（什么菜品、给谁看、用在什么场景），第二层定义怎么好看（色调、光线、构图、餐具），第三层定义什么不能错（食材不能变、分量不能夸张、不能出现的元素）。三层各司其职，改风格不会改食材，改食材不会改风格。\n\n**Q：菜品还原率40%为什么这么低？**\nA：初期使用较通用的生成方式，视觉效果不错但没有足够真实菜品和食材约束。餐饮场景的验收标准比普通美图严格，核心食材、分量或烹饪状态出现明显错误就不能算合格。\n\n---\n\n## 三、业务成果与影响：有什么价值\n\n### 回答思路：四层结构\n\n1. 生产效率\n2. 内容质量\n3. 经营结果\n4. 组织复用\n\n每个指标按「原来—后来—原因—价值」展开。\n\n### 核心数据速记\n\n| 维度 | 数据 | 记忆口诀 |\n|------|------|---------|\n| 效率 | 素材30min→10min，修改5轮→2-3轮 | 「三十分变十分，五轮变两三轮」 |\n| 质量 | 菜品还原率40%→85% | 「四成变八五」 |\n| 经营 | 调研周期约5天→36小时内，转化率提升19% | 「五天变一天半，转化提升近两成」 |\n| 组织 | 沉淀SOP，约50人团队复用 | 「从个人手艺到团队模板」 |\n\n### 业务成果逐字稿（原文完整版）\n\n项目成果主要体现在效率、质量、经营效果和组织复用四个层面。\n\n第一是生产效率。原来一版菜品图或门店素材从需求沟通、生成到调整，平均需要大约30分钟。通过结构化需求采集、分层提示词和风格基准，单版素材平均时间缩短到10分钟，减少了约三分之二。\n\n第二是沟通和质量。原来商户通常在生成后才表达「不喜欢」，单个项目平均需要修改5轮。增加3版风格样片前置确认后，修改轮次下降到2到3轮。\n\n针对川菜图片食材失真问题，经过5类方案测试和三层提示词优化，菜品还原合格率从40%提高到85%。\n\n第三是经营策略效率。通过竞品档案和套餐价格分析，将单商户市场调研周期从大约5天缩短到36小时以内。\n\n套餐策略、价格和视觉素材同步上线后，套餐整体下单转化率相较商户原有自定套餐提升19%。这里我会明确说明，这是综合方案结果，不是单个AI功能的独立贡献。\n\n第四是组织复用。我将需求采集、风格标签、参考图、提示词和质量标准沉淀成流程和模板，使方案不再依赖某个同事的个人经验，并在市场团队内部推动普及使用。\n\n所以这个项目最重要的结果不是生成了多少张图片，而是验证了AI能够进入真实商户经营流程，同时改善交付效率、内容质量和部分经营指标。\n\n### 业务成果高频QA\n\n**Q：单版素材时间如何统计？**\nA：统计口径是从需求基本确认后开始，到形成一版可以进入商户确认的候选素材为止，包括提示词配置、生成和基础调整时间。不包含商户长时间未回复造成的等待时间。\n\n**Q：19%的样本有多大？它来自试点商户的前后方对比，属于初步业务验证，不是大规模统计结论。**\nA：如实说明样本范围有限，价值在于验证方向可行。\n\n**Q：转化提升是否可能来自投流？**\nA：有可能，所以复盘时需要记录是否有达人、直播和投流资源变化。19%是套餐和视觉同步优化后的综合结果，不能做单因素归因。\n\n---\n\n## 四、反思与经验：学到了什么\n\n### 五个核心反思\n\n1. **最初过于关注「生成」，后来转向「任务完成」**：图片好看≠商户满意，商户在意的是菜品真实、品牌一致\n2. **Prompt不是唯一答案**：输入质量和流程确认（样片前置确认）比加长Prompt更有效\n3. **AI必须和规则、人工共同工作**：价格=规则、菜品=真实图片约束、合规=审核规则\n4. **MVP可以更聚焦**：如果重做，优先做好需求诊断、内容生成和质量审核三个闭环\n5. **数据归因需要加强**：应从第一天建立版本绑定和A/B测试\n\n### 反思逐字稿（原文完整版）\n\n这个项目让我最深刻的认识是，AI生成成功并不代表用户任务完成。\n\n项目早期，我比较关注生成图片是否好看，所以最初的优化方式也是增加更多视觉描述。但实际交付后发现，商户不满意的原因不只是审美，而是菜品不真实、品牌风格不一致，以及生成前双方没有对齐验收标准。\n\n后来我们把流程从「一次生成后让商户修改」，调整成「先采集结构化需求，再输出3版风格样片确认，之后批量生成并进行质量验收」。这个变化比单纯继续加长Prompt更有效。\n\n第二个经验是，Prompt不能解决所有问题。菜品真实性依赖真实原图和明确食材约束，价格准确依赖结构化数据，品牌一致依赖模板，平台合规则依赖规则和人工审核。所以AI产品需要明确模型、规则和人工各自负责什么，而不是把所有任务都交给大模型。\n\n第三个反思是，MVP范围一开始还可以更聚焦。需求诊断、竞品、套餐、文案、视觉和复盘都有价值，但资源有限时，我会先做好需求诊断、内容生成和质量审核这三个最核心的闭环，再逐步扩展经营策略和数据分析。\n\n第四个不足是数据归因。试点中套餐、价格、视觉和营销资源可能同时变化，所以虽然整体下单转化出现改善，但难以严格判断每个模块的独立贡献。如果重新做，我会从第一天建立内容版本绑定和A/B测试机制。\n\n第五个不足是自动化程度。试点阶段竞品资料仍然主要由人工整理，质量审核也依赖人工。如果进入下一阶段，我会优先完善数据接入、自动审核、品牌模板和多门店批量任务。\n\n我最终形成的方法是：先找到高频、重复、可标准化的真实任务，再明确AI、规则和人工的边界，通过固定评测和业务数据判断产品是否真正完成用户目标。\n\n---\n\n## 五、2-3分钟简版逐字稿（原文完整版）\n\n我在字节跳动本地生活主要负责餐饮商户的拓展、入驻、套餐规划、营销活动和经营复盘。\n\n在服务商户的过程中，我发现很多商户虽然完成了平台入驻，但并不具备完整的线上经营能力。中小商户缺少设计、文案和市场分析人员，连锁商户则面临多门店内容统一和本地化生产的问题。内部运营人员也需要反复进行竞品调研、套餐设计和素材制作，效率低且依赖个人经验。\n\n因此，我主导设计并推动了餐饮商户AI营销经营助手的试点。产品面向内部商务、运营和餐饮商户，覆盖需求诊断、商圈竞品分析、套餐与定价建议、营销文案和视觉生成、质量审核及经营复盘。\n\n我的正式岗位是商务经理，但在项目中主要承担业务需求发起人、产品方案负责人和试点推动者。我梳理了商户从入驻到经营复盘的全流程，完成核心功能架构、MVP规划、Prompt模板、质量标准和效果指标设计。\n\n在需求端，我们通过结构化表单、菜单、菜品原图和参考图，将商户「图片更好看」「套餐更吸引人」等模糊诉求，拆解成目标用户、品牌风格、内容场景和真实性约束。\n\n在经营端，结合商圈竞品、价格和用户评价，生成引流款、主推款和利润款三档套餐建议。\n\n在内容端，通过大模型和多模态能力生成套餐标题、营销文案、菜品图、门店头图和活动海报。\n\n项目中最关键的挑战是菜品真实性。我测试了5类方案，最终建立「业务场景—视觉风格—真实性约束」三层提示词，并通过3版样片前置确认商户风格。\n\n最终，单版素材生产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2到3轮，菜品还原合格率从40%提升到85%；市场调研周期从约5天缩短到36小时以内，套餐与视觉方案同步上线后，下单转化率较原方案提升19%。\n\n这个项目让我认识到，AI产品不是单纯接入模型，而是要把需求理解、模型生成、业务规则、人工审核和数据优化连接成完整闭环。\n\n---\n\n## 六、5-7分钟完整逐字稿（原文完整版）\n\n我介绍一下我在字节跳动本地生活业务期间主导设计并推动试点的餐饮商户AI营销经营助手。\n\n我当时担任商务经理，主要负责餐饮商户拓展、平台入驻、门店装修、套餐规划、活动运营和后续经营复盘。在实际服务过程中，我发现商户完成入驻以后，并不代表已经具备线上经营能力。\n\n对中小商户来说，他们通常没有专业的设计、文案和市场分析团队。商户很懂线下菜品和经营，但不一定熟悉平台用户、团购套餐和线上内容。他们经常只能提出「把菜做得更好看」「套餐更吸引人」或者「参考附近卖得好的店」这类模糊需求。\n\n对连锁商户来说，总部希望品牌风格统一，但不同城市和门店又需要根据本地商圈、客单价和用户做差异化内容。\n\n对内部商务和运营人员来说，商圈调研、套餐定价、文案撰写和门店装修都是高频重复工作，需要在多个平台中查询信息，很多经验依赖个人，很难规模化复制。\n\n所以我判断，这不是单纯的图片制作问题，而是商户从入驻到经营过程中，需求理解、经营策略和营销内容相互割裂的问题。\n\n我主导设计了一套餐饮商户AI营销经营助手，产品主要面向内部商务、运营人员和餐饮商户，覆盖AI需求诊断、商圈竞品分析、套餐策略、文案与视觉生成、质量审核和经营复盘。\n\n我的正式岗位是商务经理，但在项目中承担的是业务需求发起人、AI产品方案负责人和试点推动者。我首先梳理了商户入驻、门店装修、套餐上架、推广和复盘的完整流程，识别高频低效环节，再完成产品功能架构、MVP范围、Prompt模板、质量验收和数据指标设计。\n\n产品第一个核心功能是商户需求智能诊断。我们没有让商户直接写Prompt，而是通过结构化表单收集", "p2": "<h2>二、你的角色与职责</h2><pre style=\"white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.8;padding:8px;\">【原文第6页】\n我不是通过⼀次专⻔的⽤⼾访谈发现的，⽽是在持续服务商⼾的过程中反复看到同类问题。\n商⼾⼊驻后，我需要帮助他们⽣成⻔店头图、菜品图，沟通货盘和价格，还要安排达⼈推⼴\n并复盘交易数据。开始时我认为这些只是商务和运营⼯作，但做了多个商⼾后发现，很多任\n务⾼度重复，⽽且每个同事都在⽤⾃⼰的⽅法处理。\n例如，同样是⼀个双⼈套餐，⼤家都要重新查周边商⼾、整理价格和写卖点；同样是菜品\n图，商⼾也都会经历需求表达模糊、⽣成效果不满意和多轮修改的问题。\n所以我判断它不是某⼀家商⼾的个性化问题，⽽是可以被抽象和产品化的共性需求。\nQ\u0000：这个产品主要解决的是商⼾问题，还是内部效率问题？\n两者都有，但MVP阶段我会优先从内部效率切⼊。\n对商⼾来说，它解决的是缺乏线上经营能⼒的问题；对内部商务和运营来说，它解决的是需\n求沟通、市场分析和内容⽣产重复的问题。\n初期让内部⼈员使⽤更合理，因为内部运营熟悉平台规则和商⼾情况，能够对AI结果进⾏判\n断和审核。等流程和质量稳定后，再逐步开放商⼾⾃助能⼒。\nQ\u0000：为什么普通SOP不能解决？\nSOP能够统⼀步骤，但不能替代对⾮结构化内容的理解和⽣产。\n⽐如SOP可以规定“先收集商⼾资料，再分析竞品”，但⼈⼯仍然需要阅读⼤量评价、总结卖\n点和⽣成不同⽂案；也⽆法⾃动理解商⼾上传的参考图。\nAI的价值是把SOP中的部分认知和⽣产⼯作⾃动化，⽽SOP本⾝则负责约束AI的使⽤流程，\n两者不是替代关系。\nQ\u0000：为什么不⽤第三⽅设计公司或服务商？\n服务商可以解决问题，但成本、交付周期和⼀致性仍然⽐较依赖⼈员。同时，平台内部有⼤\n量商⼾，如果每⼀家都依赖定制服务，很难规模化。\nAI产品不是完全替代服务商，⽽是把⾼频、重复的基础⼯作标准化，让服务商和运营⼈员把\n更多精⼒放在⾼价值判断、商⼾沟通和活动策略上。\n\n【原文第7页】\nQ\u0000：为什么不能直接让商⼾使⽤现成的AI⼯具？\n通⽤AI⼯具解决的是“⽣成能⼒”，但没有解决“业务输⼊、品牌约束和结果验收”。\n商⼾不⼀定知道应该如何描述⽬标⽤⼾、消费场景和视觉规范；通⽤模型也不了解商⼾真实\n菜品、价格和品牌要求。⽣成完成后，还缺少事实校验、平台合规和效果复盘。\n我们的产品价值，是把模型能⼒嵌⼊⼀套业务流程，⽽不是再提供⼀个聊天框。\nQ\u0000：需求频率真的⾜够⾼吗？\n⾜够⾼。商⼾不仅在第⼀次⼊驻时需要做⻔店装修和套餐，上新、节⽇活动、⻔店扩张、达\n⼈推⼴和套餐效果下降时都会重新调整内容。\n特别是连锁商⼾，每开⼀家新店都要重复进⾏⻔店资料适配、套餐本地化和视觉内容⽣产，\n所以它不是⼀次性需求。\nQ\u0000：产品是否适合所有餐饮商⼾？\n并不完全适合。\n对已有成熟数字化团队、品牌规范和内容供应链的⼤型连锁品牌，产品更多是提⾼批量⽣产\n和本地化效率；对中⼩商⼾，产品价值主要是降低专业运营⻔槛。\n对于菜品极度定制、视觉真实性要求特别⾼，或者缺乏任何真实素材的商⼾，AI只能辅助，\n仍然需要专业拍摄和设计。\nQ\u0000：你怎么证明商⼾愿意使⽤？\n⼀⽅⾯，项⽬来⾃商⼾真实交付环节，商⼾已经在不断请求我们帮助制作⻔店图、套餐和营\n销内容；另⼀⽅⾯，试点中商⼾愿意提供菜单、原图和参考图，并参与⻛格确认和⽅案修\n改，说明需求本⾝存在。\n同时，单版⽣产时间和修改轮次明显下降，也说明这种流程不仅能⽣成内容，⽽且能够降低\n双⽅的沟通成本。\n\n【原文第8页】\n⼆、你的⻆⾊与职责：你做了什么\n1.回答思路\n这⼀部分必须主动解决⼀个潜在质疑：\n你的岗位是商务经理，为什么可以说⾃⼰做了AI产品？\n不要回避正式岗位，⽽要清晰地区分：\n·正式岗位：本地⽣活商务经理。\n·项⽬⻆⾊：业务需求发起⼈、AI产品⽅案负责⼈、商⼾试点负责⼈和产品运营推动者。\n建议采⽤四层结构回答：\n第⼀层，业务端⼯作。你负责商⼾拓展、洽谈、⼊驻、套餐规划、活动推进和数据复盘。\n第⼆层，产品端⼯作。你识别共性问题、开展需求调研、拆解业务流程、设计产品架构和\nMVP。\n第三层，AI专项⼯作。你负责Prompt结构、参考图规范、⻛格基准、质量评测和失败案例分\n析。\n第四层，项⽬推进⼯作。你推动商⼾试点、跨部⻔协作、内部培训和数据复盘。\n核⼼是让⾯试官听到⼤量明确的“我做了什么”，⽽不是“我们做了什么”。\n2.⾯试官考察⽅向\n2.1 项⽬真实性\n⾯试官会判断：\n\n【原文第9页】\n·项⽬是不是你主导的？\n·你是不是只负责商⼾沟通？\n·产品功能是谁设计的？\n·Prompt和测试是谁完成的？\n·是否真的有内部推⼴？\n2.2 个⼈贡献\n需要明确你亲⾃负责的产出物，包括：\n·商⼾需求整理\n·业务流程图\n·产品功能架构\n·MVP规划\n·结构化需求采集⽅案\n·Prompt模板\n·质量验收标准\n·商⼾试点\n·效果复盘\n·内部培训\n2.3 产品判断\n⾯试官会关注你做过哪些关键取舍，例如：\n·为什么先服务内部运营，⽽不是直接服务商⼾？\n·为什么先做内容⽣成，⽽不是完整经营平台？\n·为什么需要⼈⼯审核？\n·为什么选择模板和参考图，⽽不是训练模型？\n\n【原文第10页】\n2.4 推动⼒\n由于你没有直接管理产品、研发和算法团队，⾯试官会看你如何通过业务数据、案例和明确验\n收标准推动不同团队合作。\n2.5 诚实边界\n⾯试官会观察你是否把使⽤⼯具包装成研发平台。主动说清楚底层模型由现有⼯具和AI技术团\n队提供，⾃⼰负责产品⽅案和业务落地，可信度反⽽更⾼。\n3.注意事项\n3.1 不要说⾃⼰“负责整个产品所有⼯作”\n你可以说“我主导了产品⽅案和试点落地”，但不能说⾃⼰独⽴完成了模型开发、前后端系统和\n数据接⼝。\n3.2 少⽤“参与”，多⽤明确动作\n弱表达：\n我参与了需求分析和产品设计。\n强表达：\n我梳理了商⼾⼊驻到经营复盘的全流程，识别出五类⾼频问题，完成产品功能架构、MVP范\n围和质量指标设计。\n3.3 区分商务运营与产品⼯作\n商务运营负责拿到商⼾、理解经营⽬标和推动活动落地；产品⼯作负责将多个商⼾的共性问题\n抽象为流程、功能、规则和指标。\n\n【原文第11页】\n3.4 重点讲关键决策\n讲任务不如讲决策。建议突出三项决策：\n\u0000.MVP先服务内部运营⼈员。\n\u0000.AI、规则和⼈⼯协同，⽽⾮全⾃动。\n3.先通过模板和Prompt验证，再考虑模型定制。\n3.5 不要把团队内部“约50⼈使⽤”说成50个稳定活跃⽤⼾\n更稳妥的说法是：\n⽅案开始在约50⼈的市场团队中进⾏内部普及、培训和使⽤推⼴。\n⼯作梳理明确记录了⽅案在市场团队内部开始普及，并由约50名同事使⽤。\n4.⻆⾊与职责逐字稿\n我的正式岗位是商务经理，⽇常⼯作包括商⼾拓展、合作洽谈、平台⼊驻、套餐规划、活动\n推进和经营数据复盘。\n但是在这个项⽬中，我承担的不只是商务执⾏，⽽是业务需求发起⼈、AI产品⽅案负责⼈和\n试点推动者三个⻆⾊。\n第⼀，我是需求的发现者。我通过持续拜访和运营商⼾，梳理了商⼾从⼊驻、⻔店装修、套\n餐上架到推⼴和复盘的完整流程，识别出需求沟通、竞品调研、套餐设计、内容⽣产和质量\n验收⼏个⾼频低效环节。\n第⼆，我负责把业务问题转化为产品⽅案。我拆解了商⼾项⽬管理、AI需求诊断、竞品分\n析、套餐策略、⽂案与视觉⽣成、内容审核和数据复盘等核⼼模块，设计了⽤⼾流程和MVP\n范围。\n我的⼀个关键判断是，MVP阶段不直接让商⼾完全⾃助，⽽是优先服务内部商务和运营⼈\n员。因为内部⼈员熟悉商⼾信息和平台规则，既可以降低商⼾使⽤⻔槛，⼜能够对早期AI结\n果进⾏⼈⼯审核。\n\n【原文第12页】\n第三，我重点负责AI内容⽣产⽅案和质量体系。我设计了结构化需求采集⽅式，把商⼾的模\n糊诉求拆成品牌、⽬标⽤⼾、使⽤场景、视觉⻛格和真实性约束；同时整理了分层提⽰词、\n参考图使⽤规范、⻛格基准和质量验收标准。\n在具体问题解决上，菜品⽣成初期存在⻝材失真和⻛格漂移，我把失败案例分成真实性、视\n觉效果和品牌⼀致性⼏类，先后测试了5类⽅案，最终形成三层提⽰词和3版样⽚确认机制。\n第四，我负责试点和产品运营。我选取真实餐饮商⼾进⾏测试，参与商⼾需求沟通、资料整\n理、内容⽣成、质量审核和经营数据复盘，并将验证有效的⽅法沉淀成SOP和模板。\n在跨部⻔协作上，我会把商⼾问题整理成结构化需求，对接AI技术⽀持团队验证图⽚和模型\n效果，也会和产品、内容运营、商业化及技术团队沟通套餐上架、活动资源、直播和核销系\n统问题。\n所以我在这个项⽬中的核⼼贡献，不是单纯使⽤AI⼯具⽣成内容，⽽是从业务中定义问题，\n把解决⽅案抽象为产品流程，再推动它完成真实商⼾验证和内部复⽤。\n5.⻆⾊与职责问题QA\nQ\u0000：你是商务经理，为什么要转AI产品？\n我的商务经历让我⻓期处在⽤⼾和业务⼀线，能够看到商⼾真正愿意为什么付费、哪些⼯作\n只是表⾯需求、哪些问题可以规模化。\n在这个项⽬中，我进⼀步承担了需求抽象、产品流程、AI⽅案、评测指标和试点运营等⼯\n作。我发现⾃⼰的优势不是只完成⼀单商务合作，⽽是能够将多个客⼾的共性问题沉淀成⼀\n套可复制的产品⽅案。\n所以转AI产品不是完全跨⾏业，⽽是从单客⼾交付⾛向产品化和规模化解决问题。\nQ\u0000：这个产品是你提出的吗？\n项⽬机会最初是我在商⼾运营过程中提出的。\n我前期先完整熟悉了商⼾⼊驻、⻔店装修、货盘设计、达⼈推⼴和数据复盘流程，在能够区\n分个性问题和共性问题后，才开始验证AIGC⽅案。\n后续我整理了产品逻辑、测试⽅案和商⼾案例，再向Leader和相关团队同步并推动内部使\n⽤。\n\n【原文第13页】\nQ\u0000：你具体交付了哪些产品⽂档？\n我主要完成了业务流程梳理、⽤⼾⻆⾊和痛点分析、产品功能架构、核⼼使⽤流程、MVP范\n围、功能需求说明、Prompt模板、视觉⽣成规则、内容质量标准和效果指标。\n如果进⼀步系统开发，这些内容可以继续拆成详细PRD、原型和技术接⼝需求。\nQ\u0000：技术团队做了什么，你做了什么？\nAI技术⽀持团队主要帮助验证现有模型和⼯具的能⼒边界，例如图⽚⽣成质量、参考图理解\n效果和市场信息分析能⼒。\n我负责定义业务问题、输⼊信息、产品流程、模型需要输出什么、什么结果算合格，并通过\n真实商⼾案例进⾏测试和验收。\n换句话说，技术团队解决“模型能不能实现”，我负责解决“业务为什么需要、产品应该怎么\n⽤、结果怎么判断”。\nQ\u0000：你最关键的产品决策是什么？\n最关键的决策是先做内部运营⼈员使⽤的MVP，⽽不是直接做商⼾⾃助平台。\n早期AI结果仍然存在菜品失真、⻛格不稳定和事实错误⻛险。如果直接给商⼾使⽤，商⼾需\n要⾃⼰理解提⽰词，也缺少判断模型结果的能⼒。\n通过运营⼈员先使⽤，可以快速验证效果，也能够保留⼈⼯审核，降低业务⻛险。\nQ\u0000：你有没有做⽤⼾调研？\n有，但调研不是⼀次正式问卷，⽽是结合商⼾拜访、需求沟通、⽅案确认、修改意⻅和上线\n复盘持续进⾏。\n我主要调研了三类对象：中⼩单店、连锁商⼾和内部商务运营⼈员。\n中⼩商⼾更关注成本和快速上线，连锁商⼾更关注品牌⼀致和批量处理，内部运营更关注输\n⼊是否简单、⽣成是否稳定以及能否减少修改。\n\n【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。</pre>", "p3": "<h2>三、产品核心功能与实现</h2><pre style=\"white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.8;padding:8px;\">【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。\n\n【原文第15页】\n三、产品核⼼功能与实现：具体怎么做\n1.回答思路\n核⼼功能不能按照技术能⼒罗列，⽽要按照⽤⼾完成任务的顺序讲述：\n建⽴商⼾项⽬\n→ 收集资料和诊断需求\n→ 分析商圈与竞品\n→ 设计套餐及价格\n→ ⽣成⽂案与视觉内容\n→ 完成质量审核\n→ 商⼾确认并上线\n→ 根据经营数据继续优化\n产品的核⼼不是某⼀个功能，⽽是将原来互相割裂的市场分析、套餐策略和内容⽣产连接起\n来。\n建议将功能分成五个核⼼模块深讲：\n1.商⼾需求智能诊断\n2.商圈竞品分析\n3.套餐策略与定价建议\n\u0000.AI⽂案与视觉⽣成\n5.内容质量审核与经营复盘\n2.⾯试官考察⽅向\n⾯试官会重点判断：\n·功能是否围绕⽤⼾任务设计。\n·AI到底在哪些环节发挥作⽤。\n\n【原文第16页】\n·是否清楚模型、规则和⼈⼯的边界。\n·是否考虑模型幻觉、图⽚失真和事实错误。\n·功能之间是否有数据衔接。\n·有没有版本管理和反馈闭环。\n·MVP是否合理。\n·是否具备基础技术理解。\n3.注意事项\n3.1 不要堆砌AI术语\n项⽬中不需要强⾏加⼊知识图谱、复杂Agent或模型微调。能够解释清楚⼤模型、多模态、图\n像⽣成、规则和⼈⼯审核已经⾜够。\n3.2 不要说“系统⾃动抓取所有竞品”\n试点阶段更真实的⽅式是⼈⼯收集、表格整理、截图识别和内部授权数据。\n3.3 不要说“系统⾃动给商⼾定价”\nAI提供建议，规则负责基础测算，商⼾和运营负责确认。\n3.4 不要把内容审核说成完全⾃动化\n试点阶段主要是模型辅助与⼈⼯验收，⾃动质检是产品化⽅向。\n3.1 核⼼功能⼀：商⼾需求智能诊断\n回答思路\n\n【原文第17页】\n这个功能要解决的根本问题不是“商⼾不会写Prompt”，⽽是商⼾本⾝很难将经营⽬标表达为\n可执⾏的内容标准。\n讲述结构：\n原始需求模糊\n→ 设计结构化采集\n→ AI解析菜单、图⽚和⾃然语⾔\n→ 对缺失信息定向追问\n→ 运营确认事实字段\n→ 形成统⼀需求基线\n⾯试官考察⽅向\n·如何理解⽤⼾需求。\n·如何处理⾮结构化信息。\n·如何避免模型误读和编造。\n·如何降低⽤⼾填写成本。\n·后续不同功能如何共⽤需求信息。\n注意事项\n·AI提取只能作为候选结果。\n·商⼾名称、菜品、价格、地址、营业时间等必须⼈⼯确认。\n·AI追问不能变成⽆⽌境聊天。\n·需求结构不能过度复杂，否则⽤⼾不愿填写。\n逐字稿内容\n\n【原文第18页】\n第⼀个核⼼功能是商⼾需求智能诊断。\n我在实际沟通中发现，商⼾的需求通常停留在结果层，⽐如“图⽚要⾼端”“套餐要更有吸引\n⼒”，但模型真正需要的是⽬标⽤⼾、消费场景、品牌调性、主⾊、构图、菜品真实性和图⽚\n⽤途等具体信息。\n所以产品没有让⽤⼾直接写Prompt，⽽是设计了⼀套结构化需求采集⽅式。\n⾸先录⼊商⼾基础经营信息，包括商⼾类型、菜系、⻔店地址、客单价、核⼼菜品和当前套\n餐；其次选择⽬标⽤⼾、主要消费场景和营销⽬标；最后上传菜单、菜品原图、品牌Logo、\n历史素材和参考图。\n多模态模型可以帮助识别菜单中的菜品、菜品图⽚中的主要⻝材，以及参考图中的⾊调、构\n图、光线和背景。⼤语⾔模型则负责理解商⼾的⾃然语⾔描述，把模糊需求拆成结构化参\n数。\n当信息不⾜时，系统不是直接⽣成，⽽是根据任务进⾏定向追问。例如商⼾要设计双⼈套\n餐，但没有填写⽬标价格和必选菜品，系统优先追问这两个信息；如果要⽣成菜品图，就优\n先确认真实⻝材、图⽚⽤途和品牌⻛格。\n所有AI提取结果都要由运营⼈员确认，尤其是菜品、价格和营业时间等事实字段，不能让模\n型⾃⾏补全。\n最终确认后的信息会形成项⽬需求基线。后续竞品分析、套餐、⽂案和视觉内容都引⽤同⼀\n套数据，避免不同模块对商⼾理解不⼀致。\n问题QA\nQ\u0000：为什么需要AI诊断，⽽不是做⼀个普通表单？\n普通表单适合收集明确字段，但商⼾还会上传菜单、图⽚和⼤量⾃然语⾔描述，这些信息⽆\n法完全依靠固定选项处理。\nAI负责从⾮结构化信息中提取候选内容、发现⽭盾并⽣成追问，表单负责固定事实和规则，\n两者结合效果更好。\nQ\u0000：需求字段很多，⽤⼾会不会觉得填写⿇烦？\n会，所以产品不能⼀次把所有字段全部展⽰。\n我会根据⽤⼾选择的任务动态展⽰必要字段。只⽣成⻔店头图时，不需要填写完整成本和套\n\n【原文第19页】\n餐利润；要⽣成套餐策略时，再要求补充菜品、价格和成本。\nAI也可以从菜单和历史资料中预填内容，让⽤⼾以确认为主，⽽不是从零录⼊。\nQ\u0000：AI追问如何控制轮数？\n每轮最多展⽰3到5个对结果影响最⼤的缺失问题，并按照任务依赖排序。\n⽤⼾可以暂时跳过，但系统需要说明可能造成的影响，⽐如“未提供真实菜品图，⽣成结果\n仅能⽤于⻛格参考”。\nQ\u0000：如何处理商⼾资料互相冲突？\n系统需要将冲突字段和来源同时展⽰。\n例如菜单显⽰套餐价格是128元，但历史海报写的是138元，系统不能⾃⾏判断，⽽是提⽰⽤\n⼾确认当前有效价格。\n⽤⼾确认后，其他旧数据被标记为历史版本。\nQ\u0000：需求基线修改后怎么办？\n修改关键字段时，系统需要识别受影响内容。\n⽐如套餐价格修改，会影响套餐⽂案、封⾯和活动海报；品牌主⾊修改，会影响视觉素材。\n系统提⽰⽤⼾是否重新⽣成或重新审核，不能让旧内容继续直接使⽤。\n3.2 核⼼功能⼆：商圈与竞品分析\n回答思路\n需要说明AI不是凭空给建议，⽽是基于竞品资料、价格、套餐和评价进⾏分析。\n推荐逻辑：\n\n【原文第20页】\n数据导⼊\n→ 数据清洗和竞品分类\n→ 价格、套餐、评价和视觉分析\n→ 找到市场空档\n→ 给出可解释建议\n⾯试官考察⽅向\n·数据来源是否合法和可信。\n·数据不完整时如何处理。\n·分析结果能否追溯。\n·AI总结和真实经营判断如何区分。\n·是否避免直接抄袭竞品内容。\n注意事项\n·不要夸⼤外部数据获取能⼒。\n·不同平台和时间⼝径不能直接混⽤。\n·样本不⾜时只能给趋势判断。\n·分析结果需要展⽰依据。\n逐字稿内容\n第⼆个模块是商圈与竞品分析。\n原来的做法是运营⼈员在不同平台搜索周边商⼾，⼿⼯整理商⼾距离、客单价、套餐内容、\n价格、销量和⽤⼾评价。整个过程不仅慢，⽽且不同⼈员整理的⼝径不⼀致。\n产品中，我设计了竞品数据导⼊和结构化分析流程。MVP阶段⽀持运营⼈员通过表格、截图\n或内部授权数据导⼊竞品信息，⽽不是默认使⽤未经授权的⾃动爬取。\n数据进⼊系统后，先进⾏商⼾去重、套餐拆分、价格异常识别和数据时间检查。随后根据距\n离、品类、客单价、⽤⼾群体和消费场景，将竞品划分为直接竞品和间接竞品。\n\n【原文第21页】\nAI主要分析四个⽅⾯。\n第⼀是价格带，判断商圈主流客单价和不同套餐的价格分布。\n第⼆是套餐结构，例如热销套餐通常适合⼏⼈、包含哪些菜品、折扣如何设计。\n第三是⽤⼾评价，将⼤量评价归类为⼝味、分量、服务、环境、价格和核销体验，从中找到\n⽤⼾关注点和未满⾜需求。\n第四是内容表达，例如竞品主图主要突出菜品、环境还是价格，常⽤什么视觉⻛格和卖点。\n最终系统不是只给⼀份总结，⽽是输出可执⾏的市场机会，⽐如某⼀价格带竞争相对较少、\n⽤⼾对双⼈聚餐需求较⾼，或者竞品普遍忽视某个招牌菜卖点。\n每⼀条重要建议都需要展⽰依据，⽤⼾可以看到参考了哪些竞品、什么价格数据和多少条评\n价。这样运营⼈员才能判断是否采⽤，⽽不是盲⽬相信模型。\n问题QA\nQ\u0000：竞品数据准确性如何保证？\n每条竞品数据需要记录来源、采集时间和是否⼈⼯确认。\n系统会识别明显异常值，例如团购价⾼于原价或⽉销量异常，但最终仍需要运营⼈员确认。\n时效过旧或来源不明确的数据不能作为核⼼定价依据。\nQ\u0000：为什么不⽤实时爬⾍？\nMVP阶段的重点是验证分析价值，⽽不是先投⼊⼤量资源建设数据采集系统。\n外部平台数据还涉及授权、反爬和⼝径问题，所以前期采⽤⼈⼯和授权数据导⼊更稳妥。等\n分析能⼒被证明有效后，再评估合规数据接⼝。\nQ\u0000：⽤⼾评价如何分析？\n⼤模型先对评论进⾏主题分类和情感归纳，例如识别⼝味、分量、环境、服务和核销限制。\n但系统需要保留代表性原始评价和样本数量，避免只显⽰模型总结，让运营能够查看依据。\n\n【原文第22页】\nQ\u0000：如何避免直接复制竞品内容？\n产品只提取市场规律和⻛格特征，不直接复⽤竞品⽂案、图⽚或品牌元素。\n⽣成环节仍然基于⽬标商⼾⾃⼰的菜品、品牌和卖点。\nQ\u0000：竞品数量多少⽐较合适？\n不需要越多越好。\n核⼼是相关性。可以优先选择同商圈、同品类和相近客单价的直接竞品，再补充少量争夺相\n同消费场景的间接竞品。\n样本太少时需要提⽰结论可信度不⾜，样本太多则容易引⼊⼤量⽆关信息。\n3.3 核⼼功能三：套餐设计与定价建议\n回答思路\n套餐模块要体现“AI建议+业务规则+⼈⼯决策”。\n讲述结构：\n建⽴真实菜品池\n→ 选择⽬标⽤⼾和消费场景\n→ ⽣成三档套餐\n→ 规则计算价格与⻛险\n→ AI解释卖点\n→ 商⼾确认\n⾯试官考察⽅向\n·推荐是否建⽴在真实菜品和成本基础上。\n·定价是否可解释。\n\n【原文第23页】\n·是否考虑⽑利和⻛险。\n·AI是否越权做经营决策。\n·套餐内容与⽂案、图⽚是否联动。\n注意事项\n·AI不能凭空增加菜品。\n·没有成本数据，不能承诺利润。\n·19%的转化提升是综合⽅案结果。\n·套餐确认后需要锁定版本。\n逐字稿内容\n第三个模块是套餐设计与定价建议。\n很多商⼾会直接把线下菜单组合成团购套餐，但没有清晰区分套餐的经营⽬标。有的套餐价\n格低，但没有限制购买条件，会影响利润；有的套餐菜品很多，但⽤⼾看不出核⼼价值；还\n有的套餐和周边竞品⾼度相似。\n我先设计了商⼾菜品池，要求所有套餐菜品必须来⾃真实菜单。每个菜品记录名称、类别、\n原价、成本、适⽤⼈数、是否招牌菜、是否允许加⼊团购和供应限制。\n⽤⼾发起套餐⽣成时，需要选择⽬标⽤⼾、消费场景、适⽤⼈数、价格范围、⽬标⽑利和必\n选菜品。\n产品默认⽣成三类套餐。引流款⽤于降低新客决策⻔槛，主推款承担主要成交，利润款⽤于\n提⾼客单价和商⼾收益。\n每个套餐都会展⽰菜品组合、适⽤⼈数、原价合计、建议团购价、折扣率、核⼼卖点、竞品\n差异和⻛险提⽰。\n其中价格计算不完全由⼤模型完成。菜品原价、成本、⽑利和折扣通过结构化数据和规则计\n算；⼤模型主要负责理解商圈数据、解释套餐定位和⽣成卖点。\n如果商⼾没有提供成本数据，产品只能给出基于竞品的市场参考价，不能声称能够保证利\n润。\n商⼾确认套餐后，这个版本会成为⽂案和图⽚⽣成的统⼀事实来源。如果后续价格或菜品改\n变，相关⽂案和素材必须重新审核。\n\n【原文第24页】\n问题QA\nQ\u0000：为什么设计引流款、主推款和利润款？\n因为不同套餐承担的业务⽬标不同。\n如果所有套餐都只追求低价，可能带来销量但损害利润；如果都追求⾼客单价，⼜会增加新\n客决策⻔槛。\n通过三层设计，可以同时覆盖获客、成交和收益三个⽬标。\nQ\u0000：AI如何知道哪些菜品适合组合？\n第⼀层依据真实菜品属性和业务规则，例如菜品类别、适⽤⼈数、原价、成本和搭配限制。\n第⼆层结合商圈热销套餐和⽤⼾场景。\n第三层由AI⽣成组合说明和卖点。\n最终仍然需要商⼾确认供应和实际制作能⼒。\nQ\u0000：如何测算价格？\n可以先计算菜品原价合计和成本下限，再参考商⼾⽬标⽑利及商圈同类套餐价格。\n系统输出建议区间和主要依据，⽽不是只给⼀个数字。\n如果建议价和商⼾⽑利⽬标冲突，产品应提⽰经营⻛险，让商⼾决定是调整菜品还是价格。\nQ\u0000：套餐建议错了怎么办？\n⽤⼾可以替换、删除或锁定菜品，系统实时重新计算价格和⻛险。\n套餐属于经营决策，产品不会⾃动发布，必须经过运营和商⼾确认。\nQ\u0000：转化率提升19%如何归因？\n\n【原文第25页】\n这是套餐结构、价格和视觉内容同步优化后的综合结果，不能全部归因于套餐算法或AI图\n⽚。\n后续更严谨的做法是绑定套餐、⽂案和图⽚版本，通过A/B测试分开验证不同因素。\n3.4 核⼼功能四：AI ⽂案与视觉内容⽣成\n回答思路\n重点说明不是通⽤⽣成，⽽是在事实、品牌和平台规则约束下⽣成可直接交付的内容。\n讲述逻辑：\n引⽤商⼾需求和套餐数据\n→ 区分事实字段与创作字段\n→ ⽣成多个策略版本\n→ 通过品牌模板保持统⼀\n→ ⽀持局部修改和批量⽣成\n⾯试官考察⽅向\n·产品与通⽤AIGC⼯具的差异。\n·多模态具体有什么作⽤。\n·如何避免错误⽂字和品牌问题。\n·如何⽀持单店和连锁商⼾。\n·是否具备可编辑能⼒。\n注意事项\n·不要声称图像模型能够稳定⽣成Logo和价格⽂字。\n\n【原文第26页】\n·外部参考图只能提取⻛格，不宜直接模仿原创内容。\n·图⽚⽣成必须建⽴在真实菜品素材上。\n·多版本需要有策略差异，不是简单换词。\n逐字稿内容\n第四个模块是AI⽂案和视觉内容⽣产。\n⽂案部分⽀持套餐标题、套餐卖点、⻔店介绍、活动海报⽂案、达⼈探店脚本和直播卖点。\n产品中我将内容分为事实字段和创作字段。商⼾名称、菜品、套餐价格、活动时间和⻔店地\n址属于事实字段，只能从确认后的商⼾和套餐数据中引⽤；卖点包装、表达结构和语⽓属于\n创作字段，由⼤模型⽣成。\n每次默认⽣成多个策略不同的版本。⽐如⼀个版本突出性价⽐，⼀个版本突出招牌菜，⼀个\n版本突出朋友聚餐场景。这样⽤⼾选择的是不同营销⽅向，⽽不是⼏个同义词版本。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。系统通过多模态能⼒理解真实菜品\n图和参考图，提取⻝材、摆盘、⾊调、构图、光线和背景等信息，再转化为⽣成参数。\n对单店商⼾，重点是根据商⼾偏好形成专属⻛格；对连锁商⼾，则通过品牌模板固定Logo、\n标准⾊、字体、语⽓和强制元素，只替换⻔店、商圈和套餐等本地化信息。\n图⽚中的价格、套餐名称和Logo不直接依赖图像模型⽣成，⽽是通过可编辑的排版组件添\n加，避免出现乱码和事实错误。\n⽤⼾可以对结果进⾏局部修改，例如替换背景、提⾼亮度、调整构图或重新⽣成某个区域，\n⽽不是每次都从头⽣成。\n问题QA\nQ\u0000：这个功能和即梦、Midjourney有什么区别？\n底层可能会调⽤类似的⽣成能⼒，但产品层的价值不同。\n通⽤⼯具不知道商⼾真实菜品、套餐和品牌规范，也没有商⼾需求诊断、版本管理、质量审\n核和经营数据回流。\n我们提供的是⼀套⾯向餐饮业务的⼯作流，⽽不是单个⽣成⼊⼝。\n\n【原文第27页】\nQ\u0000：多模态具体⽤在哪⾥？\n第⼀，解析菜单、菜品图和参考图。\n第⼆，将图⽚中的⾊调、构图、光线和摆盘转化为⽣成参数。\n第三，⽐较⽣成图与真实菜品图，辅助检查⻝材和⻛格⼀致性。\nQ\u0000：如何⽀持连锁商⼾？\n总部先配置统⼀品牌模板，包括Logo、主⾊、字体、品牌语⽓和禁⽌元素。\n不同⻔店继承统⼀模板，只替换地址、商圈、套餐和区域活动内容。\n这样既能统⼀品牌，也能完成本地化批量⽣产。\nQ\u0000：商⼾提供竞品图让你模仿怎么办？\n产品可以提取通⽤⻛格特征，例如暖⾊调、俯拍构图和中式器⽫，但不能直接复制竞品的品\n牌、⽂字和具有独创性的设计。\n最终内容必须使⽤商⼾⾃⾝菜品和品牌资产。\nQ\u0000：为什么不⽤模型直接⽣成海报⽂字？\n图像模型⽣成⽂字的稳定性和准确性不⾜，尤其是价格、套餐名称等强事实信息不能出现错\n误。\n所以更合理的产品⽅案是由图像模型⽣成背景和主体，再通过可编辑图层添加⽂字、Logo和\n价格。\n3.5 核⼼功能五：Prompt 与质量评测体系\n回答思路\n这⼀部分⼀定要⽤具体问题讲，不要停留在“我优化了Prompt”。\n\n【原文第28页】\n推荐结构：\n初期问题\n→ 建⽴问题分类\n→ 测试5类⽅案\n→ 三层Prompt\n→ ⻛格基准\n→ 质量标准\n→ 数据结果\n⾯试官考察⽅向\n·是否真正做过测试。\n·是否具备问题归因能⼒。\n·指标如何定义。\n·如何将经验模板化。\n·如何处理AI输出不稳定。\n注意事项\n·40%到85%是试点⼈⼯验收数据。\n·不能只⽤“好不好看”评价。\n·Prompt不能解决所有问题，原始素材和审核流程也很重要。\n·“三层提⽰词”需要具体解释每⼀层。\n逐字稿内容\n项⽬中最难的不是模型⽣成不出图⽚，⽽是有些结果视觉上很好看，但和商⼾真实菜品不⼀\n致。\n初期主要出现四类问题：第⼀是核⼼⻝材发⽣变化；第⼆是菜品分量和摆盘明显失真；第三\n\n【原文第29页】\n是不同批次⻛格不⼀致；第四是商⼾只能在⽣成后说“不喜欢”，导致修改轮次很多。\n我没有继续单纯增加形容词，⽽是先将失败问题分类，再测试不同解决⽅式。测试内容包括\n补充菜品事实、增加参考图、加⼊负向约束、拆分提⽰词层级和建⽴商⼾⻛格基准，共测试\n了5类优化⽅向。\n最终我们使⽤三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和平台尺⼨，解决“要⽣成什\n么”的问题。\n第⼆层是视觉⻛格，包括⾊调、光线、构图、背景、餐具和摆盘，解决“应该怎么呈现”的\n问题。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌出现的元素和常⻅变形，解\n决“哪些错误不能发⽣”的问题。\n同时，在批量⽣产之前先输出3版⻛格样⽚，让商⼾确认⼀套作为单店⻛格基准。后续内容都\n沿⽤这个基准，降低⻛格漂移。\n在评测上，我们不只看图⽚是否美观，⽽是看菜品主体、核⼼⻝材、分量、烹饪状态、品牌\n⻛格和是否可以上线。\n通过这套优化，菜品还原合格率从40%提升到85%，平均修改轮次从5轮下降到2到3轮，单\n版素材平均⽣产时间从30分钟缩短到10分钟。\n问题QA\nQ\u0000：菜品还原合格率具体怎么计算？\n试点阶段采⽤⼈⼯验收。\n每张图按照菜品主体正确、核⼼⻝材没有明显新增或缺失、分量没有严重失真、烹饪状态基\n本⼀致、整体可以⽤于商⼾⻚⾯⼏个条件进⾏判断。\n合格图⽚数量除以全部⽣成并参与验收的图⽚数量，就是菜品还原合格率。\n后续产品化后，我会把这些维度拆成独⽴评分，并建⽴固定测试集。\nQ\u0000：为什么三层Prompt有效？\n因为不同问题被拆到了不同层。\n如果⻝材错误，只需要调整真实性约束；如果品牌感觉不对，则调整视觉层；如果图⽚⽤途\n\n【原文第30页】\n改变，则调整业务场景层。\n这种⽅式⽐⼀条很⻓、没有结构的Prompt更⽅便复⽤和定位问题。\nQ\u0000：Prompt越⻓是不是效果越好？\n不⼀定。\nPrompt过⻓可能出现约束冲突或模型忽略重点。关键是明确字段优先级和强约束。\n对于真实菜品和禁⽌内容，需要明确且靠前；对于装饰细节可以作为可选项。\nQ\u0000：如何处理不同模型的效果差异？\n需要建⽴相同测试集，在相同输⼊和验收标准下对⽐模型。\n不只⽐较视觉效果，还要⽐较菜品还原、⻛格稳定、⽣成速度和成本，再根据任务选择模\n型，⽽不是固定只⽤⼀个⼯具。\nQ\u0000：为什么还需要⼈⼯审核？\n餐饮视觉错误往往很隐蔽，⼀张图看起来合理，但可能增加了真实菜品没有的⻝材。\n早期模型⽆法完全稳定识别所有问题，所以必须由运营和商⼾进⾏最终确认。\nAI质检的作⽤是降低⼈⼯检查量，⽽不是完全取消⼈⼯责任。\n3.6 核⼼功能六：产品运营、商⼾确认与数据复盘\n回答思路\n产品不能停在“功能设计和内容⽣成”，还要体现：\n·如何让内部同事使⽤。\n·如何收集反馈。\n·如何判断产品是否成功。\n\n【原文第31页】\n·如何从经营数据反向优化产品。\n⾯试官考察⽅向\n·是否具备产品运营思维。\n·是否关注采⽤率和留存。\n·是否具备数据闭环。\n·是否理解业务结果归因。\n·是否可以推动规模化使⽤。\n注意事项\n·50⼈是内部推⼴或使⽤范围，不宜包装成稳定MAU。\n·转化变化受到套餐、流量和活动资源影响。\n·⽣成数量不是北极星指标。\n·内部推⼴要讲阻⼒和解决⽅法。\n逐字稿内容\n内容⽣成以后，我没有把项⽬视为结束，还进⼀步设计了商⼾确认和数据复盘流程。\n在商⼾确认环节，运营⼈员先审核套餐、⽂案和图⽚，再将候选⽅案发送给商⼾。商⼾可以\n选择版本，也可以对具体图⽚或⽂案提出意⻅。\n对商⼾的⾃然语⾔反馈，AI可以辅助拆成结构化修改任务。例如商⼾说“图⽚太暗，⽜⾁看\n起来不真实”，系统可以拆成提⾼亮度、调整⾊温和强化⽜⾁纹理三个修改项，运营确认后再\n重新⽣成。\n在产品运营上，我将需求采集表、⻛格标签、参考图、提⽰词模板、套餐分析和验收标准沉\n淀成SOP，并通过案例演⽰和使⽤培训推动市场团队使⽤。⼯作记录中，⽅案后续在约50⼈\n的市场团队范围内进⾏了内部普及和使⽤。\n我不会只看⽣成了多少内容，⽽是将指标分成使⽤、效率、质量和业务四类。\n使⽤指标包括项⽬创建量和AI⽅案采⽤率；效率指标包括⽣成时间和修改轮次；质量指标包\n\n【原文第32页】\n括菜品还原率和⾸轮通过率；业务指标包括素材点击、套餐下单和核销。\n内容上线后，根据曝光、点击、下单和核销数据判断问题。如果曝光⾼但点击低，可能是主\n图或卖点问题；如果点击⾼但下单低，更可能是价格、套餐组合或使⽤限制问题。\n数据复盘的结论可以直接触发下⼀轮套餐、⽂案或视觉优化，形成持续迭代闭环。\n问题QA\nQ\u0000：如何推动内部同事使⽤？\n最⼤阻⼒通常不是功能不会⽤，⽽是运营⼈员已有⾃⼰的⼯作⽅法，担⼼标准化⼯具降低灵\n活性。\n所以我不会只做操作培训，⽽是⽤真实案例展⽰⽣产时间、修改轮次和商⼾反馈的变化，同\n时允许运营保留⼈⼯调整空间。\n先证明能够节约时间和降低返⼯，再逐步要求使⽤标准流程。\nQ\u0000：北极星指标是什么？\nMVP阶段，我会选择“AI⽅案被商⼾确认并正式上线的项⽬数”或者“AI⽣成内容采⽤率”。\n因为⽣成数量只说明模型⼯作了，采⽤和上线才说明产品真正帮助⽤⼾完成任务。\nQ\u0000：为什么需要核销数据？\n下单不代表真实消费。\n如果套餐下单⾼但核销低，可能存在预约限制、使⽤周期、⻔店位置或⽤⼾冲动消费问题。\n只有结合核销，才能更完整地判断套餐经营价值。\nQ\u0000：如何处理归因问题？\n必须记录同期是否有达⼈、直播、投流和平台资源变化。\n没有对照组时，只能说综合⽅案上线后指标出现变化，不能说完全由AI导致。</pre>", "p4": "商户地址、菜系、客单价、核心菜品、目标用户和营销目标，并支持上传菜单、菜品原图、品牌Logo和参考图。多模态能力帮助识别菜单、菜品和参考图，大语言模型将自然语言需求拆成品牌、用户、场景、视觉和真实性参数。价格、菜品和营业时间等事实字段必须经过人工确认，最终形成统一需求基线。\n\n第二个功能是商圈竞品分析。运营人员导入周边商户的套餐、价格、销量和评价，系统分析商圈价格带、热销套餐结构、用户关注点和竞品视觉策略，并给出可解释的市场机会。\n\n第三个功能是套餐设计。系统基于真实菜品池、成本、目标用户和竞品数据，生成引流款、主推款和利润款三档方案。价格和毛利通过结构化规则测算，大模型主要负责套餐定位、市场差异和卖点表达，最终由商户和运营确认。\n\n第四个功能是文案和视觉内容生产。文案支持套餐标题、卖点、门店介绍、达人脚本和活动文案。商户名称、价格、菜品和活动时间属于强事实字段，只能引用确认数据。视觉部分支持菜品图、门店头图、套餐封面和活动海报。系统先理解真实菜品图和参考图中的食材、构图、光线和色调，再生成候选方案。\n\n项目中最关键的挑战是菜品真实性。初期图片视觉上比较好看，但经常出现食材变化、分量失真、摆盘错误和不同批次风格漂移。我将问题分成真实性、视觉和品牌一致性几类，先后测试了5类方案，最终形成三层提示词。第一层是菜品、用户和使用场景；第二层是色调、构图、光线和餐具；第三层是核心食材、分量、烹饪状态和禁止元素。同时，批量生成前先输出3版风格样片，由商户确认一版作为单店风格基准，后续素材统一继承。\n\n在评测上，我们不只看好不好看，而是判断菜品主体、核心食材、分量、烹饪状态、品牌风格和是否可以上线。\n\n经过优化，菜品还原合格率从40%提升到85%，单项目平均修改轮次从5轮下降到2到3轮，单版素材平均生产时间从30分钟缩短到10分钟。\n\n竞品分析和套餐策略方面，单商户市场调研周期从约5天缩短到36小时以内；套餐策略、价格和视觉素材同步上线后，下单转化率相较商户原有方案提升19%。我会明确说明，这是综合方案的结果，不能全部归因于某个AI功能。\n\n在产品运营方面，我将需求采集、风格标签、参考图、提示词、套餐分析和验收标准沉淀成SOP，并在市场团队内部进行案例培训和使用推广，方案进入约50人团队的内部普及范围。\n\n项目也存在不足。第一，试点阶段竞品数据仍然需要人工整理；第二，质量审核主要是模型辅助和人工验收，自动质检还没有完整系统化；第三，套餐、视觉和营销资源经常同时变化，效果归因还不够严格。\n\n如果重新做，我会进一步收敛MVP，优先做好需求诊断、品牌约束下的内容生成和质量审核，并从第一天建立固定测试集、版本绑定和A/B测试机制。\n\n这个项目让我形成的核心认识是，AI产品不能只关注模型有没有生成结果，而要定义用户任务完成标准，明确AI、规则和人工各自负责什么，并通过真实业务指标判断产品是否真正创造价值。\n\n---\n\n## 七、面试官高频追问汇总\n\n以下追问在产品逐字稿各节中分散出现，此处汇总便于集中练习：\n\n1. 「商户为什么不能自己写Prompt？」\n2. 「为什么不用现成的设计工具？」\n3. 「商务工作为什么让你有机会做AI产品？」\n4. 「竞品数据如何获得？」\n5. 「套餐如何防止低于成本？」\n6. 「为什么内容产品要做套餐策略？」\n7. 「为什么是3版样片而不是5版或1版？」\n8. 「菜品还原率40%为什么这么低？」\n9. 「转化提升是否可能来自投流？」\n10. 「项目中最关键的踩坑是什么？」\n11. 「有什么想做但没有做成？」\n12. 「如果重做一次，你会优先做哪三个功能？」\n13. 「如果模型效果一直无法达到85%怎么办？」\n14. 「你觉得这个产品最关键的挑战/风险是什么？」\n15. 「你的方法可以迁移到其他行业吗？」\n16. 「为什么不直接用Agent？」\n17. 「为什么不直接用RAG？」\n18. 「如何看待AI替代运营人员？」\n19. 「北极星指标是什么？」\n20. 「为什么需要核销数据？」\n\n### 关键概念速查（与辅助材料对照）\n\n| 产品逐字稿中的概念 | 对应辅助知识 | 一句话解释 |\n|------------------|------------|----------|\n| 「非结构化但可标准化的任务」 | Agent 第一章 | 模糊需求可通过结构化拆解变成可执行参数 |\n| 「三层Prompt」 | Agent 6.3参数设计 | 分层设计让不同约束各司其职 |\n| 「事实字段锁定」 | Agent 4.2结构化调用 | 价格/名称等只能用确认数据，不允许模型自由生成 |\n| 「风格基准」 | 需求文档 10.7 | 3版样片确认后统一继承，防止风格漂移 |\n| 「模型+规则+人工」 | Agent 8.3混合模式 | 确定性任务交程序，模糊理解交模型，高风险决策交人 |\n| 「MVP聚焦」 | Agent 18.3 | 第一版选高频、可验证、风险可控的场景 |\n| 「版本绑定和A/B测试」 | Agent 第十六章 | 评测需要关注过程和结果，不能只看模型输出 |\n| 「竞品数据人工整理」 | 需求文档 V1范围 | V1不要求自动抓取外部数据 |\n| 「引用的来源和更新时间」 | RAG 2.4 + 第十七章 | 企业知识库不等于文件库，需要管理版本和来源 |\n| 「数据归因」 | 需求文档 10.12 | 必须记录同期达人、直播、投流等其他影响因素 |\n", "p5": "", "p6": "", "p7": "", "r1": "## ZYL-完整简历面试逐字稿 学习笔记\n\n> **核心目标**：把「创业→人事→社交平台→字节BD→AI产品」这条看似跳跃的路线，统一为一条能力成长主线。\n\n---\n\n## 一、面试前必须统一的职业主线\n\n### 你真实的履历线\n\n```\n创业经营与商业验证\n  → 人力流程标准化与数据管理\n  → 用户场景及B端商户解决方案\n  → 字节跳动本地生活商务运营\n  → 从真实商户问题中设计AI产品方案\n```\n\n### 面试中把它讲成一条线（原文核心逻辑）\n\n> 我一直在解决真实业务中的用户和客户问题。早期创业让我具备商业闭环和结果意识；人事主管经历让我建立了流程、规则和数据化能力；青年社交平台让我积累了用户洞察、场景产品和B端商户方案经验；在字节跳动，我进一步把这些能力应用到本地生活商户场景，并推动餐饮商户AI营销经营助手从需求识别、方案设计到试点验证。\n\n> 这条主线要证明，我不是突然为了转行而包装一个AI项目，而是在原有B端需求、流程标准化、数据运营和商业落地能力上，进一步补充AI产品能力。\n\n### 关键词对照表：BD经验 → AI PM能力\n\n| BD经验 | 对应的AI PM能力 |\n|--------|---------------|\n| 客户需求分析 | 用户/客户需求洞察与结构化 |\n| 竞品调研 | 市场分析与竞品对标 |\n| 方案定制与谈判 | 产品方案设计与跨团队协调 |\n| 数据复盘 | 数据指标体系与效果归因 |\n| 流程SOP化 | 工作流设计与异常处理 |\n| 跨部门协调 | 产品、技术、运营多方协作 |\n\n---\n\n## 二、自我介绍\n\n### 回答思路（四段式）\n\n1. **一句话我是谁**：姓名+求职方向（AI产品经理、AIGC内容解决方案相关岗位）\n2. **三类核心能力**（不按时间流水账）：\n   - B端客户和用户需求理解\n   - 业务流程产品化与数据化\n   - AI内容生产方案设计与业务验证\n3. **重点讲字节AI项目**：核心问题、个人贡献、结果数据\n4. **为什么与目标岗位匹配**：收尾呼应\n\n### 面试官考察方向\n\n- 履历是否有清晰主线\n- 为什么从商务运营转AI产品\n- 是否真正具备产品能力\n- 是否只是会使用AIGC工具\n- 能否用较短时间讲清自身优势\n- 工作经历跨度较大是否意味着职业方向不稳定\n\n### 注意事项（5条红线）\n\n1. **不要在自我介绍中逐条复述所有公司和工作内容**\n2. **不要一开始强调「我没有正式的产品经理Title」**——先讲能力和项目，被追问时再解释\n3. **不要说「我精通所有AI工具」或「熟悉所有大模型」**——更合理表述：「熟悉结构化Prompt、多模态内容生成、质量评测及AI工作流，能够根据业务任务选择合适的工具和方案」\n4. **不要在2分钟自我介绍里详细解释AI项目的每一个功能**——先讲核心问题、个人贡献和结果\n5. **不要把过往经历割裂地讲成四段毫无关联的工作**\n\n### 两分钟自我介绍逐字稿（原文完整版）\n\n面试官您好，我叫朱耀龙，目前主要应聘AI产品经理、AIGC内容解决方案以及AI内容生产运营相关岗位。\n\n我的核心优势是同时具备B端客户需求理解、业务流程产品化和AI内容方案落地三方面能力。\n\n我早期有4年创业经历，从0到1参与青年文化和线下文娱业务的产品定位、资源拓展和经营管理，这段经历让我建立了比较强的商业结果意识。之后我做过人力流程优化和用户场景运营，分别积累了流程标准化、数据看板、用户洞察和B端商户解决方案能力。\n\n在字节跳动本地生活期间，我主要负责餐饮商户的拓展、平台入驻、套餐规划、活动运营和经营复盘。在服务商户的过程中，我发现很多中小商户缺少专业的线上运营团队，竞品分析、套餐设计、文案和视觉素材生产都比较依赖人工。\n\n基于这个问题，我主导设计并推动试点了餐饮商户AI营销经营助手。产品覆盖商户需求诊断、商圈竞品分析、套餐与定价建议、营销文案和视觉生成、内容审核及经营复盘。\n\n在项目中，我主要负责业务需求分析、产品功能规划、MVP设计、结构化Prompt、生成质量评测、商户试点和内部推广。针对菜品生成中的食材失真和风格漂移问题，我测试了5类方案，形成三层提示词和3版风格样片确认机制，将菜品还原合格率从40%提升到85%，单版素材生产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2至3轮。\n\n我的特点是，不会只从模型能做什么出发，而是会先理解业务目标和用户任务，再明确AI、规则和人工各自负责什么，并通过效率、质量和业务指标验证方案价值。我希望下一阶段能够继续深耕AI产品，将一线客户需求和AI能力转化为可复制、可规模化的产品解决方案。\n\n### 自我介绍高频QA\n\n**Q：请用一句话概括你的核心竞争力**\nA：我的核心竞争力是，既能深入理解B端客户的真实业务诉求，也能将这些模糊需求转化为结构化的AI产品流程、Prompt方案和质量标准，并推动方案在真实业务中完成验证。\n\n**Q：你和传统产品经理相比有什么优势？**\nA：我的优势是长期处于客户和业务一线，比较清楚客户提出的表面需求背后，真正影响经营结果的是什么。比如商户说「想要一张好看的图片」，表面上是视觉需求，但进一步分析后，可能涉及目标用户、套餐定位、品牌调性、内容场景和转化目标。我能够先把这些需求拆清楚，再结合模型能力、业务规则和人工流程设计解决方案，避免产品只停留在功能层。\n\n**Q：你最大的短板是什么？**\nA：相比长期在研发团队中成长的产品经理，我在复杂技术系统和完整研发管理上的经验还需要继续积累。但我的优势是业务理解和落地比较强。目前我会重点补充大模型基础、工作流设计、RAG、模型评测和数据指标体系，同时在设计方案时主动与技术人员确认模型边界、输入输出和异常机制。我的目标不是代替算法或研发，而是能够准确判断技术适用性，并把业务问题转换成团队可以执行的产品方案。\n\n---\n\n## 三、为什么从商务运营 & 产品运营转向 AI 产品\n\n### 回答思路（四步递进）\n\n1. 商务运营经历帮助自己积累了真实客户需求\n2. 在工作中逐渐从单个客户交付走向共性问题抽象\n3. 餐饮商户AI项目让自己确认更适合产品化解决问题\n4. 转型是原有能力的升级，不是完全推翻过去\n\n### 面试官考察方向\n\n- 转型动机是否稳定\n- 是否只是追逐AI热点\n- 是否具备产品基本功\n- 能否接受AI产品岗位中大量需求、协作和细节工作\n- 商务经历能否转化为产品价值\n\n### 注意事项（4条红线）\n\n1. 不要说：商务运营发展上限比较低，所以想转AI\n2. 不要否定过去经历，否则面试官会担心未来也否定AI产品工作\n3. 不要只说「对AI感兴趣」，兴趣不足以支撑职业转型\n4. 不要塑造「商务工作低价值，产品工作高价值」的对立\n\n---\n\n## 四、字节经历——七点拆解\n\n### 字节经历记忆结构\n\n```\n1. 业务场景与典型问题 → 2. 从观察到行动 → 3. Prompt设计与优化\n→ 4. 内容评测 → 5. 流程设计 → 6. 套餐与经营策略 → 7. 产品运营与内部推广\n```\n\n### 第一点：业务场景与典型问题\n\n**核心**：不是「我看到图片不好看」，而是「我长期服务商户，持续看到同一类问题在不同商户身上反复出现」。\n\n### 第二点：从观察到行动\n\n**核心**：如何从「个人判断」走向「产品化方案」。先识别共性高频问题，再梳理整条链路，判断哪些节点可以用AI、规则和模板代替人工。\n\n### 第三点：Prompt设计与优化（最体现产品能力）\n\n**核心**：不是「我会写Prompt」，而是「我如何通过系统化测试找到可复用的Prompt方案」。\n\n**逐字稿内容**：\n\n针对菜品生成中的食材失真和风格漂移问题，我将问题分成真实性、视觉风格和品牌一致性几类，先后测试了5类方案。\n\n最终形成三层Prompt结构：第一层定义业务场景（菜品类型、目标用户、使用场景），第二层定义视觉风格（色调、构图、光线、餐具），第三层定义真实性约束（核心食材、分量、烹饪状态、禁止元素）。\n\n同时建立3版风格样片前置确认机制，在批量生成前先让商户确认风格基准。\n\n**高频QA**：\n\nQ：5类方案具体是什么？\nA：原文中没有逐项列出5类方案，但可以从上下文推断包括：通用描述、加长视觉描述、增加食材约束、分层结构化、样片确认等不同组合。\n\nQ：怎么判断Prompt好不好？\nA：不只看一次生成效果，而是用固定测试案例和验收标准反复验证——菜品主体是否正确、核心食材是否变化、分量是否失真、不同批次风格是否一致。\n\n### 第四点：内容评测\n\n**核心**：评测不只是看「好不好看」，而是定义「什么算合格」。\n\n**逐字稿内容**：\n\n我将评测分成效率、质量和业务三个层面。效率包括生成时间和修改轮次；质量包括事实准确、菜品还原、风格一致和内容通过率；业务包括内容采用率、点击、下单和核销。\n\n对AI产品来说，模型生成结果并不是最终指标。只有输出被用户采用、通过审核并帮助完成业务任务，才说明产品有价值。\n\n### 第五点：流程设计\n\n**核心**：将依赖个人的工作变成可复用的流程。\n\n**逐字稿内容**：\n\n我将流程从「一次生成后让商户修改」，调整成「先采集结构化需求→输出3版风格样片确认→批量生成→质量验收」。明确每个环节的输入、输出、负责人和异常处理，使方案不再依赖个人经验。\n\n### 第六点：套餐与经营策略\n\n**核心**：图片好看不等于用户下单，经营策略和内容生产必须连接。\n\n**逐字稿内容**：\n\n系统基于商户真实菜品池、成本和竞品数据，生成引流款、主推款和利润款三档套餐方案。引流款承担新客转化和销量增长，主推款覆盖主流消费场景，利润款提升客单价和收益。\n\n价格不交给大模型。菜品原价、成本、折扣和目标毛利通过结构化数据和规则测算，大模型主要负责说明市场差异、套餐定位和卖点。\n\n**高频QA**：\n\nQ：竞品数据如何获得？\nA：MVP阶段主要通过运营人员在公开平台收集、商户提供资料、表格或截图导入，以及内部授权信息。没有默认使用未经授权的自动爬取。\n\nQ：为什么内容产品要做套餐策略？\nA：用户是否下单不只取决于图片好不好看，也取决于套餐组合、价格和消费场景。如果只生成图片，可能得到高点击但低转化。\n\n### 第七点：产品运营与内部推广\n\n**核心**：如何把个人方法变成团队标准。\n\n**逐字稿内容**：\n\n方案验证后，我将需求采集、风格标签、参考图、分层提示词、套餐分析和质量验收整理成标准化SOP。\n\n内部推广时，没有只做工具操作培训，而是使用真实商户案例说明使用前后的时间、修改轮次和内容效果变化。因为很多运营人员已经有自己的工作方式，如果一开始要求完全按照标准流程执行容易抵触，所以我保留了人工调整和个性化处理空间。\n\n后续方案在约50人的市场团队范围内进行普及和使用。\n\n**高频QA**：\n\nQ：内部推广最大的阻力是什么？\nA：不是不会用，而是不愿改变原有工作方式。运营人员担心标准化工具无法处理个性商户，所以我先用真实案例证明工具可以减少重复劳动，同时保留人工修改空间。\n\n---\n\n## 五、业务结果与反思（与产品逐字稿联动记忆）\n\n| 维度 | 数据 | 关联产品逐字稿 |\n|------|------|-------------|\n| 效率 | 30min->10min，5轮->2-3轮 | 产品逐字稿第三节 |\n| 质量 | 菜品还原率40%->85% | 产品逐字稿第四节 |\n| 经营 | 调研5天->36小时，转化+19% | 产品逐字稿第四节 |\n| 组织 | 沉淀SOP，约50人团队复用 | 产品逐字稿第五节 |\n\n**四个不足（原文）**：\n1. 试点商户数量有限，属于方向验证不是大规模统计结论\n2. 竞品数据主要依靠人工整理，自动数据接入没有完成\n3. 质检以人工为主，完整自动质检仍属于产品规划\n4. 套餐、视觉、达人和投流可能同时变化，", "r2": "19%为综合结果\n\n**如果重做**：收敛MVP、建立固定测试集、版本绑定、A/B测试\n\n---\n\n## 六、本地青年社交平台经历（三项核心数据）\n\n- 设计10余条主题社交线路\n- 周均参与用户超过1000人\n- 累计签约50余家优质商户，带动相关业务流水突破150万元\n\n**面试要点**：不要强行包装成AI项目。它的价值在于证明**用户洞察、场景产品、B端商户方案和商业化能力**。\n\n### 第一点：用户洞察与场景设计\n\n**逐字稿内容**：\n\n在本地青年社交平台，我主要负责用户需求分析、主题社交线路设计和线下活动运营。用户表面上会表达「想认识朋友」或「想参加有意思的活动」，但不同用户在兴趣、年龄、活动强度、社交目的和消费能力上差异较大。\n\n我通过用户报名信息、活动参与情况、现场反馈和后续评价，提炼不同人群的核心需求，并将需求拆成活动主题、参与人数、场地、匹配方式和互动环节。基于这些分析设计10余条主题社交线路，沉淀成可复用的场景化SOP。周均参与用户超过1000人。\n\n这段经历让我形成了将模糊用户需求转化成结构化场景方案的能力，这也是后来设计AI需求诊断的重要基础。\n\n### 第二点：商户合作与商业增长\n\n**逐字稿内容**：\n\n平台开展线下社交活动需要餐饮、休闲娱乐和场地类商户合作。我会先判断商户希望获得的是客流、曝光、活动内容还是长期年轻用户，然后根据商户类型设计不同合作方式。不只是销售固定资源，而是将用户活动、商户权益和平台收入组合成完整方案。最终累计签约50余家优质商户，带动平台相关业务流水突破150万元。\n\n### 第三点：流程产品化\n\n**逐字稿内容**：\n\n随着活动和商户数量增加，如果每一场活动都依靠个人经验，执行质量很难稳定。我将流程拆成活动策划、用户报名、人员筛选、商户协调、现场执行和反馈复盘几个阶段，并明确每个阶段的输入、责任人、交付物和异常处理。成功线路沉淀成模板，后续可以根据用户人群、场地和主题进行调整。\n\n这类经验后来可以直接迁移到AI产品中——AI工作流同样需要明确输入、节点、规则、异常和最终验收。\n\n---\n\n## 七、拓浦集团经历（两项核心数据）\n\n- 人力流程整体执行效率提升40%\n- 人力管理风险事件发生率降低30%\n\n**面试要点**：不要讲成普通行政工作。它的价值在于证明**流程标准化、数据化和规则意识**。\n\n### 第一点：流程诊断与标准化\n\n**逐字稿内容**：\n\n在拓浦集团，我发现招聘、入职、考勤、绩效和人员变动等流程比较碎片化，不同部门的执行标准也不完全一致。我先访谈流程负责人和实际执行人员，梳理每个流程中的角色、输入资料、审批节点、状态和异常情况。之后将流程拆成标准步骤，明确每个环节由谁负责、需要提交什么、什么条件下可以进入下一步，以及异常时如何处理。通过统一表单、操作规范和任务节点，减少重复确认和遗漏，使整体流程执行效率提升40%。\n\n这段经历让我建立了比较强的流程和规则意识，也让我理解产品设计不能只设计正常路径，还必须考虑异常路径。\n\n### 第二点：数据看板与风险预警\n\n**逐字稿内容**：\n\n除了流程标准化，我还将人员状态、招聘进度、考勤异常和风险事件等数据进行集中整理，搭建人力运营看板。看板的价值不只是展示数据，而是帮助管理人员快速识别哪些任务超期、哪些资料缺失以及哪些人员状态存在异常。还为不同异常设置风险标记、责任人和处理状态，使问题从发现到跟进形成闭环。通过数据监控和预警，人力管理风险事件发生率降低30%。\n\n### 第三点：对AI产品能力的迁移\n\n**逐字稿内容**：\n\n这段经历虽然不是AI项目，但让我掌握了将线下业务拆成数据输入、规则判断、任务流转、异常预警和结果反馈的能力。后来设计AI产品时，我也会按照相同逻辑思考：哪些信息由用户输入，哪些内容由模型生成，哪些规则必须强校验，什么情况需要人工确认，以及失败后如何处理。因此，它为我后续做AI工作流和人机协同产品奠定了比较扎实的流程基础。\n\n---\n\n## 八、菜鸟文化传媒创业经历\n\n**核心数据**：单店月利润从1.5万->5万\n\n### 第一点：产品定位与MVP验证\n\n**逐字稿内容**：\n\n创业阶段聚焦大学生和青年文化市场，主要解决年轻用户线下娱乐和社交场景较单一的问题。前期通过用户沟通、活动反馈和实际消费观察，判断年轻用户不仅需要活动内容，也需要更加自然的社交和文化体验。通过小规模活动验证用户参与和付费意愿，再根据反馈调整产品。这段经历让我较早建立了MVP意识——不是一开始投入大量资源做完整方案，而是先通过低成本方式验证需求和商业模式。\n\n### 第二点：经营策略与利润增长\n\n逐字稿模板：项目早期单店月利润约为1.5万元，随后从产品组合、活动排期、用户运营和定价等方面进行优化，根据不同产品的获客和利润作用进行分层。经过持续调整，单店月利润由1.5万元提升到5万元。这段经历让我形成了比较强的商业结果意识。\n\n### 第三点：资源整合与团队协作\n\n逐字稿内容：线下文娱项目需要校园社团、音乐节、消费品牌、活动场地和内容团队等多方资源。根据不同合作方的目标设计合作方式，将不同诉求组合成可执行方案。这段经历提升了商务谈判和跨组织协作能力。\n\n---\n\n## 九、AI及AIGC技能面试逐字稿\n\n### Prompt能力\n\n逐字稿：我理解的Prompt工程，不是单纯写一段很长的指令，而是将业务目标转换成稳定、可复用的输入结构。一般会包括角色和任务、业务上下文、输入数据、输出格式、强约束、负向约束和Few-shot示例。对餐饮图片使用业务场景、视觉风格和真实性约束三层结构；对文案则把商户名称、价格和菜品设置为固定事实字段，将语气和卖点作为可生成字段。Prompt是否有效，需要通过固定案例和验收指标测试，而不是只凭一次结果判断。\n\nQA：什么是Few-shot？Few-shot是在Prompt中提供少量高质量输入和输出示例，帮助模型理解任务格式和判断标准。适合格式稳定、表达规则明确的任务，但示例需要有代表性。\n\n### 模型和工具选择\n\n逐字稿：选择模型或工具时，我会先看任务。文案和需求分析重点关注中文理解、逻辑和结构化输出；视觉生成重点关注参考图理解、风格稳定和局部编辑；工作流则关注节点编排、变量管理和失败重试。同时考虑速度、成本、稳定性、数据安全和团队使用门槛。不会因为某个模型整体能力强，就默认所有任务都使用同一个模型。\n\n### Dify及工作流\n\n逐字稿：我了解Dify的基础工作流逻辑，包括输入变量、Prompt节点、模型调用、条件分支、知识检索和工具节点。当前我的能力重点在工作流和产品方案层，复杂部署和底层开发仍需要研发支持。\n\n### AI评测\n\n逐字稿：将评测分成效率、质量和业务三个层面。效率包括生成时间和修改轮次；质量包括事实准确、菜品还原、风格一致和内容通过率；业务包括内容采用率、点击、下单和核销。模型生成结果并不是最终指标，只有输出被用户采用、通过审核并帮助完成业务任务，才说明产品有价值。\n\n---\n\n## 十、全量高频追问速查\n\n1. 「请用一句话概括你的核心竞争力」\n2. 「你和传统产品经理相比有什么优势？」\n3. 「你最大的短板是什么？」\n4. 「为什么从商务运营转AI产品？」\n5. 「创业中你具体负责什么？」\n6. 「如何判断市场需求？」\n7. 「你如何设计一条新的社交线路？」\n8. 「如何说服商户合作？」\n9. 「用户体验和商业化冲突怎么办？」\n10. 「内部推广最大的阻力是什么？」\n11. 「如何衡量内部推广是否成功？」\n12. 「什么是Few-shot？」\n13. 「Prompt怎么评测？」\n14. 「你了解的Dify工作流是怎样的？」\n15. 「AI产品怎么评测？」\n16. 「你对Agent和RAG的理解？」\n", "r3": "", "r4": "", "r5": "", "q1": "<h2>Agent 10个必知概念</h2><ol><li><b>大模型 vs Agent</b>：前者只能说，后者能做</li><li><b>AI产品四层次</b>：内容生成→知识问答→辅助执行→自主执行</li><li><b>Agent 5要素</b>：目标、环境、行动、观察、持续执行</li><li><b>工具调用9步</b>：定义→输入→意图→选择→参数→校验→执行→返回→回答</li><li><b>API/FC/MCP/RPA</b>：API最稳定，FC负责结构化调用，MCP是连接协议</li><li><b>金句</b>：确定性任务交程序，模糊理解交模型，高风险决策交人</li><li><b>Human-in-the-loop</b>：按风险分级确认</li></ol>", "q2": "<h2>RAG 10个必知概念</h2><ol><li><b>RAG三环节</b>：检索→增强→生成</li><li><b>Prompt vs RAG</b>：Prompt定怎么答，RAG提供答什么</li><li><b>微调vs RAG</b>：常变的知识用RAG，稳定模式才微调</li><li><b>关键词vs向量</b>：精确用关键词，语义用向量，企业用混合检索</li><li><b>权限原则</b>：检索前过滤，不能检索后靠模型自觉</li><li><b>故障定位顺序</b>：资料→解析切片→检索重排→生成</li></ol>", "q3": "<h2>需求文档重点</h2><ol><li><b>产品定位</b>：需求理解→经营策略→内容生产→质量审核→数据优化闭环</li><li><b>V1范围</b>：做了需求诊断/竞品/套餐/文案视觉/审核/确认/导出/复盘；没做自动爬取/自动发布/动态调价</li><li><b>AI原则</b>：事实必须来源用户输入；结论需展示依据；高 // ============ SCORING ENGINE ============
function scoreAnswer(userAnswer, keyPoints) {
  if (!keyPoints || keyPoints.length === 0) return {score:5, matched:[], missed:[], total:0, hit:0};
  var answer = userAnswer.toLowerCase();
  var matched = [], missed = [];
  for (var i = 0; i < keyPoints.length; i++) {
    if (answer.indexOf(keyPoints[i].toLowerCase()) !== -1) matched.push(keyPoints[i]);
    else missed.push(keyPoints[i]);
  }
  var ratio = matched.length / keyPoints.length;
  var score = ratio >= 0.85 ? 5 : ratio >= 0.65 ? 4 : ratio >= 0.45 ? 3 : ratio >= 0.25 ? 2 : ratio > 0 ? 1 : 0;
  return { score: score, matched: matched, missed: missed, total: keyPoints.length, hit: matched.length };
}

var LSKEY = 'ai_pm_mobile';
function gp() { try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch(e) { return {}; } }
function sp(p) { localStorage.setItem(LSKEY, JSON.stringify(p)); }
function gdr(sec) { var p = gp(); return p[sec] || null; }
function sdr(sec, r) { var p = gp(); p[sec] = {results: r.results, avg: r.avg, rate: r.rate, total: r.total, count: r.count, ts: Date.now()}; sp(p); }

  if (name === 'progress') { renderProgress(); }
}

function switchStudyTab(tab) {
  cst = tab;
  document.querySelectorAll('.study-tabs button').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  renderStudySidebar();
  document.getElementById('study-content').innerHTML = '<div class="empty">选择章节开始学习</div>';
}

// ============ STUDY ============
function renderStudySidebar() {
  var data = STUDY_CONTENT[cst];
  if (!data) return;
  var sb = document.getElementById('study-sidebar-mob');
  var h = '<div class="study-sidebar-header">'+data.title+'</div>';
  data.sections.forEach(function(s) {
    h += '<div class="study-sidebar-item" onclick="loadSection(\''+s.id+'\')"><span class="dot"></span>'+s.title+'</div>';
  });
  sb.innerHTML = h;
}

function loadSection(id) {
  var data = STUDY_CONTENT[cst];
  var sec = data.sections.find(function(s) { return s.id === id; });
  if (sec) {
    document.getElementById('study-content').innerHTML = sec.content;
    document.getElementById('study-content').scrollTop = 0;
    window.scrollTo({top: document.getElementById('study-content').offsetTop - 60, behavior: 'smooth'});
  }
  document.querySelectorAll('.study-sidebar-item').forEach(function(el) { el.classList.remove('active'); });
  var items = document.querySelectorAll('.study-sidebar-item');
  data.sections.forEach(function(s, i) { if (s.id === id && items[i]) items[i].classList.add('active'); });
}

// ============ QUIZ ============
function renderSectionPills() {
  var pills = document.getElementById('section-pills');
  var sections = Object.keys(QUIZ_DATA);
  var h = '';
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = gdr(s);
    var cls = 'section-pill';
    if (s === csection) cls += ' active';
    if (r && r.avg >= 3) cls += ' done';
    var label = QUIZ_DATA[s].title.length > 12 ? QUIZ_DATA[s].title.substring(0,12)+'..' : QUIZ_DATA[s].title;
    h += '<button class="'+cls+'" onclick="csection=\''+s+'\';renderSectionPills();loadSectionQuiz(\''+s+'\')">'+label+'</button>';
  }
  pills.innerHTML = h;
}

function loadSectionQuiz(section) {
  csection = section;
  renderSectionPills();
  var data = QUIZ_DATA[section];
  if (!data) return;
  var body = document.getElementById('quiz-body');
  var pr = gdr(section);
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:4px;">'+data.title+'</h3>';
  h += '<p style="font-size:12px;color:var(--sub);margin-bottom:10px;">共 '+data.questions.length+' 题</p>';
  if (pr) {
    var cls = pr.avg >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+cls+'" style="margin-bottom:10px;">上次：'+new Date(pr.ts).toLocaleString('zh-CN')+' | <strong>'+pr.rate+'%</strong> | '+pr.avg.toFixed(1)+'/5'+(pr.avg<3?' | 建议重做':'')+'</div>';
  }
  data.questions.forEach(function(q, i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'/'+data.questions.length+'</span></h3><div class="q-text">'+q.q+'</div><textarea id="a_'+i+'" placeholder="输入你的回答..."></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitSectionQuiz(\''+section+'\')">提交自检（'+data.questions.length+'题）</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitSectionQuiz(section) {
  var data = QUIZ_DATA[section];
  var results = [], total = 0;
  for (var i = 0; i < data.questions.length; i++) {
    var ans = document.getElementById('a_'+i).value.trim();
    if (!ans) { results.push({score:0,matched:[],missed:['未作答'],question:data.questions[i].q,total:0,hit:0}); continue; }
    var r = scoreAnswer(ans, data.questions[i].kp);
    results.push({score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit});
    total += r.score;
  }
  var avg = total / data.questions.length;
  var rate = Math.round(avg * 20);
  sdr(section, {results: results, avg: avg, rate: rate, total: total, count: data.questions.length});
  showResult(section, results, avg, rate);
  renderSectionPills();
}

function showResult(section, results, avg, rate) {
  var rc = document.getElementById('quiz-result');
  var cls = avg >= 3.5 ? 'good' : avg >= 2.5 ? 'ok' : 'bad';
  var h = '<div class="result-header"><div class="result-score '+cls+'">'+rate+'%</div><div class="result-meta">'+QUIZ_DATA[section].title+'<br>'+avg.toFixed(1)+'/5 &middot; '+results.length+'题</div></div>';
  h += '<div class="result-stats">';
  var passCount = results.filter(function(r) { return r.score >= 3; }).length;
  var failCount = results.filter(function(r) { return r.score < 3; }).length;
  h += '<div class="result-stat"><div class="num" style="color:var(--green)">'+passCount+'</div><div class="lbl">达标</div></div>';
  h += '<div class="result-stat"><div class="num" style="color:var(--red)">'+failCount+'</div><div class="lbl">薄弱</div></div>';
  h += '<div class="result-stat"><div class="num">'+rate+'%</div><div class="lbl">得分率</div></div>';
  h += '</div>';
  var analysis = rate >= 80 ? '&#x1f44d; 掌握良好，关键概念和逻辑覆盖到位。' : rate >= 60 ? '&#x1f4a1; 基本掌握，部分要点遗漏。回顾红色标记。' : rate >= 40 ? '&#x26a0;&#xfe0f; 较多知识盲区，建议重读原文后再做。' : '&#x1f534; 需重点重学。先回学习材料精读。';
  h += '<div class="analysis-box"><strong>板块分析：</strong>'+analysis+'</div>';
  results.forEach(function(r, i) {
    var fcls = r.score >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+fcls+'"><div class="fb-title">Q'+(i+1)+' 得分：<strong>'+r.score+'/5</strong>（覆盖率 '+Math.round(r.hit/Math.max(1,r.total)*100)+'%）</div>';
    if (r.matched.length) h += '<div class="caught">&#x2705; '+r.matched.join('、')+'</div>';
    if (r.missed.length) h += '<div class="missed">&#x274c; '+r.missed.join('、')+'</div>';
    h += '</div>';
  });
  h += '<div style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="retrySection(\''+section+'\')">只重做薄弱题</button></div>';
  rc.innerHTML = h;
  rc.style.display = 'block';
  window.scrollTo({top: rc.offsetTop - 60, behavior: 'smooth'});
}

function retrySection(section) {
  var pr = gdr(section);
  if (!pr) return;
  var wi = [];
  pr.results.forEach(function(r, i) { if (r.score < 3) wi.push(i); });
  if (!wi.length) { alert('全部达标！'); return; }
  var data = QUIZ_DATA[section];
  var body = document.getElementById('quiz-body');
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:6px;">重做薄弱题 - '+data.title+'</h3>';
  wi.forEach(function(i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'</span> 上次：'+pr.results[i].score+'/5</h3><div class="q-text">'+data.questions[i].q+'</div><div class="q-hint">遗漏：'+pr.results[i].missed.join('、')+'</div><textarea id="r_'+i+'"></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitRetry(\''+section+'\','+JSON.stringify(wi)+')">提交重做</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitRetry(section, wi) {
  var data = QUIZ_DATA[section];
  var pr = gdr(section);
  wi.forEach(function(i) {
    var ans = document.getElementById('r_'+i).value.trim();
    if (!ans) return;
    var r = scoreAnswer(ans, data.questions[i].kp);
    if (r.score > pr.results[i].score) pr.results[i] = {score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit};
  });
  var total = 0;
  pr.results.forEach(function(r) { total += r.score; });
  pr.avg = total / pr.results.length;
  pr.rate = Math.round(pr.avg * 20);
  pr.ts = Date.now();
  sdr(section, pr);
  loadSectionQuiz(section);
  setTimeout(function() { showResult(section, pr.results, pr.avg, pr.rate); }, 100);
}

// ============ PROGRESS ============
function renderProgress() {
  var p = gp();
  var sections = Object.keys(QUIZ_DATA);
  var completed = [];
  var dcount = 0, tsum = 0, wcount = 0, aw = [];
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = p[s];
    if (r) {
      dcount++; tsum += r.avg;
      completed.push({section:s, title:QUIZ_DATA[s].title, avg:r.avg, rate:r.rate, ts:r.ts, results:r.results});
      r.results.forEach(function(res, j) {
        if (res.score < 3) { wcount++; aw.push({section:s, title:QUIZ_DATA[s].title, q:j+1, qtext:res.question, score:res.score, missed:res.missed}); }
      });
    }
  }
  var oavg = dcount ? (tsum/dcount).toFixed(1) : '-';
  var orate = dcount ? Math.round(tsum/dcount*20) : '-';
  document.getElementById('progress-stats').innerHTML = '<div class="progress-stat"><div class="val">'+dcount+'/'+sections.length+'</div><div class="lbl">已完成</div></div><div class="progress-stat"><div class="val">'+oavg+'</div><div class="lbl">平均分</div></div><div class="progress-stat"><div class="val">'+wcount+'</div><div class="lbl">薄弱题</div></div><div class="progress-stat"><div class="val">'+orate+'%</div><div class="lbl">得分率</div></div>';
  
  var chart = document.getElementById('progress-chart');
  if (!completed.length) chart.innerHTML = '<div class="empty">暂无数据</div>';
  else {
    var ch = '';
    completed.forEach(function(d) {
      var h = Math.max(10, d.avg * 24);
      var color = d.avg >= 3.5 ? 'var(--green)' : d.avg >= 2.5 ? 'var(--amber)' : 'var(--red)';
      ch += '<div style="text-align:center;min-width:20px;" title="'+d.title+': '+d.avg.toFixed(1)+'/5"><div class="chart-bar" style="height:'+h+'px;background:'+color+'"></div><div class="chart-label">'+d.section.toUpperCase()+'</div></div>';
    });
    chart.innerHTML = ch;
  }
  
  var wtc = document.getElementById('weak-table-container');
  if (!aw.length) wtc.innerHTML = '<div class="empty">暂无薄弱点</div>';
  else {
    var wh = '<table class="weakpoint-table"><thead><tr><th>板块</th><th>题</th><th>得分</th><th>题目</th><th>遗漏</th></tr></thead><tbody>';
    aw.sort(function(a, b) { return a.score - b.score; });
    aw.forEach(function(w) {
      var badge = w.score <= 1 ? 'bad' : 'warn';
      wh += '<tr><td>'+w.title.substring(0,10)+'</td><td>Q'+w.q+'</td><td><span class="score-badge '+badge+'">'+w.score+'/5</span></td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+w.qtext+'</td><td>'+w.missed.slice(0,3).join('、')+'</td></tr>';
    });
    wh += '</tbody></table>';
    wtc.innerHTML = wh;
  }
  
  var hl = document.getElementById('history-list');
  if (!completed.length) hl.innerHTML = '<div class="empty">暂无记录</div>';
  else {
    var hh = '';
    completed.reverse().forEach(function(d) {
      hh += '<div class="history-item" onclick="switchPanel(\'quiz\');csection=\''+d.section+'\';renderSectionPills();loadSectionQuiz(\''+d.section+'\')"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+(d.avg>=3?'var(--green)':'var(--red)')+';flex-shrink:0"></span>'+d.title+' &middot; '+d.rate+'% &middot; '+new Date(d.ts).toLocaleDateString('zh-CN')+'</div>';
    });
    hl.innerHTML = hh;
  }
}

// ============ INIT ============
switchPanel('study');
switchStudyTab('product');
renderStudySidebar();
</script>
