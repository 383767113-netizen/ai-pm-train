function scoreAnswer(ua,kp){if(!kp||!kp.length)return{score:5,matched:[],missed:[],total:0,hit:0};var a=ua.toLowerCase(),m=[],s=[];for(var i=0;i<kp.length;i++){if(a.indexOf(kp[i].toLowerCase())!==-1)m.push(kp[i]);else s.push(kp[i])}var r=m.length/kp.length,sc=r>=0.85?5:r>=0.65?4:r>=0.45?3:r>=0.25?2:r>0?1:0;return{score:sc,matched:m,missed:s,total:kp.length,hit:m.length}}
var cp="study",cst="product",csection="p1",LSKEY="ai_pm_v3";
function gp(){try{return JSON.parse(localStorage.getItem(LSKEY)||"{}")}catch(e){return{}}}
function sp(p){localStorage.setItem(LSKEY,JSON.stringify(p))}
function gdr(sec){var p=gp();return p[sec]||null}
function sdr(sec,r){var p=gp();p[sec]={results:r.results,avg:r.avg,rate:r.rate,total:r.total,count:r.count,ts:Date.now()};sp(p)}

function switchPanel(name){
  cp=name;
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
  document.getElementById("panel-"+name).classList.add("active");
  document.querySelectorAll(".topbar-nav button").forEach(function(b){b.classList.remove("active")});
  var nb=document.getElementById("nav-"+name);if(nb)nb.classList.add("active");
  if(name==="study"){renderStudySidebar()}
  if(name==="quiz"){renderSectionPills();loadSectionQuiz(csection)}
  if(name==="progress"){renderProgress()}
  if(name==="flashcard"){showFlashcard()}
  if(name==="sprint"){renderSprintDashboard()}
}

function switchStudyTab(tab){cst=tab;document.querySelectorAll(".study-tabs button").forEach(function(b){b.classList.remove("active")});event.target.classList.add("active");renderStudySidebar();document.getElementById("study-content").innerHTML="<div class=empty>选择章节开始学习</div>"}

function renderStudySidebar(){var data=STUDY_CONTENT[cst];if(!data)return;var sb=document.getElementById("study-sidebar-mob"),h="";data.sections.forEach(function(s){h+="<div class=study-sidebar-item onclick=loadSection('"+s.id+"')><span class=dot></span>"+s.title+"</div>"});sb.innerHTML=h}

function loadSection(id){var data=STUDY_CONTENT[cst];var sec=data.sections.find(function(s){return s.id===id});if(sec){document.getElementById("study-content").innerHTML=sec.content+"<div style=margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px><button class='feynman-btn primary' style=width:100%;justify-content:center onclick=openFeynman('"+sec.id+"')>费曼输出：用自己的话讲一遍</button><button class=feynman-btn style=width:100%;justify-content:center;background:var(--accent-dim);color:var(--accent);border-color:var(--accent) onclick="switchPanel('quiz');csection='"+sec.id+"';renderSectionPills();loadSectionQuiz('"+sec.id+"')">做本章自检</button></div>";collapseSidebar();document.getElementById("study-content").scrollTop=0}document.querySelectorAll(".study-sidebar-item").forEach(function(el){el.classList.remove("active")});var items=document.querySelectorAll(".study-sidebar-item");data.sections.forEach(function(s,i){if(s.id===id&&items[i])items[i].classList.add("active")})}

function renderSectionPills(){var pills=document.getElementById("section-pills"),sections=Object.keys(QUIZ_DATA),h="";for(var i=0;i<sections.length;i++){var s=sections[i],r=gdr(s),cls="section-pill";if(s===csection)cls+=" active";if(r&&r.avg>=3)cls+=" done";h+="<button class='"+cls+"' onclick="csection='"+s+"';renderSectionPills();loadSectionQuiz('"+s+"')">"+QUIZ_DATA[s].title.substring(0,14)+"</button>"}pills.innerHTML=h}
var quizAnswers={};
function loadSectionQuiz(section){
  // Save current answers before switching
  if(csection&&csection!==section){
    var oldData=QUIZ_DATA[csection];
    if(oldData){
      quizAnswers[csection]=[];
      for(var i=0;i<oldData.questions.length;i++){
        var ta=document.getElementById("a_"+i);
        quizAnswers[csection].push(ta?ta.value:"");
      }
    }
  }
  csection=section;renderSectionPills();
  var data=QUIZ_DATA[section];if(!data)return;
  var body=document.getElementById("quiz-body"),pr=gdr(section),h="<h3 style=font-size:16px;font-weight:600;margin-bottom:4px>"+data.title+"</h3><p style=font-size:12px;color:var(--sub)>共"+data.questions.length+"题</p>";if(pr){h+="<div class='feedback-item "+(pr.avg>=3?"pass":"fail")+"'>上次："+new Date(pr.ts).toLocaleString("zh-CN")+" | <strong>"+pr.rate+"%</strong> | "+pr.avg.toFixed(1)+"/5</div>"}data.questions.forEach(function(q,i){h+="<div class=quiz-card><h3><span class=q-badge>"+(i+1)+"/"+data.questions.length+"</span></h3><div class=q-text>"+q.q+"</div><textarea id=a_"+i+" placeholder='输入你的回答...'></textarea></div>"});h+="<button class='btn btn-primary' onclick=submitSectionQuiz('"+section+"')>提交自检（"+data.questions.length+"题）</button>";body.innerHTML=h;
  // Restore saved answers
  var saved=quizAnswers[section];
  if(saved){for(var i=0;i<saved.length;i++){var ta=document.getElementById("a_"+i);if(ta)ta.value=saved[i]}}
  document.getElementById("quiz-result").style.display="none"}
function submitSectionQuiz(section){var data=QUIZ_DATA[section],results=[],total=0;for(var i=0;i<data.questions.length;i++){var ans=document.getElementById("a_"+i).value.trim();if(!ans){results.push({score:0,matched:[],missed:["未作答"],question:data.questions[i].q,total:0,hit:0});continue}var r=scoreAnswer(ans,data.questions[i].kp);results.push({score:r.score,matched:r.matched,missed:r.missed,question:data.questions[i].q,total:r.total,hit:r.hit});total+=r.score}var avg=total/data.questions.length,rate=Math.round(avg*20);sdr(section,{results:results,avg:avg,rate:rate,total:total,count:data.questions.length});showResult(section,results,avg,rate);renderSectionPills()}
function showResult(section,results,avg,rate){var rc=document.getElementById("quiz-result"),cls=avg>=3.5?"good":avg>=2.5?"ok":"bad",h="<div class=result-header><div class='result-score "+cls+"'>"+rate+"%</div><div class=result-meta>"+QUIZ_DATA[section].title+"<br>"+avg.toFixed(1)+"/5 · "+results.length+"题</div></div>";h+="<div class=result-stats>";var passCount=results.filter(function(r){return r.score>=3}).length,failCount=results.filter(function(r){return r.score<3}).length;h+="<div class=result-stat><div class=num style=color:var(--green)>"+passCount+"</div><div class=lbl>达标</div></div><div class=result-stat><div class=num style=color:var(--red)>"+failCount+"</div><div class=lbl>薄弱</div></div><div class=result-stat><div class=num>"+rate+"%</div><div class=lbl>得分率</div></div></div>";h+="<div class=analysis-box>"+(rate>=80?"掌握良好":rate>=60?"基本掌握，回顾红色标记":"较多知识盲区，建议重读原文")+"</div>";results.forEach(function(r,i){var fcls=r.score>=3?"pass":"fail";h+="<div class='feedback-item "+fcls+"'><div class=fb-title>Q"+(i+1)+" 得分：<strong>"+r.score+"/5</strong></div>";if(r.matched.length)h+="<div class=caught>已覆盖："+r.matched.join("、")+"</div>";if(r.missed.length)h+="<div class=missed>遗漏："+r.missed.join("、")+"</div>";h+="</div>"});h+="<div style=margin-top:10px><button class='btn btn-outline btn-sm' onclick=retrySection('"+section+"')>只重做薄弱题</button></div>";rc.innerHTML=h;rc.style.display="block";window.scrollTo({top:rc.offsetTop-60,behavior:"smooth"})}
function retrySection(section){var pr=gdr(section);if(!pr)return;var wi=[];pr.results.forEach(function(r,i){if(r.score<3)wi.push(i)});if(!wi.length){alert("全部达标！");return}var data=QUIZ_DATA[section],body=document.getElementById("quiz-body"),h="<h3>重做薄弱题 - "+data.title+"</h3>";wi.forEach(function(i){h+="<div class=quiz-card><h3><span class=q-badge>"+(i+1)+"</span> 上次得分："+pr.results[i].score+"/5</h3><div class=q-text>"+data.questions[i].q+"</div><div class=q-hint>上次遗漏："+pr.results[i].missed.join("、")+"</div><textarea id=r_"+i+"></textarea></div>"});h+="<button class='btn btn-primary' onclick=submitRetry('"+section+"',"+JSON.stringify(wi)+")>提交重做</button>";body.innerHTML=h;document.getElementById("quiz-result").style.display="none"}
function submitRetry(section,wi){var data=QUIZ_DATA[section],pr=gdr(section);wi.forEach(function(i){var ans=document.getElementById("r_"+i).value.trim();if(!ans)return;var r=scoreAnswer(ans,data.questions[i].kp);if(r.score>pr.results[i].score)pr.results[i]={score:r.score,matched:r.matched,missed:r.missed,question:data.questions[i].q,total:r.total,hit:r.hit}});var total=0;pr.results.forEach(function(r){total+=r.score});pr.avg=total/pr.results.length;pr.rate=Math.round(pr.avg*20);pr.ts=Date.now();sdr(section,pr);loadSectionQuiz(section);setTimeout(function(){showResult(section,pr.results,pr.avg,pr.rate)},100)}

function renderSectionStatusSprint(){var p=gp(),sections=Object.keys(QUIZ_DATA),container=document.getElementById("sprint-section-status"),h="";sections.forEach(function(s){var r=p[s],title=QUIZ_DATA[s].title.substring(0,20);if(r){var color=r.avg>=3.5?"var(--green)":r.avg>=2.5?"var(--amber)":"var(--red)",status=r.avg>=3.5?"✅":r.avg>=2.5?"⚠️":"❌";h+="<div class=sprint-check onclick="switchPanel('quiz');csection='"+s+"';renderSectionPills();loadSectionQuiz('"+s+"')">"+status+" "+title+" <span style=margin-left:auto;font-weight:600;color:"+color+">"+r.avg.toFixed(1)+"/5</span></div>"}else{h+="<div class=sprint-check>⬜ "+title+" <span style=margin-left:auto;font-size:11px;color:var(--sub)>未测试</span></div>"}});container.innerHTML=h}

function startRandomReview(){var allQuestions=[];Object.keys(QUIZ_DATA).forEach(function(s){QUIZ_DATA[s].questions.forEach(function(q,i){allQuestions.push({section:s,qi:i,q:q.q,kp:q.kp,title:QUIZ_DATA[s].title})})});for(var i=allQuestions.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=allQuestions[i];allQuestions[i]=allQuestions[j];allQuestions[j]=tmp}var picked=allQuestions.slice(0,5),body=document.getElementById("quiz-body"),h="<h3>🎲 随机混练</h3><p style=font-size:12px;color:var(--sub)>从15个板块随机抽5题</p>";picked.forEach(function(p,i){h+="<div class=quiz-card><h3><span class=q-badge>"+(i+1)+"/5</span> "+p.title.substring(0,12)+"</h3><div class=q-text>"+p.q+"</div><textarea id=rr_"+i+"></textarea></div>"});h+="<button class='btn btn-primary' onclick=submitRandomReview("+JSON.stringify(picked.map(function(p){return{s:p.section,qi:p.qi}}))+")>提交混练</button>";body.innerHTML=h;document.getElementById("quiz-result").style.display="none";switchPanel("quiz");window.scrollTo({top:0,behavior:"smooth"})}
function submitRandomReview(refs){var results=[],total=0;refs.forEach(function(ref,i){var ans=document.getElementById("rr_"+i).value.trim();if(!ans){results.push({score:0,matched:[],missed:["未作答"]});return}var r=scoreAnswer(ans,QUIZ_DATA[ref.s].questions[ref.qi].kp);results.push(r);total+=r.score});var avg=total/refs.length,rate=Math.round(avg*20),rc=document.getElementById("quiz-result"),cls=avg>=3.5?"good":avg>=2.5?"ok":"bad",h="<div class=result-header><div class='result-score "+cls+"'>"+rate+"%</div><div class=result-meta>随机混练 · "+avg.toFixed(1)+"/5</div></div>";h+="<div style=font-size:13px;color:var(--sub);margin-bottom:8px>打乱板块顺序的随机测试，检验真实掌握程度</div>";results.forEach(function(r,i){var fcls=r.score>=3?"pass":"fail";h+="<div class='feedback-item "+fcls+"'><div class=fb-title>Q"+(i+1)+" 得分：<strong>"+r.score+"/5</strong></div>";if(r.matched&&r.matched.length)h+="<div class=caught>✅ "+r.matched.join("、")+"</div>";if(r.missed&&r.missed.length)h+="<div class=missed>❌ "+r.missed.join("、")+"</div>";h+="</div>"});h+="<div style=margin-top:10px><button class='btn btn-outline btn-sm' onclick=startRandomReview()>再抽5题</button></div>";rc.innerHTML=h;rc.style.display="block";window.scrollTo({top:rc.offsetTop-60,behavior:"smooth"})}

var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition,voiceSupported=!!SpeechRecognition,currentRecognition=null,currentVoiceTarget=null;
function isVoiceSupported(){if(!voiceSupported){alert("浏览器不支持语音。请用Chrome或Safari。");return false}return true}
function startVoice(targetId){if(!isVoiceSupported())return;if(currentRecognition){currentRecognition.stop()}var recognition=new SpeechRecognition();recognition.lang="zh-CN";recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;var target=document.getElementById(targetId),btn=document.getElementById("vbtn_"+targetId);if(!target||!btn)return;currentRecognition=recognition;currentVoiceTarget=targetId;btn.classList.add("recording");var hint=document.createElement("div");hint.style.cssText="position:absolute;background:#1e293b;color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;z-index:999;pointer-events:none;opacity:.85;bottom:100%;left:0;margin-bottom:4px";hint.textContent="🎤 正在听...";target.parentNode.style.position="relative";target.parentNode.appendChild(hint);recognition.onresult=function(event){var t="";for(var i=0;i<event.results.length;i++){if(event.results[i].isFinal){t+=event.results[i][0].transcript}}if(t){target.value=(target.value?target.value+" ":"")+t.trim()}if(hint.parentNode){hint.remove()}};recognition.onerror=function(event){btn.classList.remove("recording");if(hint.parentNode){hint.remove()}currentRecognition=null;currentVoiceTarget=null;if(event.error==="not-allowed"){alert("麦克风权限被拒绝。请在浏览器设置中允许。")}else if(event.error!=="no-speech"&&event.error!=="aborted"){console.log("Voice error:",event.error)}};recognition.onend=function(){btn.classList.remove("recording");if(hint.parentNode){hint.remove()}currentRecognition=null;currentVoiceTarget=null};try{recognition.start()}catch(e){btn.classList.remove("recording");console.log(e)}}
function stopVoice(){if(currentRecognition){currentRecognition.stop();currentRecognition=null;if(currentVoiceTarget){var btn=document.getElementById("vbtn_"+currentVoiceTarget);if(btn)btn.classList.remove("recording");currentVoiceTarget=null}}}
var _origLoadSectionQuiz=loadSectionQuiz;loadSectionQuiz=function(section){_origLoadSectionQuiz(section);setTimeout(function(){var textareas=document.querySelectorAll("#quiz-body textarea");textareas.forEach(function(ta){var id=ta.id;if(!document.getElementById("vbtn_"+id)){var btn=document.createElement("button");btn.id="vbtn_"+id;btn.className="voice-btn";btn.title="语音输入";btn.innerHTML='<svg width=14 height=14 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1=12 y1=19 x2=12 y2=23/><line x1=8 y1=23 x2=16 y2=23/></svg>';btn.onclick=function(e){e.preventDefault();if(this.classList.contains("recording")){stopVoice()}else{startVoice(id)}};ta.parentNode.appendChild(btn)}})},100)};var _origRetrySection=retrySection;retrySection=function(section){_origRetrySection(section);setTimeout(function(){var textareas=document.querySelectorAll("#quiz-body textarea");textareas.forEach(function(ta){var id=ta.id;if(!document.getElementById("vbtn_"+id)){var btn=document.createElement("button");btn.id="vbtn_"+id;btn.className="voice-btn";btn.title="语音输入";btn.innerHTML='<svg width=14 height=14 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1=12 y1=19 x2=12 y2=23/><line x1=8 y1=23 x2=16 y2=23/></svg>';btn.onclick=function(e){e.preventDefault();if(this.classList.contains("recording")){stopVoice()}else{startVoice(id)}};ta.parentNode.appendChild(btn)}})},100)}

var currentFontSize=parseInt(localStorage.getItem("app_font_size")||"14");function changeFontSize(delta){currentFontSize=Math.max(12,Math.min(20,currentFontSize+delta));document.body.style.zoom=(currentFontSize/14).toFixed(2);localStorage.setItem("app_font_size",currentFontSize);document.getElementById("fs-label").textContent=currentFontSize};changeFontSize(0);

function collapseSidebar(){var sb=document.getElementById("study-sidebar-mob"),arrow=document.getElementById("sidebar-arrow");sb.classList.add("collapsed");arrow.textContent="▶"}

var FEYNMAN_KP={p1:["字节本地生活","入驻不等于经营","中小商户缺团队","连锁商户难批量","人工无法规模化","B端AI营销经营辅助产品","不是图片生成器"],p2:["商务经理","业务需求发起人","AI产品方案负责人","试点推动者","关键决策","文档交付","技术边界"],p3:["需求诊断","竞品分析","套餐设计","菜品真实性","三层Prompt","3版样片","审核模块","数据复盘"],p4:["30到10","5轮降到2-3轮","40%到85%","5天到36小时","19%","SOP","50人","四个不足"],p5:["关注生成转向任务完成","Prompt不是唯一答案","AI规则人工协同","MVP可以更聚焦","数据归因加强","行业迁移"]};
var currentFeynmanSection=null;
function openFeynman(sid){currentFeynmanSection=sid;document.getElementById("feynman-panel").style.display="block";document.getElementById("feynman-input").value="";document.getElementById("feynman-result").innerHTML="";document.getElementById("feynman-input").focus()}
function closeFeynman(){document.getElementById("feynman-panel").style.display="none";currentFeynmanSection=null}
function checkFeynman(){if(!currentFeynmanSection)return;var input=document.getElementById("feynman-input").value.trim();if(!input){alert("先写点东西再检查！");return}var kp=FEYNMAN_KP[currentFeynmanSection];if(!kp){document.getElementById("feynman-result").innerHTML="<div class='feynman-result fail'>该板块暂未配置费曼检查要点</div>";return}var answer=input.toLowerCase(),matched=[],missed=[];for(var i=0;i<kp.length;i++){if(answer.indexOf(kp[i].toLowerCase())!==-1)matched.push(kp[i]);else missed.push(kp[i])}var rate=Math.round(matched.length/kp.length*100),cls=rate>=70?"pass":"fail",emoji=rate>=80?"🎉":rate>=60?"💪":"📖";document.getElementById("feynman-result").innerHTML="<div class='feynman-result "+cls+"'><strong>"+emoji+" 覆盖率："+rate+"%</strong>（"+matched.length+"/"+kp.length+"）<br>"+(matched.length?"<span style=color:var(--green)>✅ "+matched.join("、")+"</span><br>":"")+(missed.length?"<span style=color:var(--red)>❌ "+missed.join("、")+"</span>":"")+"</div>"}

switchPanel("study");switchStudyTab("product");renderStudySidebar();
