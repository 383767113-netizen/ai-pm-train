<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI PM 面试训练</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--sub:#6b7280;
  --accent:#1d4ed8;--accent-dim:#dbeafe;--green:#059669;--green-dim:#d1fae5;
  --amber:#d97706;--amber-dim:#fef3c7;--red:#dc2626;--red-dim:#fee2e2;
  --radius:8px;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}

/* Top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;margin-right:auto}
.topbar-nav{display:flex;gap:2px}
.topbar-nav button{height:34px;padding:0 14px;border:none;border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .12s;display:flex;align-items:center;gap:5px}
.topbar-nav button:hover{background:#f1f5f9;color:var(--text)}
.topbar-nav button.active{background:var(--accent);color:#fff}
.topbar-nav button svg{width:14px;height:14px;flex-shrink:0}
.topbar-nav .nav-label{display:none}
.main{padding:12px 12px 24px;max-width:900px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* Study panel */
.study-tabs{display:flex;gap:0;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.study-tabs button{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.study-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.study-sidebar{background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius);padding:8px 0;margin-bottom:12px;max-height:200px;overflow-y:auto}
.study-sidebar-header{padding:6px 14px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.study-sidebar-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .1s;display:flex;align-items:center;gap:8px;border-radius:4px;margin:1px 6px}
.study-sidebar-item:active{background:#e5e7eb}
.study-sidebar-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.study-sidebar-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.study-sidebar-item.active .dot{background:var(--accent)}
.study-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;overflow-y:auto;max-height:60vh;font-size:14px;line-height:1.75}
.study-content h2{font-size:18px;font-weight:700;margin:0 0 8px}
.study-content h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--sub)}
.study-content p{margin:6px 0}
.study-content ol,.study-content ul{margin:6px 0 6px 18px}
.study-content li{margin:3px 0;line-height:1.6}
.study-content blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:#f8fafc;color:var(--sub);font-size:13px;font-style:italic}
.study-content table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.study-content th,.study-content td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.study-content th{background:#f8fafc;font-weight:600;font-size:11px;color:var(--sub)}
.study-content strong{color:var(--text)}
.study-content pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid var(--border);max-height:50vh;overflow-y:auto}
.study-content code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:12px}

/* Quiz panel */
.quiz-header{margin-bottom:12px}
.quiz-header h2{font-size:18px;font-weight:700;margin-bottom:2px}
.quiz-header p{font-size:12px;color:var(--sub)}
.section-pills{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.section-pill{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:15px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .12s;display:flex;align-items:center}
.section-pill:active{border-color:var(--sub)}
.section-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-pill.done{border-color:var(--green);color:var(--green)}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.quiz-card h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.q-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:var(--accent-dim);color:var(--accent)}
.quiz-card .q-text{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--text)}
.quiz-card .q-hint{font-size:11px;color:var(--sub);margin-bottom:8px;padding:6px 10px;background:#fefce8;border-radius:4px;border-left:3px solid var(--amber)}
.quiz-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.6;resize:vertical;-webkit-appearance:none}
.quiz-card textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}

/* Buttons */
.btn{height:40px;padding:0 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;gap:6px;-webkit-appearance:none}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center}
.btn-primary:active{opacity:.85}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:32px;padding:0 10px;font-size:12px}

/* Results */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.result-score{font-size:36px;font-weight:800}
.result-score.good{color:var(--green)}.result-score.ok{color:var(--amber)}.result-score.bad{color:var(--red)}
.result-meta{font-size:12px;color:var(--sub)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.result-stat{text-align:center;padding:10px;background:#f8fafc;border-radius:var(--radius)}
.result-stat .num{font-size:16px;font-weight:700}
.result-stat .lbl{font-size:10px;color:var(--sub);margin-top:2px}
.feedback-item{padding:10px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:12px;line-height:1.5}
.feedback-item.pass{background:var(--green-dim);border:1px solid #a7f3d0}
.feedback-item.fail{background:var(--red-dim);border:1px solid #fecaca}
.feedback-item .fb-title{font-weight:600;margin-bottom:3px}
.feedback-item .caught{color:var(--green);font-weight:500}
.feedback-item .missed{color:var(--red);font-weight:500}
.analysis-box{padding:12px;background:#f8fafc;border-radius:var(--radius);font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}

/* Progress */
.progress-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.progress-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.progress-stat .val{font-size:24px;font-weight:700}
.progress-stat .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.chart-container h3{font-size:13px;font-weight:600;margin-bottom:10px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px;overflow-x:auto}
.chart-bar{flex:1;min-width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.chart-label{text-align:center;font-size:9px;color:var(--sub);margin-top:4px}
.weakpoint-table{width:100%;border-collapse:collapse;font-size:11px}
.weakpoint-table th{text-align:left;padding:6px 8px;background:#f8fafc;font-size:10px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border)}
.weakpoint-table td{padding:6px 8px;border-bottom:1px solid var(--border);line-height:1.4}
.score-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.score-badge.bad{background:var(--red-dim);color:var(--red)}
.score-badge.warn{background:var(--amber-dim);color:var(--amber)}
.empty{padding:32px;text-align:center;color:var(--sub);font-size:13px}
.history-item{padding:10px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.history-item:active{background:#f1f5f9}

/* Desktop overrides */
@media(min-width:768px){
  .main{padding:20px 24px;max-width:1100px}
  .study-layout-desktop{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .study-sidebar-desktop{background:#fafbfc;border-right:1px solid var(--border);padding:10px 0;overflow-y:auto}
  .study-content-desktop{padding:28px 36px;overflow-y:auto;max-height:calc(100vh - 120px)}
  .topbar-nav .nav-label{display:inline}
  .section-pill{height:32px;padding:0 12px;font-size:12px}
  .quiz-card{padding:18px 22px}
  .quiz-card textarea{min-height:100px}
  .progress-grid{grid-template-columns:repeat(4,1fr)}
}

/* === Content Formatting === */
.freq-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle}
.freq-3{background:#fef2f2;color:#dc2626}.freq-2{background:#fff7ed;color:#ea580c}.freq-1{background:#f0fdf4;color:#16a34a}
.kp-box{border-radius:var(--radius);padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.7}
.kp-framework{background:#eff6ff;border-left:3px solid #3b82f6}
.kp-data{background:#fefce8;border-left:3px solid #eab308}
.kp-warning{background:#fef2f2;border-left:3px solid #ef4444}
.kp-qa{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:8px 0}
.kp-qa .q-label{font-weight:700;color:var(--accent);font-size:12px;margin-bottom:2px}
.kp-qa .a-label{color:var(--text);font-size:13px;line-height:1.7}
.kp-highlight{background:linear-gradient(180deg,transparent 60%,#fde68a 60%);padding:0 2px;font-weight:600}
.kp-jp{font-weight:700;color:var(--accent);background:var(--accent-dim);padding:1px 6px;border-radius:3px;font-size:12px}
.section-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-right:4px}
.tag-silu{background:#dbeafe;color:#1d4ed8}.tag-kaocha{background:#fef3c7;color:#92400e}
.tag-zhuyi{background:#fee2e2;color:#dc2626}.tag-zhuzigao{background:#d1fae5;color:#059669}
.tag-qa{background:#f3e8ff;color:#7c3aed}
.study-content hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.study-content .freq-summary{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:12px;line-height:1.8}
.study-content .freq-summary strong{color:var(--accent)}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <span class="topbar-brand">AI PM 面试训练</span>
  <nav class="topbar-nav">
    <button id="nav-study" class="active" onclick="switchPanel('study')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span class="nav-label">学习</span>
    </button>
    <button id="nav-quiz" onclick="switchPanel('quiz')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span class="nav-label">自检</span>
    </button>
    <button id="nav-progress" onclick="switchPanel('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
      <span class="nav-label">进度</span>
    </button>
  </nav>
</header>
<main class="main">

<div id="panel-study" class="panel active">
  <div class="study-tabs" id="study-tabs">
    <button class="active" onclick="switchStudyTab('product')">产品逐字稿</button>
    <button onclick="switchStudyTab('resume')">简历逐字稿</button>
    <button onclick="switchStudyTab('quick')">辅助速查</button>
  </div>
  <div id="study-sidebar-mob" class="study-sidebar"></div>
  <div id="study-content" class="study-content">
    <div class="empty">从上方选择一个章节开始学习</div>
  </div>
</div>

<div id="panel-quiz" class="panel">
  <div class="quiz-header">
    <h2>板块自检测试</h2>
    <p>每学完一个板块就做对应的题目，系统自动评分</p>
  </div>
  <div class="section-pills" id="section-pills"></div>
  <div id="quiz-body"><div class="empty">选择上方板块开始测试</div></div>
  <div id="quiz-result" class="result-card" style="display:none"></div>
</div>

<div id="panel-progress" class="panel">
  <div class="progress-grid" id="progress-stats"></div>
  <div class="chart-container">
    <h3>各板块得分</h3>
    <div class="chart-bars" id="progress-chart"></div>
  </div>
  <div class="chart-container">
    <h3>薄弱点</h3>
    <div id="weak-table-container"><div class="empty">暂无数据</div></div>
  </div>
  <div class="chart-container">
    <h3>历史记录</h3>
    <div id="history-list"><div class="empty">暂无记录</div></div>
  </div>
</div>
</main>
</div>

<script>
var _C = {"p1":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>产品背景是面试<strong>必问第一题</strong>，基本每场面试都会让你介绍这个产品。以下6步递进结构必须熟练。<br>\n<span class=\"freq-badge freq-3\">高频</span> 6步递进思路 · 产品定位一句话 · 为什么是AI不是普通系统<br>\n<span class=\"freq-badge freq-2\">中频</span> 为什么不用现成工具 · 需求是否真实</div>\n\n<h2>一、产品背景：为什么做这个产品 <span class=\"freq-badge freq-3\">面试必问</span></h2>\n\n<h3>1. 回答思路（6步递进结构）</h3>\n<div class=\"kp-box kp-framework\">\n<strong>记忆口诀：</strong>业务场景真实存在 → 商户入驻后仍不会经营 → 中小商户缺团队，连锁商户难批量 → 人工服务成本高且无法复制 → AI适合处理理解、分析和生成 → 产品定位为经营策略与内容生产一体化助手\n</div>\n<ol>\n<li>交代业务场景：字节本地生活，餐饮商户拓展/入驻/装修/套餐/活动/复盘</li>\n<li><strong>「入驻 ≠ 会经营」</strong>：入驻后还要商圈研究、货盘规划、套餐设计、定价、文案、视觉、推广</li>\n<li>按用户类型拆解：中小商户缺团队 / 连锁商户批量+本地化矛盾 / 内部运营交付效率</li>\n<li>原方式不可规模化：依赖人工查询、个人经验、临时沟通、逐版修改</li>\n<li>为什么适合AI：非结构化信息→大模型和多模态；结构化数据→规则控制；最终方案→人工确认</li>\n<li>产品定位：<span class=\"kp-jp\">B端AI营销经营辅助产品，不是单一图片生成器</span></li>\n</ol>\n\n<h3>2. 面试官考察方向（5个判断点）</h3>\n<ol>\n<li><strong>需求是不是真实需求</strong>：不是看到大模型流行后强行找场景，而是在真实工作中反复发现同类问题</li>\n<li><strong>是否理解目标用户</strong>：MVP阶段主要用户是内部商务和运营，商户是资料提供者和方案确认者</li>\n<li><strong>为什么需要AI而不是普通系统</strong>：普通系统不能理解模糊表达、总结评价、理解参考图、生成多版本内容</li>\n<li><strong>产品价值是否清晰</strong>：对商户降低门槛 / 对运营降低重复成本 / 对平台提高效率和经营质量</li>\n<li><strong>是否具备商业化价值</strong>：AI服务可作为商户入驻增值服务，也可作为商务拓展的「钩子」</li>\n</ol>\n\n<h3>3. 注意事项 <span class=\"section-tag tag-zhuyi\">5条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li><strong>不要一上来就讲技术</strong>：错误「大模型发展快所以想做AI」。正确「先发现需求沟通、套餐设计和内容生产三个高频问题，再判断哪些环节适合用AI」</li>\n<li><strong>不要把项目只讲成图片生成</strong>：完整价值是「需求理解→市场策略→套餐设计→文案及视觉生产→质量审核→数据复盘」</li>\n<li><strong>不要说商户完全不会运营</strong>：更准确的表达「不同商户线上运营能力差异较大，中小商户普遍缺少专业团队」</li>\n<li><strong>不要声称AI可以自动完成最终经营决策</strong>：套餐定价、商户成本、活动资源和最终上线内容都需要人工确认</li>\n<li><strong>需要明确实际项目边界</strong>：项目已完成需求验证、方案设计、商户试点和团队内部复用；完整系统化能力属于后续迭代方向</li>\n</ol>\n</div>\n\n<h3>4. 产品背景逐字稿 <span class=\"section-tag tag-zhuzigao\">面试时的原话</span></h3>\n<p>我在字节跳动本地生活业务担任商务经理，日常主要负责餐饮商户的拓展、平台入驻、门店装修、套餐规划、营销活动和后续经营复盘。</p>\n\n<p>在这个过程中，我发现一个比较典型的问题，就是商户完成入驻以后，并不代表已经具备线上经营能力。平台给了商户一个经营入口，但商户还需要解决卖什么套餐、怎么定价、怎么装修门店、怎么做营销内容以及怎么根据数据继续优化这些问题。</p>\n\n<p>对中小餐饮商户来说，他们通常没有完整的线上运营团队，老板可能很懂菜品和线下经营，但不一定熟悉平台用户、团购套餐和线上内容。他们提出的需求也比较模糊，比如会说「帮我把菜做得好看一点」「套餐设计得更有吸引力」或者「参考附近卖得好的商家」，但是很难进一步说明目标用户、价格策略、视觉风格和内容使用场景。</p>\n\n<p>对连锁商户来说，问题不完全一样。总部希望所有门店保持统一的品牌形象，但不同城市、不同商圈和不同门店又需要结合本地用户做差异化套餐和内容。如果完全依赖人工逐店处理，周期和成本都会比较高。</p>\n\n<p>对内部商务和运营人员来说，也存在明显的效率问题。商圈竞品、套餐价格、用户评价需要人工在不同渠道中搜索和整理，门店头图、菜品图和文案又要重复制作，很多经验沉淀在个人手里，很难快速复制给其他同事。</p>\n\n<p>我当时判断，这个场景比较适合AI，不是单纯因为AI能够生成图片，而是因为整个流程中存在大量非结构化但又可以标准化的任务。比如商户的模糊需求可以被拆成结构化参数，用户评价可以被AI归类总结，参考图片可以被多模态模型理解，文案和视觉素材可以批量生成。但是像菜品价格、成本、套餐内容和平台合规这些，仍然需要用结构化数据和规则来控制。最终方案由人工确认。</p>\n\n<p>所以我当时是把产品定位成一款面向内部商务、运营以及餐饮商户的<span class=\"kp-highlight\">B端AI营销经营辅助产品</span>，而不是单一图片生成工具。</p>","p2":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>「你一个商务经理凭什么做AI产品」是面试官<strong>必问的质疑</strong>，必须主动区分正式岗位和项目角色。<br>\n<span class=\"freq-badge freq-3\">高频</span> 岗位vs角色区分 · 最关键的产品决策 · 怎么证明不是只会写Prompt<br>\n<span class=\"freq-badge freq-2\">中频</span> 具体交付了哪些文档 · 技术团队vs你的分工 · 如何推动没有汇报关系的团队</div>\n\n<h2>二、你的角色与职责 <span class=\"freq-badge freq-3\">面试必问</span></h2>\n\n<h3>1. 回答思路（四层结构）<span class=\"section-tag tag-silu\">思路</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>核心原则：</strong>不回避正式岗位，清晰区分：<br>\n正式岗位：<strong>本地生活商务经理</strong> → 项目角色：<strong>业务需求发起人 + AI产品方案负责人 + 试点推动者</strong>\n</div>\n<ol>\n<li><strong>业务端工作</strong>：商户拓展、洽谈、入驻、套餐规划、活动推进和数据复盘</li>\n<li><strong>产品端工作</strong>：识别共性问题、需求调研、拆解业务流程、设计产品架构和MVP</li>\n<li><strong>AI专项工作</strong>：Prompt结构、参考图规范、风格基准、质量评测和失败案例分析</li>\n<li><strong>项目推进工作</strong>：商户试点、跨部门协作、内部培训和数据复盘</li>\n</ol>\n\n<h3>2. 面试官考察方向 <span class=\"section-tag tag-kaocha\">考察</span></h3>\n<ol>\n<li><strong>项目真实性</strong>：项目是不是你主导的？是不是只负责商户沟通？Prompt和测试是谁完成的？</li>\n<li><strong>个人贡献</strong>：业务流程梳理、产品功能架构、MVP规划、Prompt模板、质量验收标准、商户试点、内部培训</li>\n<li><strong>产品判断</strong>：为什么先服务内部运营而不是直接服务商户？为什么需要人工审核？为什么选模板而不是训练模型？</li>\n<li><strong>推动力</strong>：如何通过业务数据、案例和明确验收标准推动不同团队合作</li>\n<li><strong>诚实边界</strong>：主动说清楚底层模型由现有工具和AI技术团队提供，自己负责产品方案和业务落地</li>\n</ol>\n\n<h3>3. 注意事项 <span class=\"section-tag tag-zhuyi\">5条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li><strong>不要说「负责整个产品所有工作」</strong>：应该说「我主导了产品方案和试点落地」，不能说自己独立完成了模型开发</li>\n<li><strong>少用「参与」，多用明确动作</strong>：弱「我参与了需求分析」→强「我梳理了商户入驻到经营复盘的全流程，完成产品功能架构、MVP范围和质量指标设计」</li>\n<li><strong>区分商务运营与产品工作</strong>：商务运营=拿到商户、理解目标、推动落地；产品工作=抽象共性问题为流程、功能、规则和指标</li>\n<li><strong>重点讲关键决策</strong>：①MVP先服务内部运营 ②AI、规则和人工协同而非全自动 ③先通过模板和Prompt验证再考虑模型定制</li>\n<li><strong>不要把约50人说成稳定活跃用户</strong>：更稳妥「方案开始在约50人的市场团队中进行内部普及、培训和推广」</li>\n</ol>\n</div>\n\n<h3>4. 角色与职责逐字稿 <span class=\"section-tag tag-zhuzigao\">面试原话</span></h3>\n<p>我的正式岗位是商务经理，日常包括商户拓展、合作洽谈、平台入驻、套餐规划、活动推进和经营数据复盘。</p>\n<p>但是在这个项目中，我承担的不只是商务执行，而是<strong>业务需求发起人、AI产品方案负责人和试点推动者</strong>三个角色。</p>\n<p><strong>第一，我是需求的发现者。</strong>我通过持续拜访和运营商户，梳理了商户从入驻、门店装修、套餐上架到推广和复盘的完整流程，识别出需求沟通、竞品调研、套餐设计、内容生产和质量验收几个高频低效环节。</p>\n<p><strong>第二，我负责把业务问题转化为产品方案。</strong>我拆解了商户项目管理、AI需求诊断、竞品分析、套餐策略、文案与视觉生成、内容审核和数据复盘等核心模块，设计了用户流程和MVP范围。我的一个关键判断是，MVP阶段不直接让商户完全自助，而是优先服务内部商务和运营人员。</p>\n<p><strong>第三，我重点负责AI内容生产方案和质量体系。</strong>我设计了结构化需求采集方式，把商户的模糊诉求拆成品牌、目标用户、使用场景、视觉风格和真实性约束；同时整理了分层提示词、参考图使用规范、风格基准和质量验收标准。</p>\n<p><strong>第四，我负责试点和产品运营。</strong>我选取真实餐饮商户进行测试，并将验证有效的方法沉淀成SOP和模板。</p>\n\n<h3>5. 角色与职责高频QA</h3>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你是商务经理，为什么要转AI产品？</div>\n<div class=\"a-label\">我的商务经历让我长期处在用户和业务一线，能够看到商户真正愿意为什么付费、哪些工作只是表面需求、哪些问题可以规模化。在这个项目中，我进一步承担了需求抽象、产品流程、AI方案、评测指标和试点运营等工作。我发现自己的优势不只是完成一单商务合作，而是能够将多个客户的共性问题沉淀成一套可复制的产品方案。所以转AI产品不是完全跨行业，而是从单客户交付走向产品化和规模化解决问题。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：这个产品是你提出的吗？</div>\n<div class=\"a-label\">项目机会最初是我在商户运营过程中提出的。我前期先完整熟悉了商户入驻、门店装修、货盘设计、达人推广和数据复盘流程，在能够区分个性问题和共性问题后，才开始验证AIGC方案。后续我整理了产品逻辑、测试方案和商户案例，再向Leader和相关团队同步并推动内部使用。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你具体交付了哪些产品文档？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">业务流程梳理、用户角色和痛点分析、产品功能架构、核心使用流程、MVP范围、功能需求说明、Prompt模板、视觉生成规则、内容质量标准和效果指标。</span>如果进一步系统开发，这些内容可以继续拆成详细PRD、原型和技术接口需求。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：技术团队做了什么，你做了什么？如何划分边界？</div>\n<div class=\"a-label\">AI技术支持团队主要帮助验证现有模型和工具的能力边界，例如图片生成质量、参考图理解效果和市场信息分析能力。<span class=\"kp-highlight\">我负责定义业务问题、输入信息、产品流程、模型需要输出什么、什么结果算合格</span>，并通过真实商户案例进行测试和验收。技术团队解决「模型能不能实现」，我解决「业务为什么需要、产品应该怎么用、结果怎么判断」。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你最关键的产品决策是什么？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">最关键的决策是先做内部运营人员使用的MVP，而不是直接做商户自助平台。</span>早期AI结果仍然存在菜品失真、风格不稳定和事实错误风险。通过运营人员先使用，可以快速验证效果，也能够保留人工审核，降低业务风险。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你怎么证明自己不是只会写Prompt？</div>\n<div class=\"a-label\">Prompt只是方案的一部分。我还做了<span class=\"kp-highlight\">用户分析、业务流程、功能设计、数据规则、质量评测、人工审核和产品运营</span>。比如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商户确认和版本管理也属于产品流程问题。我的重点是让AI完成真实业务任务，而不是只优化一次模型回答。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你如何推动没有汇报关系的团队？</div>\n<div class=\"a-label\">我会把问题转换成对方可以执行的信息。对AI技术支持团队，我提供具体失败案例、输入参数、期望结果和验收标准；对产品团队，我整理多个商户反复出现的共性需求；对商业化团队，我会明确商户活动目标、资源需求、上线时间和预期指标。这样沟通的不是「我觉得效果不好」，而是一个有场景、数据和优先级的需求。</div></div>\n","p3":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>核心功能部分面试官通常不会让你逐一介绍所有功能，而是会<strong>追问你最难的挑战和关键决策</strong>。<br>\n<span class=\"freq-badge freq-3\">高频</span> 菜品真实性挑战 · 三层Prompt设计 · 3版样片机制 · 为什么不让大模型定价<br>\n<span class=\"freq-badge freq-2\">中频</span> 竞品数据来源 · 审核模块设计 · 套餐三档设计<br>\n<span class=\"freq-badge freq-1\">一般</span> 各功能具体交互细节</div>\n\n<h2>三、产品核心功能与实现 <span class=\"freq-badge freq-3\">关键决策集中区</span></h2>\n\n<h3>3.1 需求诊断 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>设计方式：</strong>结构化表单 + 上传菜单/菜品图/品牌Logo/参考图 → 多模态识别 → 大模型拆解需求 → <span class=\"kp-highlight\">人工确认事实字段</span> → 形成统一需求基线</p>\n<p><strong>为什么不直接让商户写Prompt：</strong>商户不熟悉平台用户、套餐设计、视觉规则和内容规范，只能表达表层需求。产品要帮商户把模糊需求翻译成可执行参数。</p>\n\n<h3>3.2 竞品分析 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>四维分析：</strong>价格带 / 套餐结构 / 用户评价 / 内容表达 → 输出<strong>可执行的市场建议</strong>，不是只给竞品名单</p>\n<p><strong>数据来源：</strong>MVP阶段通过运营人员公开平台收集、商户提供资料、表格或截图导入、内部授权数据。<span class=\"kp-warning\">没有使用未经授权的自动爬取。</span></p>\n\n<h3>3.3 套餐设计 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>三档套餐：</strong><span class=\"kp-highlight\">引流款</span>（新客转化）→ <span class=\"kp-highlight\">主推款</span>（主流场景）→ <span class=\"kp-highlight\">利润款</span>（高客单）</p>\n<div class=\"kp-box kp-warning\"><strong>定价原则（必背）：</strong>价格不交给大模型！菜品原价、成本、折扣通过结构化规则测算。大模型负责套餐定位和卖点表达。无成本数据时只给市场参考区间，不做利润承诺。</div>\n\n<h3>3.4 文案与视觉——最关键的挑战 <span class=\"freq-badge freq-3\">面试必问</span></h3>\n<p><strong>最大挑战：菜品真实性。</strong>初期图片好看但<span class=\"kp-highlight\">食材变化、分量失真、摆盘错误、风格漂移</span>。</p>\n\n<div class=\"kp-box kp-framework\">\n<strong>解决方案：三层Prompt（核心框架，必须背熟）</strong>\n<ol>\n<li><strong>第一层（业务场景层）：</strong>菜品类型、目标用户、使用场景</li>\n<li><strong>第二层（视觉风格层）：</strong>色调、构图、光线、餐具</li>\n<li><strong>第三层（真实性约束层）：</strong>核心食材、分量、烹饪状态、禁止元素</li>\n</ol>\n<strong>设计原理：</strong>改风格不会改食材，改食材不会改风格——三层各司其职。\n</div>\n\n<div class=\"kp-box kp-data\">\n<strong>3版风格样片确认机制：</strong>批量生成前先输出3版样片，商户确认一版作为风格基准，后续素材统一继承。<br>\n<strong>为什么是3版？</strong>1版太少选择不够，5版太多选择困难，3版恰好展示风格差异。<br>\n<strong>核心效果：</strong>修改轮次从5轮降到2-3轮，沟通成本大幅降低。\n</div>\n\n<h3>3.5 审核模块</h3>\n<p>三级审核：<span style=\"color:var(--green)\">通过</span> → <span style=\"color:var(--amber)\">建议修改</span> → <span style=\"color:var(--red)\">禁止上线</span></p>\n<p>图片审核重点：菜品是否与真实素材一致、是否新增不存在的食材、分量是否明显夸大</p>\n<p>文案审核重点：商户名称、价格、活动时间是否准确，识别虚假销量、绝对化宣传、敏感词</p>\n<p><span class=\"kp-highlight\">核心原则：审核通过只代表达到进入商户确认的条件，不代表可以自动上线。</span></p>\n\n<h3>3.6 数据复盘</h3>\n<p>复盘数据包括：曝光、点击、下单、核销、退款、达人数量、直播场次、投流金额。<span class=\"kp-warning\">只有将内容版本和其他营销变量同时记录，系统才能避免将所有转化变化都错误归因于AI内容。</span></p>","p4":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>数据是面试的<strong>硬通货</strong>——每个数字面试官都可能追问口径和归因。<br>\n<span class=\"freq-badge freq-3\">高频</span> 四层数据（效率/质量/经营/组织）· 19%归因问题 · 数据口径<br>\n<span class=\"freq-badge freq-2\">中频</span> 四个不足 · 对商户和平台的价值</div>\n\n<h2>四、业务成果与影响 <span class=\"freq-badge freq-3\">数据必背</span></h2>\n\n<div class=\"kp-box kp-data\">\n<table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:6px 8px;text-align:left\">维度</th><th style=\"padding:6px 8px;text-align:left\">数据</th><th style=\"padding:6px 8px;text-align:left\">记忆口诀</th></tr>\n<tr><td style=\"padding:6px 8px\">生产效率</td><td style=\"padding:6px 8px\"><strong>30min→10min，5轮→2-3轮</strong></td><td style=\"padding:6px 8px\">三十分变十分，五轮变两三轮</td></tr>\n<tr><td style=\"padding:6px 8px\">内容质量</td><td style=\"padding:6px 8px\"><strong>菜品还原率40%→85%</strong></td><td style=\"padding:6px 8px\">四成变八五</td></tr>\n<tr><td style=\"padding:6px 8px\">经营效率</td><td style=\"padding:6px 8px\"><strong>调研5天→36小时，转化+19%</strong></td><td style=\"padding:6px 8px\">五天变一天半，转化提升近两成</td></tr>\n<tr><td style=\"padding:6px 8px\">组织复用</td><td style=\"padding:6px 8px\"><strong>沉淀SOP，约50人团队复用</strong></td><td style=\"padding:6px 8px\">从个人手艺到团队模板</td></tr>\n</table>\n</div>\n\n<h3>业务成果逐字稿（面试原话）</h3>\n<p>项目成果主要体现在效率、质量、经营效果和组织复用四个层面。第一是生产效率，单版素材平均时间从30分钟缩短到10分钟。第二是沟通和质量，修改轮次从5轮下降到2到3轮，菜品还原合格率从40%提高到85%。第三是经营策略效率，单商户市场调研周期从大约5天缩短到36小时以内，下单转化率相较商户原有自定套餐提升19%。这里我会明确说明，这是综合方案结果，不是单个AI功能的独立贡献。第四是组织复用，将流程沉淀成SOP，在市场团队内部推动普及使用。</p>\n\n<h3>数据口径相关QA</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：单版素材时间如何统计？</div>\n<div class=\"a-label\">统计口径：从需求基本确认后开始，到形成一版可以进入商户确认的候选素材为止，含提示词配置、生成和基础调整时间。不含商户长时间未回复造成的等待时间。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：19%转化提升是不是来自投流？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">有可能。</span>19%是套餐和视觉同步优化后的综合结果，不能做单因素归因。这也是我在反思中认为应该补充版本管理和A/B测试的原因。</div></div>\n\n<h3>四个不足</h3>\n<ol>\n<li>试点商户数量有限，属于方向验证不是大规模统计结论</li>\n<li>竞品数据主要依靠人工整理，自动数据接入没有完成</li>\n<li>质检以人工为主，完整自动质检仍属于产品规划</li>\n<li>套餐、视觉、达人和投流可能同时变化，19%为综合结果</li>\n</ol>","p5":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>反思题考察你的<strong>复盘能力和诚实度</strong>，面试官会看你是否敢承认不足。<br>\n<span class=\"freq-badge freq-3\">高频</span> 最大的踩坑 · 如果重做会怎么改 · 为什么不直接Agent/RAG<br>\n<span class=\"freq-badge freq-2\">中频</span> 行业迁移 · 想做没做成的事</div>\n\n<h2>五、反思与经验 <span class=\"freq-badge freq-3\">体现成长</span></h2>\n\n<div class=\"kp-box kp-framework\">\n<strong>五个核心反思（必须能脱稿讲出来）：</strong>\n<ol>\n<li><strong>从「关注生成」转向「关注任务完成」</strong>：图片好看≠商户满意，关键是菜品真实和品牌一致</li>\n<li><strong>Prompt不是唯一答案</strong>：输入质量和流程确认（样片前置确认）比加长Prompt更有效</li>\n<li><strong>AI+规则+人工共同工作</strong>：<span class=\"kp-jp\">确定性任务交程序，模糊理解交模型，高风险决策交人</span></li>\n<li><strong>MVP可以更聚焦</strong>：如果重做，优先做好需求诊断、内容生成和质量审核三个闭环</li>\n<li><strong>数据归因需要加强</strong>：应从第一天建立版本绑定和A/B测试</li>\n</ol>\n</div>\n\n<h3>反思逐字稿（面试原话）</h3>\n<p>这个项目让我最深刻的认识是，<span class=\"kp-highlight\">AI生成成功并不代表用户任务完成。</span></p>\n<p>项目早期，我比较关注生成图片是否好看，所以最初的优化方式也是增加更多视觉描述。但实际交付后发现，商户不满意的原因不只是审美，而是菜品不真实、品牌风格不一致，以及生成前双方没有对齐验收标准。后来我们把流程从「一次生成后让商户修改」，调整成「先采集结构化需求，再输出3版风格样片确认，之后批量生成并进行质量验收」。这个变化比单纯继续加长Prompt更有效。</p>\n\n<h3>关键QA</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：项目中最大的踩坑是什么？</div>\n<div class=\"a-label\">最开始把问题定义成「怎么生成更好看的图片」。我们在Prompt中增加了很多视觉词，但商户仍然频繁修改。后来发现，真正缺少的是生成前的需求对齐和真实性约束。加入结构化需求和风格样片后，修改轮次才明显下降。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：如果重做一次，你会优先做哪三个功能？</div>\n<div class=\"a-label\">第一是结构化需求诊断，保证模型拿到正确输入。第二是品牌和真实性约束下的内容生成，直接解决最高频工作。第三是质量审核，保证内容可以安全交付。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么不直接Agent或RAG？</div>\n<div class=\"a-label\"><strong>Agent：</strong>项目早期流程比较明确，需求采集、分析、生成和审核都有固定依赖，用可控工作流更合适。MVP阶段引入自主Agent会增加不可控性。<br><strong>RAG：</strong>MVP阶段主要信息是商户资料、品牌规则、套餐和少量模板，直接通过结构化数据和模板调用就能满足。后续行业案例和品牌文档规模扩大后，可以使用RAG检索相关规则和优秀案例。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你的方法可以迁移到其他行业吗？</div>\n<div class=\"a-label\">可以。核心方法不是餐饮图片，而是<span class=\"kp-highlight\">将B端客户模糊需求转化为结构化输入，将AI嵌入业务工作流，并建立输出评测和人工审核</span>。它可以迁移到零售、电商、本地服务和企业内容生产等场景。</div></div>","p6":"","p7":"<div class=\"freq-summary\" style=\"margin-bottom:16px\">\n<strong>面试官最爱问的10个问题（按频率排序）：</strong><br>\n<span class=\"freq-badge freq-3\">1</span> 为什么做这个产品？完整讲一遍 <br>\n<span class=\"freq-badge freq-3\">2</span> 你一个商务经理怎么做AI产品？（角色vs岗位）<br>\n<span class=\"freq-badge freq-3\">3</span> 项目中最大的挑战是什么？怎么解决的？（菜品真实性）<br>\n<span class=\"freq-badge freq-3\">4</span> 你的数据成果是什么？（四层数据+口径+归因）<br>\n<span class=\"freq-badge freq-3\">5</span> 你从中学到了什么？有什么不足？（五个反思）<br>\n<span class=\"freq-badge freq-2\">6</span> 为什么不让大模型直接定价？<br>\n<span class=\"freq-badge freq-2\">7</span> 怎么证明你不是只会写Prompt？<br>\n<span class=\"freq-badge freq-2\">8</span> 竞品数据怎么获得？<br>\n<span class=\"freq-badge freq-2\">9</span> 为什么不直接Agent或RAG？<br>\n<span class=\"freq-badge freq-2\">10</span> 你的方法能迁移到其他行业吗？<br>\n</div>\n<h2>七、产品相关高频QA（完整汇总）</h2>\n<h3>产品背景相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：商户为什么不能自己写Prompt？</div><div class=\"a-label\">商户不熟悉平台用户、套餐设计、视觉规则和内容规范，通常只能表达表层需求，很难说出结构化参数。产品需要帮商户把模糊需求翻译成可执行参数。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么不用现成的设计工具？</div><div class=\"a-label\">现成设计工具不解决需求诊断、竞品分析和套餐策略问题，也不理解菜品真实性约束。商户仍需自行完成调研、策略和设计，工具之间互相割裂。</div></div>\n<h3>功能设计相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么是3版样片而不是5版或1版？</div><div class=\"a-label\">1版选择太少，5版太多容易选择困难，3版恰好展示风格差异。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：菜品还原率40%为什么这么低？</div><div class=\"a-label\">初期使用较通用的生成方式，视觉效果不错但没有足够真实菜品和食材约束。餐饮场景验收标准比普通美图严格，核心食材、分量或烹饪状态出现明显错误就不能算合格。</div></div>\n<h3>反思与迁移相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你觉得这个产品最大的风险是什么？</div><div class=\"a-label\">AI生成内容视觉上合理，但事实不真实，导致消费者误解。因此必须使用真实菜品和套餐数据，设置强事实约束，并保留运营和商户确认。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：如何看待AI替代运营人员？</div><div class=\"a-label\">我不认为这个项目要完全替代运营。AI更适合完成资料总结、初稿生成和批量处理；运营人员负责商户沟通、经营判断、资源协调和风险确认。产品目标是让运营从重复生产转向高价值决策，而不是取消人工。</div></div>","r1":"## ZYL-完整简历面试逐字稿 学习笔记\n\n> **核心目标**：把「创业→人事→社交平台→字节BD→AI产品」这条看似跳跃的路线，统一为一条能力成长主线。\n\n---\n\n## 一、面试前必须统一的职业主线\n\n### 你真实的履历线\n\n```\n创业经营与商业验证\n  → 人力流程标准化与数据管理\n  → 用户场景及B端商户解决方案\n  → 字节跳动本地生活商务运营\n  → 从真实商户问题中设计AI产品方案\n```\n\n### 面试中把它讲成一条线（原文核心逻辑）\n\n> 我一直在解决真实业务中的用户和客户问题。早期创业让我具备商业闭环和结果意识；人事主管经历让我建立了流程、规则和数据化能力；青年社交平台让我积累了用户洞察、场景产品和B端商户方案经验；在字节跳动，我进一步把这些能力应用到本地生活商户场景，并推动餐饮商户AI营销经营助手从需求识别、方案设计到试点验证。\n\n> 这条主线要证明，我不是突然为了转行而包装一个AI项目，而是在原有B端需求、流程标准化、数据运营和商业落地能力上，进一步补充AI产品能力。\n\n### 关键词对照表：BD经验 → AI PM能力\n\n| BD经验 | 对应的AI PM能力 |\n|--------|---------------|\n| 客户需求分析 | 用户/客户需求洞察与结构化 |\n| 竞品调研 | 市场分析与竞品对标 |\n| 方案定制与谈判 | 产品方案设计与跨团队协调 |\n| 数据复盘 | 数据指标体系与效果归因 |\n| 流程SOP化 | 工作流设计与异常处理 |\n| 跨部门协调 | 产品、技术、运营多方协作 |\n\n---\n\n## 二、自我介绍\n\n### 回答思路（四段式）\n\n1. **一句话我是谁**：姓名+求职方向（AI产品经理、AIGC内容解决方案相关岗位）\n2. **三类核心能力**（不按时间流水账）：\n   - B端客户和用户需求理解\n   - 业务流程产品化与数据化\n   - AI内容生产方案设计与业务验证\n3. **重点讲字节AI项目**：核心问题、个人贡献、结果数据\n4. **为什么与目标岗位匹配**：收尾呼应\n\n### 面试官考察方向\n\n- 履历是否有清晰主线\n- 为什么从商务运营转AI产品\n- 是否真正具备产品能力\n- 是否只是会使用AIGC工具\n- 能否用较短时间讲清自身优势\n- 工作经历跨度较大是否意味着职业方向不稳定\n\n### 注意事项（5条红线）\n\n1. **不要在自我介绍中逐条复述所有公司和工作内容**\n2. **不要一开始强调「我没有正式的产品经理Title」**——先讲能力和项目，被追问时再解释\n3. **不要说「我精通所有AI工具」或「熟悉所有大模型」**——更合理表述：「熟悉结构化Prompt、多模态内容生成、质量评测及AI工作流，能够根据业务任务选择合适的工具和方案」\n4. **不要在2分钟自我介绍里详细解释AI项目的每一个功能**——先讲核心问题、个人贡献和结果\n5. **不要把过往经历割裂地讲成四段毫无关联的工作**\n\n### 两分钟自我介绍逐字稿（原文完整版）\n\n面试官您好，我叫朱耀龙，目前主要应聘AI产品经理、AIGC内容解决方案以及AI内容生产运营相关岗位。\n\n我的核心优势是同时具备B端客户需求理解、业务流程产品化和AI内容方案落地三方面能力。\n\n我早期有4年创业经历，从0到1参与青年文化和线下文娱业务的产品定位、资源拓展和经营管理，这段经历让我建立了比较强的商业结果意识。之后我做过人力流程优化和用户场景运营，分别积累了流程标准化、数据看板、用户洞察和B端商户解决方案能力。\n\n在字节跳动本地生活期间，我主要负责餐饮商户的拓展、平台入驻、套餐规划、活动运营和经营复盘。在服务商户的过程中，我发现很多中小商户缺少专业的线上运营团队，竞品分析、套餐设计、文案和视觉素材生产都比较依赖人工。\n\n基于这个问题，我主导设计并推动试点了餐饮商户AI营销经营助手。产品覆盖商户需求诊断、商圈竞品分析、套餐与定价建议、营销文案和视觉生成、内容审核及经营复盘。\n\n在项目中，我主要负责业务需求分析、产品功能规划、MVP设计、结构化Prompt、生成质量评测、商户试点和内部推广。针对菜品生成中的食材失真和风格漂移问题，我测试了5类方案，形成三层提示词和3版风格样片确认机制，将菜品还原合格率从40%提升到85%，单版素材生产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2至3轮。\n\n我的特点是，不会只从模型能做什么出发，而是会先理解业务目标和用户任务，再明确AI、规则和人工各自负责什么，并通过效率、质量和业务指标验证方案价值。我希望下一阶段能够继续深耕AI产品，将一线客户需求和AI能力转化为可复制、可规模化的产品解决方案。\n\n### 自我介绍高频QA\n\n**Q：请用一句话概括你的核心竞争力**\nA：我的核心竞争力是，既能深入理解B端客户的真实业务诉求，也能将这些模糊需求转化为结构化的AI产品流程、Prompt方案和质量标准，并推动方案在真实业务中完成验证。\n\n**Q：你和传统产品经理相比有什么优势？**\nA：我的优势是长期处于客户和业务一线，比较清楚客户提出的表面需求背后，真正影响经营结果的是什么。比如商户说「想要一张好看的图片」，表面上是视觉需求，但进一步分析后，可能涉及目标用户、套餐定位、品牌调性、内容场景和转化目标。我能够先把这些需求拆清楚，再结合模型能力、业务规则和人工流程设计解决方案，避免产品只停留在功能层。\n\n**Q：你最大的短板是什么？**\nA：相比长期在研发团队中成长的产品经理，我在复杂技术系统和完整研发管理上的经验还需要继续积累。但我的优势是业务理解和落地比较强。目前我会重点补充大模型基础、工作流设计、RAG、模型评测和数据指标体系，同时在设计方案时主动与技术人员确认模型边界、输入输出和异常机制。我的目标不是代替算法或研发，而是能够准确判断技术适用性，并把业务问题转换成团队可以执行的产品方案。\n\n---\n\n## 三、为什么从商务运营 & 产品运营转向 AI 产品\n\n### 回答思路（四步递进）\n\n1. 商务运营经历帮助自己积累了真实客户需求\n2. 在工作中逐渐从单个客户交付走向共性问题抽象\n3. 餐饮商户AI项目让自己确认更适合产品化解决问题\n4. 转型是原有能力的升级，不是完全推翻过去\n\n### 面试官考察方向\n\n- 转型动机是否稳定\n- 是否只是追逐AI热点\n- 是否具备产品基本功\n- 能否接受AI产品岗位中大量需求、协作和细节工作\n- 商务经历能否转化为产品价值\n\n### 注意事项（4条红线）\n\n1. 不要说：商务运营发展上限比较低，所以想转AI\n2. 不要否定过去经历，否则面试官会担心未来也否定AI产品工作\n3. 不要只说「对AI感兴趣」，兴趣不足以支撑职业转型\n4. 不要塑造「商务工作低价值，产品工作高价值」的对立\n\n---\n\n## 四、字节经历——七点拆解\n\n### 字节经历记忆结构\n\n```\n1. 业务场景与典型问题 → 2. 从观察到行动 → 3. Prompt设计与优化\n→ 4. 内容评测 → 5. 流程设计 → 6. 套餐与经营策略 → 7. 产品运营与内部推广\n```\n\n### 第一点：业务场景与典型问题\n\n**核心**：不是「我看到图片不好看」，而是「我长期服务商户，持续看到同一类问题在不同商户身上反复出现」。\n\n### 第二点：从观察到行动\n\n**核心**：如何从「个人判断」走向「产品化方案」。先识别共性高频问题，再梳理整条链路，判断哪些节点可以用AI、规则和模板代替人工。\n\n### 第三点：Prompt设计与优化（最体现产品能力）\n\n**核心**：不是「我会写Prompt」，而是「我如何通过系统化测试找到可复用的Prompt方案」。\n\n**逐字稿内容**：\n\n针对菜品生成中的食材失真和风格漂移问题，我将问题分成真实性、视觉风格和品牌一致性几类，先后测试了5类方案。\n\n最终形成三层Prompt结构：第一层定义业务场景（菜品类型、目标用户、使用场景），第二层定义视觉风格（色调、构图、光线、餐具），第三层定义真实性约束（核心食材、分量、烹饪状态、禁止元素）。\n\n同时建立3版风格样片前置确认机制，在批量生成前先让商户确认风格基准。\n\n**高频QA**：\n\nQ：5类方案具体是什么？\nA：原文中没有逐项列出5类方案，但可以从上下文推断包括：通用描述、加长视觉描述、增加食材约束、分层结构化、样片确认等不同组合。\n\nQ：怎么判断Prompt好不好？\nA：不只看一次生成效果，而是用固定测试案例和验收标准反复验证——菜品主体是否正确、核心食材是否变化、分量是否失真、不同批次风格是否一致。\n\n### 第四点：内容评测\n\n**核心**：评测不只是看「好不好看」，而是定义「什么算合格」。\n\n**逐字稿内容**：\n\n我将评测分成效率、质量和业务三个层面。效率包括生成时间和修改轮次；质量包括事实准确、菜品还原、风格一致和内容通过率；业务包括内容采用率、点击、下单和核销。\n\n对AI产品来说，模型生成结果并不是最终指标。只有输出被用户采用、通过审核并帮助完成业务任务，才说明产品有价值。\n\n### 第五点：流程设计\n\n**核心**：将依赖个人的工作变成可复用的流程。\n\n**逐字稿内容**：\n\n我将流程从「一次生成后让商户修改」，调整成「先采集结构化需求→输出3版风格样片确认→批量生成→质量验收」。明确每个环节的输入、输出、负责人和异常处理，使方案不再依赖个人经验。\n\n### 第六点：套餐与经营策略\n\n**核心**：图片好看不等于用户下单，经营策略和内容生产必须连接。\n\n**逐字稿内容**：\n\n系统基于商户真实菜品池、成本和竞品数据，生成引流款、主推款和利润款三档套餐方案。引流款承担新客转化和销量增长，主推款覆盖主流消费场景，利润款提升客单价和收益。\n\n价格不交给大模型。菜品原价、成本、折扣和目标毛利通过结构化数据和规则测算，大模型主要负责说明市场差异、套餐定位和卖点。\n\n**高频QA**：\n\nQ：竞品数据如何获得？\nA：MVP阶段主要通过运营人员在公开平台收集、商户提供资料、表格或截图导入，以及内部授权信息。没有默认使用未经授权的自动爬取。\n\nQ：为什么内容产品要做套餐策略？\nA：用户是否下单不只取决于图片好不好看，也取决于套餐组合、价格和消费场景。如果只生成图片，可能得到高点击但低转化。\n\n### 第七点：产品运营与内部推广\n\n**核心**：如何把个人方法变成团队标准。\n\n**逐字稿内容**：\n\n方案验证后，我将需求采集、风格标签、参考图、分层提示词、套餐分析和质量验收整理成标准化SOP。\n\n内部推广时，没有只做工具操作培训，而是使用真实商户案例说明使用前后的时间、修改轮次和内容效果变化。因为很多运营人员已经有自己的工作方式，如果一开始要求完全按照标准流程执行容易抵触，所以我保留了人工调整和个性化处理空间。\n\n后续方案在约50人的市场团队范围内进行普及和使用。\n\n**高频QA**：\n\nQ：内部推广最大的阻力是什么？\nA：不是不会用，而是不愿改变原有工作方式。运营人员担心标准化工具无法处理个性商户，所以我先用真实案例证明工具可以减少重复劳动，同时保留人工修改空间。\n\n---\n\n## 五、业务结果与反思（与产品逐字稿联动记忆）\n\n| 维度 | 数据 | 关联产品逐字稿 |\n|------|------|-------------|\n| 效率 | 30min->10min，5轮->2-3轮 | 产品逐字稿第三节 |\n| 质量 | 菜品还原率40%->85% | 产品逐字稿第四节 |\n| 经营 | 调研5天->36小时，转化+19% | 产品逐字稿第四节 |\n| 组织 | 沉淀SOP，约50人团队复用 | 产品逐字稿第五节 |\n\n**四个不足（原文）**：\n1. 试点商户数量有限，属于方向验证不是大规模统计结论\n2. 竞品数据主要依靠人工整理，自动数据接入没有完成\n3. 质检以人工为主，完整自动质检仍属于产品规划\n4. 套餐、视觉、达人和投流可能同时变化，","r2":"19%为综合结果\n\n**如果重做**：收敛MVP、建立固定测试集、版本绑定、A/B测试\n\n---\n\n## 六、本地青年社交平台经历（三项核心数据）\n\n- 设计10余条主题社交线路\n- 周均参与用户超过1000人\n- 累计签约50余家优质商户，带动相关业务流水突破150万元\n\n**面试要点**：不要强行包装成AI项目。它的价值在于证明**用户洞察、场景产品、B端商户方案和商业化能力**。\n\n### 第一点：用户洞察与场景设计\n\n**逐字稿内容**：\n\n在本地青年社交平台，我主要负责用户需求分析、主题社交线路设计和线下活动运营。用户表面上会表达「想认识朋友」或「想参加有意思的活动」，但不同用户在兴趣、年龄、活动强度、社交目的和消费能力上差异较大。\n\n我通过用户报名信息、活动参与情况、现场反馈和后续评价，提炼不同人群的核心需求，并将需求拆成活动主题、参与人数、场地、匹配方式和互动环节。基于这些分析设计10余条主题社交线路，沉淀成可复用的场景化SOP。周均参与用户超过1000人。\n\n这段经历让我形成了将模糊用户需求转化成结构化场景方案的能力，这也是后来设计AI需求诊断的重要基础。\n\n### 第二点：商户合作与商业增长\n\n**逐字稿内容**：\n\n平台开展线下社交活动需要餐饮、休闲娱乐和场地类商户合作。我会先判断商户希望获得的是客流、曝光、活动内容还是长期年轻用户，然后根据商户类型设计不同合作方式。不只是销售固定资源，而是将用户活动、商户权益和平台收入组合成完整方案。最终累计签约50余家优质商户，带动平台相关业务流水突破150万元。\n\n### 第三点：流程产品化\n\n**逐字稿内容**：\n\n随着活动和商户数量增加，如果每一场活动都依靠个人经验，执行质量很难稳定。我将流程拆成活动策划、用户报名、人员筛选、商户协调、现场执行和反馈复盘几个阶段，并明确每个阶段的输入、责任人、交付物和异常处理。成功线路沉淀成模板，后续可以根据用户人群、场地和主题进行调整。\n\n这类经验后来可以直接迁移到AI产品中——AI工作流同样需要明确输入、节点、规则、异常和最终验收。\n\n---\n\n## 七、拓浦集团经历（两项核心数据）\n\n- 人力流程整体执行效率提升40%\n- 人力管理风险事件发生率降低30%\n\n**面试要点**：不要讲成普通行政工作。它的价值在于证明**流程标准化、数据化和规则意识**。\n\n### 第一点：流程诊断与标准化\n\n**逐字稿内容**：\n\n在拓浦集团，我发现招聘、入职、考勤、绩效和人员变动等流程比较碎片化，不同部门的执行标准也不完全一致。我先访谈流程负责人和实际执行人员，梳理每个流程中的角色、输入资料、审批节点、状态和异常情况。之后将流程拆成标准步骤，明确每个环节由谁负责、需要提交什么、什么条件下可以进入下一步，以及异常时如何处理。通过统一表单、操作规范和任务节点，减少重复确认和遗漏，使整体流程执行效率提升40%。\n\n这段经历让我建立了比较强的流程和规则意识，也让我理解产品设计不能只设计正常路径，还必须考虑异常路径。\n\n### 第二点：数据看板与风险预警\n\n**逐字稿内容**：\n\n除了流程标准化，我还将人员状态、招聘进度、考勤异常和风险事件等数据进行集中整理，搭建人力运营看板。看板的价值不只是展示数据，而是帮助管理人员快速识别哪些任务超期、哪些资料缺失以及哪些人员状态存在异常。还为不同异常设置风险标记、责任人和处理状态，使问题从发现到跟进形成闭环。通过数据监控和预警，人力管理风险事件发生率降低30%。\n\n### 第三点：对AI产品能力的迁移\n\n**逐字稿内容**：\n\n这段经历虽然不是AI项目，但让我掌握了将线下业务拆成数据输入、规则判断、任务流转、异常预警和结果反馈的能力。后来设计AI产品时，我也会按照相同逻辑思考：哪些信息由用户输入，哪些内容由模型生成，哪些规则必须强校验，什么情况需要人工确认，以及失败后如何处理。因此，它为我后续做AI工作流和人机协同产品奠定了比较扎实的流程基础。\n\n---\n\n## 八、菜鸟文化传媒创业经历\n\n**核心数据**：单店月利润从1.5万->5万\n\n### 第一点：产品定位与MVP验证\n\n**逐字稿内容**：\n\n创业阶段聚焦大学生和青年文化市场，主要解决年轻用户线下娱乐和社交场景较单一的问题。前期通过用户沟通、活动反馈和实际消费观察，判断年轻用户不仅需要活动内容，也需要更加自然的社交和文化体验。通过小规模活动验证用户参与和付费意愿，再根据反馈调整产品。这段经历让我较早建立了MVP意识——不是一开始投入大量资源做完整方案，而是先通过低成本方式验证需求和商业模式。\n\n### 第二点：经营策略与利润增长\n\n逐字稿模板：项目早期单店月利润约为1.5万元，随后从产品组合、活动排期、用户运营和定价等方面进行优化，根据不同产品的获客和利润作用进行分层。经过持续调整，单店月利润由1.5万元提升到5万元。这段经历让我形成了比较强的商业结果意识。\n\n### 第三点：资源整合与团队协作\n\n逐字稿内容：线下文娱项目需要校园社团、音乐节、消费品牌、活动场地和内容团队等多方资源。根据不同合作方的目标设计合作方式，将不同诉求组合成可执行方案。这段经历提升了商务谈判和跨组织协作能力。\n\n---\n\n## 九、AI及AIGC技能面试逐字稿\n\n### Prompt能力\n\n逐字稿：我理解的Prompt工程，不是单纯写一段很长的指令，而是将业务目标转换成稳定、可复用的输入结构。一般会包括角色和任务、业务上下文、输入数据、输出格式、强约束、负向约束和Few-shot示例。对餐饮图片使用业务场景、视觉风格和真实性约束三层结构；对文案则把商户名称、价格和菜品设置为固定事实字段，将语气和卖点作为可生成字段。Prompt是否有效，需要通过固定案例和验收指标测试，而不是只凭一次结果判断。\n\nQA：什么是Few-shot？Few-shot是在Prompt中提供少量高质量输入和输出示例，帮助模型理解任务格式和判断标准。适合格式稳定、表达规则明确的任务，但示例需要有代表性。\n\n### 模型和工具选择\n\n逐字稿：选择模型或工具时，我会先看任务。文案和需求分析重点关注中文理解、逻辑和结构化输出；视觉生成重点关注参考图理解、风格稳定和局部编辑；工作流则关注节点编排、变量管理和失败重试。同时考虑速度、成本、稳定性、数据安全和团队使用门槛。不会因为某个模型整体能力强，就默认所有任务都使用同一个模型。\n\n### Dify及工作流\n\n逐字稿：我了解Dify的基础工作流逻辑，包括输入变量、Prompt节点、模型调用、条件分支、知识检索和工具节点。当前我的能力重点在工作流和产品方案层，复杂部署和底层开发仍需要研发支持。\n\n### AI评测\n\n逐字稿：将评测分成效率、质量和业务三个层面。效率包括生成时间和修改轮次；质量包括事实准确、菜品还原、风格一致和内容通过率；业务包括内容采用率、点击、下单和核销。模型生成结果并不是最终指标，只有输出被用户采用、通过审核并帮助完成业务任务，才说明产品有价值。\n\n---\n\n## 十、全量高频追问速查\n\n1. 「请用一句话概括你的核心竞争力」\n2. 「你和传统产品经理相比有什么优势？」\n3. 「你最大的短板是什么？」\n4. 「为什么从商务运营转AI产品？」\n5. 「创业中你具体负责什么？」\n6. 「如何判断市场需求？」\n7. 「你如何设计一条新的社交线路？」\n8. 「如何说服商户合作？」\n9. 「用户体验和商业化冲突怎么办？」\n10. 「内部推广最大的阻力是什么？」\n11. 「如何衡量内部推广是否成功？」\n12. 「什么是Few-shot？」\n13. 「Prompt怎么评测？」\n14. 「你了解的Dify工作流是怎样的？」\n15. 「AI产品怎么评测？」\n16. 「你对Agent和RAG的理解？」\n","r3":"","r4":"","r5":"","q1":"<h2>Agent 10个必知概念</h2><ol><li><b>大模型 vs Agent</b>：前者只能说，后者能做</li><li><b>AI产品四层次</b>：内容生成→知识问答→辅助执行→自主执行</li><li><b>Agent 5要素</b>：目标、环境、行动、观察、持续执行</li><li><b>工具调用9步</b>：定义→输入→意图→选择→参数→校验→执行→返回→回答</li><li><b>API/FC/MCP/RPA</b>：API最稳定，FC负责结构化调用，MCP是连接协议</li><li><b>金句</b>：确定性任务交程序，模糊理解交模型，高风险决策交人</li><li><b>Human-in-the-loop</b>：按风险分级确认</li></ol>","q2":"<h2>RAG 10个必知概念</h2><ol><li><b>RAG三环节</b>：检索→增强→生成</li><li><b>Prompt vs RAG</b>：Prompt定怎么答，RAG提供答什么</li><li><b>微调vs RAG</b>：常变的知识用RAG，稳定模式才微调</li><li><b>关键词vs向量</b>：精确用关键词，语义用向量，企业用混合检索</li><li><b>权限原则</b>：检索前过滤，不能检索后靠模型自觉</li><li><b>故障定位顺序</b>：资料→解析切片→检索重排→生成</li></ol>","q3":"<h2>需求文档重点</h2><ol><li><b>产品定位</b>：需求理解→经营策略→内容生产→质量审核→数据优化闭环</li><li><b>V1范围</b>：做了需求诊断/竞品/套餐/文案视觉/审核/确认/导出/复盘；没做自动爬取/自动发布/动态调价</li><li><b>AI原则</b>：事实必须来源用户输入；结论需展示依据；高风险决策须人工确认</li></ol>"};

// ============ SCORING ENGINE ============
function scoreAnswer(userAnswer, keyPoints) {
  if (!keyPoints || keyPoints.length === 0) return {score:5, matched:[], missed:[], total:0, hit:0};
  var answer = userAnswer.toLowerCase();
  var matched = [], missed = [];
  for (var i = 0; i < keyPoints.length; i++) {
    if (answer.indexOf(keyPoints[i].toLowerCase()) !== -1) matched.push(keyPoints[i]);
    else missed.push(keyPoints[i]);
  }
  var ratio = matched.length / keyPoints.length;
  var score = ratio >= 0.85 ? 5 : ratio >= 0.65 ? 4 : ratio >= 0.45 ? 3 : ratio >= 0.25 ? 2 : ratio > 0 ? 1 : 0;
  return { score: score, matched: matched, missed: missed, total: keyPoints.length, hit: matched.length };
}

// ============ LOCAL STORAGE ============
var LSKEY = 'ai_pm_mobile';
function gp() { try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch(e) { return {}; } }
function sp(p) { localStorage.setItem(LSKEY, JSON.stringify(p)); }
function gdr(sec) { var p = gp(); return p[sec] || null; }
function sdr(sec, r) { var p = gp(); p[sec] = {results: r.results, avg: r.avg, rate: r.rate, total: r.total, count: r.count, ts: Date.now()}; sp(p); }

// ============ PANEL SWITCHING ============
var cp = 'study', cst = 'product', csection = 'p1';
function switchPanel(name) {
  cp = name;
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('panel-'+name).classList.add('active');
  document.querySelectorAll('.topbar-nav button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('nav-'+name).classList.add('active');
  if (name === 'study') { renderStudySidebar(); }
  if (name === 'quiz') { renderSectionPills(); loadSectionQuiz(csection); }
  if (name === 'progress') { renderProgress(); }
}

function switchStudyTab(tab) {
  cst = tab;
  document.querySelectorAll('.study-tabs button').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  renderStudySidebar();

// ============ STUDY ============
function renderStudySidebar() {
  var data = STUDY_CONTENT[cst];
  if (!data) return;
  var sb = document.getElementById('study-sidebar-mob');
  var h = '<div class="study-sidebar-header">'+data.title+'</div>';
  data.sections.forEach(function(s) {
    h += '<div class="study-sidebar-item" onclick="loadSection(\''+s.id+'\')"><span class="dot"></span>'+s.title+'</div>';
  });
  sb.innerHTML = h;
}

function loadSection(id) {
  var data = STUDY_CONTENT[cst];
  var sec = data.sections.find(function(s) { return s.id === id; });
  if (sec) {
    document.getElementById('study-content').innerHTML = sec.content;
    document.getElementById('study-content').scrollTop = 0;
    window.scrollTo({top: document.getElementById('study-content').offsetTop - 60, behavior: 'smooth'});
  }
  document.querySelectorAll('.study-sidebar-item').forEach(function(el) { el.classList.remove('active'); });
  var items = document.querySelectorAll('.study-sidebar-item');
  data.sections.forEach(function(s, i) { if (s.id === id && items[i]) items[i].classList.add('active'); });
}

// ============ QUIZ ============
function renderSectionPills() {
  var pills = document.getElementById('section-pills');
  var sections = Object.keys(QUIZ_DATA);
  var h = '';
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = gdr(s);
    var cls = 'section-pill';
    if (s === csection) cls += ' active';
    if (r && r.avg >= 3) cls += ' done';
    var label = QUIZ_DATA[s].title.length > 12 ? QUIZ_DATA[s].title.substring(0,12)+'..' : QUIZ_DATA[s].title;
    h += '<button class="'+cls+'" onclick="csection=\''+s+'\';renderSectionPills();loadSectionQuiz(\''+s+'\')">'+label+'</button>';
  }
  pills.innerHTML = h;
}

function loadSectionQuiz(section) {
  csection = section;
  renderSectionPills();
  var data = QUIZ_DATA[section];
  if (!data) return;
  var body = document.getElementById('quiz-body');
  var pr = gdr(section);
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:4px;">'+data.title+'</h3>';
  h += '<p style="font-size:12px;color:var(--sub);margin-bottom:10px;">共 '+data.questions.length+' 题</p>';
  if (pr) {
    var cls = pr.avg >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+cls+'" style="margin-bottom:10px;">上次：'+new Date(pr.ts).toLocaleString('zh-CN')+' | <strong>'+pr.rate+'%</strong> | '+pr.avg.toFixed(1)+'/5'+(pr.avg<3?' | 建议重做':'')+'</div>';
  }
  data.questions.forEach(function(q, i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'/'+data.questions.length+'</span></h3><div class="q-text">'+q.q+'</div><textarea id="a_'+i+'" placeholder="输入你的回答..."></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitSectionQuiz(\''+section+'\')">提交自检（'+data.questions.length+'题）</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitSectionQuiz(section) {
  var data = QUIZ_DATA[section];
  var results = [], total = 0;
  for (var i = 0; i < data.questions.length; i++) {
    var ans = document.getElementById('a_'+i).value.trim();
    if (!ans) { results.push({score:0,matched:[],missed:['未作答'],question:data.questions[i].q,total:0,hit:0}); continue; }
    var r = scoreAnswer(ans, data.questions[i].kp);
    results.push({score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit});
    total += r.score;
  }
  var avg = total / data.questions.length;
  var rate = Math.round(avg * 20);
  sdr(section, {results: results, avg: avg, rate: rate, total: total, count: data.questions.length});
  showResult(section, results, avg, rate);
  renderSectionPills();
}

function showResult(section, results, avg, rate) {
  var rc = document.getElementById('quiz-result');
  var cls = avg >= 3.5 ? 'good' : avg >= 2.5 ? 'ok' : 'bad';
  var h = '<div class="result-header"><div class="result-score '+cls+'">'+rate+'%</div><div class="result-meta">'+QUIZ_DATA[section].title+'<br>'+avg.toFixed(1)+'/5 &middot; '+results.length+'题</div></div>';
  h += '<div class="result-stats">';
  var passCount = results.filter(function(r) { return r.score >= 3; }).length;
  var failCount = results.filter(function(r) { return r.score < 3; }).length;
  h += '<div class="result-stat"><div class="num" style="color:var(--green)">'+passCount+'</div><div class="lbl">达标</div></div>';
  h += '<div class="result-stat"><div class="num" style="color:var(--red)">'+failCount+'</div><div class="lbl">薄弱</div></div>';
  h += '<div class="result-stat"><div class="num">'+rate+'%</div><div class="lbl">得分率</div></div>';
  h += '</div>';
  var analysis = rate >= 80 ? '&#x1f44d; 掌握良好，关键概念和逻辑覆盖到位。' : rate >= 60 ? '&#x1f4a1; 基本掌握，部分要点遗漏。回顾红色标记。' : rate >= 40 ? '&#x26a0;&#xfe0f; 较多知识盲区，建议重读原文后再做。' : '&#x1f534; 需重点重学。先回学习材料精读。';
  h += '<div class="analysis-box"><strong>板块分析：</strong>'+analysis+'</div>';
  results.forEach(function(r, i) {
    var fcls = r.score >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+fcls+'"><div class="fb-title">Q'+(i+1)+' 得分：<strong>'+r.score+'/5</strong>（覆盖率 '+Math.round(r.hit/Math.max(1,r.total)*100)+'%）</div>';
    if (r.matched.length) h += '<div class="caught">&#x2705; '+r.matched.join('、')+'</div>';
    if (r.missed.length) h += '<div class="missed">&#x274c; '+r.missed.join('、')+'</div>';
    h += '</div>';
  });
  h += '<div style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="retrySection(\''+section+'\')">只重做薄弱题</button></div>';
  rc.innerHTML = h;
  rc.style.display = 'block';
  window.scrollTo({top: rc.offsetTop - 60, behavior: 'smooth'});
}

function retrySection(section) {
  var pr = gdr(section);
  if (!pr) return;
  var wi = [];
  pr.results.forEach(function(r, i) { if (r.score < 3) wi.push(i); });
  if (!wi.length) { alert('全部达标！'); return; }
  var data = QUIZ_DATA[section];
  var body = document.getElementById('quiz-body');
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:6px;">重做薄弱题 - '+data.title+'</h3>';
  wi.forEach(function(i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'</span> 上次：'+pr.results[i].score+'/5</h3><div class="q-text">'+data.questions[i].q+'</div><div class="q-hint">遗漏：'+pr.results[i].missed.join('、')+'</div><textarea id="r_'+i+'"></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitRetry(\''+section+'\','+JSON.stringify(wi)+')">提交重做</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitRetry(section, wi) {
  var data = QUIZ_DATA[section];
  var pr = gdr(section);
  wi.forEach(function(i) {
    var ans = document.getElementById('r_'+i).value.trim();
    if (!ans) return;
    var r = scoreAnswer(ans, data.questions[i].kp);
    if (r.score > pr.results[i].score) pr.results[i] = {score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit};
  });
  var total = 0;
  pr.results.forEach(function(r) { total += r.score; });
  pr.avg = total / pr.results.length;
  pr.rate = Math.round(pr.avg * 20);
  pr.ts = Date.now();
  sdr(section, pr);
  loadSectionQuiz(section);
  setTimeout(function() { showResult(section, pr.results, pr.avg, pr.rate); }, 100);
}

// ============ PROGRESS ============
function renderProgress() {
  var p = gp();
  var sections = Object.keys(QUIZ_DATA);
  var completed = [];
  var dcount = 0, tsum = 0, wcount = 0, aw = [];
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = p[s];
    if (r) {
      dcount++; tsum += r.avg;
      completed.push({section:s, title:QUIZ_DATA[s].title, avg:r.avg, rate:r.rate, ts:r.ts, results:r.results});
      r.results.forEach(function(res, j) {
        if (res.score < 3) { wcount++; aw.push({section:s, title:QUIZ_DATA[s].title, q:j+1, qtext:res.question, score:res.score, missed:res.missed}); }
      });
    }
  }
  var oavg = dcount ? (tsum/dcount).toFixed(1) : '-';
  var orate = dcount ? Math.round(tsum/dcount*20) : '-';
  document.getElementById('progress-stats').innerHTML = '<div class="progress-stat"><div class="val">'+dcount+'/'+sections.length+'</div><div class="lbl">已完成</div></div><div class="progress-stat"><div class="val">'+oavg+'</div><div class="lbl">平均分</div></div><div class="progress-stat"><div class="val">'+wcount+'</div><div class="lbl">薄弱题</div></div><div class="progress-stat"><div class="val">'+orate+'%</div><div class="lbl">得分率</div></div>';
  
  var chart = document.getElementById('progress-chart');
  if (!completed.length) chart.innerHTML = '<div class="empty">暂无数据</div>';
  else {
    var ch = '';
    completed.forEach(function(d) {
      var h = Math.max(10, d.avg * 24);
      var color = d.avg >= 3.5 ? 'var(--green)' : d.avg >= 2.5 ? 'var(--amber)' : 'var(--red)';
      ch += '<div style="text-align:center;min-width:20px;" title="'+d.title+': '+d.avg.toFixed(1)+'/5"><div class="chart-bar" style="height:'+h+'px;background:'+color+'"></div><div class="chart-label">'+d.section.toUpperCase()+'</div></div>';
    });
    chart.innerHTML = ch;
  }
  
  var wtc = document.getElementById('weak-table-container');
  if (!aw.length) wtc.innerHTML = '<div class="empty">暂无薄弱点</div>';
  else {
    var wh = '<table class="weakpoint-table"><thead><tr><th>板块</th><th>题</th><th>得分</th><th>题目</th><th>遗漏</th></tr></thead><tbody>';
    aw.sort(function(a, b) { return a.score - b.score; });
    aw.forEach(function(w) {
      var badge = w.score <= 1 ? 'bad' : 'warn';
      wh += '<tr><td>'+w.title.substring(0,10)+'</td><td>Q'+w.q+'</td><td><span class="score-badge '+badge+'">'+w.score+'/5</span></td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+w.qtext+'</td><td>'+w.missed.slice(0,3).join('、')+'</td></tr>';
    });
    wh += '</tbody></table>';
    wtc.innerHTML = wh;
  }
  
  var hl = document.getElementById('history-list');
  if (!completed.length) hl.innerHTML = '<div class="empty">暂无记录</div>';
  else {
    var hh = '';
    completed.reverse().forEach(function(d) {
      hh += '<div class="history-item" onclick="switchPanel(\'quiz\');csection=\''+d.section+'\';renderSectionPills();loadSectionQuiz(\''+d.section+'\')"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+(d.avg>=3?'var(--green)':'var(--red)')+';flex-shrink:0"></span>'+d.title+' &middot; '+d.rate+'% &middot; '+new Date(d.ts).toLocaleDateString('zh-CN')+'</div>';
    });
    hl.innerHTML = hh;
  }
}

// ============ INIT ============
switchPanel('study');
switchStudyTab('product');
renderStudySidebar();
