}

function loadSection(id) {
  var data = STUDY_CONTENT[cst];
  var sec = data.sections.find(function(s) { return s.id === id; });
  if (sec) {
    document.getElementById('study-content').innerHTML = sec.content;
    document.getElementById('study-content').scrollTop = 0;
    window.scrollTo({top: document.getElementById('study-content').offsetTop - 60, behavior: 'smooth'});
  }
  document.querySelectorAll('.study-sidebar-item').forEach(function(el) { el.classList.remove('active'); });
  var items = document.querySelectorAll('.study-sidebar-item');
  data.sections.forEach(function(s, i) { if (s.id === id && items[i]) items[i].classList.add('active'); });
}

// ============ QUIZ ============
function renderSectionPills() {
  var pills = document.getElementById('section-pills');
  var sections = Object.keys(QUIZ_DATA);
  var h = '';
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = gdr(s);
    var cls = 'section-pill';
    if (s === csection) cls += ' active';
    if (r && r.avg >= 3) cls += ' done';
    var label = QUIZ_DATA[s].title.length > 12 ? QUIZ_DATA[s].title.substring(0,12)+'..' : QUIZ_DATA[s].title;
    h += '<button class="'+cls+'" onclick="csection=\''+s+'\';renderSectionPills();loadSectionQuiz(\''+s+'\')">'+label+'</button>';
  }
  pills.innerHTML = h;
}

function loadSectionQuiz(section) {
  csection = section;
  renderSectionPills();
  var data = QUIZ_DATA[section];
  if (!data) return;
  var body = document.getElementById('quiz-body');
  var pr = gdr(section);
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:4px;">'+data.title+'</h3>';
  h += '<p style="font-size:12px;color:var(--sub);margin-bottom:10px;">共 '+data.questions.length+' 题</p>';
  if (pr) {
    var cls = pr.avg >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+cls+'" style="margin-bottom:10px;">上次：'+new Date(pr.ts).toLocaleString('zh-CN')+' | <strong>'+pr.rate+'%</strong> | '+pr.avg.toFixed(1)+'/5'+(pr.avg<3?' | 建议重做':'')+'</div>';
  }
  data.questions.forEach(function(q, i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'/'+data.questions.length+'</span></h3><div class="q-text">'+q.q+'</div><textarea id="a_'+i+'" placeholder="输入你的回答..."></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitSectionQuiz(\''+section+'\')">提交自检（'+data.questions.length+'题）</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitSectionQuiz(section) {
  var data = QUIZ_DATA[section];
  var results = [], total = 0;
  for (var i = 0; i < data.questions.length; i++) {
    var ans = document.getElementById('a_'+i).value.trim();
    if (!ans) { results.push({score:0,matched:[],missed:['未作答'],question:data.questions[i].q,total:0,hit:0}); continue; }
    var r = scoreAnswer(ans, data.questions[i].kp);
    results.push({score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit});
    total += r.score;
  }
  var avg = total / data.questions.length;
  var rate = Math.round(avg * 20);
  sdr(section, {results: results, avg: avg, rate: rate, total: total, count: data.questions.length});
  showResult(section, results, avg, rate);
  renderSectionPills();
}

function showResult(section, results, avg, rate) {
  var rc = document.getElementById('quiz-result');
  var cls = avg >= 3.5 ? 'good' : avg >= 2.5 ? 'ok' : 'bad';
  var h = '<div class="result-header"><div class="result-score '+cls+'">'+rate+'%</div><div class="result-meta">'+QUIZ_DATA[section].title+'<br>'+avg.toFixed(1)+'/5 &middot; '+results.length+'题</div></div>';
  h += '<div class="result-stats">';
  var passCount = results.filter(function(r) { return r.score >= 3; }).length;
  var failCount = results.filter(function(r) { return r.score < 3; }).length;
  h += '<div class="result-stat"><div class="num" style="color:var(--green)">'+passCount+'</div><div class="lbl">达标</div></div>';
  h += '<div class="result-stat"><div class="num" style="color:var(--red)">'+failCount+'</div><div class="lbl">薄弱</div></div>';
  h += '<div class="result-stat"><div class="num">'+rate+'%</div><div class="lbl">得分率</div></div>';
  h += '</div>';
  var analysis = rate >= 80 ? '&#x1f44d; 掌握良好，关键概念和逻辑覆盖到位。' : rate >= 60 ? '&#x1f4a1; 基本掌握，部分要点遗漏。回顾红色标记。' : rate >= 40 ? '&#x26a0;&#xfe0f; 较多知识盲区，建议重读原文后再做。' : '&#x1f534; 需重点重学。先回学习材料精读。';
  h += '<div class="analysis-box"><strong>板块分析：</strong>'+analysis+'</div>';
  results.forEach(function(r, i) {
    var fcls = r.score >= 3 ? 'pass' : 'fail';
    h += '<div class="feedback-item '+fcls+'"><div class="fb-title">Q'+(i+1)+' 得分：<strong>'+r.score+'/5</strong>（覆盖率 '+Math.round(r.hit/Math.max(1,r.total)*100)+'%）</div>';
    if (r.matched.length) h += '<div class="caught">&#x2705; '+r.matched.join('、')+'</div>';
    if (r.missed.length) h += '<div class="missed">&#x274c; '+r.missed.join('、')+'</div>';
    h += '</div>';
  });
  h += '<div style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="retrySection(\''+section+'\')">只重做薄弱题</button></div>';
  rc.innerHTML = h;
  rc.style.display = 'block';
  window.scrollTo({top: rc.offsetTop - 60, behavior: 'smooth'});
}

function retrySection(section) {
  var pr = gdr(section);
  if (!pr) return;
  var wi = [];
  pr.results.forEach(function(r, i) { if (r.score < 3) wi.push(i); });
  if (!wi.length) { alert('全部达标！'); return; }
  var data = QUIZ_DATA[section];
  var body = document.getElementById('quiz-body');
  var h = '<h3 style="font-size:15px;font-weight:600;margin-bottom:6px;">重做薄弱题 - '+data.title+'</h3>';
  wi.forEach(function(i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'</span> 上次：'+pr.results[i].score+'/5</h3><div class="q-text">'+data.questions[i].q+'</div><div class="q-hint">遗漏：'+pr.results[i].missed.join('、')+'</div><textarea id="r_'+i+'"></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitRetry(\''+section+'\','+JSON.stringify(wi)+')">提交重做</button>';
  body.innerHTML = h;
  document.getElementById('quiz-result').style.display = 'none';
}

function submitRetry(section, wi) {
  var data = QUIZ_DATA[section];
  var pr = gdr(section);
  wi.forEach(function(i) {
    var ans = document.getElementById('r_'+i).value.trim();
    if (!ans) return;
    var r = scoreAnswer(ans, data.questions[i].kp);
    if (r.score > pr.results[i].score) pr.results[i] = {score:r.score, matched:r.matched, missed:r.missed, question:data.questions[i].q, total:r.total, hit:r.hit};
  });
  var total = 0;
  pr.results.forEach(function(r) { total += r.score; });
  pr.avg = total / pr.results.length;
  pr.rate = Math.round(pr.avg * 20);
  pr.ts = Date.now();
  sdr(section, pr);
  loadSectionQuiz(section);
  setTimeout(function() { showResult(section, pr.results, pr.avg, pr.rate); }, 100);
}

// ============ PROGRESS ============
function renderProgress() {
  var p = gp();
  var sections = Object.keys(QUIZ_DATA);
  var completed = [];
  var dcount = 0, tsum = 0, wcount = 0, aw = [];
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var r = p[s];
    if (r) {
      dcount++; tsum += r.avg;
      completed.push({section:s, title:QUIZ_DATA[s].title, avg:r.avg, rate:r.rate, ts:r.ts, results:r.results});
      r.results.forEach(function(res, j) {
        if (res.score < 3) { wcount++; aw.push({section:s, title:QUIZ_DATA[s].title, q:j+1, qtext:res.question, score:res.score, missed:res.missed}); }
      });
    }
  }
  var oavg = dcount ? (tsum/dcount).toFixed(1) : '-';
  var orate = dcount ? Math.round(tsum/dcount*20) : '-';
  document.getElementById('progress-stats').innerHTML = '<div class="progress-stat"><div class="val">'+dcount+'/'+sections.length+'</div><div class="lbl">已完成</div></div><div class="progress-stat"><div class="val">'+oavg+'</div><div class="lbl">平均分</div></div><div class="progress-stat"><div class="val">'+wcount+'</div><div class="lbl">薄弱题</div></div><div class="progress-stat"><div class="val">'+orate+'%</div><div class="lbl">得分率</div></div>';
  
  var chart = document.getElementById('progress-chart');
  if (!completed.length) chart.innerHTML = '<div class="empty">暂无数据</div>';
  else {
    var ch = '';
    completed.forEach(function(d) {
      var h = Math.max(10, d.avg * 24);
      var color = d.avg >= 3.5 ? 'var(--green)' : d.avg >= 2.5 ? 'var(--amber)' : 'var(--red)';
      ch += '<div style="text-align:center;min-width:20px;" title="'+d.title+': '+d.avg.toFixed(1)+'/5"><div class="chart-bar" style="height:'+h+'px;background:'+color+'"></div><div class="chart-label">'+d.section.toUpperCase()+'</div></div>';
    });
    chart.innerHTML = ch;
  }
  
  var wtc = document.getElementById('weak-table-container');
  if (!aw.length) wtc.innerHTML = '<div class="empty">暂无薄弱点</div>';
  else {
    var wh = '<table class="weakpoint-table"><thead><tr><th>板块</th><th>题</th><th>得分</th><th>题目</th><th>遗漏</th></tr></thead><tbody>';
    aw.sort(function(a, b) { return a.score - b.score; });
    aw.forEach(function(w) {
      var badge = w.score <= 1 ? 'bad' : 'warn';
      wh += '<tr><td>'+w.title.substring(0,10)+'</td><td>Q'+w.q+'</td><td><span class="score-badge '+badge+'">'+w.score+'/5</span></td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+w.qtext+'</td><td>'+w.missed.slice(0,3).join('、')+'</td></tr>';
    });
    wh += '</tbody></table>';
    wtc.innerHTML = wh;
  }
  
  var hl = document.getElementById('history-list');
  if (!completed.length) hl.innerHTML = '<div class="empty">暂无记录</div>';
  else {
    var hh = '';
    completed.reverse().forEach(function(d) {
      hh += '<div class="history-item" onclick="switchPanel(\'quiz\');csection=\''+d.section+'\';renderSectionPills();loadSectionQuiz(\''+d.section+'\')"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+(d.avg>=3?'var(--green)':'var(--red)')+';flex-shrink:0"></span>'+d.title+' &middot; '+d.rate+'% &middot; '+new Date(d.ts).toLocaleDateString('zh-CN')+'</div>';
    });
    hl.innerHTML = hh;
  }
}

function checkFeynman() {
  if (!currentFeynmanSection) return;
  var input = document.getElementById("feynman-input").value.trim();
  if (!input) { alert("先写点东西再检查！"); return; }
  
  var kp = FEYNMAN_KP[currentFeynmanSection];
  if (!kp) { document.getElementById("feynman-result").innerHTML = '<div class="feynman-result fail">该板块暂未配置费曼检查要点</div>'; return; }
  
  var answer = input.toLowerCase();
  var matched = [], missed = [];
  for (var i = 0; i < kp.length; i++) {
    if (answer.indexOf(kp[i].toLowerCase()) !== -1) matched.push(kp[i]);
    else missed.push(kp[i]);
  }
  var rate = Math.round(matched.length / kp.length * 100);
  var cls = rate >= 70 ? "pass" : "fail";
  var emoji = rate >= 80 ? "🎉" : rate >= 60 ? "💪" : "📖";
  
  var resultDiv = document.getElementById("feynman-result");
  resultDiv.innerHTML = '<div class="feynman-result '+cls+'">' +
    '<strong>'+emoji+' 覆盖率：'+rate+'%</strong> （'+matched.length+'/'+kp.length+' 个关键点）<br>' +
    (matched.length ? '<span style="color:var(--green)">✅ 讲到的：'+matched.join('、')+'</span><br>' : '') +

    '</div>';
}

// ============ SPACED REPETITION ============
var SPACED_INTERVALS = [1, 3, 7, 14, 30]; // days

function getReviewStatus(sectionId) {
  var p = gp();
  var record = p[sectionId];
  if (!record) return null;
  var lastReview = record.ts;
  var daysSince = Math.floor((Date.now() - lastReview) / (1000 * 60 * 60 * 24));
  var reviewCount = record.reviewCount || 0;
  var nextInterval = SPACED_INTERVALS[Math.min(reviewCount, SPACED_INTERVALS.length - 1)];
  var daysUntilDue = nextInterval - daysSince;
  return {daysSince: daysSince, reviewCount: reviewCount, nextInterval: nextInterval, daysUntilDue: daysUntilDue, avg: record.avg};
}

// Override sdr to track review count
var _origSdr = sdr;
sdr = function(sec, r) {
  var old = gdr(sec);
  r.reviewCount = (old && old.reviewCount ? old.reviewCount + 1 : 1);
  _origSdr(sec, r);
};

// Add function to render reminders
function renderReviewReminders() {
  var sections = Object.keys(QUIZ_DATA);
  var reminders = [];
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var status = getReviewStatus(s);
    if (status) {
      reminders.push({section: s, title: QUIZ_DATA[s].title, status: status});
    }
  }
  
  var container = document.getElementById("review-reminders");
  if (!reminders.length) {
    container.innerHTML = '<div class="empty">暂无复习数据，完成板块自检后自动生成复习计划</div>';
    return;
  }
  
  // Sort: most overdue first
  reminders.sort(function(a, b) { return a.status.daysUntilDue - b.status.daysUntilDue; });
  
  var h = '';
  reminders.forEach(function(r) {
    var due = r.status.daysUntilDue <= 0;
    var today = r.status.daysUntilDue === 0;
    var badgeCls = due ? "due" : (today ? "today" : "ok");
    var badgeText = due ? "⚠ 待复习" : (r.status.daysUntilDue <= 1 ? "今天复习" : r.status.daysUntilDue + "天后复习");
    var cardCls = due ? "review-card due" : "review-card";
    h += '<div class="'+cardCls+'" onclick="switchPanel(\'quiz\');csection=\''+r.section+'\';renderSectionPills();loadSectionQuiz(\''+r.section+'\')">';
    h += '<span class="review-badge '+badgeCls+'">'+badgeText+'</span>';
    h += '<span style="flex:1">'+r.title+'</span>';
    h += '<span style="font-size:11px;color:var(--sub)">'+r.status.daysSince+'天前 · 得分'+r.status.avg.toFixed(1)+'/5</span>';
    h += '</div>';
  });
  container.innerHTML = h;
}

// ============ VOICE INPUT (Web Speech API) ============
var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
var voiceSupported = !!SpeechRecognition;
var currentRecognition = null;
var currentVoiceTarget = null;

function isVoiceSupported() {
  if (!voiceSupported) {
    alert("你的浏览器不支持语音输入。请使用 Chrome 或 Safari 打开此页面。");
    return false;
  }
  return true;
}

function startVoice(targetId) {
  if (!isVoiceSupported()) return;
  
  // Stop any existing recognition
  if (currentRecognition) {
    currentRecognition.stop();
  }
  
  var recognition = new SpeechRecognition();
  recognition.lang = "zh-CN";
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 1;
  
  var target = document.getElementById(targetId);
  var btn = document.getElementById("vbtn_" + targetId);
  if (!target || !btn) return;
  
  currentRecognition = recognition;
  currentVoiceTarget = targetId;
  
  btn.classList.add("recording");
  
  recognition.onresult = function(event) {
    var transcript = "";
    for (var i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    // Append to existing text
    if (event.results[event.results.length - 1].isFinal) {
      target.value = (target.value ? target.value + " " : "") + transcript;
    } else {
      // Show interim result by temporarily adding it
      var existing = target.value;
      target.value = existing + transcript;
      target.setSelectionRange(existing.length, existing.length + transcript.length);
    }
  };
  
  recognition.onerror = function(event) {
    console.log("Voice error:", event.error);
    btn.classList.remove("recording");
    currentRecognition = null;
    currentVoiceTarget = null;
    
    if (event.error === "not-allowed") {
      alert("麦克风权限被拒绝。请在浏览器设置中允许麦克风访问。");
    } else if (event.error === "no-speech") {
      // Silent - just stop
    } else if (event.error !== "aborted") {
      alert("语音识别出错: " + event.error + "。请重试或使用键盘输入。");
    }
  };
  
  recognition.onend = function() {
    btn.classList.remove("recording");
    currentRecognition = null;
    currentVoiceTarget = null;
  };
  
  try {
    recognition.start();
  } catch(e) {
    btn.classList.remove("recording");
    alert("语音启动失败: " + e.message);
  }
}

function stopVoice() {
  if (currentRecognition) {
    currentRecognition.stop();
    currentRecognition = null;
    if (currentVoiceTarget) {
      var btn = document.getElementById("vbtn_" + currentVoiceTarget);
      if (btn) btn.classList.remove("recording");
      currentVoiceTarget = null;
    }
  }
}
