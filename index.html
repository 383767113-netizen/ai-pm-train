<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI PM 面试训练</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--sub:#6b7280;
  --accent:#1d4ed8;--accent-dim:#dbeafe;--green:#059669;--green-dim:#d1fae5;
  --amber:#d97706;--amber-dim:#fef3c7;--red:#dc2626;--red-dim:#fee2e2;
  --radius:8px;--font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}

/* Top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;margin-right:auto}
.topbar-nav{display:flex;gap:2px}
.topbar-nav button{height:34px;padding:0 14px;border:none;border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .12s;display:flex;align-items:center;gap:5px}
.topbar-nav button:hover{background:#f1f5f9;color:var(--text)}
.topbar-nav button.active{background:var(--accent);color:#fff}
.topbar-nav button svg{width:14px;height:14px;flex-shrink:0}
.topbar-nav .nav-label{display:none}
.main{padding:12px 12px 24px;max-width:900px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* Study panel */
.study-tabs{display:flex;gap:0;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.study-tabs button{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.study-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.study-sidebar{background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius);padding:8px 0;margin-bottom:12px;max-height:200px;overflow-y:auto}
.study-sidebar-header{padding:6px 14px;font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.study-sidebar-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text);transition:all .1s;display:flex;align-items:center;gap:8px;border-radius:4px;margin:1px 6px}
.study-sidebar-item:active{background:#e5e7eb}
.study-sidebar-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.study-sidebar-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.study-sidebar-item.active .dot{background:var(--accent)}
.study-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;overflow-y:auto;max-height:60vh;font-size:14px;line-height:1.75}
.study-content h2{font-size:18px;font-weight:700;margin:0 0 8px}
.study-content h3{font-size:14px;font-weight:600;margin:16px 0 6px;color:var(--sub)}
.study-content p{margin:6px 0}
.study-content ol,.study-content ul{margin:6px 0 6px 18px}
.study-content li{margin:3px 0;line-height:1.6}
.study-content blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:10px 0;background:#f8fafc;color:var(--sub);font-size:13px;font-style:italic}
.study-content table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.study-content th,.study-content td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.study-content th{background:#f8fafc;font-weight:600;font-size:11px;color:var(--sub)}
.study-content strong{color:var(--text)}
.study-content pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid var(--border);max-height:50vh;overflow-y:auto}
.study-content code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:12px}

/* Quiz panel */
.quiz-header{margin-bottom:12px}
.quiz-header h2{font-size:18px;font-weight:700;margin-bottom:2px}
.quiz-header p{font-size:12px;color:var(--sub)}
.section-pills{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.section-pill{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:15px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .12s;display:flex;align-items:center}
.section-pill:active{border-color:var(--sub)}
.section-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-pill.done{border-color:var(--green);color:var(--green)}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.quiz-card h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.q-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:var(--accent-dim);color:var(--accent)}
.quiz-card .q-text{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--text)}
.quiz-card .q-hint{font-size:11px;color:var(--sub);margin-bottom:8px;padding:6px 10px;background:#fefce8;border-radius:4px;border-left:3px solid var(--amber)}
.quiz-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.6;resize:vertical;-webkit-appearance:none}
.quiz-card textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}

/* Buttons */
.btn{height:40px;padding:0 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;gap:6px;-webkit-appearance:none}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center}
.btn-primary:active{opacity:.85}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:32px;padding:0 10px;font-size:12px}

/* Results */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.result-score{font-size:36px;font-weight:800}
.result-score.good{color:var(--green)}.result-score.ok{color:var(--amber)}.result-score.bad{color:var(--red)}
.result-meta{font-size:12px;color:var(--sub)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.result-stat{text-align:center;padding:10px;background:#f8fafc;border-radius:var(--radius)}
.result-stat .num{font-size:16px;font-weight:700}
.result-stat .lbl{font-size:10px;color:var(--sub);margin-top:2px}
.feedback-item{padding:10px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:12px;line-height:1.5}
.feedback-item.pass{background:var(--green-dim);border:1px solid #a7f3d0}
.feedback-item.fail{background:var(--red-dim);border:1px solid #fecaca}
.feedback-item .fb-title{font-weight:600;margin-bottom:3px}
.feedback-item .caught{color:var(--green);font-weight:500}
.feedback-item .missed{color:var(--red);font-weight:500}
.analysis-box{padding:12px;background:#f8fafc;border-radius:var(--radius);font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}

/* Progress */
.progress-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.progress-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.progress-stat .val{font-size:24px;font-weight:700}
.progress-stat .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.chart-container h3{font-size:13px;font-weight:600;margin-bottom:10px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px;overflow-x:auto}
.chart-bar{flex:1;min-width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.chart-label{text-align:center;font-size:9px;color:var(--sub);margin-top:4px}
.weakpoint-table{width:100%;border-collapse:collapse;font-size:11px}
.weakpoint-table th{text-align:left;padding:6px 8px;background:#f8fafc;font-size:10px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border)}
.weakpoint-table td{padding:6px 8px;border-bottom:1px solid var(--border);line-height:1.4}
.score-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.score-badge.bad{background:var(--red-dim);color:var(--red)}
.score-badge.warn{background:var(--amber-dim);color:var(--amber)}
.empty{padding:32px;text-align:center;color:var(--sub);font-size:13px}
.history-item{padding:10px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.history-item:active{background:#f1f5f9}

/* Desktop overrides */
@media(min-width:768px){
  .main{padding:20px 24px;max-width:1100px}
  .study-layout-desktop{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .study-sidebar-desktop{background:#fafbfc;border-right:1px solid var(--border);padding:10px 0;overflow-y:auto}
  .study-content-desktop{padding:28px 36px;overflow-y:auto;max-height:calc(100vh - 120px)}
  .topbar-nav .nav-label{display:inline}
  .section-pill{height:32px;padding:0 12px;font-size:12px}
  .quiz-card{padding:18px 22px}
  .quiz-card textarea{min-height:100px}
  .progress-grid{grid-template-columns:repeat(4,1fr)}
}

/* === Content Formatting === */
.freq-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle}
.freq-3{background:#fef2f2;color:#dc2626}.freq-2{background:#fff7ed;color:#ea580c}.freq-1{background:#f0fdf4;color:#16a34a}
.kp-box{border-radius:var(--radius);padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.7}
.kp-framework{background:#eff6ff;border-left:3px solid #3b82f6}
.kp-data{background:#fefce8;border-left:3px solid #eab308}
.kp-warning{background:#fef2f2;border-left:3px solid #ef4444}
.kp-qa{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:8px 0}
.kp-qa .q-label{font-weight:700;color:var(--accent);font-size:12px;margin-bottom:2px}
.kp-qa .a-label{color:var(--text);font-size:13px;line-height:1.7}
.kp-highlight{background:linear-gradient(180deg,transparent 60%,#fde68a 60%);padding:0 2px;font-weight:600}
.kp-jp{font-weight:700;color:var(--accent);background:var(--accent-dim);padding:1px 6px;border-radius:3px;font-size:12px}
.section-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-right:4px}
.tag-silu{background:#dbeafe;color:#1d4ed8}.tag-kaocha{background:#fef3c7;color:#92400e}
.tag-zhuyi{background:#fee2e2;color:#dc2626}.tag-zhuzigao{background:#d1fae5;color:#059669}
.tag-qa{background:#f3e8ff;color:#7c3aed}
.study-content hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.study-content .freq-summary{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:12px;line-height:1.8}
.study-content .freq-summary strong{color:var(--accent)}


/* Feynman output panel */
.feynman-panel{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:16px;margin:12px 0}
.feynman-panel h3{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.feynman-panel .feynman-hint{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.6}
.feynman-panel textarea{width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.7;resize:vertical}
.feynman-result{margin-top:10px;padding:10px;border-radius:var(--radius);font-size:12px;line-height:1.6}
.feynman-result.pass{background:var(--green-dim);border:1px solid #a7f3d0}
.feynman-result.fail{background:var(--amber-dim);border:1px solid #fde68a}
.feynman-btn-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.feynman-btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;transition:all .12s}
.feynman-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.feynman-btn:hover{opacity:.85}

/* Spaced repetition */
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:6px 0;display:flex;align-items:center;gap:10px;font-size:13px}
.review-card.due{background:#fef2f2;border-color:#fecaca}
.review-card .review-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;white-space:nowrap}
.review-badge.due{background:var(--red-dim);color:var(--red)}
.review-badge.today{background:var(--amber-dim);color:var(--amber)}
.review-badge.ok{background:var(--green-dim);color:var(--green)}

/* BD anchor callout */
.bd-anchor{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #a7f3d0;border-radius:var(--radius);padding:10px 14px;margin:10px 0;font-size:12px;line-height:1.7}
.bd-anchor strong{color:var(--green)}


/* Font size controls */
.font-ctrl{display:flex;align-items:center;gap:4px;margin-right:8px}
.font-ctrl button{width:28px;height:28px;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--text)}
.font-ctrl button:hover{background:#f1f5f9}
.font-ctrl .fs-label{font-size:11px;color:var(--sub);width:28px;text-align:center;font-weight:600}

/* Voice recording */
.voice-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:50%;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;margin-left:8px;vertical-align:middle}
.voice-btn:hover{background:#f1f5f9}
.voice-btn.recording{background:var(--red-dim);border-color:var(--red);animation:pulse 1.5s infinite}
.voice-btn.recording svg{stroke:var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.voice-status{font-size:11px;color:var(--red);margin-left:4px;display:none}
.voice-status.active{display:inline;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <span class="topbar-brand">AI PM 面试训练</span>
    <div class="font-ctrl"><button onclick="changeFontSize(-1)" title="缩小字体">A-</button><span class="fs-label" id="fs-label">14</span><button onclick="changeFontSize(1)" title="放大字体">A+</button></div>
  <nav class="topbar-nav">
    <button id="nav-study" class="active" onclick="switchPanel('study')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span class="nav-label">学习</span>
    </button>
    <button id="nav-quiz" onclick="switchPanel('quiz')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span class="nav-label">自检</span>
    </button>
    <button id="nav-progress" onclick="switchPanel('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
      <span class="nav-label">进度</span>
    </button>
  </nav>
</header>
<main class="main">

<div id="panel-study" class="panel active">
  <div class="study-tabs" id="study-tabs">
    <button class="active" onclick="switchStudyTab('product')">产品逐字稿</button>
    <button onclick="switchStudyTab('resume')">简历逐字稿</button>
    <button onclick="switchStudyTab('quick')">辅助速查</button>
  </div>
  <div id="study-sidebar-mob" class="study-sidebar"></div>
  <div id="study-content" class="study-content">
    <div class="empty">从上方选择一个章节开始学习</div>
  </div>
</div>

<div id="panel-quiz" class="panel">
  <div class="quiz-header">
    <h2>板块自检测试</h2>
    <p>每学完一个板块就做对应的题目，系统自动评分</p>
  </div>
  <div class="section-pills" id="section-pills"></div>
  <div id="quiz-body"><div class="empty">选择上方板块开始测试</div></div>
  <div id="quiz-result" class="result-card" style="display:none"></div>
</div>

<div id="panel-progress" class="panel">
  <div class="progress-grid" id="progress-stats"></div>
  <div class="chart-container">
    <h3>各板块得分</h3>
    <div class="chart-bars" id="progress-chart"></div>
  </div>
  <div class="chart-container">
    <h3>薄弱点</h3>
    <div id="weak-table-container"><div class="empty">暂无数据</div></div>
  </div>
  <div class="chart-container">
    <h3>历史记录</h3>
    <div id="history-list"><div class="empty">暂无记录</div></div>
  </div>
</div>
</main>
</div>

<script>
var _C = {"p1":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>产品背景是面试<strong>必问第一题</strong>，基本每场面试都会让你介绍这个产品。以下6步递进结构必须熟练。<br>\n<span class=\"freq-badge freq-3\">高频</span> 6步递进思路 · 产品定位一句话 · 为什么是AI不是普通系统<br>\n<span class=\"freq-badge freq-2\">中频</span> 为什么不用现成工具 · 需求是否真实</div>\n\n<h2>一、产品背景：为什么做这个产品 <span class=\"freq-badge freq-3\">面试必问</span></h2>\n\n<h3>1. 回答思路（6步递进结构）</h3>\n<div class=\"kp-box kp-framework\">\n<strong>记忆口诀：</strong>业务场景真实存在 → 商户入驻后仍不会经营 → 中小商户缺团队，连锁商户难批量 → 人工服务成本高且无法复制 → AI适合处理理解、分析和生成 → 产品定位为经营策略与内容生产一体化助手\n</div>\n<ol>\n<li>交代业务场景：字节本地生活，餐饮商户拓展/入驻/装修/套餐/活动/复盘</li>\n<li><strong>「入驻 ≠ 会经营」</strong>：入驻后还要商圈研究、货盘规划、套餐设计、定价、文案、视觉、推广</li>\n<li>按用户类型拆解：中小商户缺团队 / 连锁商户批量+本地化矛盾 / 内部运营交付效率</li>\n<li>原方式不可规模化：依赖人工查询、个人经验、临时沟通、逐版修改</li>\n<li>为什么适合AI：非结构化信息→大模型和多模态；结构化数据→规则控制；最终方案→人工确认</li>\n<li>产品定位：<span class=\"kp-jp\">B端AI营销经营辅助产品，不是单一图片生成器</span></li>\n</ol>\n\n<h3>2. 面试官考察方向（5个判断点）</h3>\n<ol>\n<li><strong>需求是不是真实需求</strong>：不是看到大模型流行后强行找场景，而是在真实工作中反复发现同类问题</li>\n<li><strong>是否理解目标用户</strong>：MVP阶段主要用户是内部商务和运营，商户是资料提供者和方案确认者</li>\n<li><strong>为什么需要AI而不是普通系统</strong>：普通系统不能理解模糊表达、总结评价、理解参考图、生成多版本内容</li>\n<li><strong>产品价值是否清晰</strong>：对商户降低门槛 / 对运营降低重复成本 / 对平台提高效率和经营质量</li>\n<li><strong>是否具备商业化价值</strong>：AI服务可作为商户入驻增值服务，也可作为商务拓展的「钩子」</li>\n</ol>\n\n<h3>3. 注意事项 <span class=\"section-tag tag-zhuyi\">5条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li><strong>不要一上来就讲技术</strong>：错误「大模型发展快所以想做AI」。正确「先发现需求沟通、套餐设计和内容生产三个高频问题，再判断哪些环节适合用AI」</li>\n<li><strong>不要把项目只讲成图片生成</strong>：完整价值是「需求理解→市场策略→套餐设计→文案及视觉生产→质量审核→数据复盘」</li>\n<li><strong>不要说商户完全不会运营</strong>：更准确的表达「不同商户线上运营能力差异较大，中小商户普遍缺少专业团队」</li>\n<li><strong>不要声称AI可以自动完成最终经营决策</strong>：套餐定价、商户成本、活动资源和最终上线内容都需要人工确认</li>\n<li><strong>需要明确实际项目边界</strong>：项目已完成需求验证、方案设计、商户试点和团队内部复用；完整系统化能力属于后续迭代方向</li>\n</ol>\n</div>\n\n<h3>4. 产品背景逐字稿 <span class=\"section-tag tag-zhuzigao\">面试时的原话</span></h3>\n<p>我在字节跳动本地生活业务担任商务经理，日常主要负责餐饮商户的拓展、平台入驻、门店装修、套餐规划、营销活动和后续经营复盘。</p>\n\n<p>在这个过程中，我发现一个比较典型的问题，就是商户完成入驻以后，并不代表已经具备线上经营能力。平台给了商户一个经营入口，但商户还需要解决卖什么套餐、怎么定价、怎么装修门店、怎么做营销内容以及怎么根据数据继续优化这些问题。</p>\n\n<p>对中小餐饮商户来说，他们通常没有完整的线上运营团队，老板可能很懂菜品和线下经营，但不一定熟悉平台用户、团购套餐和线上内容。他们提出的需求也比较模糊，比如会说「帮我把菜做得好看一点」「套餐设计得更有吸引力」或者「参考附近卖得好的商家」，但是很难进一步说明目标用户、价格策略、视觉风格和内容使用场景。</p>\n\n<p>对连锁商户来说，问题不完全一样。总部希望所有门店保持统一的品牌形象，但不同城市、不同商圈和不同门店又需要结合本地用户做差异化套餐和内容。如果完全依赖人工逐店处理，周期和成本都会比较高。</p>\n\n<p>对内部商务和运营人员来说，也存在明显的效率问题。商圈竞品、套餐价格、用户评价需要人工在不同渠道中搜索和整理，门店头图、菜品图和文案又要重复制作，很多经验沉淀在个人手里，很难快速复制给其他同事。</p>\n\n<p>我当时判断，这个场景比较适合AI，不是单纯因为AI能够生成图片，而是因为整个流程中存在大量非结构化但又可以标准化的任务。比如商户的模糊需求可以被拆成结构化参数，用户评价可以被AI归类总结，参考图片可以被多模态模型理解，文案和视觉素材可以批量生成。但是像菜品价格、成本、套餐内容和平台合规这些，仍然需要用结构化数据和规则来控制。最终方案由人工确认。</p>\n\n<p>所以我当时是把产品定位成一款面向内部商务、运营以及餐饮商户的<span class=\"kp-highlight\">B端AI营销经营辅助产品</span>，而不是单一图片生成工具。</p>","p2":"<div class=\"freq-summary\"><span style=\"display:inline-block;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px\">🔴 两篇重合</span><strong>面试频率分析：</strong>「你一个商务经理凭什么做AI产品」是面试官<strong>必问的质疑</strong>，必须主动区分正式岗位和项目角色。<br>\n<span class=\"freq-badge freq-3\">高频</span> 岗位vs角色区分 · 最关键的产品决策 · 怎么证明不是只会写Prompt<br>\n<span class=\"freq-badge freq-2\">中频</span> 具体交付了哪些文档 · 技术团队vs你的分工 · 如何推动没有汇报关系的团队</div>\n\n<h2>二、你的角色与职责 <span class=\"freq-badge freq-3\">面试必问</span></h2>\n\n<h3>1. 回答思路（四层结构）<span class=\"section-tag tag-silu\">思路</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>核心原则：</strong>不回避正式岗位，清晰区分：<br>\n正式岗位：<strong>本地生活商务经理</strong> → 项目角色：<strong>业务需求发起人 + AI产品方案负责人 + 试点推动者</strong>\n</div>\n<ol>\n<li><strong>业务端工作</strong>：商户拓展、洽谈、入驻、套餐规划、活动推进和数据复盘</li>\n<li><strong>产品端工作</strong>：识别共性问题、需求调研、拆解业务流程、设计产品架构和MVP</li>\n<li><strong>AI专项工作</strong>：Prompt结构、参考图规范、风格基准、质量评测和失败案例分析</li>\n<li><strong>项目推进工作</strong>：商户试点、跨部门协作、内部培训和数据复盘</li>\n</ol>\n\n<h3>2. 面试官考察方向 <span class=\"section-tag tag-kaocha\">考察</span></h3>\n<ol>\n<li><strong>项目真实性</strong>：项目是不是你主导的？是不是只负责商户沟通？Prompt和测试是谁完成的？</li>\n<li><strong>个人贡献</strong>：业务流程梳理、产品功能架构、MVP规划、Prompt模板、质量验收标准、商户试点、内部培训</li>\n<li><strong>产品判断</strong>：为什么先服务内部运营而不是直接服务商户？为什么需要人工审核？为什么选模板而不是训练模型？</li>\n<li><strong>推动力</strong>：如何通过业务数据、案例和明确验收标准推动不同团队合作</li>\n<li><strong>诚实边界</strong>：主动说清楚底层模型由现有工具和AI技术团队提供，自己负责产品方案和业务落地</li>\n</ol>\n\n<h3>3. 注意事项 <span class=\"section-tag tag-zhuyi\">5条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li><strong>不要说「负责整个产品所有工作」</strong>：应该说「我主导了产品方案和试点落地」，不能说自己独立完成了模型开发</li>\n<li><strong>少用「参与」，多用明确动作</strong>：弱「我参与了需求分析」→强「我梳理了商户入驻到经营复盘的全流程，完成产品功能架构、MVP范围和质量指标设计」</li>\n<li><strong>区分商务运营与产品工作</strong>：商务运营=拿到商户、理解目标、推动落地；产品工作=抽象共性问题为流程、功能、规则和指标</li>\n<li><strong>重点讲关键决策</strong>：①MVP先服务内部运营 ②AI、规则和人工协同而非全自动 ③先通过模板和Prompt验证再考虑模型定制</li>\n<li><strong>不要把约50人说成稳定活跃用户</strong>：更稳妥「方案开始在约50人的市场团队中进行内部普及、培训和推广」</li>\n</ol>\n</div>\n\n<h3>4. 角色与职责逐字稿 <span class=\"section-tag tag-zhuzigao\">面试原话</span></h3>\n<p>我的正式岗位是商务经理，日常包括商户拓展、合作洽谈、平台入驻、套餐规划、活动推进和经营数据复盘。</p>\n<p>但是在这个项目中，我承担的不只是商务执行，而是<strong>业务需求发起人、AI产品方案负责人和试点推动者</strong>三个角色。</p>\n<p><strong>第一，我是需求的发现者。</strong>我通过持续拜访和运营商户，梳理了商户从入驻、门店装修、套餐上架到推广和复盘的完整流程，识别出需求沟通、竞品调研、套餐设计、内容生产和质量验收几个高频低效环节。</p>\n<p><strong>第二，我负责把业务问题转化为产品方案。</strong>我拆解了商户项目管理、AI需求诊断、竞品分析、套餐策略、文案与视觉生成、内容审核和数据复盘等核心模块，设计了用户流程和MVP范围。我的一个关键判断是，MVP阶段不直接让商户完全自助，而是优先服务内部商务和运营人员。</p>\n<p><strong>第三，我重点负责AI内容生产方案和质量体系。</strong>我设计了结构化需求采集方式，把商户的模糊诉求拆成品牌、目标用户、使用场景、视觉风格和真实性约束；同时整理了分层提示词、参考图使用规范、风格基准和质量验收标准。</p>\n<p><strong>第四，我负责试点和产品运营。</strong>我选取真实餐饮商户进行测试，并将验证有效的方法沉淀成SOP和模板。</p>\n\n<h3>5. 角色与职责高频QA</h3>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你是商务经理，为什么要转AI产品？</div>\n<div class=\"a-label\">我的商务经历让我长期处在用户和业务一线，能够看到商户真正愿意为什么付费、哪些工作只是表面需求、哪些问题可以规模化。在这个项目中，我进一步承担了需求抽象、产品流程、AI方案、评测指标和试点运营等工作。我发现自己的优势不只是完成一单商务合作，而是能够将多个客户的共性问题沉淀成一套可复制的产品方案。所以转AI产品不是完全跨行业，而是从单客户交付走向产品化和规模化解决问题。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：这个产品是你提出的吗？</div>\n<div class=\"a-label\">项目机会最初是我在商户运营过程中提出的。我前期先完整熟悉了商户入驻、门店装修、货盘设计、达人推广和数据复盘流程，在能够区分个性问题和共性问题后，才开始验证AIGC方案。后续我整理了产品逻辑、测试方案和商户案例，再向Leader和相关团队同步并推动内部使用。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你具体交付了哪些产品文档？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">业务流程梳理、用户角色和痛点分析、产品功能架构、核心使用流程、MVP范围、功能需求说明、Prompt模板、视觉生成规则、内容质量标准和效果指标。</span>如果进一步系统开发，这些内容可以继续拆成详细PRD、原型和技术接口需求。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：技术团队做了什么，你做了什么？如何划分边界？</div>\n<div class=\"a-label\">AI技术支持团队主要帮助验证现有模型和工具的能力边界，例如图片生成质量、参考图理解效果和市场信息分析能力。<span class=\"kp-highlight\">我负责定义业务问题、输入信息、产品流程、模型需要输出什么、什么结果算合格</span>，并通过真实商户案例进行测试和验收。技术团队解决「模型能不能实现」，我解决「业务为什么需要、产品应该怎么用、结果怎么判断」。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你最关键的产品决策是什么？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">最关键的决策是先做内部运营人员使用的MVP，而不是直接做商户自助平台。</span>早期AI结果仍然存在菜品失真、风格不稳定和事实错误风险。通过运营人员先使用，可以快速验证效果，也能够保留人工审核，降低业务风险。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你怎么证明自己不是只会写Prompt？</div>\n<div class=\"a-label\">Prompt只是方案的一部分。我还做了<span class=\"kp-highlight\">用户分析、业务流程、功能设计、数据规则、质量评测、人工审核和产品运营</span>。比如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商户确认和版本管理也属于产品流程问题。我的重点是让AI完成真实业务任务，而不是只优化一次模型回答。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你如何推动没有汇报关系的团队？</div>\n<div class=\"a-label\">我会把问题转换成对方可以执行的信息。对AI技术支持团队，我提供具体失败案例、输入参数、期望结果和验收标准；对产品团队，我整理多个商户反复出现的共性需求；对商业化团队，我会明确商户活动目标、资源需求、上线时间和预期指标。这样沟通的不是「我觉得效果不好」，而是一个有场景、数据和优先级的需求。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你有没有做用户调研？</div>\n<div class=\"a-label\">有，但调研不是一次正式问卷，而是结合商户拜访、需求沟通、方案确认、修改意见和上线复盘持续进行。我主要调研了三类对象：中小单店、连锁商户和内部商务运营人员。中小商户更关注成本和快速上线，连锁商户更关注品牌一致和批量处理，内部运营更关注输入是否简单、生成是否稳定以及能否减少修改。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：项目中你花时间最多的工作是什么？</div>\n<div class=\"a-label\">前期花时间最多的是需求拆解和生成质量调试。商户的需求非常模糊，需要反复确认哪些是事实，哪些是偏好；图片生成又容易出现视觉好看但食材不真实的问题。后期花时间最多的是标准化，把个人能够完成的流程整理成其他同事也能复用的模板和验收标准。</div></div>\n\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你最大的个人贡献是什么？</div>\n<div class=\"a-label\">我认为最大的贡献是完成了从「个人使用AIGC工具」到「可被多人复用的AI产品方案」的转换。我不仅完成商户交付，还进一步提炼共性需求、统一输入标准、搭建提示词体系、定义质量指标，并将结果沉淀为团队可复用的流程。</div></div>\n<hr>\n<h3>📄 原文完整内容（第6-14页）</h3>\n<div class=\"kp-box kp-framework\" style=\"max-height:60vh;overflow-y:auto\">\n<pre style=\"white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.8;padding:8px;\">【原文第6页】\n我不是通过⼀次专⻔的⽤⼾访谈发现的，⽽是在持续服务商⼾的过程中反复看到同类问题。\n商⼾⼊驻后，我需要帮助他们⽣成⻔店头图、菜品图，沟通货盘和价格，还要安排达⼈推⼴\n并复盘交易数据。开始时我认为这些只是商务和运营⼯作，但做了多个商⼾后发现，很多任\n务⾼度重复，⽽且每个同事都在⽤⾃⼰的⽅法处理。\n例如，同样是⼀个双⼈套餐，⼤家都要重新查周边商⼾、整理价格和写卖点；同样是菜品\n图，商⼾也都会经历需求表达模糊、⽣成效果不满意和多轮修改的问题。\n所以我判断它不是某⼀家商⼾的个性化问题，⽽是可以被抽象和产品化的共性需求。\nQ\u0000：这个产品主要解决的是商⼾问题，还是内部效率问题？\n两者都有，但MVP阶段我会优先从内部效率切⼊。\n对商⼾来说，它解决的是缺乏线上经营能⼒的问题；对内部商务和运营来说，它解决的是需\n求沟通、市场分析和内容⽣产重复的问题。\n初期让内部⼈员使⽤更合理，因为内部运营熟悉平台规则和商⼾情况，能够对AI结果进⾏判\n断和审核。等流程和质量稳定后，再逐步开放商⼾⾃助能⼒。\nQ\u0000：为什么普通SOP不能解决？\nSOP能够统⼀步骤，但不能替代对⾮结构化内容的理解和⽣产。\n⽐如SOP可以规定“先收集商⼾资料，再分析竞品”，但⼈⼯仍然需要阅读⼤量评价、总结卖\n点和⽣成不同⽂案；也⽆法⾃动理解商⼾上传的参考图。\nAI的价值是把SOP中的部分认知和⽣产⼯作⾃动化，⽽SOP本⾝则负责约束AI的使⽤流程，\n两者不是替代关系。\nQ\u0000：为什么不⽤第三⽅设计公司或服务商？\n服务商可以解决问题，但成本、交付周期和⼀致性仍然⽐较依赖⼈员。同时，平台内部有⼤\n量商⼾，如果每⼀家都依赖定制服务，很难规模化。\nAI产品不是完全替代服务商，⽽是把⾼频、重复的基础⼯作标准化，让服务商和运营⼈员把\n更多精⼒放在⾼价值判断、商⼾沟通和活动策略上。\n\n【原文第7页】\nQ\u0000：为什么不能直接让商⼾使⽤现成的AI⼯具？\n通⽤AI⼯具解决的是“⽣成能⼒”，但没有解决“业务输⼊、品牌约束和结果验收”。\n商⼾不⼀定知道应该如何描述⽬标⽤⼾、消费场景和视觉规范；通⽤模型也不了解商⼾真实\n菜品、价格和品牌要求。⽣成完成后，还缺少事实校验、平台合规和效果复盘。\n我们的产品价值，是把模型能⼒嵌⼊⼀套业务流程，⽽不是再提供⼀个聊天框。\nQ\u0000：需求频率真的⾜够⾼吗？\n⾜够⾼。商⼾不仅在第⼀次⼊驻时需要做⻔店装修和套餐，上新、节⽇活动、⻔店扩张、达\n⼈推⼴和套餐效果下降时都会重新调整内容。\n特别是连锁商⼾，每开⼀家新店都要重复进⾏⻔店资料适配、套餐本地化和视觉内容⽣产，\n所以它不是⼀次性需求。\nQ\u0000：产品是否适合所有餐饮商⼾？\n并不完全适合。\n对已有成熟数字化团队、品牌规范和内容供应链的⼤型连锁品牌，产品更多是提⾼批量⽣产\n和本地化效率；对中⼩商⼾，产品价值主要是降低专业运营⻔槛。\n对于菜品极度定制、视觉真实性要求特别⾼，或者缺乏任何真实素材的商⼾，AI只能辅助，\n仍然需要专业拍摄和设计。\nQ\u0000：你怎么证明商⼾愿意使⽤？\n⼀⽅⾯，项⽬来⾃商⼾真实交付环节，商⼾已经在不断请求我们帮助制作⻔店图、套餐和营\n销内容；另⼀⽅⾯，试点中商⼾愿意提供菜单、原图和参考图，并参与⻛格确认和⽅案修\n改，说明需求本⾝存在。\n同时，单版⽣产时间和修改轮次明显下降，也说明这种流程不仅能⽣成内容，⽽且能够降低\n双⽅的沟通成本。\n\n【原文第8页】\n⼆、你的⻆⾊与职责：你做了什么\n1.回答思路\n这⼀部分必须主动解决⼀个潜在质疑：\n你的岗位是商务经理，为什么可以说⾃⼰做了AI产品？\n不要回避正式岗位，⽽要清晰地区分：\n·正式岗位：本地⽣活商务经理。\n·项⽬⻆⾊：业务需求发起⼈、AI产品⽅案负责⼈、商⼾试点负责⼈和产品运营推动者。\n建议采⽤四层结构回答：\n第⼀层，业务端⼯作。你负责商⼾拓展、洽谈、⼊驻、套餐规划、活动推进和数据复盘。\n第⼆层，产品端⼯作。你识别共性问题、开展需求调研、拆解业务流程、设计产品架构和\nMVP。\n第三层，AI专项⼯作。你负责Prompt结构、参考图规范、⻛格基准、质量评测和失败案例分\n析。\n第四层，项⽬推进⼯作。你推动商⼾试点、跨部⻔协作、内部培训和数据复盘。\n核⼼是让⾯试官听到⼤量明确的“我做了什么”，⽽不是“我们做了什么”。\n2.⾯试官考察⽅向\n2.1 项⽬真实性\n⾯试官会判断：\n\n【原文第9页】\n·项⽬是不是你主导的？\n·你是不是只负责商⼾沟通？\n·产品功能是谁设计的？\n·Prompt和测试是谁完成的？\n·是否真的有内部推⼴？\n2.2 个⼈贡献\n需要明确你亲⾃负责的产出物，包括：\n·商⼾需求整理\n·业务流程图\n·产品功能架构\n·MVP规划\n·结构化需求采集⽅案\n·Prompt模板\n·质量验收标准\n·商⼾试点\n·效果复盘\n·内部培训\n2.3 产品判断\n⾯试官会关注你做过哪些关键取舍，例如：\n·为什么先服务内部运营，⽽不是直接服务商⼾？\n·为什么先做内容⽣成，⽽不是完整经营平台？\n·为什么需要⼈⼯审核？\n·为什么选择模板和参考图，⽽不是训练模型？\n\n【原文第10页】\n2.4 推动⼒\n由于你没有直接管理产品、研发和算法团队，⾯试官会看你如何通过业务数据、案例和明确验\n收标准推动不同团队合作。\n2.5 诚实边界\n⾯试官会观察你是否把使⽤⼯具包装成研发平台。主动说清楚底层模型由现有⼯具和AI技术团\n队提供，⾃⼰负责产品⽅案和业务落地，可信度反⽽更⾼。\n3.注意事项\n3.1 不要说⾃⼰“负责整个产品所有⼯作”\n你可以说“我主导了产品⽅案和试点落地”，但不能说⾃⼰独⽴完成了模型开发、前后端系统和\n数据接⼝。\n3.2 少⽤“参与”，多⽤明确动作\n弱表达：\n我参与了需求分析和产品设计。\n强表达：\n我梳理了商⼾⼊驻到经营复盘的全流程，识别出五类⾼频问题，完成产品功能架构、MVP范\n围和质量指标设计。\n3.3 区分商务运营与产品⼯作\n商务运营负责拿到商⼾、理解经营⽬标和推动活动落地；产品⼯作负责将多个商⼾的共性问题\n抽象为流程、功能、规则和指标。\n\n【原文第11页】\n3.4 重点讲关键决策\n讲任务不如讲决策。建议突出三项决策：\n\u0000.MVP先服务内部运营⼈员。\n\u0000.AI、规则和⼈⼯协同，⽽⾮全⾃动。\n3.先通过模板和Prompt验证，再考虑模型定制。\n3.5 不要把团队内部“约50⼈使⽤”说成50个稳定活跃⽤⼾\n更稳妥的说法是：\n⽅案开始在约50⼈的市场团队中进⾏内部普及、培训和使⽤推⼴。\n⼯作梳理明确记录了⽅案在市场团队内部开始普及，并由约50名同事使⽤。\n4.⻆⾊与职责逐字稿\n我的正式岗位是商务经理，⽇常⼯作包括商⼾拓展、合作洽谈、平台⼊驻、套餐规划、活动\n推进和经营数据复盘。\n但是在这个项⽬中，我承担的不只是商务执⾏，⽽是业务需求发起⼈、AI产品⽅案负责⼈和\n试点推动者三个⻆⾊。\n第⼀，我是需求的发现者。我通过持续拜访和运营商⼾，梳理了商⼾从⼊驻、⻔店装修、套\n餐上架到推⼴和复盘的完整流程，识别出需求沟通、竞品调研、套餐设计、内容⽣产和质量\n验收⼏个⾼频低效环节。\n第⼆，我负责把业务问题转化为产品⽅案。我拆解了商⼾项⽬管理、AI需求诊断、竞品分\n析、套餐策略、⽂案与视觉⽣成、内容审核和数据复盘等核⼼模块，设计了⽤⼾流程和MVP\n范围。\n我的⼀个关键判断是，MVP阶段不直接让商⼾完全⾃助，⽽是优先服务内部商务和运营⼈\n员。因为内部⼈员熟悉商⼾信息和平台规则，既可以降低商⼾使⽤⻔槛，⼜能够对早期AI结\n果进⾏⼈⼯审核。\n\n【原文第12页】\n第三，我重点负责AI内容⽣产⽅案和质量体系。我设计了结构化需求采集⽅式，把商⼾的模\n糊诉求拆成品牌、⽬标⽤⼾、使⽤场景、视觉⻛格和真实性约束；同时整理了分层提⽰词、\n参考图使⽤规范、⻛格基准和质量验收标准。\n在具体问题解决上，菜品⽣成初期存在⻝材失真和⻛格漂移，我把失败案例分成真实性、视\n觉效果和品牌⼀致性⼏类，先后测试了5类⽅案，最终形成三层提⽰词和3版样⽚确认机制。\n第四，我负责试点和产品运营。我选取真实餐饮商⼾进⾏测试，参与商⼾需求沟通、资料整\n理、内容⽣成、质量审核和经营数据复盘，并将验证有效的⽅法沉淀成SOP和模板。\n在跨部⻔协作上，我会把商⼾问题整理成结构化需求，对接AI技术⽀持团队验证图⽚和模型\n效果，也会和产品、内容运营、商业化及技术团队沟通套餐上架、活动资源、直播和核销系\n统问题。\n所以我在这个项⽬中的核⼼贡献，不是单纯使⽤AI⼯具⽣成内容，⽽是从业务中定义问题，\n把解决⽅案抽象为产品流程，再推动它完成真实商⼾验证和内部复⽤。\n5.⻆⾊与职责问题QA\nQ\u0000：你是商务经理，为什么要转AI产品？\n我的商务经历让我⻓期处在⽤⼾和业务⼀线，能够看到商⼾真正愿意为什么付费、哪些⼯作\n只是表⾯需求、哪些问题可以规模化。\n在这个项⽬中，我进⼀步承担了需求抽象、产品流程、AI⽅案、评测指标和试点运营等⼯\n作。我发现⾃⼰的优势不是只完成⼀单商务合作，⽽是能够将多个客⼾的共性问题沉淀成⼀\n套可复制的产品⽅案。\n所以转AI产品不是完全跨⾏业，⽽是从单客⼾交付⾛向产品化和规模化解决问题。\nQ\u0000：这个产品是你提出的吗？\n项⽬机会最初是我在商⼾运营过程中提出的。\n我前期先完整熟悉了商⼾⼊驻、⻔店装修、货盘设计、达⼈推⼴和数据复盘流程，在能够区\n分个性问题和共性问题后，才开始验证AIGC⽅案。\n后续我整理了产品逻辑、测试⽅案和商⼾案例，再向Leader和相关团队同步并推动内部使\n⽤。\n\n【原文第13页】\nQ\u0000：你具体交付了哪些产品⽂档？\n我主要完成了业务流程梳理、⽤⼾⻆⾊和痛点分析、产品功能架构、核⼼使⽤流程、MVP范\n围、功能需求说明、Prompt模板、视觉⽣成规则、内容质量标准和效果指标。\n如果进⼀步系统开发，这些内容可以继续拆成详细PRD、原型和技术接⼝需求。\nQ\u0000：技术团队做了什么，你做了什么？\nAI技术⽀持团队主要帮助验证现有模型和⼯具的能⼒边界，例如图⽚⽣成质量、参考图理解\n效果和市场信息分析能⼒。\n我负责定义业务问题、输⼊信息、产品流程、模型需要输出什么、什么结果算合格，并通过\n真实商⼾案例进⾏测试和验收。\n换句话说，技术团队解决“模型能不能实现”，我负责解决“业务为什么需要、产品应该怎么\n⽤、结果怎么判断”。\nQ\u0000：你最关键的产品决策是什么？\n最关键的决策是先做内部运营⼈员使⽤的MVP，⽽不是直接做商⼾⾃助平台。\n早期AI结果仍然存在菜品失真、⻛格不稳定和事实错误⻛险。如果直接给商⼾使⽤，商⼾需\n要⾃⼰理解提⽰词，也缺少判断模型结果的能⼒。\n通过运营⼈员先使⽤，可以快速验证效果，也能够保留⼈⼯审核，降低业务⻛险。\nQ\u0000：你有没有做⽤⼾调研？\n有，但调研不是⼀次正式问卷，⽽是结合商⼾拜访、需求沟通、⽅案确认、修改意⻅和上线\n复盘持续进⾏。\n我主要调研了三类对象：中⼩单店、连锁商⼾和内部商务运营⼈员。\n中⼩商⼾更关注成本和快速上线，连锁商⼾更关注品牌⼀致和批量处理，内部运营更关注输\n⼊是否简单、⽣成是否稳定以及能否减少修改。\n\n【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。\n\n</pre>\n</div>\n<p style=\"font-size:12px;color:var(--sub);margin-top:4px\">以上为原文PDF第6-14页的完整内容，包含角色与职责的完整逐字稿、考察方向和全部QA。</p>\n","p3":"<div class=\"freq-summary\"><span style=\"display:inline-block;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px\">🔴 两篇重合</span><strong>面试频率分析：</strong>核心功能部分面试官通常不会让你逐一介绍所有功能，而是会<strong>追问你最难的挑战和关键决策</strong>。<br>\n<span class=\"freq-badge freq-3\">高频</span> 菜品真实性挑战 · 三层Prompt设计 · 3版样片机制 · 为什么不让大模型定价<br>\n<span class=\"freq-badge freq-2\">中频</span> 竞品数据来源 · 审核模块设计 · 套餐三档设计<br>\n<span class=\"freq-badge freq-1\">一般</span> 各功能具体交互细节</div>\n\n<h2>三、产品核心功能与实现 <span class=\"freq-badge freq-3\">关键决策集中区</span></h2>\n\n<h3>3.1 需求诊断 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>设计方式：</strong>结构化表单 + 上传菜单/菜品图/品牌Logo/参考图 → 多模态识别 → 大模型拆解需求 → <span class=\"kp-highlight\">人工确认事实字段</span> → 形成统一需求基线</p>\n<p><strong>为什么不直接让商户写Prompt：</strong>商户不熟悉平台用户、套餐设计、视觉规则和内容规范，只能表达表层需求。产品要帮商户把模糊需求翻译成可执行参数。</p>\n\n<h3>3.2 竞品分析 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>四维分析：</strong>价格带 / 套餐结构 / 用户评价 / 内容表达 → 输出<strong>可执行的市场建议</strong>，不是只给竞品名单</p>\n<p><strong>数据来源：</strong>MVP阶段通过运营人员公开平台收集、商户提供资料、表格或截图导入、内部授权数据。<span class=\"kp-warning\">没有使用未经授权的自动爬取。</span></p>\n\n<h3>3.3 套餐设计 <span class=\"section-tag tag-silu\">设计思路</span></h3>\n<p><strong>三档套餐：</strong><span class=\"kp-highlight\">引流款</span>（新客转化）→ <span class=\"kp-highlight\">主推款</span>（主流场景）→ <span class=\"kp-highlight\">利润款</span>（高客单）</p>\n<div class=\"kp-box kp-warning\"><strong>定价原则（必背）：</strong>价格不交给大模型！菜品原价、成本、折扣通过结构化规则测算。大模型负责套餐定位和卖点表达。无成本数据时只给市场参考区间，不做利润承诺。</div>\n\n<h3>3.4 文案与视觉——最关键的挑战 <span class=\"freq-badge freq-3\">面试必问</span></h3>\n<p><strong>最大挑战：菜品真实性。</strong>初期图片好看但<span class=\"kp-highlight\">食材变化、分量失真、摆盘错误、风格漂移</span>。</p>\n\n<div class=\"kp-box kp-framework\">\n<strong>解决方案：三层Prompt（核心框架，必须背熟）</strong>\n<ol>\n<li><strong>第一层（业务场景层）：</strong>菜品类型、目标用户、使用场景</li>\n<li><strong>第二层（视觉风格层）：</strong>色调、构图、光线、餐具</li>\n<li><strong>第三层（真实性约束层）：</strong>核心食材、分量、烹饪状态、禁止元素</li>\n</ol>\n<strong>设计原理：</strong>改风格不会改食材，改食材不会改风格——三层各司其职。\n</div>\n\n<div class=\"kp-box kp-data\">\n<strong>3版风格样片确认机制：</strong>批量生成前先输出3版样片，商户确认一版作为风格基准，后续素材统一继承。<br>\n<strong>为什么是3版？</strong>1版太少选择不够，5版太多选择困难，3版恰好展示风格差异。<br>\n<strong>核心效果：</strong>修改轮次从5轮降到2-3轮，沟通成本大幅降低。\n</div>\n\n<h3>3.5 审核模块</h3>\n<p>三级审核：<span style=\"color:var(--green)\">通过</span> → <span style=\"color:var(--amber)\">建议修改</span> → <span style=\"color:var(--red)\">禁止上线</span></p>\n<p>图片审核重点：菜品是否与真实素材一致、是否新增不存在的食材、分量是否明显夸大</p>\n<p>文案审核重点：商户名称、价格、活动时间是否准确，识别虚假销量、绝对化宣传、敏感词</p>\n<p><span class=\"kp-highlight\">核心原则：审核通过只代表达到进入商户确认的条件，不代表可以自动上线。</span></p>\n\n<h3>3.6 数据复盘</h3>\n<p>复盘数据包括：曝光、点击、下单、核销、退款、达人数量、直播场次、投流金额。<span class=\"kp-warning\">只有将内容版本和其他营销变量同时记录，系统才能避免将所有转化变化都错误归因于AI内容。</span></p>\n<hr>\n<h3>📄 原文完整内容（第14-32页）</h3>\n<div class=\"kp-box kp-framework\" style=\"max-height:60vh;overflow-y:auto\">\n<pre style=\"white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.8;padding:8px;\">【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。\n\n【原文第15页】\n三、产品核⼼功能与实现：具体怎么做\n1.回答思路\n核⼼功能不能按照技术能⼒罗列，⽽要按照⽤⼾完成任务的顺序讲述：\n建⽴商⼾项⽬\n→ 收集资料和诊断需求\n→ 分析商圈与竞品\n→ 设计套餐及价格\n→ ⽣成⽂案与视觉内容\n→ 完成质量审核\n→ 商⼾确认并上线\n→ 根据经营数据继续优化\n产品的核⼼不是某⼀个功能，⽽是将原来互相割裂的市场分析、套餐策略和内容⽣产连接起\n来。\n建议将功能分成五个核⼼模块深讲：\n1.商⼾需求智能诊断\n2.商圈竞品分析\n3.套餐策略与定价建议\n\u0000.AI⽂案与视觉⽣成\n5.内容质量审核与经营复盘\n2.⾯试官考察⽅向\n⾯试官会重点判断：\n·功能是否围绕⽤⼾任务设计。\n·AI到底在哪些环节发挥作⽤。\n\n【原文第16页】\n·是否清楚模型、规则和⼈⼯的边界。\n·是否考虑模型幻觉、图⽚失真和事实错误。\n·功能之间是否有数据衔接。\n·有没有版本管理和反馈闭环。\n·MVP是否合理。\n·是否具备基础技术理解。\n3.注意事项\n3.1 不要堆砌AI术语\n项⽬中不需要强⾏加⼊知识图谱、复杂Agent或模型微调。能够解释清楚⼤模型、多模态、图\n像⽣成、规则和⼈⼯审核已经⾜够。\n3.2 不要说“系统⾃动抓取所有竞品”\n试点阶段更真实的⽅式是⼈⼯收集、表格整理、截图识别和内部授权数据。\n3.3 不要说“系统⾃动给商⼾定价”\nAI提供建议，规则负责基础测算，商⼾和运营负责确认。\n3.4 不要把内容审核说成完全⾃动化\n试点阶段主要是模型辅助与⼈⼯验收，⾃动质检是产品化⽅向。\n3.1 核⼼功能⼀：商⼾需求智能诊断\n回答思路\n\n【原文第17页】\n这个功能要解决的根本问题不是“商⼾不会写Prompt”，⽽是商⼾本⾝很难将经营⽬标表达为\n可执⾏的内容标准。\n讲述结构：\n原始需求模糊\n→ 设计结构化采集\n→ AI解析菜单、图⽚和⾃然语⾔\n→ 对缺失信息定向追问\n→ 运营确认事实字段\n→ 形成统⼀需求基线\n⾯试官考察⽅向\n·如何理解⽤⼾需求。\n·如何处理⾮结构化信息。\n·如何避免模型误读和编造。\n·如何降低⽤⼾填写成本。\n·后续不同功能如何共⽤需求信息。\n注意事项\n·AI提取只能作为候选结果。\n·商⼾名称、菜品、价格、地址、营业时间等必须⼈⼯确认。\n·AI追问不能变成⽆⽌境聊天。\n·需求结构不能过度复杂，否则⽤⼾不愿填写。\n逐字稿内容\n\n【原文第18页】\n第⼀个核⼼功能是商⼾需求智能诊断。\n我在实际沟通中发现，商⼾的需求通常停留在结果层，⽐如“图⽚要⾼端”“套餐要更有吸引\n⼒”，但模型真正需要的是⽬标⽤⼾、消费场景、品牌调性、主⾊、构图、菜品真实性和图⽚\n⽤途等具体信息。\n所以产品没有让⽤⼾直接写Prompt，⽽是设计了⼀套结构化需求采集⽅式。\n⾸先录⼊商⼾基础经营信息，包括商⼾类型、菜系、⻔店地址、客单价、核⼼菜品和当前套\n餐；其次选择⽬标⽤⼾、主要消费场景和营销⽬标；最后上传菜单、菜品原图、品牌Logo、\n历史素材和参考图。\n多模态模型可以帮助识别菜单中的菜品、菜品图⽚中的主要⻝材，以及参考图中的⾊调、构\n图、光线和背景。⼤语⾔模型则负责理解商⼾的⾃然语⾔描述，把模糊需求拆成结构化参\n数。\n当信息不⾜时，系统不是直接⽣成，⽽是根据任务进⾏定向追问。例如商⼾要设计双⼈套\n餐，但没有填写⽬标价格和必选菜品，系统优先追问这两个信息；如果要⽣成菜品图，就优\n先确认真实⻝材、图⽚⽤途和品牌⻛格。\n所有AI提取结果都要由运营⼈员确认，尤其是菜品、价格和营业时间等事实字段，不能让模\n型⾃⾏补全。\n最终确认后的信息会形成项⽬需求基线。后续竞品分析、套餐、⽂案和视觉内容都引⽤同⼀\n套数据，避免不同模块对商⼾理解不⼀致。\n问题QA\nQ\u0000：为什么需要AI诊断，⽽不是做⼀个普通表单？\n普通表单适合收集明确字段，但商⼾还会上传菜单、图⽚和⼤量⾃然语⾔描述，这些信息⽆\n法完全依靠固定选项处理。\nAI负责从⾮结构化信息中提取候选内容、发现⽭盾并⽣成追问，表单负责固定事实和规则，\n两者结合效果更好。\nQ\u0000：需求字段很多，⽤⼾会不会觉得填写⿇烦？\n会，所以产品不能⼀次把所有字段全部展⽰。\n我会根据⽤⼾选择的任务动态展⽰必要字段。只⽣成⻔店头图时，不需要填写完整成本和套\n\n【原文第19页】\n餐利润；要⽣成套餐策略时，再要求补充菜品、价格和成本。\nAI也可以从菜单和历史资料中预填内容，让⽤⼾以确认为主，⽽不是从零录⼊。\nQ\u0000：AI追问如何控制轮数？\n每轮最多展⽰3到5个对结果影响最⼤的缺失问题，并按照任务依赖排序。\n⽤⼾可以暂时跳过，但系统需要说明可能造成的影响，⽐如“未提供真实菜品图，⽣成结果\n仅能⽤于⻛格参考”。\nQ\u0000：如何处理商⼾资料互相冲突？\n系统需要将冲突字段和来源同时展⽰。\n例如菜单显⽰套餐价格是128元，但历史海报写的是138元，系统不能⾃⾏判断，⽽是提⽰⽤\n⼾确认当前有效价格。\n⽤⼾确认后，其他旧数据被标记为历史版本。\nQ\u0000：需求基线修改后怎么办？\n修改关键字段时，系统需要识别受影响内容。\n⽐如套餐价格修改，会影响套餐⽂案、封⾯和活动海报；品牌主⾊修改，会影响视觉素材。\n系统提⽰⽤⼾是否重新⽣成或重新审核，不能让旧内容继续直接使⽤。\n3.2 核⼼功能⼆：商圈与竞品分析\n回答思路\n需要说明AI不是凭空给建议，⽽是基于竞品资料、价格、套餐和评价进⾏分析。\n推荐逻辑：\n\n【原文第20页】\n数据导⼊\n→ 数据清洗和竞品分类\n→ 价格、套餐、评价和视觉分析\n→ 找到市场空档\n→ 给出可解释建议\n⾯试官考察⽅向\n·数据来源是否合法和可信。\n·数据不完整时如何处理。\n·分析结果能否追溯。\n·AI总结和真实经营判断如何区分。\n·是否避免直接抄袭竞品内容。\n注意事项\n·不要夸⼤外部数据获取能⼒。\n·不同平台和时间⼝径不能直接混⽤。\n·样本不⾜时只能给趋势判断。\n·分析结果需要展⽰依据。\n逐字稿内容\n第⼆个模块是商圈与竞品分析。\n原来的做法是运营⼈员在不同平台搜索周边商⼾，⼿⼯整理商⼾距离、客单价、套餐内容、\n价格、销量和⽤⼾评价。整个过程不仅慢，⽽且不同⼈员整理的⼝径不⼀致。\n产品中，我设计了竞品数据导⼊和结构化分析流程。MVP阶段⽀持运营⼈员通过表格、截图\n或内部授权数据导⼊竞品信息，⽽不是默认使⽤未经授权的⾃动爬取。\n数据进⼊系统后，先进⾏商⼾去重、套餐拆分、价格异常识别和数据时间检查。随后根据距\n离、品类、客单价、⽤⼾群体和消费场景，将竞品划分为直接竞品和间接竞品。\n\n【原文第21页】\nAI主要分析四个⽅⾯。\n第⼀是价格带，判断商圈主流客单价和不同套餐的价格分布。\n第⼆是套餐结构，例如热销套餐通常适合⼏⼈、包含哪些菜品、折扣如何设计。\n第三是⽤⼾评价，将⼤量评价归类为⼝味、分量、服务、环境、价格和核销体验，从中找到\n⽤⼾关注点和未满⾜需求。\n第四是内容表达，例如竞品主图主要突出菜品、环境还是价格，常⽤什么视觉⻛格和卖点。\n最终系统不是只给⼀份总结，⽽是输出可执⾏的市场机会，⽐如某⼀价格带竞争相对较少、\n⽤⼾对双⼈聚餐需求较⾼，或者竞品普遍忽视某个招牌菜卖点。\n每⼀条重要建议都需要展⽰依据，⽤⼾可以看到参考了哪些竞品、什么价格数据和多少条评\n价。这样运营⼈员才能判断是否采⽤，⽽不是盲⽬相信模型。\n问题QA\nQ\u0000：竞品数据准确性如何保证？\n每条竞品数据需要记录来源、采集时间和是否⼈⼯确认。\n系统会识别明显异常值，例如团购价⾼于原价或⽉销量异常，但最终仍需要运营⼈员确认。\n时效过旧或来源不明确的数据不能作为核⼼定价依据。\nQ\u0000：为什么不⽤实时爬⾍？\nMVP阶段的重点是验证分析价值，⽽不是先投⼊⼤量资源建设数据采集系统。\n外部平台数据还涉及授权、反爬和⼝径问题，所以前期采⽤⼈⼯和授权数据导⼊更稳妥。等\n分析能⼒被证明有效后，再评估合规数据接⼝。\nQ\u0000：⽤⼾评价如何分析？\n⼤模型先对评论进⾏主题分类和情感归纳，例如识别⼝味、分量、环境、服务和核销限制。\n但系统需要保留代表性原始评价和样本数量，避免只显⽰模型总结，让运营能够查看依据。\n\n【原文第22页】\nQ\u0000：如何避免直接复制竞品内容？\n产品只提取市场规律和⻛格特征，不直接复⽤竞品⽂案、图⽚或品牌元素。\n⽣成环节仍然基于⽬标商⼾⾃⼰的菜品、品牌和卖点。\nQ\u0000：竞品数量多少⽐较合适？\n不需要越多越好。\n核⼼是相关性。可以优先选择同商圈、同品类和相近客单价的直接竞品，再补充少量争夺相\n同消费场景的间接竞品。\n样本太少时需要提⽰结论可信度不⾜，样本太多则容易引⼊⼤量⽆关信息。\n3.3 核⼼功能三：套餐设计与定价建议\n回答思路\n套餐模块要体现“AI建议+业务规则+⼈⼯决策”。\n讲述结构：\n建⽴真实菜品池\n→ 选择⽬标⽤⼾和消费场景\n→ ⽣成三档套餐\n→ 规则计算价格与⻛险\n→ AI解释卖点\n→ 商⼾确认\n⾯试官考察⽅向\n·推荐是否建⽴在真实菜品和成本基础上。\n·定价是否可解释。\n\n【原文第23页】\n·是否考虑⽑利和⻛险。\n·AI是否越权做经营决策。\n·套餐内容与⽂案、图⽚是否联动。\n注意事项\n·AI不能凭空增加菜品。\n·没有成本数据，不能承诺利润。\n·19%的转化提升是综合⽅案结果。\n·套餐确认后需要锁定版本。\n逐字稿内容\n第三个模块是套餐设计与定价建议。\n很多商⼾会直接把线下菜单组合成团购套餐，但没有清晰区分套餐的经营⽬标。有的套餐价\n格低，但没有限制购买条件，会影响利润；有的套餐菜品很多，但⽤⼾看不出核⼼价值；还\n有的套餐和周边竞品⾼度相似。\n我先设计了商⼾菜品池，要求所有套餐菜品必须来⾃真实菜单。每个菜品记录名称、类别、\n原价、成本、适⽤⼈数、是否招牌菜、是否允许加⼊团购和供应限制。\n⽤⼾发起套餐⽣成时，需要选择⽬标⽤⼾、消费场景、适⽤⼈数、价格范围、⽬标⽑利和必\n选菜品。\n产品默认⽣成三类套餐。引流款⽤于降低新客决策⻔槛，主推款承担主要成交，利润款⽤于\n提⾼客单价和商⼾收益。\n每个套餐都会展⽰菜品组合、适⽤⼈数、原价合计、建议团购价、折扣率、核⼼卖点、竞品\n差异和⻛险提⽰。\n其中价格计算不完全由⼤模型完成。菜品原价、成本、⽑利和折扣通过结构化数据和规则计\n算；⼤模型主要负责理解商圈数据、解释套餐定位和⽣成卖点。\n如果商⼾没有提供成本数据，产品只能给出基于竞品的市场参考价，不能声称能够保证利\n润。\n商⼾确认套餐后，这个版本会成为⽂案和图⽚⽣成的统⼀事实来源。如果后续价格或菜品改\n变，相关⽂案和素材必须重新审核。\n\n【原文第24页】\n问题QA\nQ\u0000：为什么设计引流款、主推款和利润款？\n因为不同套餐承担的业务⽬标不同。\n如果所有套餐都只追求低价，可能带来销量但损害利润；如果都追求⾼客单价，⼜会增加新\n客决策⻔槛。\n通过三层设计，可以同时覆盖获客、成交和收益三个⽬标。\nQ\u0000：AI如何知道哪些菜品适合组合？\n第⼀层依据真实菜品属性和业务规则，例如菜品类别、适⽤⼈数、原价、成本和搭配限制。\n第⼆层结合商圈热销套餐和⽤⼾场景。\n第三层由AI⽣成组合说明和卖点。\n最终仍然需要商⼾确认供应和实际制作能⼒。\nQ\u0000：如何测算价格？\n可以先计算菜品原价合计和成本下限，再参考商⼾⽬标⽑利及商圈同类套餐价格。\n系统输出建议区间和主要依据，⽽不是只给⼀个数字。\n如果建议价和商⼾⽑利⽬标冲突，产品应提⽰经营⻛险，让商⼾决定是调整菜品还是价格。\nQ\u0000：套餐建议错了怎么办？\n⽤⼾可以替换、删除或锁定菜品，系统实时重新计算价格和⻛险。\n套餐属于经营决策，产品不会⾃动发布，必须经过运营和商⼾确认。\nQ\u0000：转化率提升19%如何归因？\n\n【原文第25页】\n这是套餐结构、价格和视觉内容同步优化后的综合结果，不能全部归因于套餐算法或AI图\n⽚。\n后续更严谨的做法是绑定套餐、⽂案和图⽚版本，通过A/B测试分开验证不同因素。\n3.4 核⼼功能四：AI ⽂案与视觉内容⽣成\n回答思路\n重点说明不是通⽤⽣成，⽽是在事实、品牌和平台规则约束下⽣成可直接交付的内容。\n讲述逻辑：\n引⽤商⼾需求和套餐数据\n→ 区分事实字段与创作字段\n→ ⽣成多个策略版本\n→ 通过品牌模板保持统⼀\n→ ⽀持局部修改和批量⽣成\n⾯试官考察⽅向\n·产品与通⽤AIGC⼯具的差异。\n·多模态具体有什么作⽤。\n·如何避免错误⽂字和品牌问题。\n·如何⽀持单店和连锁商⼾。\n·是否具备可编辑能⼒。\n注意事项\n·不要声称图像模型能够稳定⽣成Logo和价格⽂字。\n\n【原文第26页】\n·外部参考图只能提取⻛格，不宜直接模仿原创内容。\n·图⽚⽣成必须建⽴在真实菜品素材上。\n·多版本需要有策略差异，不是简单换词。\n逐字稿内容\n第四个模块是AI⽂案和视觉内容⽣产。\n⽂案部分⽀持套餐标题、套餐卖点、⻔店介绍、活动海报⽂案、达⼈探店脚本和直播卖点。\n产品中我将内容分为事实字段和创作字段。商⼾名称、菜品、套餐价格、活动时间和⻔店地\n址属于事实字段，只能从确认后的商⼾和套餐数据中引⽤；卖点包装、表达结构和语⽓属于\n创作字段，由⼤模型⽣成。\n每次默认⽣成多个策略不同的版本。⽐如⼀个版本突出性价⽐，⼀个版本突出招牌菜，⼀个\n版本突出朋友聚餐场景。这样⽤⼾选择的是不同营销⽅向，⽽不是⼏个同义词版本。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。系统通过多模态能⼒理解真实菜品\n图和参考图，提取⻝材、摆盘、⾊调、构图、光线和背景等信息，再转化为⽣成参数。\n对单店商⼾，重点是根据商⼾偏好形成专属⻛格；对连锁商⼾，则通过品牌模板固定Logo、\n标准⾊、字体、语⽓和强制元素，只替换⻔店、商圈和套餐等本地化信息。\n图⽚中的价格、套餐名称和Logo不直接依赖图像模型⽣成，⽽是通过可编辑的排版组件添\n加，避免出现乱码和事实错误。\n⽤⼾可以对结果进⾏局部修改，例如替换背景、提⾼亮度、调整构图或重新⽣成某个区域，\n⽽不是每次都从头⽣成。\n问题QA\nQ\u0000：这个功能和即梦、Midjourney有什么区别？\n底层可能会调⽤类似的⽣成能⼒，但产品层的价值不同。\n通⽤⼯具不知道商⼾真实菜品、套餐和品牌规范，也没有商⼾需求诊断、版本管理、质量审\n核和经营数据回流。\n我们提供的是⼀套⾯向餐饮业务的⼯作流，⽽不是单个⽣成⼊⼝。\n\n【原文第27页】\nQ\u0000：多模态具体⽤在哪⾥？\n第⼀，解析菜单、菜品图和参考图。\n第⼆，将图⽚中的⾊调、构图、光线和摆盘转化为⽣成参数。\n第三，⽐较⽣成图与真实菜品图，辅助检查⻝材和⻛格⼀致性。\nQ\u0000：如何⽀持连锁商⼾？\n总部先配置统⼀品牌模板，包括Logo、主⾊、字体、品牌语⽓和禁⽌元素。\n不同⻔店继承统⼀模板，只替换地址、商圈、套餐和区域活动内容。\n这样既能统⼀品牌，也能完成本地化批量⽣产。\nQ\u0000：商⼾提供竞品图让你模仿怎么办？\n产品可以提取通⽤⻛格特征，例如暖⾊调、俯拍构图和中式器⽫，但不能直接复制竞品的品\n牌、⽂字和具有独创性的设计。\n最终内容必须使⽤商⼾⾃⾝菜品和品牌资产。\nQ\u0000：为什么不⽤模型直接⽣成海报⽂字？\n图像模型⽣成⽂字的稳定性和准确性不⾜，尤其是价格、套餐名称等强事实信息不能出现错\n误。\n所以更合理的产品⽅案是由图像模型⽣成背景和主体，再通过可编辑图层添加⽂字、Logo和\n价格。\n3.5 核⼼功能五：Prompt 与质量评测体系\n回答思路\n这⼀部分⼀定要⽤具体问题讲，不要停留在“我优化了Prompt”。\n\n【原文第28页】\n推荐结构：\n初期问题\n→ 建⽴问题分类\n→ 测试5类⽅案\n→ 三层Prompt\n→ ⻛格基准\n→ 质量标准\n→ 数据结果\n⾯试官考察⽅向\n·是否真正做过测试。\n·是否具备问题归因能⼒。\n·指标如何定义。\n·如何将经验模板化。\n·如何处理AI输出不稳定。\n注意事项\n·40%到85%是试点⼈⼯验收数据。\n·不能只⽤“好不好看”评价。\n·Prompt不能解决所有问题，原始素材和审核流程也很重要。\n·“三层提⽰词”需要具体解释每⼀层。\n逐字稿内容\n项⽬中最难的不是模型⽣成不出图⽚，⽽是有些结果视觉上很好看，但和商⼾真实菜品不⼀\n致。\n初期主要出现四类问题：第⼀是核⼼⻝材发⽣变化；第⼆是菜品分量和摆盘明显失真；第三\n\n【原文第29页】\n是不同批次⻛格不⼀致；第四是商⼾只能在⽣成后说“不喜欢”，导致修改轮次很多。\n我没有继续单纯增加形容词，⽽是先将失败问题分类，再测试不同解决⽅式。测试内容包括\n补充菜品事实、增加参考图、加⼊负向约束、拆分提⽰词层级和建⽴商⼾⻛格基准，共测试\n了5类优化⽅向。\n最终我们使⽤三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和平台尺⼨，解决“要⽣成什\n么”的问题。\n第⼆层是视觉⻛格，包括⾊调、光线、构图、背景、餐具和摆盘，解决“应该怎么呈现”的\n问题。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌出现的元素和常⻅变形，解\n决“哪些错误不能发⽣”的问题。\n同时，在批量⽣产之前先输出3版⻛格样⽚，让商⼾确认⼀套作为单店⻛格基准。后续内容都\n沿⽤这个基准，降低⻛格漂移。\n在评测上，我们不只看图⽚是否美观，⽽是看菜品主体、核⼼⻝材、分量、烹饪状态、品牌\n⻛格和是否可以上线。\n通过这套优化，菜品还原合格率从40%提升到85%，平均修改轮次从5轮下降到2到3轮，单\n版素材平均⽣产时间从30分钟缩短到10分钟。\n问题QA\nQ\u0000：菜品还原合格率具体怎么计算？\n试点阶段采⽤⼈⼯验收。\n每张图按照菜品主体正确、核⼼⻝材没有明显新增或缺失、分量没有严重失真、烹饪状态基\n本⼀致、整体可以⽤于商⼾⻚⾯⼏个条件进⾏判断。\n合格图⽚数量除以全部⽣成并参与验收的图⽚数量，就是菜品还原合格率。\n后续产品化后，我会把这些维度拆成独⽴评分，并建⽴固定测试集。\nQ\u0000：为什么三层Prompt有效？\n因为不同问题被拆到了不同层。\n如果⻝材错误，只需要调整真实性约束；如果品牌感觉不对，则调整视觉层；如果图⽚⽤途\n\n【原文第30页】\n改变，则调整业务场景层。\n这种⽅式⽐⼀条很⻓、没有结构的Prompt更⽅便复⽤和定位问题。\nQ\u0000：Prompt越⻓是不是效果越好？\n不⼀定。\nPrompt过⻓可能出现约束冲突或模型忽略重点。关键是明确字段优先级和强约束。\n对于真实菜品和禁⽌内容，需要明确且靠前；对于装饰细节可以作为可选项。\nQ\u0000：如何处理不同模型的效果差异？\n需要建⽴相同测试集，在相同输⼊和验收标准下对⽐模型。\n不只⽐较视觉效果，还要⽐较菜品还原、⻛格稳定、⽣成速度和成本，再根据任务选择模\n型，⽽不是固定只⽤⼀个⼯具。\nQ\u0000：为什么还需要⼈⼯审核？\n餐饮视觉错误往往很隐蔽，⼀张图看起来合理，但可能增加了真实菜品没有的⻝材。\n早期模型⽆法完全稳定识别所有问题，所以必须由运营和商⼾进⾏最终确认。\nAI质检的作⽤是降低⼈⼯检查量，⽽不是完全取消⼈⼯责任。\n3.6 核⼼功能六：产品运营、商⼾确认与数据复盘\n回答思路\n产品不能停在“功能设计和内容⽣成”，还要体现：\n·如何让内部同事使⽤。\n·如何收集反馈。\n·如何判断产品是否成功。\n\n【原文第31页】\n·如何从经营数据反向优化产品。\n⾯试官考察⽅向\n·是否具备产品运营思维。\n·是否关注采⽤率和留存。\n·是否具备数据闭环。\n·是否理解业务结果归因。\n·是否可以推动规模化使⽤。\n注意事项\n·50⼈是内部推⼴或使⽤范围，不宜包装成稳定MAU。\n·转化变化受到套餐、流量和活动资源影响。\n·⽣成数量不是北极星指标。\n·内部推⼴要讲阻⼒和解决⽅法。\n逐字稿内容\n内容⽣成以后，我没有把项⽬视为结束，还进⼀步设计了商⼾确认和数据复盘流程。\n在商⼾确认环节，运营⼈员先审核套餐、⽂案和图⽚，再将候选⽅案发送给商⼾。商⼾可以\n选择版本，也可以对具体图⽚或⽂案提出意⻅。\n对商⼾的⾃然语⾔反馈，AI可以辅助拆成结构化修改任务。例如商⼾说“图⽚太暗，⽜⾁看\n起来不真实”，系统可以拆成提⾼亮度、调整⾊温和强化⽜⾁纹理三个修改项，运营确认后再\n重新⽣成。\n在产品运营上，我将需求采集表、⻛格标签、参考图、提⽰词模板、套餐分析和验收标准沉\n淀成SOP，并通过案例演⽰和使⽤培训推动市场团队使⽤。⼯作记录中，⽅案后续在约50⼈\n的市场团队范围内进⾏了内部普及和使⽤。\n我不会只看⽣成了多少内容，⽽是将指标分成使⽤、效率、质量和业务四类。\n使⽤指标包括项⽬创建量和AI⽅案采⽤率；效率指标包括⽣成时间和修改轮次；质量指标包\n\n【原文第32页】\n括菜品还原率和⾸轮通过率；业务指标包括素材点击、套餐下单和核销。\n内容上线后，根据曝光、点击、下单和核销数据判断问题。如果曝光⾼但点击低，可能是主\n图或卖点问题；如果点击⾼但下单低，更可能是价格、套餐组合或使⽤限制问题。\n数据复盘的结论可以直接触发下⼀轮套餐、⽂案或视觉优化，形成持续迭代闭环。\n问题QA\nQ\u0000：如何推动内部同事使⽤？\n最⼤阻⼒通常不是功能不会⽤，⽽是运营⼈员已有⾃⼰的⼯作⽅法，担⼼标准化⼯具降低灵\n活性。\n所以我不会只做操作培训，⽽是⽤真实案例展⽰⽣产时间、修改轮次和商⼾反馈的变化，同\n时允许运营保留⼈⼯调整空间。\n先证明能够节约时间和降低返⼯，再逐步要求使⽤标准流程。\nQ\u0000：北极星指标是什么？\nMVP阶段，我会选择“AI⽅案被商⼾确认并正式上线的项⽬数”或者“AI⽣成内容采⽤率”。\n因为⽣成数量只说明模型⼯作了，采⽤和上线才说明产品真正帮助⽤⼾完成任务。\nQ\u0000：为什么需要核销数据？\n下单不代表真实消费。\n如果套餐下单⾼但核销低，可能存在预约限制、使⽤周期、⻔店位置或⽤⼾冲动消费问题。\n只有结合核销，才能更完整地判断套餐经营价值。\nQ\u0000：如何处理归因问题？\n必须记录同期是否有达⼈、直播、投流和平台资源变化。\n没有对照组时，只能说综合⽅案上线后指标出现变化，不能说完全由AI导致。\n\n</pre>\n</div>\n<p style=\"font-size:12px;color:var(--sub);margin-top:4px\">以上为原文PDF第14-32页的完整内容，包含所有功能模块的详细逐字稿、考察方向和注意事项。</p>\n","p4":"<div class=\"freq-summary\"><span style=\"display:inline-block;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px\">🔴 两篇重合</span><strong>面试频率分析：</strong>数据是面试的<strong>硬通货</strong>——每个数字面试官都可能追问口径和归因。<br>\n<span class=\"freq-badge freq-3\">高频</span> 四层数据（效率/质量/经营/组织）· 19%归因问题 · 数据口径<br>\n<span class=\"freq-badge freq-2\">中频</span> 四个不足 · 对商户和平台的价值</div>\n\n<h2>四、业务成果与影响 <span class=\"freq-badge freq-3\">数据必背</span></h2>\n\n<div class=\"kp-box kp-data\">\n<table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:6px 8px;text-align:left\">维度</th><th style=\"padding:6px 8px;text-align:left\">数据</th><th style=\"padding:6px 8px;text-align:left\">记忆口诀</th></tr>\n<tr><td style=\"padding:6px 8px\">生产效率</td><td style=\"padding:6px 8px\"><strong>30分钟缩短到10分钟，5轮降低到2-3轮</strong></td><td style=\"padding:6px 8px\">三十分变十分，五轮变两三轮</td></tr>\n<tr><td style=\"padding:6px 8px\">内容质量</td><td style=\"padding:6px 8px\"><strong>菜品还原率40%提升到85%</strong></td><td style=\"padding:6px 8px\">四成变八五</td></tr>\n<tr><td style=\"padding:6px 8px\">经营效率</td><td style=\"padding:6px 8px\"><strong>调研5天→36小时，转化+19%</strong></td><td style=\"padding:6px 8px\">五天变一天半，转化提升近两成</td></tr>\n<tr><td style=\"padding:6px 8px\">组织复用</td><td style=\"padding:6px 8px\"><strong>沉淀SOP，约50人团队复用</strong></td><td style=\"padding:6px 8px\">从个人手艺到团队模板</td></tr>\n</table>\n</div>\n\n<h3>业务成果逐字稿（面试原话）</h3>\n<p>项目成果主要体现在效率、质量、经营效果和组织复用四个层面。第一是生产效率，单版素材平均时间从30分钟缩短到10分钟。第二是沟通和质量，修改轮次从5轮下降到2到3轮，菜品还原合格率从40%提高到85%。第三是经营策略效率，单商户市场调研周期从大约5天缩短到36小时以内，下单转化率相较商户原有自定套餐提升19%。这里我会明确说明，这是综合方案结果，不是单个AI功能的独立贡献。第四是组织复用，将流程沉淀成SOP，在市场团队内部推动普及使用。</p>\n\n<h3>数据口径相关QA</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：单版素材时间如何统计？</div>\n<div class=\"a-label\">统计口径：从需求基本确认后开始，到形成一版可以进入商户确认的候选素材为止，含提示词配置、生成和基础调整时间。不含商户长时间未回复造成的等待时间。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：19%转化提升是不是来自投流？</div>\n<div class=\"a-label\"><span class=\"kp-highlight\">有可能。</span>19%是套餐和视觉同步优化后的综合结果，不能做单因素归因。这也是我在反思中认为应该补充版本管理和A/B测试的原因。</div></div>\n\n<h3>四个不足</h3>\n<ol>\n<li>试点商户数量有限，属于方向验证不是大规模统计结论</li>\n<li>竞品数据主要依靠人工整理，自动数据接入没有完成</li>\n<li>质检以人工为主，完整自动质检仍属于产品规划</li>\n<li>套餐、视觉、达人和投流可能同时变化，19%为综合结果</li>\n</ol>","p5":"<div class=\"freq-summary\"><span style=\"display:inline-block;background:#fef2f2;color:#dc2626;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px\">🔴 两篇重合</span><strong>面试频率分析：</strong>反思题考察你的<strong>复盘能力和诚实度</strong>，面试官会看你是否敢承认不足。<br>\n<span class=\"freq-badge freq-3\">高频</span> 最大的踩坑 · 如果重做会怎么改 · 为什么不直接Agent/RAG<br>\n<span class=\"freq-badge freq-2\">中频</span> 行业迁移 · 想做没做成的事</div>\n\n<h2>五、反思与经验 <span class=\"freq-badge freq-3\">体现成长</span></h2>\n\n<div class=\"kp-box kp-framework\">\n<strong>五个核心反思（必须能脱稿讲出来）：</strong>\n<ol>\n<li><strong>从「关注生成」转向「关注任务完成」</strong>：图片好看≠商户满意，关键是菜品真实和品牌一致</li>\n<li><strong>Prompt不是唯一答案</strong>：输入质量和流程确认（样片前置确认）比加长Prompt更有效</li>\n<li><strong>AI+规则+人工共同工作</strong>：<span class=\"kp-jp\">确定性任务交程序，模糊理解交模型，高风险决策交人</span></li>\n<li><strong>MVP可以更聚焦</strong>：如果重做，优先做好需求诊断、内容生成和质量审核三个闭环</li>\n<li><strong>数据归因需要加强</strong>：应从第一天建立版本绑定和A/B测试</li>\n</ol>\n</div>\n\n<h3>反思逐字稿（面试原话）</h3>\n<p>这个项目让我最深刻的认识是，<span class=\"kp-highlight\">AI生成成功并不代表用户任务完成。</span></p>\n<p>项目早期，我比较关注生成图片是否好看，所以最初的优化方式也是增加更多视觉描述。但实际交付后发现，商户不满意的原因不只是审美，而是菜品不真实、品牌风格不一致，以及生成前双方没有对齐验收标准。后来我们把流程从「一次生成后让商户修改」，调整成「先采集结构化需求，再输出3版风格样片确认，之后批量生成并进行质量验收」。这个变化比单纯继续加长Prompt更有效。</p>\n\n<h3>关键QA</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：项目中最大的踩坑是什么？</div>\n<div class=\"a-label\">最开始把问题定义成「怎么生成更好看的图片」。我们在Prompt中增加了很多视觉词，但商户仍然频繁修改。后来发现，真正缺少的是生成前的需求对齐和真实性约束。加入结构化需求和风格样片后，修改轮次才明显下降。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：如果重做一次，你会优先做哪三个功能？</div>\n<div class=\"a-label\">第一是结构化需求诊断，保证模型拿到正确输入。第二是品牌和真实性约束下的内容生成，直接解决最高频工作。第三是质量审核，保证内容可以安全交付。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么不直接Agent或RAG？</div>\n<div class=\"a-label\"><strong>Agent：</strong>项目早期流程比较明确，需求采集、分析、生成和审核都有固定依赖，用可控工作流更合适。MVP阶段引入自主Agent会增加不可控性。<br><strong>RAG：</strong>MVP阶段主要信息是商户资料、品牌规则、套餐和少量模板，直接通过结构化数据和模板调用就能满足。后续行业案例和品牌文档规模扩大后，可以使用RAG检索相关规则和优秀案例。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你的方法可以迁移到其他行业吗？</div>\n<div class=\"a-label\">可以。核心方法不是餐饮图片，而是<span class=\"kp-highlight\">将B端客户模糊需求转化为结构化输入，将AI嵌入业务工作流，并建立输出评测和人工审核</span>。它可以迁移到零售、电商、本地服务和企业内容生产等场景。</div></div>","p6":"<h2>六、2-3分钟简版逐字稿 <span class=\"freq-badge freq-3\">面试常用</span></h2>\n<div class=\"freq-summary\">面试时如果时间紧张（2-3分钟限制），用这个简版。涵盖了核心问题→产品定位→关键挑战→核心数据→核心认识，五段到位。</div>\n\n<div class=\"kp-box kp-framework\"><strong>简版结构（5段）：</strong>业务场景 → 产品定位 → 关键挑战 → 核心数据 → 核心认识</div>\n\n<h3>逐字稿原文</h3>\n<p>我在字节跳动本地生活主要负责餐饮商户的拓展、入驻、套餐规划、营销活动和经营复盘。</p>\n<p>在服务商户的过程中，我发现很多商户虽然完成了平台入驻，但并不具备完整的线上经营能力。中小商户缺少设计、文案和市场分析人员，连锁商户则面临多门店内容统一和本地化生产的问题。内部运营人员也需要反复进行竞品调研、套餐设计和素材制作，效率低且依赖个人经验。</p>\n<p>因此，我主导设计并推动了餐饮商户AI营销经营助手的试点。产品面向内部商务、运营和餐饮商户，覆盖需求诊断、商圈竞品分析、套餐与定价建议、营销文案和视觉生成、质量审核及经营复盘。</p>\n<p>我的正式岗位是商务经理，但在项目中主要承担业务需求发起人、产品方案负责人和试点推动者。我梳理了商户从入驻到经营复盘的全流程，完成核心功能架构、MVP规划、Prompt模板、质量标准和效果指标设计。</p>\n<p>在需求端，我们通过结构化表单、菜单、菜品原图和参考图，将商户「图片更好看」「套餐更吸引人」等模糊诉求，拆解成目标用户、品牌风格、内容场景和真实性约束。在经营端，结合商圈竞品、价格和用户评价，生成引流款、主推款和利润款三档套餐建议。在内容端，通过大模型和多模态能力生成套餐标题、营销文案、菜品图、门店头图和活动海报。</p>\n<p>项目中最关键的挑战是菜品真实性。我测试了5类方案，最终建立「业务场景—视觉风格—真实性约束」三层提示词，并通过3版样片前置确认商户风格。</p>\n<p>最终，<span class=\"kp-highlight\">单版素材生产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2到3轮，菜品还原合格率从40%提升到85%；市场调研周期从约5天缩短到36小时以内，下单转化率较原方案提升19%。</span></p>\n<p>这个项目让我认识到，AI产品不是单纯接入模型，而是要把需求理解、模型生成、业务规则、人工审核和数据优化连接成完整闭环。</p>","p7":"<h2>七、5-7分钟完整逐字稿 <span class=\"freq-badge freq-3\">模拟面试用</span></h2>\n<div class=\"freq-summary\">完整版用于面试时间充裕时（5-7分钟），涵盖全部功能模块、关键决策和反思。建议录音自听，检查语气、节奏和逻辑跳跃点。</div>\n\n<div class=\"kp-box kp-framework\"><strong>完整版结构：</strong>背景→四大功能逐一展开→最大挑战→成果四层→不足→总结</div>\n\n<h3>逐字稿原文</h3>\n<p>我介绍一下我在字节跳动本地生活业务期间主导设计并推动试点的餐饮商户AI营销经营助手。</p>\n<p>我当时担任商务经理，主要负责餐饮商户拓展、平台入驻、门店装修、套餐规划、活动运营和后续经营复盘。在实际服务过程中，我发现商户完成入驻以后，并不代表已经具备线上经营能力。</p>\n<p>对中小商户来说，他们通常没有专业的设计、文案和市场分析团队。商户很懂线下菜品和经营，但不一定熟悉平台用户、团购套餐和线上内容。他们经常只能提出「把菜做得更好看」「套餐更吸引人」或者「参考附近卖得好的店」这类模糊需求。对连锁商户来说，总部希望品牌风格统一，但不同城市和门店又需要根据本地商圈、客单价和用户做差异化内容。对内部商务和运营人员来说，商圈调研、套餐定价、文案撰写和门店装修都是高频重复工作。</p>\n<p>所以我判断，这不是单纯的图片制作问题，而是商户从入驻到经营过程中，需求理解、经营策略和营销内容相互割裂的问题。</p>\n<p>我主导设计了一套餐饮商户AI营销经营助手，产品主要面向内部商务、运营人员和餐饮商户，覆盖AI需求诊断、商圈竞品分析、套餐策略、文案与视觉生成、质量审核和经营复盘。我的正式岗位是商务经理，但在项目中承担的是业务需求发起人、AI产品方案负责人和试点推动者。</p>\n<p><strong>产品第一个核心功能是商户需求智能诊断。</strong>我们没有让商户直接写Prompt，而是通过结构化表单收集信息，并支持上传菜单、菜品原图、品牌Logo和参考图。多模态能力帮助识别，大语言模型将自然语言需求拆成结构化参数，事实字段必须经过人工确认。</p>\n<p><strong>第二个功能是商圈竞品分析。</strong>运营人员导入周边商户数据，系统分析商圈价格带、热销套餐结构和竞品视觉策略，并给出可解释的市场机会。</p>\n<p><strong>第三个功能是套餐设计。</strong>系统基于真实菜品池、成本、目标用户和竞品数据，生成引流款、主推款和利润款三档方案。价格和毛利通过结构化规则测算，大模型主要负责套餐定位、市场差异和卖点表达。</p>\n<p><strong>第四个功能是文案和视觉内容生产。</strong>文案支持套餐标题、卖点、门店介绍、达人脚本和活动文案。视觉部分支持菜品图、门店头图、套餐封面和活动海报。</p>\n<p><strong>项目中最关键的挑战是菜品真实性。</strong>初期图片视觉上比较好看，但经常出现食材变化、分量失真、摆盘错误和不同批次风格漂移。我将问题分成真实性、视觉和品牌一致性几类，先后测试了5类方案，最终形成三层提示词——第一层菜品/用户/场景，第二层色调/构图/光线/餐具，第三层核心食材/分量/烹饪状态/禁止元素。同时批量生成前先输出3版风格样片确认。</p>\n<p>经过优化，<span class=\"kp-highlight\">菜品还原合格率从40%提升到85%，单项目平均修改轮次从5轮下降到2到3轮，单版素材平均生产时间从30分钟缩短到10分钟。</span>竞品分析和套餐策略方面，单商户市场调研周期从约5天缩短到36小时以内。19%是综合方案的结果，不能全部归因于某个AI功能。</p>\n<p>在产品运营方面，我将需求采集、风格标签、参考图、提示词、套餐分析和验收标准沉淀成SOP，并在市场团队内部进行案例培训和使用推广。</p>\n<p>项目也存在不足。试点阶段竞品数据仍需要人工整理；质量审核主要是模型辅助和人工验收；套餐、视觉和营销资源经常同时变化，效果归因还不够严格。如果重新做，我会进一步收敛MVP，优先做好需求诊断、品牌约束下的内容生成和质量审核，并从第一天建立固定测试集、版本绑定和A/B测试机制。</p>\n<p><strong>这个项目让我形成的核心认识是，AI产品不能只关注模型有没有生成结果，而要定义用户任务完成标准，明确AI、规则和人工各自负责什么，并通过真实业务指标判断产品是否真正创造价值。</strong></p>\n\n<hr>\n<h3>面试官最爱问的10个问题（按频率排序）</h3>\n<div class=\"freq-summary\" style=\"margin-bottom:16px\">\n<strong>面试官最爱问的10个问题（按频率排序）：</strong><br>\n<span class=\"freq-badge freq-3\">1</span> 为什么做这个产品？完整讲一遍 <br>\n<span class=\"freq-badge freq-3\">2</span> 你一个商务经理怎么做AI产品？（角色vs岗位）<br>\n<span class=\"freq-badge freq-3\">3</span> 项目中最大的挑战是什么？怎么解决的？（菜品真实性）<br>\n<span class=\"freq-badge freq-3\">4</span> 你的数据成果是什么？（四层数据+口径+归因）<br>\n<span class=\"freq-badge freq-3\">5</span> 你从中学到了什么？有什么不足？（五个反思）<br>\n<span class=\"freq-badge freq-2\">6</span> 为什么不让大模型直接定价？<br>\n<span class=\"freq-badge freq-2\">7</span> 怎么证明你不是只会写Prompt？<br>\n<span class=\"freq-badge freq-2\">8</span> 竞品数据怎么获得？<br>\n<span class=\"freq-badge freq-2\">9</span> 为什么不直接Agent或RAG？<br>\n<span class=\"freq-badge freq-2\">10</span> 你的方法能迁移到其他行业吗？<br>\n</div>\n<h2>七、产品相关高频QA（完整汇总）</h2>\n<h3>产品背景相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：商户为什么不能自己写Prompt？</div><div class=\"a-label\">商户不熟悉平台用户、套餐设计、视觉规则和内容规范，通常只能表达表层需求，很难说出结构化参数。产品需要帮商户把模糊需求翻译成可执行参数。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么不用现成的设计工具？</div><div class=\"a-label\">现成设计工具不解决需求诊断、竞品分析和套餐策略问题，也不理解菜品真实性约束。商户仍需自行完成调研、策略和设计，工具之间互相割裂。</div></div>\n<h3>功能设计相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：为什么是3版样片而不是5版或1版？</div><div class=\"a-label\">1版选择太少，5版太多容易选择困难，3版恰好展示风格差异。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：菜品还原率40%为什么这么低？</div><div class=\"a-label\">初期使用较通用的生成方式，视觉效果不错但没有足够真实菜品和食材约束。餐饮场景验收标准比普通美图严格，核心食材、分量或烹饪状态出现明显错误就不能算合格。</div></div>\n<h3>反思与迁移相关</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你觉得这个产品最大的风险是什么？</div><div class=\"a-label\">AI生成内容视觉上合理，但事实不真实，导致消费者误解。因此必须使用真实菜品和套餐数据，设置强事实约束，并保留运营和商户确认。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：如何看待AI替代运营人员？</div><div class=\"a-label\">我不认为这个项目要完全替代运营。AI更适合完成资料总结、初稿生成和批量处理；运营人员负责商户沟通、经营判断、资源协调和风险确认。产品目标是让运营从重复生产转向高价值决策，而不是取消人工。</div></div>","r1":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>简历面试第一问往往是「你的履历跨度很大，你到底做什么的」，这条主线是<strong>整个简历面试的定调回答</strong>。<br>\n<span class=\"freq-badge freq-3\">必问</span> 职业主线一句话概括 · 如何统一四段看似跳跃的经历</div>\n\n<h2>一、面试前必须统一的职业主线 <span class=\"freq-badge freq-3\">定调回答</span></h2>\n\n<div class=\"kp-box kp-framework\">\n<strong>你的真实履历线：</strong><br>\n创业经营与商业验证 → 人力流程标准化与数据管理 → 用户场景及B端商户解决方案 → 字节跳动本地生活商务运营 → 从真实商户问题中设计AI产品方案\n</div>\n\n<h3>面试中把它讲成一条线（原文核心逻辑）</h3>\n<blockquote style=\"border-left:3px solid var(--accent);padding:12px 16px;background:#f8fafc;margin:10px 0;font-style:italic;font-size:14px;line-height:1.8\">\n我一直在解决真实业务中的用户和客户问题。早期创业让我具备商业闭环和结果意识；人事主管经历让我建立了流程、规则和数据化能力；青年社交平台让我积累了用户洞察、场景产品和B端商户方案经验；在字节跳动，我进一步把这些能力应用到本地生活商户场景，并推动餐饮商户AI营销经营助手从需求识别、方案设计到试点验证。\n</blockquote>\n<p>这条主线要证明：<span class=\"kp-highlight\">我不是突然为了转行而包装一个AI项目，而是在原有B端需求、流程标准化、数据运营和商业落地能力上，进一步补充AI产品能力。</span></p>\n\n<h3>关键词对照：BD经验 → AI PM能力</h3>\n<table style=\"width:100%;font-size:13px;border-collapse:collapse\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:6px 8px\">BD经验</th><th style=\"padding:6px 8px\">对应的AI PM能力</th></tr>\n<tr><td style=\"padding:6px 8px\">客户需求分析</td><td style=\"padding:6px 8px\">用户/客户需求洞察与结构化</td></tr>\n<tr><td style=\"padding:6px 8px\">竞品调研</td><td style=\"padding:6px 8px\">市场分析与竞品对标</td></tr>\n<tr><td style=\"padding:6px 8px\">方案定制与谈判</td><td style=\"padding:6px 8px\">产品方案设计与跨团队协调</td></tr>\n<tr><td style=\"padding:6px 8px\">数据复盘</td><td style=\"padding:6px 8px\">数据指标体系与效果归因</td></tr>\n<tr><td style=\"padding:6px 8px\">流程SOP化</td><td style=\"padding:6px 8px\">工作流设计与异常处理</td></tr>\n</table>","r2":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>自我介绍是<strong>每场面试第一题</strong>，2分钟内要让面试官形成明确印象。核心数据必须脱口而出。<br>\n<span class=\"freq-badge freq-3\">必问</span> 2分钟自我介绍 · 核心竞争力一句话 · 最大短板怎么回答<br>\n<span class=\"freq-badge freq-2\">中频</span> 和传统PM比优势在哪</div>\n\n<h2>二、自我介绍 <span class=\"freq-badge freq-3\">每场必问</span></h2>\n\n<h3>回答思路（四段式）<span class=\"section-tag tag-silu\">思路</span></h3>\n<ol>\n<li><strong>一句话我是谁：</strong>姓名+求职方向（AI产品经理、AIGC内容解决方案相关岗位）</li>\n<li><strong>三类核心能力</strong>（不按时间流水账）：B端客户需求理解 · 业务流程产品化与数据化 · AI内容生产方案设计与业务验证</li>\n<li><strong>重点讲字节AI项目：</strong>核心问题、个人贡献、结果数据</li>\n<li><strong>为什么与目标岗位匹配：</strong>收尾呼应</li>\n</ol>\n\n<h3>注意事项 <span class=\"section-tag tag-zhuyi\">5条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li><strong>不要在自我介绍中逐条复述所有公司和工作内容</strong></li>\n<li><strong>不要一开始强调「我没有正式的产品经理Title」</strong>——先讲能力和项目，被追问时再解释</li>\n<li><strong>不要说「我精通所有AI工具」</strong>——更合理：「熟悉结构化Prompt、多模态内容生成、质量评测及AI工作流，能够根据业务任务选择合适的工具和方案」</li>\n<li><strong>不要在2分钟自我介绍里详细解释AI项目的每一个功能</strong>——先讲核心问题、个人贡献和结果</li>\n<li><strong>不要把过往经历割裂地讲成四段毫无关联的工作</strong></li>\n</ol>\n</div>\n\n<h3>两分钟自我介绍逐字稿 <span class=\"section-tag tag-zhuzigao\">面试原话</span></h3>\n<p>面试官您好，我叫朱耀龙，目前主要应聘AI产品经理、AIGC内容解决方案以及AI内容生产运营相关岗位。</p>\n<p>我的核心优势是同时具备<strong>B端客户需求理解、业务流程产品化和AI内容方案落地</strong>三方面能力。</p>\n<p>我早期有4年创业经历，从0到1参与青年文化和线下文娱业务的产品定位、资源拓展和经营管理，这段经历让我建立了比较强的商业结果意识。之后我做过人力流程优化和用户场景运营，分别积累了流程标准化、数据看板、用户洞察和B端商户解决方案能力。</p>\n<p>在字节跳动本地生活期间，我主要负责餐饮商户的拓展、平台入驻、套餐规划、活动运营和经营复盘。在服务商户的过程中，我发现很多中小商户缺少专业的线上运营团队，竞品分析、套餐设计、文案和视觉素材生产都比较依赖人工。</p>\n<p>基于这个问题，我主导设计并推动试点了餐饮商户AI营销经营助手。产品覆盖商户需求诊断、商圈竞品分析、套餐与定价建议、营销文案和视觉生成、内容审核及经营复盘。</p>\n<p>在项目中，我主要负责业务需求分析、产品功能规划、MVP设计、结构化Prompt、生成质量评测、商户试点和内部推广。针对菜品生成中的食材失真和风格漂移问题，我测试了5类方案，形成三层提示词和3版风格样片确认机制，将<span class=\"kp-highlight\">菜品还原合格率从40%提升到85%，单版素材生产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2至3轮</span>。</p>\n<p>我的特点是，不会只从模型能做什么出发，而是会先理解业务目标和用户任务，再明确AI、规则和人工各自负责什么，并通过效率、质量和业务指标验证方案价值。我希望下一阶段能够继续深耕AI产品，将一线客户需求和AI能力转化为可复制、可规模化的产品解决方案。</p>\n\n<h3>高频QA</h3>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：请用一句话概括你的核心竞争力</div>\n<div class=\"a-label\">我的核心竞争力是，既能深入理解B端客户的真实业务诉求，也能将这些模糊需求转化为结构化的AI产品流程、Prompt方案和质量标准，并推动方案在真实业务中完成验证。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你最大的短板是什么？</div>\n<div class=\"a-label\">相比长期在研发团队中成长的产品经理，我在复杂技术系统和完整研发管理上的经验还需要继续积累。但我的优势是业务理解和落地比较强。目前我会重点补充大模型基础、工作流设计、RAG、模型评测和数据指标体系。我的目标不是代替算法或研发，而是能够准确判断技术适用性，并把业务问题转换成团队可以执行的产品方案。</div></div>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：你和传统产品经理相比有什么优势？</div>\n<div class=\"a-label\">我的优势是长期处于客户和业务一线，比较清楚客户提出的表面需求背后，真正影响经营结果的是什么。比如商户说「想要一张好看的图片」，表面上是视觉需求，但进一步分析后，可能涉及目标用户、套餐定位、品牌调性、内容场景和转化目标。我能够先把这些需求拆清楚，再结合模型能力、业务规则和人工流程设计解决方案，避免产品只停留在功能层。</div></div>","r3":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>转型动机是面试官的<strong>核心质疑点</strong>，必须讲清楚「为什么是升级而不是逃避」。<br>\n<span class=\"freq-badge freq-3\">必问</span> 为什么从商务转AI产品 · 转型是能力升级不是推翻过去</div>\n\n<h2>三、为什么从商务运营转向AI产品 <span class=\"freq-badge freq-3\">核心质疑</span></h2>\n\n<h3>回答思路（四步递进）<span class=\"section-tag tag-silu\">思路</span></h3>\n<ol>\n<li>商务运营经历帮助自己积累了真实客户需求</li>\n<li>在工作中逐渐从单个客户交付走向共性问题抽象</li>\n<li>餐饮商户AI项目让自己确认更适合产品化解决问题</li>\n<li><span class=\"kp-highlight\">转型是原有能力的升级，不是完全推翻过去</span></li>\n</ol>\n\n<h3>注意事项 <span class=\"section-tag tag-zhuyi\">四条红线</span></h3>\n<div class=\"kp-box kp-warning\">\n<ol>\n<li>不要说：商务运营发展上限比较低，所以想转AI</li>\n<li>不要否定过去经历，否则面试官会担心未来也否定AI产品工作</li>\n<li>不要只说「对AI感兴趣」，兴趣不足以支撑职业转型</li>\n<li>不要塑造「商务工作低价值，产品工作高价值」的对立</li>\n</ol>\n</div>","r4":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>字节经历是简历中<strong>最核心的证明段落</strong>，7点拆解不需要全讲，但要能在被追问时逐一展开。<br>\n<span class=\"freq-badge freq-3\">必问</span> Prompt设计与优化（最体现产品能力）· 内容评测方法 · 内部推广怎么做的<br>\n<span class=\"freq-badge freq-2\">中频</span> 套餐与经营策略 · 流程设计</div>\n\n<h2>四、字节经历——七点拆解 <span class=\"freq-badge freq-3\">核心证明</span></h2>\n\n<h3>字节经历记忆结构</h3>\n<div class=\"kp-box kp-framework\">\n<strong>7点递进：</strong>业务场景与典型问题 → 从观察到行动 → Prompt设计与优化 → 内容评测 → 流程设计 → 套餐与经营策略 → 产品运营与内部推广\n</div>\n\n<h3>第三点：Prompt设计与优化 <span class=\"freq-badge freq-3\">最体现产品能力</span></h3>\n<p>不是「我会写Prompt」，而是「我如何通过系统化测试找到可复用的Prompt方案」。</p>\n<p>针对菜品生成中的食材失真和风格漂移问题，将问题分成真实性、视觉风格和品牌一致性几类，先后测试了5类方案。最终形成三层Prompt结构：第一层定义业务场景，第二层定义视觉风格，第三层定义真实性约束。同时建立3版风格样片前置确认机制。</p>\n\n<h3>第四点：内容评测</h3>\n<p>评测分成效率、质量和业务三个层面。效率包括生成时间和修改轮次；质量包括事实准确、菜品还原、风格一致和内容通过率；业务包括内容采用率、点击、下单和核销。<span class=\"kp-highlight\">模型生成结果并不是最终指标。只有输出被用户采用、通过审核并帮助完成业务任务，才说明产品有价值。</span></p>\n\n<h3>第五点：流程设计</h3>\n<p>将流程从「一次生成后让商户修改」，调整成「先采集结构化需求→输出3版风格样片确认→批量生成→质量验收」。明确每个环节的输入、输出、负责人和异常处理，使方案不再依赖个人经验。</p>\n\n<h3>第七点：产品运营与内部推广</h3>\n<p>方案验证后，将需求采集、风格标签、参考图、分层提示词、套餐分析和质量验收整理成标准化SOP。内部推广时使用真实商户案例说明使用前后的变化。因为很多运营人员已经有自己的工作方式，所以<span class=\"kp-highlight\">保留了人工调整和个性化处理空间</span>，而不是一开始要求完全按标准流程执行。后续方案在约50人的市场团队范围内进行普及和使用。</p>\n<div class=\"kp-qa\"><div class=\"q-label\">Q：内部推广最大的阻力是什么？</div><div class=\"a-label\">不是不会用，而是不愿改变原有工作方式。运营人员担心标准化工具无法处理个性商户，所以我先用真实案例证明工具可以减少重复劳动，同时保留人工修改空间。</div></div>","r5":"<div class=\"freq-summary\"><strong>面试频率分析：</strong>全量关键数据必须<strong>脱口而出</strong>——这是简历面试的硬通货，面试官会追问每个数字的口径和来源。</div>\n\n<h2>五、业务结果与反思 <span class=\"freq-badge freq-3\">数据必背</span></h2>\n\n<div class=\"kp-box kp-data\">\n<table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:6px 8px\">经历</th><th style=\"padding:6px 8px\">关键数据</th><th style=\"padding:6px 8px\">记忆口诀</th></tr>\n<tr><td style=\"padding:6px 8px\">字节AI项目</td><td style=\"padding:6px 8px\"><strong>30min→10min / 5轮→2-3轮 / 40%→85% / 5天→36h / 转化+19%</strong></td><td style=\"padding:6px 8px\">三十分变十分，五轮变两三轮，四成变八五</td></tr>\n<tr><td style=\"padding:6px 8px\">社交平台</td><td style=\"padding:6px 8px\"><strong>10余条线路 / 周均1000+用户 / 50余家商户 / 150万流水</strong></td><td style=\"padding:6px 8px\">十条线千户五十商一百五</td></tr>\n<tr><td style=\"padding:6px 8px\">拓浦集团</td><td style=\"padding:6px 8px\"><strong>流程效率+40% / 风险事件-30%</strong></td><td style=\"padding:6px 8px\">流程四成风险三成</td></tr>\n<tr><td style=\"padding:6px 8px\">创业</td><td style=\"padding:6px 8px\"><strong>单店月利润1.5万→5万</strong></td><td style=\"padding:6px 8px\">一万五变五万</td></tr>\n</table>\n</div>\n\n<h3>四个不足</h3>\n<ol>\n<li>试点商户数量有限，属于方向验证不是大规模统计结论</li>\n<li>竞品数据主要依靠人工整理，自动数据接入没有完成</li>\n<li>质检以人工为主，完整自动质检仍属于产品规划</li>\n<li>套餐、视觉、达人和投流可能同时变化，19%为综合结果</li>\n</ol>","q1":"<div class=\"freq-summary\"><strong>面试关联：</strong>Agent 是 AI 产品经理面试的<strong>核心技术话题</strong>——「你的项目为什么不直接 Agent」「Agent 和聊天机器人有什么区别」「你怎么设计工具调用」都是高频追问。这份速查卡覆盖原 PDF 全部 19 章的核心内容。</div>\n\n<h2>Agent 与工具调用 —— 完整速查（原 PDF 19 章提炼）</h2>\n\n<h3>第一章：从大模型到 Agent <span class=\"freq-badge freq-3\">基础</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>普通大模型为什么不能直接完成真实工作？</strong><br>\n普通大模型能理解和生成语言，但无法天然访问日历、邮箱、数据库、企业系统和本地文件。<br>\n用户说「帮我安排明天下午的项目复盘会」→ 模型可以生成会议邀请文字，但如果没连接日历系统，它无法知道用户是否有空，也无法真正创建会议。<br>\n<strong>核心原则：模型说完成了任务，不代表任务真的完成了。</strong>任务是否完成，必须由外部系统的真实状态来判断。\n</div>\n\n<h3>AI产品能力的四个层次 <span class=\"freq-badge freq-2\">框架</span></h3>\n<ol>\n<li><strong>内容生成</strong>：用户输入→模型直接生成文字/代码/图片。一次调用完成，不一定需要Agent。</li>\n<li><strong>知识问答</strong>：先查资料（RAG或搜索），再让模型基于资料回答。需要知识库但不需要真实业务操作。</li>\n<li><strong>辅助执行</strong>：AI生成草稿，人工确认后执行。企业Agent早期最常见形态。</li>\n<li><strong>半自主/自主执行</strong>：Agent围绕目标调用多个工具完成连续任务，根据中间结果决定下一步。</li>\n</ol>\n<div class=\"kp-box kp-warning\">产品能力层次越高，不代表产品一定越好。自主程度越高，系统复杂度、失败概率、安全风险和成本也会同步增加。</div>\n\n<h3>第二章：Agent的定义与边界 <span class=\"freq-badge freq-3\">必背</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>Agent定义（5要素）：</strong>一个能围绕<strong>用户目标</strong>，理解当前<strong>环境</strong>，选择<strong>行动步骤</strong>，调用<strong>工具</strong>，观察<strong>执行结果</strong>，并根据结果继续完成任务的AI系统。<br>\n<strong>运行过程：</strong>接收目标→理解任务→获取必要信息→选择行动→调用工具→读取结果→判断是否完成→继续执行或结束<br>\n<strong>关键认知：</strong>成熟Agent运行在明确工具、权限、步骤数、预算和时间限制之内，本质上是<strong>受控自主</strong>，而不是无限自主。\n</div>\n\n<h3>Agent vs 聊天机器人 <span class=\"freq-badge freq-3\">对比必考</span></h3>\n<div class=\"kp-box kp-data\">\n<table style=\"width:100%;font-size:12px;border-collapse:collapse\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:5px 8px\">维度</th><th style=\"padding:5px 8px\">聊天机器人</th><th style=\"padding:5px 8px\">Agent</th></tr>\n<tr><td style=\"padding:5px 8px\">模式</td><td style=\"padding:5px 8px\">用户输入→模型回答→对话结束</td><td style=\"padding:5px 8px\">接收目标→调用工具→观察结果→继续执行</td></tr>\n<tr><td style=\"padding:5px 8px\">能力</td><td style=\"padding:5px 8px\">只能「说」</td><td style=\"padding:5px 8px\">能「做」（查数据、发邮件、建工单）</td></tr>\n<tr><td style=\"padding:5px 8px\">验证</td><td style=\"padding:5px 8px\">回答是否合理</td><td style=\"padding:5px 8px\">外部系统状态是否真实改变</td></tr>\n</table>\n</div>\n\n<h3>第四章：工具调用完整链路（9步）<span class=\"freq-badge freq-3\">必懂</span></h3>\n<div class=\"kp-box kp-framework\">\n工具定义 → 用户输入 → 意图识别 → 工具选择 → 参数生成 → 参数校验 → 工具执行 → 结果返回 → 结果理解和最终回答<br>\n<strong>关键认知：</strong>结构化参数可以明确字段和值，便于程序校验、日志记录和自动测试。但<strong>结构化不等于正确</strong>——模型仍可能漏字段、填错字段、编造不存在的编号。任何进入真实系统的参数都应经过程序校验。\n</div>\n\n<h3>第五章：API / Function Calling / MCP / Webhook / RPA 区别 <span class=\"freq-badge freq-3\">必考</span></h3>\n<div class=\"kp-box kp-data\">\n<table style=\"width:100%;font-size:12px;border-collapse:collapse\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:5px 8px\">概念</th><th style=\"padding:5px 8px\">一句话解释</th><th style=\"padding:5px 8px\">特点</th></tr>\n<tr><td style=\"padding:5px 8px\"><strong>API</strong></td><td style=\"padding:5px 8px\">系统对外提供的标准接口</td><td style=\"padding:5px 8px\">最稳定、结构化、效率高。优先使用</td></tr>\n<tr><td style=\"padding:5px 8px\"><strong>Function Calling</strong></td><td style=\"padding:5px 8px\">模型以结构化方式选择工具并生成参数的机制</td><td style=\"padding:5px 8px\">负责「调什么、参数是什么」，不负责权限和校验</td></tr>\n<tr><td style=\"padding:5px 8px\"><strong>MCP</strong></td><td style=\"padding:5px 8px\">模型应用与外部工具之间的标准连接协议</td><td style=\"padding:5px 8px\">降低重复适配成本，暴露Tools/Resources/Prompts</td></tr>\n<tr><td style=\"padding:5px 8px\"><strong>Webhook</strong></td><td style=\"padding:5px 8px\">事件发生后系统主动通知Agent</td><td style=\"padding:5px 8px\">长时间任务比Agent不断轮询更高效</td></tr>\n<tr><td style=\"padding:5px 8px\"><strong>RPA</strong></td><td style=\"padding:5px 8px\">模拟用户点击操作没有API的老系统</td><td style=\"padding:5px 8px\">稳定性差，容易受页面变化影响。最后手段</td></tr>\n</table>\n</div>\n\n<h3>第六章：工具设计方法 <span class=\"freq-badge freq-2\">设计</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>名称：</strong>体现明确动作+对象（query_order，不是process）<br>\n<strong>描述：</strong>说明能做什么、何时使用、何时不能使用、有何限制<br>\n<strong>粒度：</strong>一个工具完成一个清晰、完整、可验证的业务动作<br>\n<strong>参数：</strong>明确名称、含义、类型、是否必填、格式、允许值、示例<br>\n<strong>返回：</strong>至少包含是否成功、结果数据、错误代码、错误说明、是否可重试<br>\n<strong>幂等性：</strong>同一请求重复执行不会产生重复影响（支付/退款/审批尤其重要）\n</div>\n\n<h3>第七章：任务拆解与规划 <span class=\"freq-badge freq-2\">方法</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>四层拆解法：</strong>目标 → 子任务 → 动作 → 工具<br>\n<strong>例子（销售报告）：</strong>目标=生成本月销售报告 → 子任务=获取数据/分析数据/生成报告 → 动作=查询CRM/计算环比/生成图表 → 工具=CRM工具/代码工具/文档工具<br>\n<strong>静态规划：</strong>适合流程稳定的任务（报销、请假），步骤提前明确<br>\n<strong>动态规划：</strong>适合后续步骤依赖中间结果的任务（市场调研、竞品分析）<br>\n<strong>计划与执行分离：</strong>复杂/高成本/高风险任务先出计划再执行\n</div>\n\n<h3>第八章：工作流与Agent的选择 <span class=\"freq-badge freq-3\">必考</span></h3>\n<div class=\"kp-box kp-warning\">\n<strong>固定工作流：</strong>稳定、可预测、易测试、易审计——适合报销、请假、工单、审批等标准流程<br>\n<strong>自主Agent：</strong>适合市场调研、竞品分析、复杂搜索等路径难以提前确定的任务——但带来成本、延迟、稳定性问题<br>\n<strong>混合模式（最常见）：</strong><span class=\"kp-highlight\">确定性任务交给程序，模糊理解交给模型，高风险决策交给人。</span>\n</div>\n\n<h3>第九~十五章：上下文、状态、记忆、人工确认、异常、权限、可观察性 <span class=\"freq-badge freq-1\">进阶</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>上下文管理：</strong>上下文越长效果不一定越好。复杂任务应定期总结，将关键参数结构化保存。<br>\n<strong>状态管理：</strong>状态记录任务当前阶段和关键数据，存储在系统中，不能只靠模型记忆。<br>\n<strong>人工确认（Human-in-the-loop）：</strong>低风险自动执行，中风险执行后提供撤销，高风险执行前确认，极高风险不允许Agent独立执行。<br>\n<strong>异常处理：</strong>网络超时可重试；权限不足应停止并提示；数据不存在应检查输入；业务规则拒绝不应重复执行。<br>\n<strong>权限原则：</strong>Agent只获得完成任务所需的最小权限。应继承当前用户权限而非使用超级管理员账号。<br>\n<strong>可观察性：</strong>能回答三个问题——Agent为什么做了这一步？失败发生在哪里？是否可以恢复？\n</div>\n\n<h3>第十六~十八章：Agent评测、成本、产品设计流程 <span class=\"freq-badge freq-2\">方法</span></h3>\n<div class=\"kp-box kp-data\">\n<strong>Agent评测9项指标：</strong>任务完成率、意图识别准确率、工具选择正确率、参数准确率、工具成功率、路径效率、异常恢复率、安全指标、成本指标<br>\n<strong>任务成功必须以外部系统真实结果为准，不能以模型回复为准。</strong><br>\n<strong>成本优化：</strong>固定规则由程序执行；简单分类使用小模型；减少无关历史；缓存重复结果；并行执行独立步骤；限制最大步骤<br>\n<strong>Agent产品设计流程：</strong>从业务问题开始→还原现有流程→选择MVP场景（高频/重复/数据可获得/工具可连接/结果可验证/风险可控）→定义成功标准\n</div>\n\n<h3>第19章：典型案例速查</h3>\n<table style=\"width:100%;font-size:12px;border-collapse:collapse\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:5px 8px\">场景</th><th style=\"padding:5px 8px\">流程</th><th style=\"padding:5px 8px\">重点风险</th></tr>\n<tr><td style=\"padding:5px 8px\">会议纪要Agent</td><td style=\"padding:5px 8px\">录音→转写→识别主题→提取结论→识别待办→匹配负责人→确认→创建任务</td><td style=\"padding:5px 8px\">发言人识别错误、讨论被误判为结论、负责人被编造</td></tr>\n<tr><td style=\"padding:5px 8px\">客服工单Agent</td><td style=\"padding:5px 8px\">识别客户→判断问题→查询订单→搜索知识库→尝试自助→检查重复→创建工单</td><td style=\"padding:5px 8px\">越权查询、错误分类、重复创建、错误退款</td></tr>\n<tr><td style=\"padding:5px 8px\">销售周报Agent</td><td style=\"padding:5px 8px\">确认时间→查询数据→清洗→计算→对比→分析→生成图表→生成报告</td><td style=\"padding:5px 8px\">计算应由代码完成，大模型只负责解释</td></tr>\n<tr><td style=\"padding:5px 8px\">请假Agent</td><td style=\"padding:5px 8px\">识别假期类型→获取时间→查询余额→查询制度→检查材料→确认→提交审批</td><td style=\"padding:5px 8px\">制度判断由规则和知识库结合完成</td></tr>\n</table>","q2":"<h2>RAG 10个必知概念</h2><ol><li><b>RAG三环节</b>：检索→增强→生成</li><li><b>Prompt vs RAG</b>：Prompt定怎么答，RAG提供答什么</li><li><b>微调vs RAG</b>：常变的知识用RAG，稳定模式才微调</li><li><b>关键词vs向量</b>：精确用关键词，语义用向量，企业用混合检索</li><li><b>权限原则</b>：检索前过滤，不能检索后靠模型自觉</li><li><b>故障定位顺序</b>：资料→解析切片→检索重排→生成</li></ol>","q3":"<h2>需求文档重点</h2><ol><li><b>产品定位</b>：需求理解→经营策略→内容生产→质量审核→数据优化闭环</li><li><b>V1范围</b>：做了需求诊断/竞品/套餐/文案视觉/审核/确认/导出/复盘；没做自动爬取/自动发布/动态调价</li><li><b>AI原则</b>：事实必须来源用户输入；结论需展示依据；高风险决策须人工确认</li></ol>","q4":"<div style=\"background:linear-gradient(135deg,#fef2f2,#fff7ed);border:2px solid #fca5a5;border-radius:var(--radius);padding:14px 16px;margin:12px 0\">\n<strong style=\"font-size:15px\">🔴 两篇逐字稿重合重点 —— 出现频率最高，必须背熟</strong>\n<p style=\"font-size:12px;color:var(--sub);margin:6px 0 0\">以下 11 个概念在产品逐字稿和简历逐字稿中<strong>同时出现</strong>。面试官在不同环节都可能追问——<span style=\"color:var(--red);font-weight:600\">说明这些是核心考察点，优先级最高。</span></p>\n</div>\n<table style=\"width:100%;border-collapse:collapse;font-size:13px;margin:10px 0\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:6px 8px;text-align:left\">重合概念</th><th style=\"padding:6px 8px;text-align:left\">在两篇中出现的板块</th></tr>\n<tr><td style=\"padding:6px 8px\"><strong>MVP验证边界</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p4/p5 + r5</td></tr><tr><td style=\"padding:6px 8px\"><strong>三档套餐策略</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p3 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>内容质量验收标准</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p3 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>分层提示词设计</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p3 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>商圈竞品调研</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p3 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>商户入驻后不会经营</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p1/p6/p7 + r2</td></tr><tr><td style=\"padding:6px 8px\"><strong>商户表达模糊、需求不清晰</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p1 + r2/r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>最小可行产品</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p2/p5 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>流程标准化沉淀</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p4 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>结构化需求采集</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p3 + r4</td></tr><tr><td style=\"padding:6px 8px\"><strong>项目局限性反思</strong></td><td style=\"padding:6px 8px;font-size:11px;color:var(--sub)\">p4 + r5</td></tr>\n</table>\n<div style=\"background:#fefce8;border:1px solid #fde68a;border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:12px;line-height:1.7\">\n<strong>💡 学习建议：</strong>这些重合概念应该优先背熟——因为它们既会在产品项目介绍时被问到，也会在简历经历问询时被追问。掌握一个概念 = 同时应对两篇逐字稿的考题。\n</div>","q5":"<div class=\"freq-summary\"><strong>面试关联：</strong>这份材料覆盖了AI产品设计中面试官最可能问及的<strong>方法论层面</strong>问题——「AI产品和传统软件有什么不同」「你怎么设计AI产品的评测」「你的MVP原则是什么」等。和产品逐字稿里的具体项目呼应使用。</div>\n\n<h2>AI产品设计方法 —— 面试高频框架速查</h2>\n\n<h3>1. AI产品 vs 传统软件的根本差异 <span class=\"freq-badge freq-3\">必懂</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>传统软件</strong>：确定性规则 → 同样输入=同样输出<br>\n<strong>AI产品</strong>：用户输入不确定 → 模型输出概率性 → 效果由模型+Prompt+知识+数据+检索+规则+工作流+工具+交互共同决定<br>\n<strong>核心风险</strong>：输出看起来合理但事实不正确（幻觉）——传统系统报错用户知道失败了，模型幻觉却是自信地给出错误答案<br>\n<strong>一句话</strong>：AI产品设计不是在传统软件中增加一个聊天框，而是重新设计用户、模型、知识、数据、规则、工具和人工之间的协作关系。\n</div>\n\n<h3>2. AI产品设计的8个阶段 <span class=\"freq-badge freq-2\">方法论</span></h3>\n<ol>\n<li><strong>业务问题发现</strong>：通过访谈、工单、数据找到高频、耗时、重复、易出错的任务</li>\n<li><strong>AI适用性判断</strong>：是否真的需要AI？是否有足够知识和数据？结果可否评测？错误风险是否可控？</li>\n<li><strong>用户任务拆解</strong>：拆成多个步骤，分析每步当前谁做、用什么系统、耗时多少、哪里容易出错</li>\n<li><strong>能力分配</strong>：决定哪些步骤由大模型/RAG/数据库/规则/工作流/Agent/工具/人工完成</li>\n<li><strong>产品流程与交互设计</strong>：用户输入→系统追问→任务执行→进度展示→结果修改→高风险确认</li>\n<li><strong>能力和数据建设</strong>：整理知识、接入系统、设计Prompt、准备测试集</li>\n<li><strong>评测与验证</strong>：数据层→模型层→检索层→业务层逐层评测</li>\n<li><strong>MVP与迭代</strong>：最小范围验证完整价值闭环，根据真实使用优化</li>\n</ol>\n\n<h3>3. AI产品新增的7个设计对象 <span class=\"freq-badge freq-2\">面试可引用</span></h3>\n<div class=\"kp-box kp-data\">\n<ol>\n<li><strong>模型能力边界</strong>：明确模型适合处理什么、哪些必须交给规则/数据库/人工</li>\n<li><strong>输入设计</strong>：用户需要提供什么、系统可自动补充什么、缺失什么必须追问</li>\n<li><strong>上下文设计</strong>：用户输入+历史对话+知识片段+业务数据+系统规则，如何排序、保存多久、控制长度</li>\n<li><strong>输出设计</strong>：不只是\"一段文字\"，还要说明结构、字段、引用、置信表达和后续操作</li>\n<li><strong>效果评测</strong>：不只是\"接口成功\"，还要评测正确性、完整性、相关性、任务完成情况和业务价值</li>\n<li><strong>容错设计</strong>：模型误解、知识缺失、工具失败、权限不足、输出格式错误、任务部分完成</li>\n<li><strong>持续运营</strong>：知识更新、测试集维护、错误反馈、Prompt版本、模型版本、成本管理</li>\n</ol>\n</div>\n\n<h3>4. 上下文设计要点 <span class=\"freq-badge freq-1\">进阶</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>上下文的组成部分：</strong>用户输入 + 历史对话 + 知识片段 + 业务数据 + 系统规则 + 工具结果<br>\n<strong>关键原则：</strong>上下文不是越长越好——无关信息会增加成本和干扰模型判断<br>\n<strong>实践建议：</strong>定期总结、结构化保存关键参数、按重要性排序、控制Token预算\n</div>\n\n<h3>5. AI产品评测体系（分层评测）<span class=\"freq-badge freq-3\">面试高频</span></h3>\n<table style=\"width:100%;font-size:12px;border-collapse:collapse;margin:8px 0\">\n<tr style=\"background:#f8fafc\"><th style=\"padding:5px 8px\">层级</th><th style=\"padding:5px 8px\">评测内容</th><th style=\"padding:5px 8px\">关键指标</th></tr>\n<tr><td style=\"padding:5px 8px\">数据/知识层</td><td style=\"padding:5px 8px\">文件解析完整性、关键字段准确、版本正确</td><td style=\"padding:5px 8px\">OCR准确率、字段提取率</td></tr>\n<tr><td style=\"padding:5px 8px\">模型能力层</td><td style=\"padding:5px 8px\">意图识别、实体提取、答案正确性</td><td style=\"padding:5px 8px\">准确率、幻觉率、指令遵循率</td></tr>\n<tr><td style=\"padding:5px 8px\">RAG/检索层</td><td style=\"padding:5px 8px\">正确资料是否找到、排序是否合理</td><td style=\"padding:5px 8px\">Recall@K、MRR、引用准确率</td></tr>\n<tr><td style=\"padding:5px 8px\">Agent层</td><td style=\"padding:5px 8px\">任务是否完成、工具选择是否正确</td><td style=\"padding:5px 8px\">任务完成率、工具成功率</td></tr>\n<tr><td style=\"padding:5px 8px\">业务价值层</td><td style=\"padding:5px 8px\">是否真正帮用户完成任务</td><td style=\"padding:5px 8px\">时间节省、采用率、转化率、返工率</td></tr>\n</table>\n<div class=\"kp-box kp-warning\"><strong>核心原则：</strong>技术指标良好不代表产品有价值。最终判断标准是用户任务完成情况和业务指标改善。</div>\n\n<h3>6. MVP设计原则 <span class=\"freq-badge freq-3\">必懂</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>MVP目标：</strong>不是功能越少越好，而是用最小范围<strong>验证完整价值闭环</strong>。<br>\n例如企业知识助手的闭环：用户提问→系统找到正确知识→生成有来源的答案→用户完成问题解决→错误反馈进入优化。如果只有聊天页面，没有引用、反馈和知识更新，就没有形成完整闭环。<br>\n<strong>首批范围：</strong>限制目标用户、业务部门、知识范围、任务类型、工具数量和风险范围。\n</div>\n\n<h3>7. 人机协作设计 <span class=\"freq-badge freq-2\">设计原则</span></h3>\n<div class=\"kp-box kp-data\">\n<strong>AI在产品中的四种角色：</strong>\n<ol>\n<li><strong>信息助手</strong>：查找和整理资料</li>\n<li><strong>内容助手</strong>：生成初稿、摘要、说明</li>\n<li><strong>决策助手</strong>：提供判断、排序、风险提示</li>\n<li><strong>执行助手</strong>：调用系统完成操作</li>\n</ol>\n<strong>必须人工确认的操作：</strong>发送外部邮件、发布公开内容、提交付款、修改合同、审批员工事项、删除数据、执行不可逆操作。<br>\n<strong>金句：</strong>AI产品不是替代人，而是让模型在明确边界内与知识、数据、规则、工具和人工协同工作。\n</div>\n\n<h3>8. AI产品PRD应额外包含的内容 <span class=\"freq-badge freq-2\">PRD</span></h3>\n<div class=\"kp-box kp-framework\">\n传统PRD（背景、用户、流程、功能）之外，AI产品PRD还需包含：<br>\nAI能力边界 | 知识和数据来源 | Prompt规则 | 模型选择原则 | 工作流/Agent逻辑 | 工具调用 | 人工确认点 | 异常和降级策略 | 评测指标 | 成本要求 | 安全要求 | 版本规划\n</div>\n\n<h3>9. AI产品设计的完整思考路径 <span class=\"freq-badge freq-3\">面试金句</span></h3>\n<div class=\"kp-box kp-framework\">\n<strong>拿到一个AI产品需求时，按以下顺序思考：</strong>\n<ol>\n<li>目标用户是谁？在什么场景下完成什么任务？</li>\n<li>当前流程中哪些步骤耗时、重复、易出错或依赖专家？</li>\n<li>是否真的需要AI？有足够知识数据吗？能评测吗？风险可控吗？</li>\n<li>任务拆解后，每步该由大模型/RAG/业务系统/规则/工作流/Agent/工具/人工完成？</li>\n<li>用户如何输入？系统如何追问？进度如何展示？失败如何处理？</li>\n<li>分层建立评测指标</li>\n<li>用有限范围的MVP验证核心价值</li>\n</ol>\n<strong>一句话总结：</strong>模型只是AI产品中的一个组件。真正成熟的设计，是让模型在明确的业务边界内，与企业知识、实时数据、确定性规则、业务工具和人工判断协同工作，稳定、安全、可评测并可持续地帮助用户完成有价值的任务。\n</div>"};

// ============ SCORING ENGINE ============
function scoreAnswer(userAnswer, keyPoints) {
  if (!keyPoints || keyPoints.length === 0) return {score:5, matched:[], missed:[], total:0, hit:0};
  var answer = userAnswer.toLowerCase();
  var matched = [], missed = [];
  for (var i = 0; i < keyPoints.length; i++) {
    if (answer.indexOf(keyPoints[i].toLowerCase()) !== -1) matched.push(keyPoints[i]);
    else missed.push(keyPoints[i]);
  }
  var ratio = matched.length / keyPoints.length;
  var score = ratio >= 0.85 ? 5 : ratio >= 0.65 ? 4 : ratio >= 0.45 ? 3 : ratio >= 0.25 ? 2 : ratio > 0 ? 1 : 0;
  return { score: score, matched: matched, missed: missed, total: keyPoints.length, hit: matched.length };
}

// ============ LOCAL STORAGE ============
var LSKEY = 'ai_pm_mobile';
function gp() { try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch(e) { return {}; } }
function sp(p) { localStorage.setItem(LSKEY, JSON.stringify(p)); }
function gdr(sec) { var p = gp(); return p[sec] || null; }
function sdr(sec, r) { var p = gp(); p[sec] = {results: r.results, avg: r.avg, rate: r.rate, total: r.total, count: r.count, ts: Date.now()}; sp(p); }

var cp = 'study', cst = 'product', csection = 'p1';
function switchPanel(name) {
  cp = name;
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });

function renderStudySidebar() {
  var data = STUDY_CONTENT[cst];
  if (!data) return;
  var sb = document.getElementById('study-sidebar-mob');
  var h = '<div class="study-sidebar-header">'+data.title+'</div>';

    h += '<div class="study-sidebar-item" onclick="loadSection(\''+s.id+'\')"><span class="dot"></span>'+s.title+'</div>';
  });
