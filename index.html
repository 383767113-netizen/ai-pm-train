function renderSprintDashboard() {
  var sprint = getSprint();
  if (!sprint.started) {
    // Auto-start
    sprint.started = true;
    sprint.startTs = Date.now();
    sprint.day = 1;
    sprint.checklist = {};
    saveSprint(sprint);
  }
  
  // Determine which day we're on
  var elapsed = Date.now() - sprint.startTs;
  var dayNum = Math.min(3, Math.floor(elapsed / (1000 * 60 * 60 * 24)) + 1);
  sprint.day = dayNum;
  saveSprint(sprint);
  
  document.getElementById("sprint-day-badge").textContent = "Day " + dayNum + "/3";
  
  // Render checklist
  var plan = SPRINT_PLAN[dayNum];
  var checklist = document.getElementById("sprint-checklist");
  var h = '<p style="font-size:13px;font-weight:600;margin-bottom:8px">' + plan.title + '</p>';
  plan.tasks.forEach(function(t) {
    var done = sprint.checklist[t.id];
    var cls = done ? "sprint-check done" : "sprint-check";
    h += '<div class="'+cls+'" onclick="toggleSprintTask(\''+t.id+'\')"><div class="check-box"></div>' + t.label + '</div>';
  });
  checklist.innerHTML = h;
  
  // Calculate readiness score
  var readiness = calculateReadiness();
  document.getElementById("readiness-score").textContent = readiness.score + "%";
  document.getElementById("readiness-bar").style.width = readiness.score + "%";
  document.getElementById("readiness-bar").style.background = readiness.score >= 80 ? "var(--green)" : readiness.score >= 60 ? "var(--amber)" : "var(--red)";
  document.getElementById("readiness-label").textContent = readiness.label;
  
  // Render section status
  renderSectionStatus();
  
  // Update smart review section
  updateSmartReview();
}

function toggleSprintTask(taskId) {
  var sprint = getSprint();
  sprint.checklist[taskId] = !sprint.checklist[taskId];
  saveSprint(sprint);
  renderSprintDashboard();
}

function calculateReadiness() {
  var p = gp();
  var sections = Object.keys(QUIZ_DATA);
  var completed = 0, totalScore = 0;
  sections.forEach(function(s) {
    var r = p[s];
    if (r) { completed++; totalScore += r.avg; }
  });
  
  var sprint = getSprint();
  var plan = SPRINT_PLAN[sprint.day];
  var tasksDone = 0;
  plan.tasks.forEach(function(t) {
    if (sprint.checklist[t.id]) tasksDone++;
  });
  
  var sectionScore = completed > 0 ? Math.round(totalScore / completed * 20) : 0;
  var taskScore = plan.tasks.length > 0 ? Math.round(tasksDone / plan.tasks.length * 100) : 0;
  var score = Math.round(sectionScore * 0.6 + taskScore * 0.4);
  
  var label = score >= 85 ? "🔥 已就绪，可以应对面试" : score >= 70 ? "💪 进展良好，继续攻克弱项" : score >= 50 ? "📖 稳步推进，重点回顾薄弱板块" : "🚀 冲刺刚开始，按计划推进";
  return {score: score, label: label};
}

function updateSmartReview() {
  var p = gp();
  var allWeak = [];
  Object.keys(QUIZ_DATA).forEach(function(s) {
    var r = p[s];
    if (r) {
      r.results.forEach(function(res, i) {
        if (res.score < 3) {
          allWeak.push({section:s, title:QUIZ_DATA[s].title, qi:i, q:res.question, score:res.score, missed:res.missed});
        }
      });
    }
  });
  
  var container = document.getElementById("smart-review-section");
  var list = document.getElementById("smart-review-questions");
  if (allWeak.length === 0) {
    container.style.display = "none";
    return;
  }
  
  container.style.display = "block";
  allWeak.sort(function(a,b) { return a.score - b.score; });
  var h = '<p style="font-size:12px;color:var(--sub);margin-bottom:4px">共 '+allWeak.length+' 道弱题需要攻克</p>';
  allWeak.slice(0, 8).forEach(function(w) {
    h += '<div style="font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)"><span class="score-badge '+(w.score<=1?'bad':'warn')+'">'+w.score+'/5</span> '+w.q.substring(0,60)+'...</div>';
  });
  list.innerHTML = h;
}

function startSmartReview() {
  var p = gp();
  var allWeak = [];
  Object.keys(QUIZ_DATA).forEach(function(s) {
    var r = p[s];
    if (r) {
      r.results.forEach(function(res, i) {
        if (res.score < 3) {
          allWeak.push({section:s, qi:i, q:res.q, missed:res.missed});
        }
      });
    }
  });
  
  if (allWeak.length === 0) { alert("没有弱题需要复习！"); return; }
  
  // Sort worst first, take top 10
  allWeak.sort(function(a,b) { 
    var pa = gp()[a.section]; var pb = gp()[b.section];
    return (pa?pa.results[a.qi].score:0) - (pb?pb.results[b.qi].score:0);
  });
  allWeak = allWeak.slice(0, 10);
  
  // Build combined quiz
  var body = document.getElementById("quiz-body");
  var h = '<h3 style="font-size:16px;font-weight:600;margin-bottom:4px">🔴 综合弱题攻克</h3>';
  h += '<p style="font-size:12px;color:var(--sub);margin-bottom:12px">共 '+allWeak.length+' 题 · 来自多个板块的低分题目</p>';
  allWeak.forEach(function(w, i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'/'+allWeak.length+'</span> <span style="font-size:11px;color:var(--sub)">'+QUIZ_DATA[w.section].title.substring(0,12)+'</span></h3>';
    h += '<div class="q-text">'+w.q+'</div>';
    if (w.missed.length) h += '<div class="q-hint">上次遗漏：'+w.missed.join('、')+'</div>';
    h += '<textarea id="sr_'+i+'" placeholder="输入你的回答..."></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitSmartReview('+JSON.stringify(allWeak.map(function(w){return {s:w.section, qi:w.qi};}))+')">提交综合复习</button>';
  body.innerHTML = h;
  document.getElementById("quiz-result").style.display = "none";
  switchPanel("quiz");
  window.scrollTo({top: 0, behavior: "smooth"});
}

function submitSmartReview(weakRefs) {
  var totalScore = 0;
  weakRefs.forEach(function(ref, i) {
    var ans = document.getElementById("sr_"+i).value.trim();
    if (!ans) return;
    var data = QUIZ_DATA[ref.s];
    var kp = data.questions[ref.qi].kp;
    var r = scoreAnswer(ans, kp);
    // Update the original result if better
    var p = gp();
    var sectionData = p[ref.s];
    if (sectionData && r.score > sectionData.results[ref.qi].score) {
      sectionData.results[ref.qi] = {score:r.score, matched:r.matched, missed:r.missed, question:data.questions[ref.qi].q, total:r.total, hit:r.hit};
      // Recalculate section avg
      var total = 0;
      sectionData.results.forEach(function(res) { total += res.score; });
      sectionData.avg = total / sectionData.results.length;
      sectionData.rate = Math.round(sectionData.avg * 20);
      p[ref.s] = sectionData;
    }
    totalScore += r.score;
  });
  sp(p);
  
  var avg = totalScore / weakRefs.length;
  var rate = Math.round(avg * 20);
  alert("综合复习完成！平均分：" + avg.toFixed(1) + "/5 (" + rate + "%)");
  
  // Refresh sprint dashboard
  var sprint = getSprint();
  saveSprint(sprint);
  
  switchPanel("sprint");
  renderSprintDashboard();
}

var FC_KEY = 'ai_pm_flashcards';
function getFC() {
  try { return JSON.parse(localStorage.getItem(FC_KEY) || '{"ratings":{},"current":0,"history":[]}'); } catch(e) { return {ratings:{},current:0,history:[]}; }
}
function saveFC(d) { localStorage.setItem(FC_KEY, JSON.stringify(d)); }

var fcData = getFC();
var fcFlipped = false;

var fcFilter = "all";
function setFCFilter(cat) {
  fcFilter = cat;
  ["all","product","resume","concept"].forEach(function(c) {
    var btn = document.getElementById("fc-filter-"+c);
    if (btn) { btn.classList.remove("primary"); btn.classList.add(c === cat ? "primary" : ""); }
  });
  showFlashcard();
}
function getNextCard() {
  var ratings = fcData.ratings;
  // Filter by category
  var deck = FLASHCARD_DECK;
  if (fcFilter !== "all") {
    deck = FLASHCARD_DECK.filter(function(c) { return c.cat === fcFilter; });
  }
  // Cards rated 1 (hard) appear 3x more often, rated 2 appear 2x, rated 3 appear 1x
  var weighted = [];
  deck.forEach(function(card, deckIdx) {
    // Find original index in FLASHCARD_DECK
    var origIdx = FLASHCARD_DECK.indexOf(card);
    var r = ratings[origIdx] || 0;
    var weight = r === 0 ? 4 : r === 1 ? 3 : r === 2 ? 2 : 1;
    for (var j = 0; j < weight; j++) weighted.push(origIdx);
  });
  // Shuffle
  for (var i = weighted.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = weighted[i]; weighted[i] = weighted[j]; weighted[j] = tmp;
  }
  // Don't repeat same card twice in a row
  var pick = weighted[0];
  if (pick === fcData.current && weighted.length > 1) pick = weighted[1];
  return pick;
}

function showFlashcard() {
  var idx = getNextCard();
  fcData.current = idx;
  saveFC(fcData);
  
  var card = FLASHCARD_DECK[idx];
  document.getElementById("fc-front").textContent = card.q;
  document.getElementById("fc-back").textContent = card.a;
  document.getElementById("fc-card").classList.remove("flipped");
  document.getElementById("fc-btns").style.display = "none";
  fcFlipped = false;
  
  // Update counter
  var deck = fcFilter === "all" ? FLASHCARD_DECK : FLASHCARD_DECK.filter(function(c) { return c.cat === fcFilter; });
  var ratedInFilter = 0;
  deck.forEach(function(c) { if (fcData.ratings[FLASHCARD_DECK.indexOf(c)]) ratedInFilter++; });
  var totalRated = Object.keys(fcData.ratings).length;
  document.getElementById("fc-counter").textContent = "当前筛选：" + (fcFilter==="all"?"全部":fcFilter==="product"?"产品逐字稿":fcFilter==="resume"?"简历逐字稿":"概念速查") + " · 已评 " + ratedInFilter + " / " + deck.length + " 张（总计 " + totalRated + " / " + FLASHCARD_DECK.length + "）";
  
  // Update progress dots
  var deck = fcFilter === "all" ? FLASHCARD_DECK : FLASHCARD_DECK.filter(function(c) { return c.cat === fcFilter; });
  var dots = "";
  for (var i = 0; i < deck.length; i++) {
    var origIdx = FLASHCARD_DECK.indexOf(deck[i]);
    var cls = "flashcard-dot";
    if (origIdx === idx) cls += " current";
    else if (fcData.ratings[origIdx]) cls += " done";
    dots += '<span class="'+cls+'"></span>';
  }
  document.getElementById("fc-progress").innerHTML = dots;
}

function flipCard() {
  fcFlipped = !fcFlipped;
  if (fcFlipped) {
    document.getElementById("fc-card").classList.add("flipped");
    document.getElementById("fc-btns").style.display = "flex";
  } else {
    document.getElementById("fc-card").classList.remove("flipped");
    document.getElementById("fc-btns").style.display = "none";
  }
}

function rateCard(rating) {
  fcData.ratings[fcData.current] = rating;
  fcData.history.push({card: fcData.current, rating: rating, ts: Date.now()});
  saveFC(fcData);
  showFlashcard();
}

function resetFlashcards() {
  if (confirm("确定重置所有闪卡进度？")) {
    localStorage.removeItem(FC_KEY);
    fcData = getFC();
    showFlashcard();
  }
}

// ============ DAILY RANDOM REVIEW ============
function startRandomReview() {
  var allQuestions = [];
  Object.keys(QUIZ_DATA).forEach(function(s) {
    QUIZ_DATA[s].questions.forEach(function(q, i) {
      allQuestions.push({section:s, qi:i, q:q.q, kp:q.kp, title:QUIZ_DATA[s].title});
    });
  });
  
  // Shuffle and take 5
  for (var i = allQuestions.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allQuestions[i]; allQuestions[i] = allQuestions[j]; allQuestions[j] = tmp;
  }
  var picked = allQuestions.slice(0, 5);
  
  var body = document.getElementById("quiz-body");
  var h = '<h3 style="font-size:16px;font-weight:600;margin-bottom:4px">🎲 随机混练</h3>';
  h += '<p style="font-size:12px;color:var(--sub);margin-bottom:12px">从15个板块中随机抽取5题，打乱顺序，避免按板块记忆</p>';
  picked.forEach(function(p, i) {
    h += '<div class="quiz-card"><h3><span class="q-badge">'+(i+1)+'/5</span> <span style="font-size:11px;color:var(--sub)">'+p.title.substring(0,12)+'</span></h3>';
    h += '<div class="q-text">'+p.q+'</div>';
    h += '<textarea id="rr_'+i+'" placeholder="输入你的回答..."></textarea></div>';
  });
  h += '<button class="btn btn-primary" onclick="submitRandomReview('+JSON.stringify(picked.map(function(p){return {s:p.section, qi:p.qi};}))+')">提交混练</button>';
  body.innerHTML = h;
  document.getElementById("quiz-result").style.display = "none";
  switchPanel("quiz");
  window.scrollTo({top: 0, behavior: "smooth"});
}

function submitRandomReview(refs) {
  var results = [];
  var total = 0;
  refs.forEach(function(ref, i) {
    var ans = document.getElementById("rr_"+i).value.trim();
    if (!ans) { results.push({score:0, matched:[], missed:['未作答']}); return; }
    var data = QUIZ_DATA[ref.s];
    var r = scoreAnswer(ans, data.questions[ref.qi].kp);
    results.push(r);
    total += r.score;
  });
  var avg = total / refs.length;
  var rate = Math.round(avg * 20);
  
  var rc = document.getElementById("quiz-result");
  var cls = avg >= 3.5 ? "good" : avg >= 2.5 ? "ok" : "bad";
  var h = '<div class="result-header"><div class="result-score '+cls+'">'+rate+'%</div><div class="result-meta">随机混练 · '+avg.toFixed(1)+'/5 · '+refs.length+'题</div></div>';
  h += '<div style="font-size:13px;color:var(--sub);margin-bottom:8px">打乱板块顺序的随机测试，检验真实掌握程度（非按板块记忆）</div>';
  results.forEach(function(r, i) {
    var fcls = r.score >= 3 ? "pass" : "fail";
    h += '<div class="feedback-item '+fcls+'"><div class="fb-title">Q'+(i+1)+' 得分：<strong>'+r.score+'/5</strong></div>';
    if (r.matched && r.matched.length) h += '<div class="caught">✅ '+r.matched.join('、')+'</div>';
    if (r.missed && r.missed.length) h += '<div class="missed">❌ '+r.missed.join('、')+'</div>';
    h += '</div>';
  });
  h += '<div style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="startRandomReview()">再抽5题</button></div>';
  rc.innerHTML = h;
  rc.style.display = "block";
  window.scrollTo({top: rc.offsetTop - 60, behavior: "smooth"});
}
