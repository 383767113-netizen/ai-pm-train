<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI PM 面试训练</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--sub:#6b7280;--accent:#1d4ed8;--accent-dim:#dbeafe;--green:#059669;--green-dim:#d1fae5;--amber:#d97706;--amber-dim:#fef3c7;--red:#dc2626;--red-dim:#fee2e2;--radius:8px;--font:system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;margin-right:auto}
.topbar-nav{display:flex;gap:2px}
.topbar-nav button{height:34px;padding:0 10px;border:none;border-radius:var(--radius);background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--sub);transition:all .12s;display:flex;align-items:center;gap:4px}
.topbar-nav button:hover{background:#f1f5f9;color:var(--text)}
.topbar-nav button.active{background:var(--accent);color:#fff}
.topbar-nav button svg{width:14px;height:14px;flex-shrink:0}
.nav-label{display:none}
.main{padding:12px;max-width:900px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.study-tabs{display:flex;gap:0;margin-bottom:12px;overflow-x:auto}
.study-tabs button{padding:8px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.study-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.study-sidebar-toggle{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;width:100%;justify-content:space-between}
.study-sidebar{background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;margin-bottom:12px;max-height:200px;overflow-y:auto}
.study-sidebar.collapsed{display:none}
.study-sidebar-item{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;border-radius:4px;margin:1px 6px}
.study-sidebar-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.study-sidebar-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.study-content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow-y:auto;max-height:60vh;font-size:14px;line-height:1.75}
.study-content h2{font-size:18px;font-weight:700;margin:0 0 8px}
.study-content pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid var(--border);max-height:50vh;overflow-y:auto}
.quiz-header{margin-bottom:12px}.quiz-header h2{font-size:17px;font-weight:700}
.quiz-header p{font-size:12px;color:var(--sub)}
.section-pills{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.section-pill{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:15px;background:var(--surface);cursor:pointer;font-size:11px;font-weight:500;transition:all .12s}
.section-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-pill.done{border-color:var(--green);color:var(--green)}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.quiz-card h3{font-size:13px;font-weight:600;margin-bottom:6px}
.q-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;background:var(--accent-dim);color:var(--accent)}
.quiz-card .q-text{font-size:13px;line-height:1.6;margin-bottom:10px;color:var(--text)}
.quiz-card .q-hint{font-size:11px;color:var(--sub);margin-bottom:8px;padding:6px 10px;background:#fefce8;border-radius:4px;border-left:3px solid var(--amber)}
.quiz-card textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.6;resize:vertical;-webkit-appearance:none}
.quiz-card textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.btn{height:40px;padding:0 18px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;gap:6px;-webkit-appearance:none}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center}
.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-sm{height:32px;padding:0 10px;font-size:12px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.result-score{font-size:36px;font-weight:800}.result-score.good{color:var(--green)}.result-score.ok{color:var(--amber)}.result-score.bad{color:var(--red)}
.result-meta{font-size:12px;color:var(--sub)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.result-stat{text-align:center;padding:10px;background:#f8fafc;border-radius:var(--radius)}.result-stat .num{font-size:18px;font-weight:700}.result-stat .lbl{font-size:10px;color:var(--sub)}
.feedback-item{padding:10px 12px;border-radius:var(--radius);margin-bottom:6px;font-size:12px;line-height:1.5}
.feedback-item.pass{background:var(--green-dim);border:1px solid #a7f3d0}
.feedback-item.fail{background:var(--red-dim);border:1px solid #fecaca}
.feedback-item .fb-title{font-weight:600}
.caught{color:var(--green);font-weight:500}.missed{color:var(--red);font-weight:500}
.progress-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.progress-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}.progress-stat .val{font-size:24px;font-weight:700}.progress-stat .lbl{font-size:11px;color:var(--sub)}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.chart-container h3{font-size:13px;font-weight:600;margin-bottom:10px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 2px;overflow-x:auto}
.chart-bar{flex:1;min-width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.chart-label{text-align:center;font-size:9px;color:var(--sub)}
.weakpoint-table{width:100%;border-collapse:collapse;font-size:11px}
.weakpoint-table th{padding:6px 8px;background:#f8fafc;font-size:10px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border)}
.weakpoint-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.score-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}.score-badge.bad{background:var(--red-dim);color:var(--red)}.score-badge.warn{background:var(--amber-dim);color:var(--amber)}
.empty{padding:32px;text-align:center;color:var(--sub);font-size:13px}
.history-item{padding:10px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.freq-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;margin-left:6px}
.freq-3{background:#fef2f2;color:#dc2626}.freq-2{background:#fff7ed;color:#ea580c}.freq-1{background:#f0fdf4;color:#16a34a}
.kp-box{border-radius:var(--radius);padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.7}
.kp-framework{background:#eff6ff;border-left:3px solid #3b82f6}
.kp-data{background:#fefce8;border-left:3px solid #eab308}
.kp-warning{background:#fef2f2;border-left:3px solid #ef4444}
.freq-summary{background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:12px;line-height:1.8}
.feynman-panel{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:16px;margin:12px 0}
.feynman-panel h3{font-size:14px;font-weight:700;margin-bottom:8px}
.feynman-panel textarea{width:100%;min-height:100px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;line-height:1.7;resize:vertical}
.feynman-result{margin-top:10px;padding:10px;border-radius:var(--radius);font-size:12px;line-height:1.6}
.feynman-result.pass{background:var(--green-dim)}.feynman-result.fail{background:var(--amber-dim)}
.feynman-btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600}.feynman-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.flashcard-container{perspective:1000px;width:100%;max-width:600px;margin:0 auto;min-height:200px}
.flashcard{position:relative;width:100%;min-height:180px;cursor:pointer;transition:transform .4s;transform-style:preserve-3d}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;min-height:180px;backface-visibility:hidden;border-radius:var(--radius);padding:24px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.7;border:2px solid var(--border)}
.flashcard-front{background:var(--surface);z-index:2}
.flashcard-back{background:var(--accent-dim);transform:rotateY(180deg);border-color:var(--accent)}
.flashcard-counter{text-align:center;font-size:12px;color:var(--sub);margin:8px 0}
.flashcard-btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.flashcard-rate{height:38px;padding:0 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600}.flashcard-rate.easy{background:var(--green-dim);color:var(--green)}.flashcard-rate.medium{background:var(--amber-dim);color:var(--amber)}.flashcard-rate.hard{background:var(--red-dim);color:var(--red)}
.flashcard-progress{display:flex;gap:4px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.flashcard-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}.flashcard-dot.done{background:var(--green)}.flashcard-dot.current{background:var(--accent);transform:scale(1.4)}
.sprint-banner{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.sprint-banner .day-badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:13px;font-weight:700}
.sprint-check{display:flex;align-items:center;gap:6px;padding:8px 12px;margin:4px 0;border-radius:4px;font-size:13px;cursor:pointer}.sprint-check.done{color:var(--green);text-decoration:line-through}.sprint-check .check-box{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center}.sprint-check.done .check-box{background:var(--green);border-color:var(--green)}.sprint-check.done .check-box::after{content:"✓";color:#fff;font-size:12px;font-weight:700}
.readiness-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.readiness-fill{height:100%;border-radius:4px}
.smart-review-card{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);padding:14px;margin:10px 0}
.voice-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:50%;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px}
.voice-btn.recording{background:var(--red-dim);border-color:var(--red);animation:pulse 1.5s infinite}.voice-btn.recording svg{stroke:var(--red)}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.font-ctrl{display:flex;align-items:center;gap:4px;margin-right:8px}.font-ctrl button{width:28px;height:28px;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}.fs-label{font-size:11px;color:var(--sub);width:28px;text-align:center;font-weight:600}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin:6px 0;display:flex;align-items:center;gap:10px;font-size:13px}.review-card.due{background:#fef2f2;border-color:#fecaca}
.review-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}.review-badge.due{background:var(--red-dim);color:var(--red)}.review-badge.today{background:var(--amber-dim);color:var(--amber)}.review-badge.ok{background:var(--green-dim);color:var(--green)}
@media(min-width:768px){.main{padding:20px 24px;max-width:1100px}.nav-label{display:inline}.section-pill{height:32px;padding:0 12px;font-size:12px}.quiz-card{padding:18px 22px}.quiz-card textarea{min-height:100px}.progress-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <span class="topbar-brand">AI PM 面试训练</span>
  <div class="font-ctrl"><button onclick="changeFontSize(-1)">A-</button><span class="fs-label" id="fs-label">14</span><button onclick="changeFontSize(1)">A+</button></div>
  <nav class="topbar-nav">
    <button id="nav-study" class="active" onclick="switchPanel('study')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span class="nav-label">学习</span></button>
    <button id="nav-quiz" onclick="switchPanel('quiz')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="nav-label">自检</span></button>
    <button id="nav-flashcard" onclick="switchPanel('flashcard');showFlashcard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="nav-label">闪卡</span></button>
    <button id="nav-sprint" onclick="switchPanel('sprint');renderSprintDashboard()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="nav-label">冲刺</span></button>
    <button id="nav-progress" onclick="switchPanel('progress')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg><span class="nav-label">进度</span></button>
  </nav>
</header>
<main class="main">
<div id="panel-study" class="panel active">
  <div class="study-tabs"><button class="active" onclick="switchStudyTab('product')">产品逐字稿</button><button onclick="switchStudyTab('resume')">简历逐字稿</button><button onclick="switchStudyTab('quick')">辅助速查</button></div>
  <button class="study-sidebar-toggle" onclick="toggleSidebar()">📂 章节目录 <span id="sidebar-arrow">▼</span></button>
  <div id="study-sidebar-mob" class="study-sidebar"></div>
  <div id="study-content" class="study-content"><div class="empty">从上方选择一个章节开始学习</div></div>
  <div id="feynman-panel" class="feynman-panel" style="display:none"><h3>🗣️ 费曼输出</h3><textarea id="feynman-input" placeholder="用自己的话讲一遍..."></textarea><div style="margin-top:10px;display:flex;gap:8px"><button class="feynman-btn primary" onclick="checkFeynman()">检查覆盖率</button><button class="feynman-btn" onclick="closeFeynman()">关闭</button></div><div id="feynman-result"></div></div>
</div>
<div id="panel-quiz" class="panel">
  <div class="quiz-header"><h2>板块自检测试</h2><p>每学完一个板块就做对应的题目，系统自动评分</p></div>
  <div class="section-pills" id="section-pills"></div>
  <div id="quiz-body"><div class="empty">选择上方板块开始测试</div></div>
  <div id="quiz-result" class="result-card" style="display:none"></div>
</div>
<div id="panel-flashcard" class="panel">
  <div class="quiz-header"><h2>闪卡记忆</h2><p>看正面回想答案，点击翻面检查。不熟的优先出现。</p></div>
  <div style="display:flex;gap:4px;justify-content:center;margin-bottom:12px;flex-wrap:wrap" id="fc-filters">
    <button class="feynman-btn primary" onclick="setFCFilter('all')">全部</button>
    <button class="feynman-btn" onclick="setFCFilter('product')">产品</button>
    <button class="feynman-btn" onclick="setFCFilter('resume')">简历</button>
    <button class="feynman-btn" onclick="setFCFilter('concept')">概念</button>
  </div>
  <div class="flashcard-progress" id="fc-progress"></div><div class="flashcard-counter" id="fc-counter"></div>
  <div class="flashcard-container"><div class="flashcard" id="fc-card" onclick="flipCard()"><div class="flashcard-face flashcard-front" id="fc-front">点击开始</div><div class="flashcard-face flashcard-back" id="fc-back"></div></div></div>
  <div class="flashcard-btns" id="fc-btns" style="display:none"><button class="flashcard-rate hard" onclick="rateCard(1)">不熟</button><button class="flashcard-rate medium" onclick="rateCard(2)">还行</button><button class="flashcard-rate easy" onclick="rateCard(3)">熟了</button></div>
</div>
<div id="panel-sprint" class="panel">
  <div class="sprint-banner"><span class="day-badge" id="sprint-day-badge">Day 1/3</span><div class="sprint-info"><strong>3天冲刺模式</strong></div><button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;border:none" onclick="resetSprint()">重新开始</button></div>
  <div class="chart-container"><h3>📋 今日任务清单</h3><div id="sprint-checklist"></div></div>
  <div class="chart-container"><h3>📊 掌握度评分</h3><div id="readiness-score" style="font-size:40px;font-weight:800;text-align:center;padding:16px">--</div><div class="readiness-bar"><div class="readiness-fill" id="readiness-bar" style="width:0%;background:var(--red)"></div></div></div>
  <div class="chart-container"><h3>各板块掌握度</h3><div id="sprint-section-status"></div></div>
</div>
<div id="panel-progress" class="panel">
  <div class="progress-grid" id="progress-stats"></div>
  <div class="chart-container"><h3>各板块得分</h3><div class="chart-bars" id="progress-chart"></div></div>
  <div class="chart-container"><h3>⏰ 间隔重复提醒</h3><div id="review-reminders"><div class="empty">暂无复习提醒</div></div></div>
  <div class="chart-container"><h3>薄弱点</h3><div id="weak-table-container"><div class="empty">暂无数据</div></div></div>
  <div class="chart-container"><h3>历史记录</h3><div id="history-list"><div class="empty">暂无记录</div></div></div>
</div>
</main></div>
<script>
var _C = {"p1": "<div class=\"freq-summary\">⭐ 每场必问</div><h2>一、产品背景 <span class=\"freq-badge freq-3\">面试必问</span></h2><div class=\"kp-box kp-framework\" style=\"margin-bottom:12px\"><strong>🧠 记忆辅助：</strong>费曼练习：给不懂的人解释为什么值得做，对照原文检查6步递进。</div><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第2页】\n第六步，给出产品定位。它不是单⼀图⽚⽣成器，⽽是⼀款⾯向内部商务、运营及餐饮商⼾的\nB端AI营销经营辅助产品。\n推荐记忆结构\n业务场景真实存在\n→ 商⼾⼊驻后仍不会经营\n→ 中⼩商⼾缺团队，连锁商⼾难批量\n→ ⼈⼯服务成本⾼且⽆法复制\n→ AI适合处理理解、分析和⽣成\n→ 产品定位为经营策略与内容⽣产⼀体化助⼿\n2.⾯试官考察⽅向\n这⼀部分⾯试官通常不是单纯想听“为什么做”，⽽是在判断以下问题：\n2.1 需求是不是真实需求\n⾯试官会判断你是先看到⼤模型流⾏，再强⾏寻找使⽤场景，还是在真实⼯作过程中反复发现\n同类问题。\n你需要体现，商⼾市场分析、套餐规划、⽂案撰写和⻔店装修是⽇常⾼频任务，不是偶发的⼀\n次性需求。⼯作资料也显⽰，你在⽇常⼯作中需要持续对接商⼾、设计优惠、处理流量和核销\n问题，并协调产品、市场和技术团队。\n2.2 你是否理解⽬标⽤⼾\n⾯试官会追问：\n·核⼼⽤⼾是商⼾还是内部运营？\n【原文第3页】\n·⼩商⼾和连锁商⼾的需求是否⼀样？\n·商务⼈员为什么愿意使⽤这个⼯具？\n你需要讲清，MVP阶段主要⽤⼾是内部商务和运营⼈员，商⼾是资料提供者和⽅案确认者；后\n续流程成熟后，再开放部分⾃助能⼒。\n2.3 为什么需要AI⽽不是普通系统\n普通系统可以解决字段录⼊和流程管理，但不能很好地理解商⼾模糊表达、总结⼤量评价、理\n解参考图⽚或⽣成多版本内容。\n同时，不能把所有问题都交给AI。价格底线、成本核算、事实字段和审核规则，仍然需要结构\n化数据和规则控制。\n2.4 产品价值是否⾜够清晰\n产品价值⾄少包含三层：\n·对商⼾：降低线上经营⻔槛。\n·对运营：降低重复⼯作和沟通成本。\n·对平台：提⾼商⼾上线效率和后续经营质量。\n2.5 是否具备商业化价值\n项⽬中的AI服务既可以作为商⼾⼊驻时的增值服务，也可以提⾼商务拓展的专业度和吸引⼒。\n原⽅案就将免费的AI内容服务视为商⼾合作中的“钩⼦”，帮助增强商⼾对平台服务能⼒的认\n可。\n3.注意事项\n【原文第4页】\n3.1 不要⼀开始就讲技术\n错误表达：\n因为⼤模型和多模态发展得⽐较快，所以我们想⽤AI帮助餐饮商⼾⽣成图⽚。\n这种表达会让⾯试官认为项⽬是技术驱动，⽽不是需求驱动。\n更好的表达：\n我先在商⼾服务过程中发现了需求沟通、套餐设计和内容⽣产三个⾼频问题，再判断哪些环\n节适合使⽤⼤模型、多模态和规则能⼒。\n3.2 不要把项⽬只讲成图⽚⽣成\n图⽚只是产品的⼀部分。完整价值是：\n商⼾需求理解 → 市场策略 → 套餐设计 → ⽂案及视觉⽣产 → 质量审核 → 数据复盘。\n3.3 不要说商⼾完全不会运营\n部分商⼾具备经验，但缺少系统⽅法和专业⼈⼒。更准确的说法是：\n不同商⼾线上运营能⼒差异较⼤，中⼩商⼾普遍缺少专业团队，连锁商⼾则存在批量⽣产和\n本地化适配压⼒。\n3.4 不要声称AI可以⾃动完成最终经营决策\n套餐定价、商⼾成本、活动资源和最终上线内容都需要⼈⼯确认。\n3.5 需要明确实际项⽬边界\n可以说：\n【原文第5页】\n项⽬已经完成了需求验证、⽅案设计、商⼾试点和团队内部复⽤，核⼼场景通过现有AI能⼒\n进⾏了验证；完整系统化能⼒属于产品化⽅案和后续迭代⽅向。\n4.产品背景逐字稿\n我在字节跳动本地⽣活业务担任商务经理，⽇常主要负责餐饮商⼾的拓展、平台⼊驻、⻔店\n装修、套餐规划、营销活动和后续经营复盘。\n在这个过程中，我发现⼀个⽐较典型的问题，就是商⼾完成⼊驻以后，并不代表已经具备线\n上经营能⼒。平台给了商⼾⼀个经营⼊⼝，但商⼾还需要解决卖什么套餐、怎么定价、怎么\n装修⻔店、怎么做营销内容以及怎么根据数据继续优化这些问题。\n对中⼩餐饮商⼾来说，他们通常没有完整的线上运营团队，⽼板可能很懂菜品和线下经营，\n但不⼀定熟悉平台⽤⼾、团购套餐和线上内容。他们提出的需求也⽐较模糊，⽐如会说“帮\n我把菜做得好看⼀点”“套餐设计得更有吸引⼒”或者“参考附近卖得好的商家”，但是很难\n进⼀步说明⽬标⽤⼾、价格策略、视觉⻛格和内容使⽤场景。\n对连锁商⼾来说，问题不完全⼀样。总部希望所有⻔店保持统⼀的品牌形象，但不同城市、\n不同商圈和不同⻔店⼜需要结合本地⽤⼾做差异化套餐和内容。如果完全依赖⼈⼯逐店处\n理，周期和成本都会⽐较⾼。\n对内部商务和运营⼈员来说，也存在明显的效率问题。商圈竞品、套餐价格、⽤⼾评价需要\n⼈⼯在不同渠道中搜索和整理，⻔店头图、菜品图和⽂案⼜要重复制作，很多经验沉淀在个\n⼈⼿⾥，很难快速复制给其他同事。\n我当时判断，这个场景⽐较适合AI，不是单纯因为AI能够⽣成图⽚，⽽是因为整个流程中存\n在⼤量⾮结构化但⼜可以标准化的任务。⽐如商⼾的模糊需求可以被拆成结构化参数，⽤⼾\n评价可以被AI归类总结，参考图⽚可以被多模态模型理解，⽂案和视觉素材可以批量⽣成。\n但是像菜品价格、成本、套餐内容和平台合规要求，不能完全交给模型，⽽是要通过结构化\n数据、规则校验和⼈⼯审核来控制。\n所以我主导设计了餐饮商⼾AI营销经营助⼿。它是⼀款⾯向内部商务、运营⼈员和餐饮商⼾\n的B端AI产品，核⼼⽬标不是单次⽣成⼀张图⽚，⽽是将商⼾需求诊断、商圈竞品分析、套餐\n策略、营销内容⽣产、质量审核和经营复盘串成⼀个完整闭环。\n5.产品背景问题QA\nQ\u0000：你最早是怎么发现这个需求的？\n</pre></div>", "p2": "<div class=\"freq-summary\">⭐ 必问「商务经理凭什么做AI产品」</div><h2>二、角色与职责 <span class=\"freq-badge freq-3\">核心质疑</span></h2><div class=\"kp-box kp-framework\" style=\"margin-bottom:12px\"><strong>🧠 记忆辅助：</strong>情境锚定：BD提案逻辑=AI产品介绍逻辑。</div><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第6页】\n我不是通过⼀次专⻔的⽤⼾访谈发现的，⽽是在持续服务商⼾的过程中反复看到同类问题。\n商⼾⼊驻后，我需要帮助他们⽣成⻔店头图、菜品图，沟通货盘和价格，还要安排达⼈推⼴\n并复盘交易数据。开始时我认为这些只是商务和运营⼯作，但做了多个商⼾后发现，很多任\n务⾼度重复，⽽且每个同事都在⽤⾃⼰的⽅法处理。\n例如，同样是⼀个双⼈套餐，⼤家都要重新查周边商⼾、整理价格和写卖点；同样是菜品\n图，商⼾也都会经历需求表达模糊、⽣成效果不满意和多轮修改的问题。\n所以我判断它不是某⼀家商⼾的个性化问题，⽽是可以被抽象和产品化的共性需求。\nQ\u0000：这个产品主要解决的是商⼾问题，还是内部效率问题？\n两者都有，但MVP阶段我会优先从内部效率切⼊。\n对商⼾来说，它解决的是缺乏线上经营能⼒的问题；对内部商务和运营来说，它解决的是需\n求沟通、市场分析和内容⽣产重复的问题。\n初期让内部⼈员使⽤更合理，因为内部运营熟悉平台规则和商⼾情况，能够对AI结果进⾏判\n断和审核。等流程和质量稳定后，再逐步开放商⼾⾃助能⼒。\nQ\u0000：为什么普通SOP不能解决？\nSOP能够统⼀步骤，但不能替代对⾮结构化内容的理解和⽣产。\n⽐如SOP可以规定“先收集商⼾资料，再分析竞品”，但⼈⼯仍然需要阅读⼤量评价、总结卖\n点和⽣成不同⽂案；也⽆法⾃动理解商⼾上传的参考图。\nAI的价值是把SOP中的部分认知和⽣产⼯作⾃动化，⽽SOP本⾝则负责约束AI的使⽤流程，\n两者不是替代关系。\nQ\u0000：为什么不⽤第三⽅设计公司或服务商？\n服务商可以解决问题，但成本、交付周期和⼀致性仍然⽐较依赖⼈员。同时，平台内部有⼤\n量商⼾，如果每⼀家都依赖定制服务，很难规模化。\nAI产品不是完全替代服务商，⽽是把⾼频、重复的基础⼯作标准化，让服务商和运营⼈员把\n更多精⼒放在⾼价值判断、商⼾沟通和活动策略上。\n【原文第7页】\nQ\u0000：为什么不能直接让商⼾使⽤现成的AI⼯具？\n通⽤AI⼯具解决的是“⽣成能⼒”，但没有解决“业务输⼊、品牌约束和结果验收”。\n商⼾不⼀定知道应该如何描述⽬标⽤⼾、消费场景和视觉规范；通⽤模型也不了解商⼾真实\n菜品、价格和品牌要求。⽣成完成后，还缺少事实校验、平台合规和效果复盘。\n我们的产品价值，是把模型能⼒嵌⼊⼀套业务流程，⽽不是再提供⼀个聊天框。\nQ\u0000：需求频率真的⾜够⾼吗？\n⾜够⾼。商⼾不仅在第⼀次⼊驻时需要做⻔店装修和套餐，上新、节⽇活动、⻔店扩张、达\n⼈推⼴和套餐效果下降时都会重新调整内容。\n特别是连锁商⼾，每开⼀家新店都要重复进⾏⻔店资料适配、套餐本地化和视觉内容⽣产，\n所以它不是⼀次性需求。\nQ\u0000：产品是否适合所有餐饮商⼾？\n并不完全适合。\n对已有成熟数字化团队、品牌规范和内容供应链的⼤型连锁品牌，产品更多是提⾼批量⽣产\n和本地化效率；对中⼩商⼾，产品价值主要是降低专业运营⻔槛。\n对于菜品极度定制、视觉真实性要求特别⾼，或者缺乏任何真实素材的商⼾，AI只能辅助，\n仍然需要专业拍摄和设计。\nQ\u0000：你怎么证明商⼾愿意使⽤？\n⼀⽅⾯，项⽬来⾃商⼾真实交付环节，商⼾已经在不断请求我们帮助制作⻔店图、套餐和营\n销内容；另⼀⽅⾯，试点中商⼾愿意提供菜单、原图和参考图，并参与⻛格确认和⽅案修\n改，说明需求本⾝存在。\n同时，单版⽣产时间和修改轮次明显下降，也说明这种流程不仅能⽣成内容，⽽且能够降低\n双⽅的沟通成本。\n【原文第8页】\n⼆、你的⻆⾊与职责：你做了什么\n1.回答思路\n这⼀部分必须主动解决⼀个潜在质疑：\n你的岗位是商务经理，为什么可以说⾃⼰做了AI产品？\n不要回避正式岗位，⽽要清晰地区分：\n·正式岗位：本地⽣活商务经理。\n·项⽬⻆⾊：业务需求发起⼈、AI产品⽅案负责⼈、商⼾试点负责⼈和产品运营推动者。\n建议采⽤四层结构回答：\n第⼀层，业务端⼯作。你负责商⼾拓展、洽谈、⼊驻、套餐规划、活动推进和数据复盘。\n第⼆层，产品端⼯作。你识别共性问题、开展需求调研、拆解业务流程、设计产品架构和\nMVP。\n第三层，AI专项⼯作。你负责Prompt结构、参考图规范、⻛格基准、质量评测和失败案例分\n析。\n第四层，项⽬推进⼯作。你推动商⼾试点、跨部⻔协作、内部培训和数据复盘。\n核⼼是让⾯试官听到⼤量明确的“我做了什么”，⽽不是“我们做了什么”。\n2.⾯试官考察⽅向\n2.1 项⽬真实性\n⾯试官会判断：\n【原文第9页】\n·项⽬是不是你主导的？\n·你是不是只负责商⼾沟通？\n·产品功能是谁设计的？\n·Prompt和测试是谁完成的？\n·是否真的有内部推⼴？\n2.2 个⼈贡献\n需要明确你亲⾃负责的产出物，包括：\n·商⼾需求整理\n·业务流程图\n·产品功能架构\n·MVP规划\n·结构化需求采集⽅案\n·Prompt模板\n·质量验收标准\n·商⼾试点\n·效果复盘\n·内部培训\n2.3 产品判断\n⾯试官会关注你做过哪些关键取舍，例如：\n·为什么先服务内部运营，⽽不是直接服务商⼾？\n·为什么先做内容⽣成，⽽不是完整经营平台？\n·为什么需要⼈⼯审核？\n·为什么选择模板和参考图，⽽不是训练模型？\n【原文第10页】\n2.4 推动⼒\n由于你没有直接管理产品、研发和算法团队，⾯试官会看你如何通过业务数据、案例和明确验\n收标准推动不同团队合作。\n2.5 诚实边界\n⾯试官会观察你是否把使⽤⼯具包装成研发平台。主动说清楚底层模型由现有⼯具和AI技术团\n队提供，⾃⼰负责产品⽅案和业务落地，可信度反⽽更⾼。\n3.注意事项\n3.1 不要说⾃⼰“负责整个产品所有⼯作”\n你可以说“我主导了产品⽅案和试点落地”，但不能说⾃⼰独⽴完成了模型开发、前后端系统和\n数据接⼝。\n3.2 少⽤“参与”，多⽤明确动作\n弱表达：\n我参与了需求分析和产品设计。\n强表达：\n我梳理了商⼾⼊驻到经营复盘的全流程，识别出五类⾼频问题，完成产品功能架构、MVP范\n围和质量指标设计。\n3.3 区分商务运营与产品⼯作\n商务运营负责拿到商⼾、理解经营⽬标和推动活动落地；产品⼯作负责将多个商⼾的共性问题\n抽象为流程、功能、规则和指标。\n【原文第11页】\n3.4 重点讲关键决策\n讲任务不如讲决策。建议突出三项决策：\n\u0000.MVP先服务内部运营⼈员。\n\u0000.AI、规则和⼈⼯协同，⽽⾮全⾃动。\n3.先通过模板和Prompt验证，再考虑模型定制。\n3.5 不要把团队内部“约50⼈使⽤”说成50个稳定活跃⽤⼾\n更稳妥的说法是：\n⽅案开始在约50⼈的市场团队中进⾏内部普及、培训和使⽤推⼴。\n⼯作梳理明确记录了⽅案在市场团队内部开始普及，并由约50名同事使⽤。\n4.⻆⾊与职责逐字稿\n我的正式岗位是商务经理，⽇常⼯作包括商⼾拓展、合作洽谈、平台⼊驻、套餐规划、活动\n推进和经营数据复盘。\n但是在这个项⽬中，我承担的不只是商务执⾏，⽽是业务需求发起⼈、AI产品⽅案负责⼈和\n试点推动者三个⻆⾊。\n第⼀，我是需求的发现者。我通过持续拜访和运营商⼾，梳理了商⼾从⼊驻、⻔店装修、套\n餐上架到推⼴和复盘的完整流程，识别出需求沟通、竞品调研、套餐设计、内容⽣产和质量\n验收⼏个⾼频低效环节。\n第⼆，我负责把业务问题转化为产品⽅案。我拆解了商⼾项⽬管理、AI需求诊断、竞品分\n析、套餐策略、⽂案与视觉⽣成、内容审核和数据复盘等核⼼模块，设计了⽤⼾流程和MVP\n范围。\n我的⼀个关键判断是，MVP阶段不直接让商⼾完全⾃助，⽽是优先服务内部商务和运营⼈\n员。因为内部⼈员熟悉商⼾信息和平台规则，既可以降低商⼾使⽤⻔槛，⼜能够对早期AI结\n果进⾏⼈⼯审核。\n【原文第12页】\n第三，我重点负责AI内容⽣产⽅案和质量体系。我设计了结构化需求采集⽅式，把商⼾的模\n糊诉求拆成品牌、⽬标⽤⼾、使⽤场景、视觉⻛格和真实性约束；同时整理了分层提⽰词、\n参考图使⽤规范、⻛格基准和质量验收标准。\n在具体问题解决上，菜品⽣成初期存在⻝材失真和⻛格漂移，我把失败案例分成真实性、视\n觉效果和品牌⼀致性⼏类，先后测试了5类⽅案，最终形成三层提⽰词和3版样⽚确认机制。\n第四，我负责试点和产品运营。我选取真实餐饮商⼾进⾏测试，参与商⼾需求沟通、资料整\n理、内容⽣成、质量审核和经营数据复盘，并将验证有效的⽅法沉淀成SOP和模板。\n在跨部⻔协作上，我会把商⼾问题整理成结构化需求，对接AI技术⽀持团队验证图⽚和模型\n效果，也会和产品、内容运营、商业化及技术团队沟通套餐上架、活动资源、直播和核销系\n统问题。\n所以我在这个项⽬中的核⼼贡献，不是单纯使⽤AI⼯具⽣成内容，⽽是从业务中定义问题，\n把解决⽅案抽象为产品流程，再推动它完成真实商⼾验证和内部复⽤。\n5.⻆⾊与职责问题QA\nQ\u0000：你是商务经理，为什么要转AI产品？\n我的商务经历让我⻓期处在⽤⼾和业务⼀线，能够看到商⼾真正愿意为什么付费、哪些⼯作\n只是表⾯需求、哪些问题可以规模化。\n在这个项⽬中，我进⼀步承担了需求抽象、产品流程、AI⽅案、评测指标和试点运营等⼯\n作。我发现⾃⼰的优势不是只完成⼀单商务合作，⽽是能够将多个客⼾的共性问题沉淀成⼀\n套可复制的产品⽅案。\n所以转AI产品不是完全跨⾏业，⽽是从单客⼾交付⾛向产品化和规模化解决问题。\nQ\u0000：这个产品是你提出的吗？\n项⽬机会最初是我在商⼾运营过程中提出的。\n我前期先完整熟悉了商⼾⼊驻、⻔店装修、货盘设计、达⼈推⼴和数据复盘流程，在能够区\n分个性问题和共性问题后，才开始验证AIGC⽅案。\n后续我整理了产品逻辑、测试⽅案和商⼾案例，再向Leader和相关团队同步并推动内部使\n⽤。\n【原文第13页】\nQ\u0000：你具体交付了哪些产品⽂档？\n我主要完成了业务流程梳理、⽤⼾⻆⾊和痛点分析、产品功能架构、核⼼使⽤流程、MVP范\n围、功能需求说明、Prompt模板、视觉⽣成规则、内容质量标准和效果指标。\n如果进⼀步系统开发，这些内容可以继续拆成详细PRD、原型和技术接⼝需求。\nQ\u0000：技术团队做了什么，你做了什么？\nAI技术⽀持团队主要帮助验证现有模型和⼯具的能⼒边界，例如图⽚⽣成质量、参考图理解\n效果和市场信息分析能⼒。\n我负责定义业务问题、输⼊信息、产品流程、模型需要输出什么、什么结果算合格，并通过\n真实商⼾案例进⾏测试和验收。\n换句话说，技术团队解决“模型能不能实现”，我负责解决“业务为什么需要、产品应该怎么\n⽤、结果怎么判断”。\nQ\u0000：你最关键的产品决策是什么？\n最关键的决策是先做内部运营⼈员使⽤的MVP，⽽不是直接做商⼾⾃助平台。\n早期AI结果仍然存在菜品失真、⻛格不稳定和事实错误⻛险。如果直接给商⼾使⽤，商⼾需\n要⾃⼰理解提⽰词，也缺少判断模型结果的能⼒。\n通过运营⼈员先使⽤，可以快速验证效果，也能够保留⼈⼯审核，降低业务⻛险。\nQ\u0000：你有没有做⽤⼾调研？\n有，但调研不是⼀次正式问卷，⽽是结合商⼾拜访、需求沟通、⽅案确认、修改意⻅和上线\n复盘持续进⾏。\n我主要调研了三类对象：中⼩单店、连锁商⼾和内部商务运营⼈员。\n中⼩商⼾更关注成本和快速上线，连锁商⼾更关注品牌⼀致和批量处理，内部运营更关注输\n⼊是否简单、⽣成是否稳定以及能否减少修改。\n【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。\n</pre></div>", "p3": "<div class=\"freq-summary\">⭐ 追问集中区</div><h2>三、核心功能与实现 <span class=\"freq-badge freq-3\">关键决策</span></h2><div class=\"kp-box kp-framework\" style=\"margin-bottom:12px\"><strong>🧠 记忆辅助：</strong>对比混淆：三层Prompt各司其职，传统Prompt一段长指令。</div><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第14页】\nQ\u0000：你如何证明⾃⼰不是只会写Prompt？\nPrompt只是⽅案的⼀部分。\n我还做了⽤⼾分析、业务流程、功能设计、数据规则、质量评测、⼈⼯审核和产品运营。⽐\n如套餐定价不能靠Prompt解决，需要结构化菜品、成本和竞品数据；商⼾确认和版本管理也\n属于产品流程问题。\n我的重点是让AI完成真实业务任务，⽽不是只优化⼀次模型回答。\nQ\u0000：你如何推动没有汇报关系的团队？\n我会把问题转换成对⽅可以执⾏的信息。\n对AI技术⽀持团队，我提供具体失败案例、输⼊参数、期望结果和验收标准；对产品团队，\n我整理多个商⼾反复出现的共性需求；对商业化和内容运营团队，我会明确商⼾活动⽬标、\n资源需求、上线时间和预期指标。\n这样沟通的不是“我觉得效果不好”，⽽是⼀个有场景、数据和优先级的需求。\nQ\u0000：项⽬中你花时间最多的⼯作是什么？\n前期花时间最多的是需求拆解和⽣成质量调试。\n商⼾的需求⾮常模糊，需要反复确认哪些是事实，哪些是偏好；图⽚⽣成⼜容易出现视觉好\n看但⻝材不真实的问题。\n后期花时间最多的是标准化，把个⼈能够完成的流程整理成其他同事也能复⽤的模板和验收\n标准。\nQ\u0000\u0000：你最⼤的个⼈贡献是什么？\n我认为最⼤的贡献是完成了从“个⼈使⽤AIGC⼯具”到“可被多⼈复⽤的AI产品⽅案”的转\n换。\n我不仅完成商⼾交付，还进⼀步提炼共性需求、统⼀输⼊标准、搭建提⽰词体系、定义质量\n指标，并将结果沉淀为团队可复⽤的流程。\n【原文第15页】\n三、产品核⼼功能与实现：具体怎么做\n1.回答思路\n核⼼功能不能按照技术能⼒罗列，⽽要按照⽤⼾完成任务的顺序讲述：\n建⽴商⼾项⽬\n→ 收集资料和诊断需求\n→ 分析商圈与竞品\n→ 设计套餐及价格\n→ ⽣成⽂案与视觉内容\n→ 完成质量审核\n→ 商⼾确认并上线\n→ 根据经营数据继续优化\n产品的核⼼不是某⼀个功能，⽽是将原来互相割裂的市场分析、套餐策略和内容⽣产连接起\n来。\n建议将功能分成五个核⼼模块深讲：\n1.商⼾需求智能诊断\n2.商圈竞品分析\n3.套餐策略与定价建议\n\u0000.AI⽂案与视觉⽣成\n5.内容质量审核与经营复盘\n2.⾯试官考察⽅向\n⾯试官会重点判断：\n·功能是否围绕⽤⼾任务设计。\n·AI到底在哪些环节发挥作⽤。\n【原文第16页】\n·是否清楚模型、规则和⼈⼯的边界。\n·是否考虑模型幻觉、图⽚失真和事实错误。\n·功能之间是否有数据衔接。\n·有没有版本管理和反馈闭环。\n·MVP是否合理。\n·是否具备基础技术理解。\n3.注意事项\n3.1 不要堆砌AI术语\n项⽬中不需要强⾏加⼊知识图谱、复杂Agent或模型微调。能够解释清楚⼤模型、多模态、图\n像⽣成、规则和⼈⼯审核已经⾜够。\n3.2 不要说“系统⾃动抓取所有竞品”\n试点阶段更真实的⽅式是⼈⼯收集、表格整理、截图识别和内部授权数据。\n3.3 不要说“系统⾃动给商⼾定价”\nAI提供建议，规则负责基础测算，商⼾和运营负责确认。\n3.4 不要把内容审核说成完全⾃动化\n试点阶段主要是模型辅助与⼈⼯验收，⾃动质检是产品化⽅向。\n3.1 核⼼功能⼀：商⼾需求智能诊断\n回答思路\n【原文第17页】\n这个功能要解决的根本问题不是“商⼾不会写Prompt”，⽽是商⼾本⾝很难将经营⽬标表达为\n可执⾏的内容标准。\n讲述结构：\n原始需求模糊\n→ 设计结构化采集\n→ AI解析菜单、图⽚和⾃然语⾔\n→ 对缺失信息定向追问\n→ 运营确认事实字段\n→ 形成统⼀需求基线\n⾯试官考察⽅向\n·如何理解⽤⼾需求。\n·如何处理⾮结构化信息。\n·如何避免模型误读和编造。\n·如何降低⽤⼾填写成本。\n·后续不同功能如何共⽤需求信息。\n注意事项\n·AI提取只能作为候选结果。\n·商⼾名称、菜品、价格、地址、营业时间等必须⼈⼯确认。\n·AI追问不能变成⽆⽌境聊天。\n·需求结构不能过度复杂，否则⽤⼾不愿填写。\n逐字稿内容\n【原文第18页】\n第⼀个核⼼功能是商⼾需求智能诊断。\n我在实际沟通中发现，商⼾的需求通常停留在结果层，⽐如“图⽚要⾼端”“套餐要更有吸引\n⼒”，但模型真正需要的是⽬标⽤⼾、消费场景、品牌调性、主⾊、构图、菜品真实性和图⽚\n⽤途等具体信息。\n所以产品没有让⽤⼾直接写Prompt，⽽是设计了⼀套结构化需求采集⽅式。\n⾸先录⼊商⼾基础经营信息，包括商⼾类型、菜系、⻔店地址、客单价、核⼼菜品和当前套\n餐；其次选择⽬标⽤⼾、主要消费场景和营销⽬标；最后上传菜单、菜品原图、品牌Logo、\n历史素材和参考图。\n多模态模型可以帮助识别菜单中的菜品、菜品图⽚中的主要⻝材，以及参考图中的⾊调、构\n图、光线和背景。⼤语⾔模型则负责理解商⼾的⾃然语⾔描述，把模糊需求拆成结构化参\n数。\n当信息不⾜时，系统不是直接⽣成，⽽是根据任务进⾏定向追问。例如商⼾要设计双⼈套\n餐，但没有填写⽬标价格和必选菜品，系统优先追问这两个信息；如果要⽣成菜品图，就优\n先确认真实⻝材、图⽚⽤途和品牌⻛格。\n所有AI提取结果都要由运营⼈员确认，尤其是菜品、价格和营业时间等事实字段，不能让模\n型⾃⾏补全。\n最终确认后的信息会形成项⽬需求基线。后续竞品分析、套餐、⽂案和视觉内容都引⽤同⼀\n套数据，避免不同模块对商⼾理解不⼀致。\n问题QA\nQ\u0000：为什么需要AI诊断，⽽不是做⼀个普通表单？\n普通表单适合收集明确字段，但商⼾还会上传菜单、图⽚和⼤量⾃然语⾔描述，这些信息⽆\n法完全依靠固定选项处理。\nAI负责从⾮结构化信息中提取候选内容、发现⽭盾并⽣成追问，表单负责固定事实和规则，\n两者结合效果更好。\nQ\u0000：需求字段很多，⽤⼾会不会觉得填写⿇烦？\n会，所以产品不能⼀次把所有字段全部展⽰。\n我会根据⽤⼾选择的任务动态展⽰必要字段。只⽣成⻔店头图时，不需要填写完整成本和套\n【原文第19页】\n餐利润；要⽣成套餐策略时，再要求补充菜品、价格和成本。\nAI也可以从菜单和历史资料中预填内容，让⽤⼾以确认为主，⽽不是从零录⼊。\nQ\u0000：AI追问如何控制轮数？\n每轮最多展⽰3到5个对结果影响最⼤的缺失问题，并按照任务依赖排序。\n⽤⼾可以暂时跳过，但系统需要说明可能造成的影响，⽐如“未提供真实菜品图，⽣成结果\n仅能⽤于⻛格参考”。\nQ\u0000：如何处理商⼾资料互相冲突？\n系统需要将冲突字段和来源同时展⽰。\n例如菜单显⽰套餐价格是128元，但历史海报写的是138元，系统不能⾃⾏判断，⽽是提⽰⽤\n⼾确认当前有效价格。\n⽤⼾确认后，其他旧数据被标记为历史版本。\nQ\u0000：需求基线修改后怎么办？\n修改关键字段时，系统需要识别受影响内容。\n⽐如套餐价格修改，会影响套餐⽂案、封⾯和活动海报；品牌主⾊修改，会影响视觉素材。\n系统提⽰⽤⼾是否重新⽣成或重新审核，不能让旧内容继续直接使⽤。\n3.2 核⼼功能⼆：商圈与竞品分析\n回答思路\n需要说明AI不是凭空给建议，⽽是基于竞品资料、价格、套餐和评价进⾏分析。\n推荐逻辑：\n【原文第20页】\n数据导⼊\n→ 数据清洗和竞品分类\n→ 价格、套餐、评价和视觉分析\n→ 找到市场空档\n→ 给出可解释建议\n⾯试官考察⽅向\n·数据来源是否合法和可信。\n·数据不完整时如何处理。\n·分析结果能否追溯。\n·AI总结和真实经营判断如何区分。\n·是否避免直接抄袭竞品内容。\n注意事项\n·不要夸⼤外部数据获取能⼒。\n·不同平台和时间⼝径不能直接混⽤。\n·样本不⾜时只能给趋势判断。\n·分析结果需要展⽰依据。\n逐字稿内容\n第⼆个模块是商圈与竞品分析。\n原来的做法是运营⼈员在不同平台搜索周边商⼾，⼿⼯整理商⼾距离、客单价、套餐内容、\n价格、销量和⽤⼾评价。整个过程不仅慢，⽽且不同⼈员整理的⼝径不⼀致。\n产品中，我设计了竞品数据导⼊和结构化分析流程。MVP阶段⽀持运营⼈员通过表格、截图\n或内部授权数据导⼊竞品信息，⽽不是默认使⽤未经授权的⾃动爬取。\n数据进⼊系统后，先进⾏商⼾去重、套餐拆分、价格异常识别和数据时间检查。随后根据距\n离、品类、客单价、⽤⼾群体和消费场景，将竞品划分为直接竞品和间接竞品。\n【原文第21页】\nAI主要分析四个⽅⾯。\n第⼀是价格带，判断商圈主流客单价和不同套餐的价格分布。\n第⼆是套餐结构，例如热销套餐通常适合⼏⼈、包含哪些菜品、折扣如何设计。\n第三是⽤⼾评价，将⼤量评价归类为⼝味、分量、服务、环境、价格和核销体验，从中找到\n⽤⼾关注点和未满⾜需求。\n第四是内容表达，例如竞品主图主要突出菜品、环境还是价格，常⽤什么视觉⻛格和卖点。\n最终系统不是只给⼀份总结，⽽是输出可执⾏的市场机会，⽐如某⼀价格带竞争相对较少、\n⽤⼾对双⼈聚餐需求较⾼，或者竞品普遍忽视某个招牌菜卖点。\n每⼀条重要建议都需要展⽰依据，⽤⼾可以看到参考了哪些竞品、什么价格数据和多少条评\n价。这样运营⼈员才能判断是否采⽤，⽽不是盲⽬相信模型。\n问题QA\nQ\u0000：竞品数据准确性如何保证？\n每条竞品数据需要记录来源、采集时间和是否⼈⼯确认。\n系统会识别明显异常值，例如团购价⾼于原价或⽉销量异常，但最终仍需要运营⼈员确认。\n时效过旧或来源不明确的数据不能作为核⼼定价依据。\nQ\u0000：为什么不⽤实时爬⾍？\nMVP阶段的重点是验证分析价值，⽽不是先投⼊⼤量资源建设数据采集系统。\n外部平台数据还涉及授权、反爬和⼝径问题，所以前期采⽤⼈⼯和授权数据导⼊更稳妥。等\n分析能⼒被证明有效后，再评估合规数据接⼝。\nQ\u0000：⽤⼾评价如何分析？\n⼤模型先对评论进⾏主题分类和情感归纳，例如识别⼝味、分量、环境、服务和核销限制。\n但系统需要保留代表性原始评价和样本数量，避免只显⽰模型总结，让运营能够查看依据。\n【原文第22页】\nQ\u0000：如何避免直接复制竞品内容？\n产品只提取市场规律和⻛格特征，不直接复⽤竞品⽂案、图⽚或品牌元素。\n⽣成环节仍然基于⽬标商⼾⾃⼰的菜品、品牌和卖点。\nQ\u0000：竞品数量多少⽐较合适？\n不需要越多越好。\n核⼼是相关性。可以优先选择同商圈、同品类和相近客单价的直接竞品，再补充少量争夺相\n同消费场景的间接竞品。\n样本太少时需要提⽰结论可信度不⾜，样本太多则容易引⼊⼤量⽆关信息。\n3.3 核⼼功能三：套餐设计与定价建议\n回答思路\n套餐模块要体现“AI建议+业务规则+⼈⼯决策”。\n讲述结构：\n建⽴真实菜品池\n→ 选择⽬标⽤⼾和消费场景\n→ ⽣成三档套餐\n→ 规则计算价格与⻛险\n→ AI解释卖点\n→ 商⼾确认\n⾯试官考察⽅向\n·推荐是否建⽴在真实菜品和成本基础上。\n·定价是否可解释。\n【原文第23页】\n·是否考虑⽑利和⻛险。\n·AI是否越权做经营决策。\n·套餐内容与⽂案、图⽚是否联动。\n注意事项\n·AI不能凭空增加菜品。\n·没有成本数据，不能承诺利润。\n·19%的转化提升是综合⽅案结果。\n·套餐确认后需要锁定版本。\n逐字稿内容\n第三个模块是套餐设计与定价建议。\n很多商⼾会直接把线下菜单组合成团购套餐，但没有清晰区分套餐的经营⽬标。有的套餐价\n格低，但没有限制购买条件，会影响利润；有的套餐菜品很多，但⽤⼾看不出核⼼价值；还\n有的套餐和周边竞品⾼度相似。\n我先设计了商⼾菜品池，要求所有套餐菜品必须来⾃真实菜单。每个菜品记录名称、类别、\n原价、成本、适⽤⼈数、是否招牌菜、是否允许加⼊团购和供应限制。\n⽤⼾发起套餐⽣成时，需要选择⽬标⽤⼾、消费场景、适⽤⼈数、价格范围、⽬标⽑利和必\n选菜品。\n产品默认⽣成三类套餐。引流款⽤于降低新客决策⻔槛，主推款承担主要成交，利润款⽤于\n提⾼客单价和商⼾收益。\n每个套餐都会展⽰菜品组合、适⽤⼈数、原价合计、建议团购价、折扣率、核⼼卖点、竞品\n差异和⻛险提⽰。\n其中价格计算不完全由⼤模型完成。菜品原价、成本、⽑利和折扣通过结构化数据和规则计\n算；⼤模型主要负责理解商圈数据、解释套餐定位和⽣成卖点。\n如果商⼾没有提供成本数据，产品只能给出基于竞品的市场参考价，不能声称能够保证利\n润。\n商⼾确认套餐后，这个版本会成为⽂案和图⽚⽣成的统⼀事实来源。如果后续价格或菜品改\n变，相关⽂案和素材必须重新审核。\n【原文第24页】\n问题QA\nQ\u0000：为什么设计引流款、主推款和利润款？\n因为不同套餐承担的业务⽬标不同。\n如果所有套餐都只追求低价，可能带来销量但损害利润；如果都追求⾼客单价，⼜会增加新\n客决策⻔槛。\n通过三层设计，可以同时覆盖获客、成交和收益三个⽬标。\nQ\u0000：AI如何知道哪些菜品适合组合？\n第⼀层依据真实菜品属性和业务规则，例如菜品类别、适⽤⼈数、原价、成本和搭配限制。\n第⼆层结合商圈热销套餐和⽤⼾场景。\n第三层由AI⽣成组合说明和卖点。\n最终仍然需要商⼾确认供应和实际制作能⼒。\nQ\u0000：如何测算价格？\n可以先计算菜品原价合计和成本下限，再参考商⼾⽬标⽑利及商圈同类套餐价格。\n系统输出建议区间和主要依据，⽽不是只给⼀个数字。\n如果建议价和商⼾⽑利⽬标冲突，产品应提⽰经营⻛险，让商⼾决定是调整菜品还是价格。\nQ\u0000：套餐建议错了怎么办？\n⽤⼾可以替换、删除或锁定菜品，系统实时重新计算价格和⻛险。\n套餐属于经营决策，产品不会⾃动发布，必须经过运营和商⼾确认。\nQ\u0000：转化率提升19%如何归因？\n【原文第25页】\n这是套餐结构、价格和视觉内容同步优化后的综合结果，不能全部归因于套餐算法或AI图\n⽚。\n后续更严谨的做法是绑定套餐、⽂案和图⽚版本，通过A/B测试分开验证不同因素。\n3.4 核⼼功能四：AI ⽂案与视觉内容⽣成\n回答思路\n重点说明不是通⽤⽣成，⽽是在事实、品牌和平台规则约束下⽣成可直接交付的内容。\n讲述逻辑：\n引⽤商⼾需求和套餐数据\n→ 区分事实字段与创作字段\n→ ⽣成多个策略版本\n→ 通过品牌模板保持统⼀\n→ ⽀持局部修改和批量⽣成\n⾯试官考察⽅向\n·产品与通⽤AIGC⼯具的差异。\n·多模态具体有什么作⽤。\n·如何避免错误⽂字和品牌问题。\n·如何⽀持单店和连锁商⼾。\n·是否具备可编辑能⼒。\n注意事项\n·不要声称图像模型能够稳定⽣成Logo和价格⽂字。\n【原文第26页】\n·外部参考图只能提取⻛格，不宜直接模仿原创内容。\n·图⽚⽣成必须建⽴在真实菜品素材上。\n·多版本需要有策略差异，不是简单换词。\n逐字稿内容\n第四个模块是AI⽂案和视觉内容⽣产。\n⽂案部分⽀持套餐标题、套餐卖点、⻔店介绍、活动海报⽂案、达⼈探店脚本和直播卖点。\n产品中我将内容分为事实字段和创作字段。商⼾名称、菜品、套餐价格、活动时间和⻔店地\n址属于事实字段，只能从确认后的商⼾和套餐数据中引⽤；卖点包装、表达结构和语⽓属于\n创作字段，由⼤模型⽣成。\n每次默认⽣成多个策略不同的版本。⽐如⼀个版本突出性价⽐，⼀个版本突出招牌菜，⼀个\n版本突出朋友聚餐场景。这样⽤⼾选择的是不同营销⽅向，⽽不是⼏个同义词版本。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。系统通过多模态能⼒理解真实菜品\n图和参考图，提取⻝材、摆盘、⾊调、构图、光线和背景等信息，再转化为⽣成参数。\n对单店商⼾，重点是根据商⼾偏好形成专属⻛格；对连锁商⼾，则通过品牌模板固定Logo、\n标准⾊、字体、语⽓和强制元素，只替换⻔店、商圈和套餐等本地化信息。\n图⽚中的价格、套餐名称和Logo不直接依赖图像模型⽣成，⽽是通过可编辑的排版组件添\n加，避免出现乱码和事实错误。\n⽤⼾可以对结果进⾏局部修改，例如替换背景、提⾼亮度、调整构图或重新⽣成某个区域，\n⽽不是每次都从头⽣成。\n问题QA\nQ\u0000：这个功能和即梦、Midjourney有什么区别？\n底层可能会调⽤类似的⽣成能⼒，但产品层的价值不同。\n通⽤⼯具不知道商⼾真实菜品、套餐和品牌规范，也没有商⼾需求诊断、版本管理、质量审\n核和经营数据回流。\n我们提供的是⼀套⾯向餐饮业务的⼯作流，⽽不是单个⽣成⼊⼝。\n【原文第27页】\nQ\u0000：多模态具体⽤在哪⾥？\n第⼀，解析菜单、菜品图和参考图。\n第⼆，将图⽚中的⾊调、构图、光线和摆盘转化为⽣成参数。\n第三，⽐较⽣成图与真实菜品图，辅助检查⻝材和⻛格⼀致性。\nQ\u0000：如何⽀持连锁商⼾？\n总部先配置统⼀品牌模板，包括Logo、主⾊、字体、品牌语⽓和禁⽌元素。\n不同⻔店继承统⼀模板，只替换地址、商圈、套餐和区域活动内容。\n这样既能统⼀品牌，也能完成本地化批量⽣产。\nQ\u0000：商⼾提供竞品图让你模仿怎么办？\n产品可以提取通⽤⻛格特征，例如暖⾊调、俯拍构图和中式器⽫，但不能直接复制竞品的品\n牌、⽂字和具有独创性的设计。\n最终内容必须使⽤商⼾⾃⾝菜品和品牌资产。\nQ\u0000：为什么不⽤模型直接⽣成海报⽂字？\n图像模型⽣成⽂字的稳定性和准确性不⾜，尤其是价格、套餐名称等强事实信息不能出现错\n误。\n所以更合理的产品⽅案是由图像模型⽣成背景和主体，再通过可编辑图层添加⽂字、Logo和\n价格。\n3.5 核⼼功能五：Prompt 与质量评测体系\n回答思路\n这⼀部分⼀定要⽤具体问题讲，不要停留在“我优化了Prompt”。\n【原文第28页】\n推荐结构：\n初期问题\n→ 建⽴问题分类\n→ 测试5类⽅案\n→ 三层Prompt\n→ ⻛格基准\n→ 质量标准\n→ 数据结果\n⾯试官考察⽅向\n·是否真正做过测试。\n·是否具备问题归因能⼒。\n·指标如何定义。\n·如何将经验模板化。\n·如何处理AI输出不稳定。\n注意事项\n·40%到85%是试点⼈⼯验收数据。\n·不能只⽤“好不好看”评价。\n·Prompt不能解决所有问题，原始素材和审核流程也很重要。\n·“三层提⽰词”需要具体解释每⼀层。\n逐字稿内容\n项⽬中最难的不是模型⽣成不出图⽚，⽽是有些结果视觉上很好看，但和商⼾真实菜品不⼀\n致。\n初期主要出现四类问题：第⼀是核⼼⻝材发⽣变化；第⼆是菜品分量和摆盘明显失真；第三\n【原文第29页】\n是不同批次⻛格不⼀致；第四是商⼾只能在⽣成后说“不喜欢”，导致修改轮次很多。\n我没有继续单纯增加形容词，⽽是先将失败问题分类，再测试不同解决⽅式。测试内容包括\n补充菜品事实、增加参考图、加⼊负向约束、拆分提⽰词层级和建⽴商⼾⻛格基准，共测试\n了5类优化⽅向。\n最终我们使⽤三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和平台尺⼨，解决“要⽣成什\n么”的问题。\n第⼆层是视觉⻛格，包括⾊调、光线、构图、背景、餐具和摆盘，解决“应该怎么呈现”的\n问题。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌出现的元素和常⻅变形，解\n决“哪些错误不能发⽣”的问题。\n同时，在批量⽣产之前先输出3版⻛格样⽚，让商⼾确认⼀套作为单店⻛格基准。后续内容都\n沿⽤这个基准，降低⻛格漂移。\n在评测上，我们不只看图⽚是否美观，⽽是看菜品主体、核⼼⻝材、分量、烹饪状态、品牌\n⻛格和是否可以上线。\n通过这套优化，菜品还原合格率从40%提升到85%，平均修改轮次从5轮下降到2到3轮，单\n版素材平均⽣产时间从30分钟缩短到10分钟。\n问题QA\nQ\u0000：菜品还原合格率具体怎么计算？\n试点阶段采⽤⼈⼯验收。\n每张图按照菜品主体正确、核⼼⻝材没有明显新增或缺失、分量没有严重失真、烹饪状态基\n本⼀致、整体可以⽤于商⼾⻚⾯⼏个条件进⾏判断。\n合格图⽚数量除以全部⽣成并参与验收的图⽚数量，就是菜品还原合格率。\n后续产品化后，我会把这些维度拆成独⽴评分，并建⽴固定测试集。\nQ\u0000：为什么三层Prompt有效？\n因为不同问题被拆到了不同层。\n如果⻝材错误，只需要调整真实性约束；如果品牌感觉不对，则调整视觉层；如果图⽚⽤途\n【原文第30页】\n改变，则调整业务场景层。\n这种⽅式⽐⼀条很⻓、没有结构的Prompt更⽅便复⽤和定位问题。\nQ\u0000：Prompt越⻓是不是效果越好？\n不⼀定。\nPrompt过⻓可能出现约束冲突或模型忽略重点。关键是明确字段优先级和强约束。\n对于真实菜品和禁⽌内容，需要明确且靠前；对于装饰细节可以作为可选项。\nQ\u0000：如何处理不同模型的效果差异？\n需要建⽴相同测试集，在相同输⼊和验收标准下对⽐模型。\n不只⽐较视觉效果，还要⽐较菜品还原、⻛格稳定、⽣成速度和成本，再根据任务选择模\n型，⽽不是固定只⽤⼀个⼯具。\nQ\u0000：为什么还需要⼈⼯审核？\n餐饮视觉错误往往很隐蔽，⼀张图看起来合理，但可能增加了真实菜品没有的⻝材。\n早期模型⽆法完全稳定识别所有问题，所以必须由运营和商⼾进⾏最终确认。\nAI质检的作⽤是降低⼈⼯检查量，⽽不是完全取消⼈⼯责任。\n3.6 核⼼功能六：产品运营、商⼾确认与数据复盘\n回答思路\n产品不能停在“功能设计和内容⽣成”，还要体现：\n·如何让内部同事使⽤。\n·如何收集反馈。\n·如何判断产品是否成功。\n【原文第31页】\n·如何从经营数据反向优化产品。\n⾯试官考察⽅向\n·是否具备产品运营思维。\n·是否关注采⽤率和留存。\n·是否具备数据闭环。\n·是否理解业务结果归因。\n·是否可以推动规模化使⽤。\n注意事项\n·50⼈是内部推⼴或使⽤范围，不宜包装成稳定MAU。\n·转化变化受到套餐、流量和活动资源影响。\n·⽣成数量不是北极星指标。\n·内部推⼴要讲阻⼒和解决⽅法。\n逐字稿内容\n内容⽣成以后，我没有把项⽬视为结束，还进⼀步设计了商⼾确认和数据复盘流程。\n在商⼾确认环节，运营⼈员先审核套餐、⽂案和图⽚，再将候选⽅案发送给商⼾。商⼾可以\n选择版本，也可以对具体图⽚或⽂案提出意⻅。\n对商⼾的⾃然语⾔反馈，AI可以辅助拆成结构化修改任务。例如商⼾说“图⽚太暗，⽜⾁看\n起来不真实”，系统可以拆成提⾼亮度、调整⾊温和强化⽜⾁纹理三个修改项，运营确认后再\n重新⽣成。\n在产品运营上，我将需求采集表、⻛格标签、参考图、提⽰词模板、套餐分析和验收标准沉\n淀成SOP，并通过案例演⽰和使⽤培训推动市场团队使⽤。⼯作记录中，⽅案后续在约50⼈\n的市场团队范围内进⾏了内部普及和使⽤。\n我不会只看⽣成了多少内容，⽽是将指标分成使⽤、效率、质量和业务四类。\n使⽤指标包括项⽬创建量和AI⽅案采⽤率；效率指标包括⽣成时间和修改轮次；质量指标包\n【原文第32页】\n括菜品还原率和⾸轮通过率；业务指标包括素材点击、套餐下单和核销。\n内容上线后，根据曝光、点击、下单和核销数据判断问题。如果曝光⾼但点击低，可能是主\n图或卖点问题；如果点击⾼但下单低，更可能是价格、套餐组合或使⽤限制问题。\n数据复盘的结论可以直接触发下⼀轮套餐、⽂案或视觉优化，形成持续迭代闭环。\n问题QA\nQ\u0000：如何推动内部同事使⽤？\n最⼤阻⼒通常不是功能不会⽤，⽽是运营⼈员已有⾃⼰的⼯作⽅法，担⼼标准化⼯具降低灵\n活性。\n所以我不会只做操作培训，⽽是⽤真实案例展⽰⽣产时间、修改轮次和商⼾反馈的变化，同\n时允许运营保留⼈⼯调整空间。\n先证明能够节约时间和降低返⼯，再逐步要求使⽤标准流程。\nQ\u0000：北极星指标是什么？\nMVP阶段，我会选择“AI⽅案被商⼾确认并正式上线的项⽬数”或者“AI⽣成内容采⽤率”。\n因为⽣成数量只说明模型⼯作了，采⽤和上线才说明产品真正帮助⽤⼾完成任务。\nQ\u0000：为什么需要核销数据？\n下单不代表真实消费。\n如果套餐下单⾼但核销低，可能存在预约限制、使⽤周期、⻔店位置或⽤⼾冲动消费问题。\n只有结合核销，才能更完整地判断套餐经营价值。\nQ\u0000：如何处理归因问题？\n必须记录同期是否有达⼈、直播、投流和平台资源变化。\n没有对照组时，只能说综合⽅案上线后指标出现变化，不能说完全由AI导致。\n</pre></div>", "p4": "<div class=\"freq-summary\">⭐ 每个数字都可能追问口径</div><h2>四、业务成果 <span class=\"freq-badge freq-3\">数据必背</span></h2><div class=\"kp-box kp-framework\" style=\"margin-bottom:12px\"><strong>🧠 记忆辅助：</strong>口诀：三十分变十分，五轮变两三轮，四成变八五。</div><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第33页】\n后续可以绑定版本并进⾏A/B测试，分别验证套餐、⽂案和视觉的效果。\nQ\u0000：商⼾反馈如何进⼊产品迭代？\n单个反馈先转成当前项⽬的修改任务；相同问题在多个商⼾中反复出现后，再沉淀为共性需\n求。\n例如多个商⼾都反馈同⼀菜系容易失真，就需要调整⾏业模板或审核规则；多个运营反馈输\n⼊太复杂，则需要优化资料⾃动解析和默认值。\n四、业务成果与影响：有什么价值\n1.回答思路\n业务成果按照四层讲最清楚：\n1.⽣产效率\n2.内容质量\n3.经营结果\n4.组织复⽤\n每个指标按照“原来—后来—原因—价值”展开，⽽不是只报数据。\n2.⾯试官考察⽅向\n·数据是否真实。\n·指标如何计算。\n·是否明确样本范围。\n·能否合理归因。\n·结果是否可持续、可复制。\n【原文第34页】\n·对公司和商⼾分别有什么价值。\n3.注意事项\n·试点覆盖商⼾数量有限，应称为初步验证。\n·19%是套餐与内容综合⽅案结果。\n·50⼈是内部推⼴范围。\n·⽣产时间和修改轮次要说明统计⼝径。\n·不要将“理论上可⽀持百⼈团队”作为已实现结果。\n4.业务成果逐字稿\n项⽬成果主要体现在效率、质量、经营效果和组织复⽤四个层⾯。\n第⼀是⽣产效率。原来⼀版菜品图或⻔店素材从需求沟通、⽣成到调整，平均需要⼤约30分\n钟。通过结构化需求采集、分层提⽰词和⻛格基准，单版素材平均时间缩短到10分钟，减少\n了约三分之⼆。\n第⼆是沟通和质量。原来商⼾通常在⽣成后才表达“不喜欢”，单个项⽬平均需要修改5轮。\n增加3版⻛格样⽚前置确认后，修改轮次下降到2到3轮。\n针对川菜图⽚⻝材失真问题，经过5类⽅案测试和三层提⽰词优化，菜品还原合格率从40%\n提⾼到85%。\n第三是经营策略效率。通过竞品档案和套餐价格分析，将单商⼾市场调研周期从⼤约5天缩短\n到36⼩时以内。\n套餐策略、价格和视觉素材同步上线后，套餐整体下单转化率相较商⼾原有⾃定套餐提升\n19%。这⾥我会明确说明，这是综合⽅案结果，不是单个AI功能的独⽴贡献。\n第四是组织复⽤。我将需求采集、⻛格标签、参考图、提⽰词和质量标准沉淀成流程和模\n板，使⽅案不再依赖某个同事的个⼈经验，并在市场团队内部推动普及使⽤。\n所以这个项⽬最重要的结果不是⽣成了多少张图⽚，⽽是验证了AI能够进⼊真实商⼾经营流\n程，同时改善交付效率、内容质量和部分经营指标。\n5.业务成果问题QA\n【原文第35页】\nQ\u0000：单版素材时间如何统计？\n统计⼝径是从需求基本确认后开始，到形成⼀版可以进⼊商⼾确认的候选素材为⽌，包括提\n⽰词配置、⽣成和基础调整时间。\n不包含商⼾⻓时间未回复造成的等待时间。\n优化前后使⽤同类素材任务进⾏对⽐。\nQ\u0000：修改轮次如何定义？\n商⼾或运营提出⼀轮集中修改意⻅，并重新输出⼀个版本，算作⼀轮。\n同⼀轮中的多个⼩调整不重复计算。\nQ\u0000：菜品还原率40%为什么这么低？\n初期使⽤的是较通⽤的⽣成⽅式，视觉效果虽然不错，但没有⾜够真实菜品和⻝材约束。\n餐饮场景的验收标准⽐普通美图严格，只要核⼼⻝材、分量或烹饪状态出现明显错误，就不\n能算合格，所以初期合格率⽐较低。\nQ\u0000：\u0000\u0000%的样本有多⼤？\n它来⾃试点商⼾的前后⽅案对⽐，属于初步业务验证，不是⼤规模统计结论。\n我会如实说明样本范围有限，价值在于验证⽅向可⾏，后续需要扩⼤商⼾数并进⾏分层测\n试。\nQ\u0000：转化提升是否可能来⾃投流？\n有可能，所以复盘时需要记录是否有达⼈、直播和投流资源变化。\n当前19%是套餐和视觉同步优化后的综合结果，不能做单因素归因。\n这也是我在项⽬反思中认为应该补充版本管理和A/B测试的原因。\n【原文第36页】\nQ\u0000：对商⼾的直接价值是什么？\n更快获得可以使⽤的套餐和营销素材，降低设计、⽂案和市场分析⻔槛；同时商⼾可以在⽣\n成前确认⻛格，减少反复沟通。\nQ\u0000：对平台的价值是什么？\n第⼀，内部团队能够更⾼效服务商⼾。\n第⼆，优质内容和套餐有助于商⼾更快产⽣交易。\n第三，AI⽅案可以作为拓展商⼾时的增值服务，提⾼平台专业度和商⼾合作意愿。\nQ\u0000：对你个⼈的最⼤成果是什么？\n我完成了从单商⼾交付到产品化⽅案的转变。\n不只是解决⼀家商⼾的问题，⽽是将需求、输⼊、⽣成、审核和复盘沉淀成可复⽤的⽅法。\n五、反思与经验：学到了什么\n1.回答思路\n反思需要有真实变化过程：\n最初怎么判断\n→ 遇到什么问题\n→ 为什么原⽅案不⾏\n→ 如何调整\n→ 如果重做怎么优化\n推荐讲四个核⼼反思：\n1.最初过于关注“⽣成”，后来转向“任务完成”。\n</pre></div>", "p5": "<div class=\"freq-summary\">⭐ 考察复盘，敢承认不足</div><h2>五、反思与经验 <span class=\"freq-badge freq-3\">体现成长</span></h2><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第36页】\nQ\u0000：对商⼾的直接价值是什么？\n更快获得可以使⽤的套餐和营销素材，降低设计、⽂案和市场分析⻔槛；同时商⼾可以在⽣\n成前确认⻛格，减少反复沟通。\nQ\u0000：对平台的价值是什么？\n第⼀，内部团队能够更⾼效服务商⼾。\n第⼆，优质内容和套餐有助于商⼾更快产⽣交易。\n第三，AI⽅案可以作为拓展商⼾时的增值服务，提⾼平台专业度和商⼾合作意愿。\nQ\u0000：对你个⼈的最⼤成果是什么？\n我完成了从单商⼾交付到产品化⽅案的转变。\n不只是解决⼀家商⼾的问题，⽽是将需求、输⼊、⽣成、审核和复盘沉淀成可复⽤的⽅法。\n五、反思与经验：学到了什么\n1.回答思路\n反思需要有真实变化过程：\n最初怎么判断\n→ 遇到什么问题\n→ 为什么原⽅案不⾏\n→ 如何调整\n→ 如果重做怎么优化\n推荐讲四个核⼼反思：\n1.最初过于关注“⽣成”，后来转向“任务完成”。\n【原文第37页】\n\u0000.Prompt不是唯⼀答案，输⼊质量和流程确认更重要。\n\u0000.AI必须和规则、⼈⼯共同⼯作。\n4.数据归因、版本管理和⾃动质检仍需加强。\n2.⾯试官考察⽅向\n·是否敢于承认不⾜。\n·能否分析失败原因。\n·是否有迭代思维。\n·是否理解AI产品边界。\n·如果获得更多资源，是否知道下⼀步做什么。\n·项⽬经验是否能迁移到其他⾏业。\n3.注意事项\n·不要将责任全部归因于模型或技术团队。\n·反思不能只说“沟通还需要加强”。\n·不要说项⽬已经没有优化空间。\n·需要区分未做成、没必要做和后续迭代。\n·最好有⼀个具体踩坑案例。\n4.反思与经验逐字稿\n这个项⽬让我最深刻的认识是，AI⽣成成功并不代表⽤⼾任务完成。\n项⽬早期，我⽐较关注⽣成图⽚是否好看，所以最初的优化⽅式也是增加更多视觉描述。但\n实际交付后发现，商⼾不满意的原因不只是审美，⽽是菜品不真实、品牌⻛格不⼀致，以及\n⽣成前双⽅没有对⻬验收标准。\n后来我们把流程从“⼀次⽣成后让商⼾修改”，调整成“先采集结构化需求，再输出3版⻛格\n样⽚确认，之后批量⽣成并进⾏质量验收”。这个变化⽐单纯继续加⻓Prompt更有效。\n【原文第38页】\n第⼆个经验是，Prompt不能解决所有问题。菜品真实性依赖真实原图和明确⻝材约束，价格\n准确依赖结构化数据，品牌⼀致依赖模板，平台合规则依赖规则和⼈⼯审核。\n所以AI产品需要明确模型、规则和⼈⼯各⾃负责什么，⽽不是把所有任务都交给⼤模型。\n第三个反思是，MVP范围⼀开始还可以更聚焦。需求诊断、竞品、套餐、⽂案、视觉和复盘\n都有价值，但资源有限时，我会先做好需求诊断、内容⽣成和质量审核这三个最核⼼的闭\n环，再逐步扩展经营策略和数据分析。\n第四个不⾜是数据归因。试点中套餐、价格、视觉和营销资源可能同时变化，所以虽然整体\n下单转化出现改善，但难以严格判断每个模块的独⽴贡献。\n如果重新做，我会从第⼀天建⽴内容版本绑定和A/B测试机制，记录每个套餐、⽂案和图⽚\n的使⽤周期，以及同期达⼈、直播和投流变化。\n第五个不⾜是⾃动化程度。试点阶段竞品资料仍然主要由⼈⼯整理，质量审核也依赖⼈⼯。\n如果进⼊下⼀阶段，我会优先完善数据接⼊、⾃动审核、品牌模板和多⻔店批量任务，⽽不\n是继续增加更多内容类型。\n我最终形成的⽅法论是：先找到⾼频、重复、可标准化的真实任务，再明确AI、规则和⼈⼯\n的边界，通过固定评测和业务数据判断产品是否真正完成⽤⼾⽬标。\n5.反思与经验问题QA\nQ\u0000：项⽬中最⼤的踩坑是什么？\n最⼤的踩坑是最开始把问题定义成“怎么⽣成更好看的图⽚”。\n我们在Prompt中增加了很多视觉词，但商⼾仍然频繁修改。后来发现，真正缺少的是⽣成前\n的需求对⻬和真实性约束。\n加⼊结构化需求和⻛格样⽚后，修改轮次才明显下降。\nQ\u0000：有什么想做但没有做成？\n我原本希望⾃动接⼊曝光、点击、下单和核销数据，建⽴更完整的内容效果归因和推荐机\n制。\n但受到数据权限、系统接⼊和项⽬周期限制，试点阶段主要依靠⼈⼯整理和复盘，没有完成\n完整⾃动化闭环。\n这是项⽬后续最值得补强的能⼒。\n【原文第39页】\nQ\u0000：如果重做⼀次，你会优先做哪三个功能？\n第⼀是结构化需求诊断，保证模型拿到正确输⼊。\n第⼆是品牌和真实性约束下的内容⽣成，直接解决最⾼频⼯作。\n第三是质量审核，保证内容可以安全交付。\n竞品分析和经营数据闭环可以在核⼼内容链路稳定后扩展。\nQ\u0000：如果模型效果⼀直⽆法达到85%怎么办？\n需要判断问题是模型能⼒、输⼊素材还是使⽤场景本⾝不适合。\n可以收窄⽣成范围，例如只优化背景和光线，不重新⽣成菜品主体；对真实性要求特别⾼的\n菜品，采⽤真实拍摄加AI后期，⽽不是完整⽣成。\n产品经理不能为了使⽤AI⽽强⾏使⽤AI。\nQ\u0000：你觉得这个产品最⼤的⻛险是什么？\n最⼤⻛险是AI⽣成内容视觉上合理，但事实不真实，导致消费者误解。\n因此产品必须使⽤真实菜品和套餐数据，设置强事实约束，并保留运营和商⼾确认。\nQ\u0000：这个项⽬最体现你成⻓的地⽅是什么？\n以前我更关注单个商⼾能否顺利交付，后来我开始关注如何把多个商⼾的共性需求抽象成流\n程、模板、指标和产品能⼒。\n这是我从商务运营向AI产品思维转变的关键。\nQ\u0000：你的⽅法可以迁移到其他⾏业吗？\n【原文第40页】\n可以。\n核⼼⽅法不是餐饮图⽚，⽽是将B端客⼾模糊需求转化为结构化输⼊，将AI嵌⼊业务⼯作流，\n并建⽴输出评测和⼈⼯审核。\n它可以迁移到零售、电商、本地服务和企业内容⽣产等场景。\nQ\u0000：为什么不⽤Agent？\n项⽬早期流程⽐较明确，需求采集、分析、⽣成和审核都有固定依赖，⽤可控⼯作流更合\n适。\nAgent可以在后续⽤于处理更复杂的经营⽬标，例如⾃动拆解活动任务、调⽤数据⼯具和持\n续跟踪结果，但MVP阶段引⼊⾃主Agent会增加不可控性。\nQ\u0000：为什么不⽤RAG？\nMVP阶段主要信息是商⼾资料、品牌规则、套餐和少量模板，直接通过结构化数据和模板调\n⽤就能满⾜。\n后续⾏业案例、品牌⽂档和平台规范规模扩⼤后，可以使⽤RAG检索相关规则和优秀案例，\n但不是早期必要条件。\nQ\u0000\u0000：如何看待AI替代运营⼈员？\n我不认为这个项⽬要完全替代运营。\nAI更适合完成资料总结、初稿⽣成和批量处理；运营⼈员负责商⼾沟通、经营判断、资源协\n调和⻛险确认。\n产品⽬标是让运营从重复⽣产转向⾼价值决策，⽽不是取消⼈⼯。\n六、2—3 分钟简版逐字稿\n</pre></div>", "p6": "<div class=\"freq-summary\">⭐ 时间紧张时用</div><h2>六、2-3分钟简版 <span class=\"freq-badge freq-2\">面试常用</span></h2><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第40页】\n可以。\n核⼼⽅法不是餐饮图⽚，⽽是将B端客⼾模糊需求转化为结构化输⼊，将AI嵌⼊业务⼯作流，\n并建⽴输出评测和⼈⼯审核。\n它可以迁移到零售、电商、本地服务和企业内容⽣产等场景。\nQ\u0000：为什么不⽤Agent？\n项⽬早期流程⽐较明确，需求采集、分析、⽣成和审核都有固定依赖，⽤可控⼯作流更合\n适。\nAgent可以在后续⽤于处理更复杂的经营⽬标，例如⾃动拆解活动任务、调⽤数据⼯具和持\n续跟踪结果，但MVP阶段引⼊⾃主Agent会增加不可控性。\nQ\u0000：为什么不⽤RAG？\nMVP阶段主要信息是商⼾资料、品牌规则、套餐和少量模板，直接通过结构化数据和模板调\n⽤就能满⾜。\n后续⾏业案例、品牌⽂档和平台规范规模扩⼤后，可以使⽤RAG检索相关规则和优秀案例，\n但不是早期必要条件。\nQ\u0000\u0000：如何看待AI替代运营⼈员？\n我不认为这个项⽬要完全替代运营。\nAI更适合完成资料总结、初稿⽣成和批量处理；运营⼈员负责商⼾沟通、经营判断、资源协\n调和⻛险确认。\n产品⽬标是让运营从重复⽣产转向⾼价值决策，⽽不是取消⼈⼯。\n六、2—3 分钟简版逐字稿\n【原文第41页】\n我在字节跳动本地⽣活主要负责餐饮商⼾的拓展、⼊驻、套餐规划、营销活动和经营复盘。\n在服务商⼾的过程中，我发现很多商⼾虽然完成了平台⼊驻，但并不具备完整的线上经营能\n⼒。中⼩商⼾缺少设计、⽂案和市场分析⼈员，连锁商⼾则⾯临多⻔店内容统⼀和本地化⽣\n产的问题。内部运营⼈员也需要反复进⾏竞品调研、套餐设计和素材制作，效率低且依赖个\n⼈经验。\n因此，我主导设计并推动试点了餐饮商⼾AI营销经营助⼿。产品⾯向内部商务、运营和餐饮\n商⼾，覆盖需求诊断、商圈竞品分析、套餐与定价建议、营销⽂案和视觉⽣成、质量审核及\n经营复盘。\n我的正式岗位是商务经理，但在项⽬中主要承担业务需求发起⼈、产品⽅案负责⼈和试点推\n动者。我梳理了商⼾从⼊驻到经营复盘的全流程，完成核⼼功能架构、MVP规划、Prompt模\n板、质量标准和效果指标设计。\n在需求端，我们通过结构化表单、菜单、菜品原图和参考图，将商⼾“图⽚更好看”“套餐更\n吸引⼈”等模糊诉求，拆解成⽬标⽤⼾、品牌⻛格、内容场景和真实性约束。\n在经营端，结合商圈竞品、价格和⽤⼾评价，⽣成引流款、主推款和利润款三档套餐建议。\n在内容端，通过⼤模型和多模态能⼒⽣成套餐标题、营销⽂案、菜品图、⻔店头图和活动海\n报。\n项⽬中最⼤的挑战是菜品真实性。我测试了5类⽅案，最终建⽴“业务场景—视觉⻛格—真实\n性约束”三层提⽰词，并通过3版样⽚前置确认商⼾⻛格。\n最终，单版素材⽣产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2到3轮，菜品还原\n合格率从40%提升到85%；市场调研周期从约5天缩短到36⼩时以内，套餐与视觉⽅案同步\n上线后，下单转化率较原⽅案提升19%。\n这个项⽬让我认识到，AI产品不是单纯接⼊模型，⽽是要把需求理解、模型⽣成、业务规\n则、⼈⼯审核和数据优化连接成完整闭环。\n七、5—7 分钟完整逐字稿\n我介绍⼀下我在字节跳动本地⽣活业务期间主导设计并推动试点的餐饮商⼾AI营销经营助\n⼿。\n我当时担任商务经理，主要负责餐饮商⼾拓展、平台⼊驻、⻔店装修、套餐规划、活动运营\n和后续经营复盘。在实际服务过程中，我发现商⼾完成⼊驻以后，并不代表已经具备线上经\n营能⼒。\n对中⼩商⼾来说，他们通常没有专业的设计、⽂案和市场分析团队。商⼾很懂线下菜品和经\n营，但不⼀定熟悉平台⽤⼾、团购套餐和线上内容。他们经常只能提出“把菜做得更好\n</pre></div>", "p7": "<div class=\"freq-summary\">⭐ 时间充裕时用，录音回听</div><h2>七、5-7分钟完整版 <span class=\"freq-badge freq-2\">模拟面试用</span></h2><div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-height:70vh;overflow-y:auto\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">【原文第41页】\n我在字节跳动本地⽣活主要负责餐饮商⼾的拓展、⼊驻、套餐规划、营销活动和经营复盘。\n在服务商⼾的过程中，我发现很多商⼾虽然完成了平台⼊驻，但并不具备完整的线上经营能\n⼒。中⼩商⼾缺少设计、⽂案和市场分析⼈员，连锁商⼾则⾯临多⻔店内容统⼀和本地化⽣\n产的问题。内部运营⼈员也需要反复进⾏竞品调研、套餐设计和素材制作，效率低且依赖个\n⼈经验。\n因此，我主导设计并推动试点了餐饮商⼾AI营销经营助⼿。产品⾯向内部商务、运营和餐饮\n商⼾，覆盖需求诊断、商圈竞品分析、套餐与定价建议、营销⽂案和视觉⽣成、质量审核及\n经营复盘。\n我的正式岗位是商务经理，但在项⽬中主要承担业务需求发起⼈、产品⽅案负责⼈和试点推\n动者。我梳理了商⼾从⼊驻到经营复盘的全流程，完成核⼼功能架构、MVP规划、Prompt模\n板、质量标准和效果指标设计。\n在需求端，我们通过结构化表单、菜单、菜品原图和参考图，将商⼾“图⽚更好看”“套餐更\n吸引⼈”等模糊诉求，拆解成⽬标⽤⼾、品牌⻛格、内容场景和真实性约束。\n在经营端，结合商圈竞品、价格和⽤⼾评价，⽣成引流款、主推款和利润款三档套餐建议。\n在内容端，通过⼤模型和多模态能⼒⽣成套餐标题、营销⽂案、菜品图、⻔店头图和活动海\n报。\n项⽬中最⼤的挑战是菜品真实性。我测试了5类⽅案，最终建⽴“业务场景—视觉⻛格—真实\n性约束”三层提⽰词，并通过3版样⽚前置确认商⼾⻛格。\n最终，单版素材⽣产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2到3轮，菜品还原\n合格率从40%提升到85%；市场调研周期从约5天缩短到36⼩时以内，套餐与视觉⽅案同步\n上线后，下单转化率较原⽅案提升19%。\n这个项⽬让我认识到，AI产品不是单纯接⼊模型，⽽是要把需求理解、模型⽣成、业务规\n则、⼈⼯审核和数据优化连接成完整闭环。\n七、5—7 分钟完整逐字稿\n我介绍⼀下我在字节跳动本地⽣活业务期间主导设计并推动试点的餐饮商⼾AI营销经营助\n⼿。\n我当时担任商务经理，主要负责餐饮商⼾拓展、平台⼊驻、⻔店装修、套餐规划、活动运营\n和后续经营复盘。在实际服务过程中，我发现商⼾完成⼊驻以后，并不代表已经具备线上经\n营能⼒。\n对中⼩商⼾来说，他们通常没有专业的设计、⽂案和市场分析团队。商⼾很懂线下菜品和经\n营，但不⼀定熟悉平台⽤⼾、团购套餐和线上内容。他们经常只能提出“把菜做得更好\n【原文第42页】\n看”“套餐更吸引⼈”或者“参考附近卖得好的店”这类模糊需求。\n对连锁商⼾来说，总部希望品牌⻛格统⼀，但不同城市和⻔店⼜需要根据本地商圈、客单价\n和⽤⼾做差异化内容。\n对内部商务和运营⼈员来说，商圈调研、套餐定价、⽂案撰写和⻔店装修都是⾼频重复⼯\n作，需要在多个平台中查询信息，很多经验依赖个⼈，很难规模化复制。\n所以我判断，这不是单纯的图⽚制作问题，⽽是商⼾从⼊驻到经营过程中，需求理解、经营\n策略和营销内容相互割裂的问题。\n我主导设计了⼀套餐饮商⼾AI营销经营助⼿，产品主要⾯向内部商务、运营⼈员和餐饮商\n⼾，覆盖AI需求诊断、商圈竞品分析、套餐策略、⽂案与视觉⽣成、质量审核和经营复盘。\n我的正式岗位是商务经理，但在项⽬中承担的是业务需求发起⼈、AI产品⽅案负责⼈和试点\n推动者。我⾸先梳理了商⼾⼊驻、⻔店装修、套餐上架、推⼴和复盘的完整流程，识别⾼频\n低效环节，再完成产品功能架构、MVP范围、Prompt模板、质量验收和数据指标设计。\n产品第⼀个核⼼功能是商⼾需求智能诊断。我们没有让商⼾直接写Prompt，⽽是通过结构化\n表单收集商⼾地址、菜系、客单价、核⼼菜品、⽬标⽤⼾和营销⽬标，并⽀持上传菜单、菜\n品原图、品牌Logo和参考图。\n多模态能⼒帮助识别菜单、菜品和参考图，⼤语⾔模型将⾃然语⾔需求拆成品牌、⽤⼾、场\n景、视觉和真实性参数。价格、菜品和营业时间等事实字段必须经过⼈⼯确认，最终形成统\n⼀需求基线。\n第⼆个功能是商圈竞品分析。运营⼈员导⼊周边商⼾的套餐、价格、销量和评价，系统分析\n商圈价格带、热销套餐结构、⽤⼾关注点和竞品视觉策略，并给出可解释的市场机会。\n第三个功能是套餐设计。系统基于真实菜品池、成本、⽬标⽤⼾和竞品数据，⽣成引流款、\n主推款和利润款三档⽅案。价格和⽑利通过结构化规则测算，⼤模型主要负责套餐定位、市\n场差异和卖点表达，最终由商⼾和运营确认。\n第四个功能是⽂案和视觉内容⽣产。⽂案⽀持套餐标题、卖点、⻔店介绍、达⼈脚本和活动\n⽂案。商⼾名称、价格、菜品和活动时间属于强事实字段，只能引⽤确认数据。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。系统先理解真实菜品图和参考图中\n的⻝材、构图、光线和⾊调，再⽣成候选⽅案。\n项⽬中最⼤的挑战是菜品真实性。初期图⽚视觉上⽐较好看，但经常出现⻝材变化、分量失\n真、摆盘错误和不同批次⻛格漂移。\n我将问题分成真实性、视觉和品牌⼀致性⼏类，先后测试了5类⽅案，最终形成三层提⽰词。\n第⼀层是菜品、⽤⼾和使⽤场景；第⼆层是⾊调、构图、光线和餐具；第三层是核⼼⻝材、\n分量、烹饪状态和禁⽌元素。\n同时，批量⽣成前先输出3版⻛格样⽚，由商⼾确认⼀版作为单店⻛格基准，后续素材统⼀继\n承。\n在评测上，我们不只看好不好看，⽽是判断菜品主体、核⼼⻝材、分量、烹饪状态、品牌⻛\n【原文第43页】\n格和是否可以上线。\n经过优化，菜品还原合格率从40%提升到85%，单项⽬平均修改轮次从5轮下降到2到3轮，\n单版素材平均⽣产时间从30分钟缩短到10分钟。\n竞品分析和套餐策略⽅⾯，单商⼾市场调研周期从约5天缩短到36⼩时以内；套餐策略、价\n格和视觉素材同步上线后，下单转化率相较商⼾原有⽅案提升19%。我会明确说明，这是综\n合⽅案的结果，不能全部归因于某个AI功能。\n在产品运营⽅⾯，我将需求采集、⻛格标签、参考图、提⽰词、套餐分析和验收标准沉淀成\nSOP，并在市场团队内部进⾏案例培训和使⽤推⼴，⽅案进⼊约50⼈团队的内部普及范围。\n项⽬也存在不⾜。第⼀，试点阶段竞品数据仍然需要⼈⼯整理；第⼆，质量审核主要是模型\n辅助和⼈⼯验收，⾃动质检还没有完整系统化；第三，套餐、视觉和营销资源经常同时变\n化，效果归因还不够严格。\n如果重新做，我会进⼀步收敛MVP，优先做好需求诊断、品牌约束下的内容⽣成和质量审\n核，并从第⼀天建⽴固定测试集、版本绑定和A/B测试机制。\n这个项⽬让我形成的核⼼认识是，AI产品不能只关注模型有没有⽣成结果，⽽要定义⽤⼾任\n务完成标准，明确AI、规则和⼈⼯各⾃负责什么，并通过真实业务指标判断产品是否真正创\n造价值。\n\u0000 words\n</pre></div>", "r1": "<div class=\"freq-summary\">⭐ 定调回答</div><h2>一、职业主线 <span class=\"freq-badge freq-3\">定调</span></h2><div class=\"kp-box kp-framework\"><strong>🧠 故事线：</strong>创业→人事→社交平台→字节→AI产品。同一条能力线。</div><div style=\"max-height:70vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">ZYL- 完整简历⾯试逐字稿\n📌 原⽂链接：https://qcnfs\u0000fi\u0000l\u0000y.feishu.cn/...\n🕘 收藏时间：2026年07⽉26⽇\n📂 ⽂档⽬录：我的云⽂档/应⽤/⾦⼭收藏助⼿\n📑 本⽂档由【⾦⼭收藏助⼿】⼀键⽣成\nModified Yesterday\n⼀、⾯试前必须统⼀的职业主线\n履历不是传统的“产品助理—产品经理—⾼级产品经理”路线，⽽是：\n创业经营与商业验证\n→ ⼈⼒流程标准化与数据管理\n→ ⽤⼾场景及B端商⼾解决⽅案\n→ 字节跳动本地⽣活商务运营\n→ 从真实商⼾问题中设计AI产品⽅案\n因此，⾯试中不要把过往经历割裂地讲成“创业、⼈事、商务、AI”四段毫⽆关联的⼯作，⽽\n要统⼀为⼀条能⼒成⻓路线：\n我⼀直在解决真实业务中的⽤⼾和客⼾问题。早期创业让我具备商业闭环和结果意识；⼈事\n主管经历让我建⽴了流程、规则和数据化能⼒；⻘年社交平台让我积累了⽤⼾洞察、场景产\n品和B端商⼾⽅案经验；在字节跳动，我进⼀步把这些能⼒应⽤到本地⽣活商⼾场景，并推\n动餐饮商⼾AI营销经营助⼿从需求识别、⽅案设计到试点验证。\n这条主线要证明，我不是突然为了转⾏⽽包装⼀个AI项⽬，⽽是在原有B端需求、流程标准\n化、数据运营和商业落地能⼒上，进⼀步补充AI产品能⼒。\n⼆、⾃我介绍\n2.1 回答思路\n⾃我介绍建议按照四个部分展开：\n第⼀部分，⽤⼀句话说明⾃⼰是谁，以及当前的求职⽅向。\n第⼆部分，不按照时间流⽔账复述全部简历，⽽是提炼三类核⼼能⼒：\n·B端客⼾和⽤⼾需求理解；\n·业务流程产品化与数据化；\n·AI内容⽣产⽅案设计与业务验证。\n第三部分，重点讲字节跳动的餐饮商⼾AI营销经营助⼿，证明⾃⼰具备AI产品经验。\n第四部分，说明为什么⾃⼰与⽬标岗位匹配。\n⾃我介绍的重点不是“做过多少份⼯作”，⽽是让⾯试官快速形成⼀个明确印象：\n这是⼀个懂B端商⼾、懂商业落地、能将模糊需求转化为AI产品⽅案的⼈。\n2.2 ⾯试官考察⽅向\n⾯试官会重点判断：\n·履历是否有清晰主线；\n·为什么从商务运营转AI产品；\n·是否真正具备产品能⼒；\n·是否只是会使⽤AIGC⼯具；\n·能否⽤较短时间讲清⾃⾝优势；\n·⼯作经历跨度较⼤是否意味着职业⽅向不稳定。\n2.3 注意事项\n不要在⾃我介绍中逐条复述所有公司和⼯作内容。\n不要⼀开始强调“我没有正式的产品经理Title”，这会主动削弱⾃⼰。应当先讲能⼒和项⽬，\n在被追问时再解释正式岗位与项⽬⻆⾊的区别。\n不要说“我精通所有AI⼯具”或“熟悉所有⼤模型”。更合理的表述是：\n熟悉结构化Prompt、多模态内容⽣成、质量评测及AI⼯作流，能够根据业务任务选择合适的\n⼯具和⽅案。\n不要在2分钟⾃我介绍⾥详细解释AI项⽬的每⼀个功能，先讲核⼼问题、个⼈贡献和结果。\n2.4 两分钟⾃我介绍逐字稿\n⾯试官您好，我叫朱耀⻰，⽬前主要应聘AI产品经理、AIGC内容解决⽅案以及AI内容⽣产运\n营相关岗位。\n我的核⼼优势是同时具备B端客⼾需求理解、业务流程产品化和AI内容⽅案落地三⽅⾯能⼒。\n我早期有4年创业经历，从0到1参与⻘年⽂化和线下⽂娱业务的产品定位、资源拓展和经营\n管理，这段经历让我建⽴了⽐较强的商业结果意识。之后我做过⼈⼒流程优化和⽤⼾场景运\n营，分别积累了流程标准化、数据看板、⽤⼾洞察和B端商⼾解决⽅案能⼒。\n在字节跳动本地⽣活期间，我主要负责餐饮商⼾的拓展、平台⼊驻、套餐规划、活动运营和\n经营复盘。在服务商⼾的过程中，我发现很多中⼩商⼾缺少专业的线上运营团队，竞品分\n析、套餐设计、⽂案和视觉素材⽣产都⽐较依赖⼈⼯。\n基于这个问题，我主导设计并推动试点了餐饮商⼾AI营销经营助⼿。产品覆盖商⼾需求诊\n断、商圈竞品分析、套餐与定价建议、营销⽂案和视觉⽣成、内容审核及经营复盘。\n在项⽬中，我主要负责业务需求分析、产品功能规划、MVP设计、结构化Prompt、⽣成质量\n评测、商⼾试点和内部推⼴。针对菜品⽣成中的⻝材失真和⻛格漂移问题，我测试了5类⽅\n案，形成三层提⽰词和3版⻛格样⽚确认机制，将菜品还原合格率从40%提升到85%，单版\n素材⽣产时间从30分钟缩短到10分钟，修改轮次从5轮降低到2⾄3轮。\n我的特点是，不会只从模型能做什么出发，⽽是会先理解业务⽬标和⽤⼾任务，再明确AI、\n规则和⼈⼯各⾃负责什么，并通过效率、质量和业务指标验证⽅案价值。我希望下⼀阶段能\n够继续深耕AI产品，将⼀线客⼾需求和AI能⼒转化为可复制、可规模化的产品解决⽅案。\n2.5 ⾃我介绍⾼频QA\nQ\u0000：请⽤⼀句话概括你的核⼼竞争⼒\n回答思路：不要列五六项技能，要形成⼀个有差异化的定位。\n逐字稿：\n我的核⼼竞争⼒是，既能深⼊理解B端客⼾的真实业务诉求，也能将这些模糊需求转化为结\n构化的AI产品流程、Prompt⽅案和质量标准，并推动⽅案在真实业务中完成验证。\nQ\u0000：你和传统产品经理相⽐有什么优势？\n回答思路：强调真实商业场景和落地能⼒，不贬低传统产品经理。\n逐字稿：\n我的优势是⻓期处于客⼾和业务⼀线，⽐较清楚客⼾提出的表⾯需求背后，真正影响经营结\n果的是什么。\n⽐如商⼾说“想要⼀张好看的图⽚”，表⾯上是视觉需求，但进⼀步分析后，可能涉及⽬标⽤\n⼾、套餐定位、品牌调性、内容场景和转化⽬标。\n我能够先把这些需求拆清楚，再结合模型能⼒、业务规则和⼈⼯流程设计解决⽅案，避免产\n品只停留在功能层。\nQ\u0000：你最⼤的短板是什么？\n回答思路：不要说“技术能⼒不⾜”后就结束，应说明正在怎样补⻬。\n逐字稿：\n相⽐⻓期在研发团队中成⻓的产品经理，我在复杂技术系统和完整研发管理上的经验还需要\n继续积累。\n但我的优势是业务理解和落地⽐较强。⽬前我会重点补充⼤模型基础、⼯作流设计、RAG、\n模型评测和数据指标体系，同时在设计⽅案时主动与技术⼈员确认模型边界、输⼊输出和异\n常机制。\n我的⽬标不是代替算法或研发，⽽是能够准确判断技术适⽤性，并把业务问题转换成团队可\n以执⾏的产品⽅案。\n三、为什么从商务运营 & 产品运营转向 AI 产品\n3.1 回答思路\n不要把转型描述成“商务⼯作太累”或“AI岗位⼯资更⾼”，⽽应说明：\n1.商务运营经历帮助⾃⼰积累了真实客⼾需求；\n2.在⼯作中逐渐从单个客⼾交付⾛向共性问题抽象；\n3.餐饮商⼾AI项⽬让⾃⼰确认更适合产品化解决问题；\n4.转型是原有能⼒的升级，⽽不是完全推翻过去。\n3.2 ⾯试官考察⽅向\n·转型动机是否稳定；\n·是否只是追逐AI热点；\n·是否具备产品基本功；\n·能否接受AI产品岗位中⼤量需求、协作和细节⼯作；\n·商务经历能否转化为产品价值。\n3.3 注意事项\n不要说：\n商务运营发展上限⽐较低，所以想转AI。\n不要否定过去经历，否则⾯试官会担⼼未来也否定AI产品⼯作。\n不要只说⾃⼰“对AI感兴趣”，兴趣不⾜以⽀撑职业转型。\n3.4 逐字稿内容\n我的转型不是突然决定的，⽽是从实际⼯作中逐渐形成的。\n过去做创业和商务运营时，我最擅⻓的是理解⽤⼾和客⼾想要什么，并推动⽅案落地。但前\n期更多是针对单个客⼾解决问题，很多经验依赖个⼈。\n到字节跳动以后，我接触了更多餐饮单店、连锁商⼾和内部运营⼈员，开始发现不同客⼾之\n间存在⼤量共性问题。⽐如⼤家都需要做竞品分析、套餐设计、⽂案和视觉内容，也都会经\n历需求表达模糊、反复修改和交付周期⻓的问题。\n在推动餐饮商⼾AI营销经营助⼿时，我第⼀次⽐较系统地完成了从业务调研、需求抽象、功\n能设计、Prompt和质量标准，到真实商⼾试点和数据复盘的过程。\n我发现⾃⼰真正感兴趣、也更有优势的，不是⻓期重复服务单个客⼾，⽽是把多个客⼾的共\n性需求转化成⼀套可重复使⽤的产品能⼒。\n因此，我选择AI产品⽅向，不是放弃商务运营经验，⽽是希望利⽤过去积累的客⼾理解、商\n业判断和落地能⼒，进⼀步做规模化的产品解决⽅案。\n3.5 ⾼频QA\nQ\u0000：为什么不是继续做商务或者⼤客⼾运营？\n我认可商务和⼤客⼾运营的价值，⽽且这些经历也是我的优势。\n但我发现⾃⼰更希望解决⼀类客⼾的共性问题，⽽不是⻓期依赖个⼈去完成每⼀次交付。AI\n产品能够把需求理解、内容⽣产和经营分析进⼀步标准化，从⼀个客⼾扩展到多个客⼾。\n所以我未来希望以产品为主要⻆⾊，同时保留⾃⼰的客⼾和商业理解优势。\nQ\u0000：为什么偏偏选择AI产品，⽽不是普通产品经理？\n因为我过去处理的很多问题，本⾝就包含⼤量⾮结构化信息，例如客⼾⾃然语⾔需求、⽤⼾\n评价、菜单、图⽚和内容⽅案。\n传统规则系统很难完全覆盖这些内容，⽽⼤模型和多模态能⼒能够明显提升需求理解、信息\n总结和内容⽣产效率。\n我不是为了AI⽽AI，⽽是发现AI可以更好地解决我⻓期接触的业务问题。\nQ\u0000：如果AI⾏业降温，你还会做产品吗？\n会。\n我关注的核⼼并不是某个模型或热点，⽽是如何将技术应⽤到真实业务流程中。即使未来AI\n⾏业热度变化，需求分析、流程设计、⽤⼾体验、数据验证和商业落地仍然是产品⼯作的核\n⼼。\nAI只是当前⾮常重要的⼀种能⼒，不是我职业选择的唯⼀理由。\n四、字节跳动经历整体介绍\n4.1 回答思路\n字节跳动经历建议拆成两条线：\n第⼀条是商务运营线：\n·商⼾线索拓展；\n·商⼾洽谈和⼊驻；\n·⻔店装修与货盘设计；\n·达⼈、直播和流量资源协调；\n·交易、GMV、核销和ROI复盘。\n第⼆条是AI产品线：\n·从⾼频⼈⼯任务中识别AI机会；\n·设计餐饮商⼾AI营销经营助⼿；\n·完成需求、功能、Prompt、评测和试点；\n·推动内部团队使⽤和产品迭代。\n这样既能解释正式岗位，也能证明产品能⼒。\n字节期间实际⼯作覆盖商⼾后台、活动报名、商⼾沟通、合规学习、商⼾拓展、达⼈推⼴、货\n盘调整、交易复盘、产品需求反馈及技术故障协调；后期还独⽴负责中⼩型连锁商⼾和本地⼤\n客⼾。\n4.2 ⾯试官考察⽅向\n·是否真正理解本地⽣活业务；\n·商务运营职责有哪些；\n·AI项⽬从哪⾥产⽣；\n·个⼈贡献和团队贡献如何区分；\n·短期内做了多少有价值的⼯作；\n·能否从业务运营⾛向产品设计。\n4.3 注意事项\n不能只讲AI项⽬，完全不解释本职⼯作，否则⾯试官会怀疑项⽬来源和⾝份真实性。\n也不能花⼤量时间讲商⼾拜访、签合同等⽇常⼯作，导致AI产品能⼒被弱化。\n建议时间分配：\n·20%讲本地⽣活业务和商务运营；\n·60%讲AI产品；\n·20%讲数据结果和反思。\n4.4 字节经历整体逐字稿\n在字节跳动本地⽣活期间，我的正式岗位是商务经理，主要负责餐饮商⼾从拓展、⼊驻到后\n续经营的完整链路。\n前期我先熟悉商⼾后台、活动报名、合规规则和交易数据，之后通过企查查、⼤众点评、公\n海线索、服务商合作和线下拜访等⽅式拓展商⼾。\n商⼾合作后，我还需要继续帮助我们完成⻔店装修、套餐和货盘规划、达⼈探店、活动推⼴\n及经营数据复盘，并解决流量不⾜、核销异常或系统对接等问题。\n在这个过程中，我不仅关注新开商⼾数量，也会关注新开GMV、有效新开、⾼价值商⼾、销\n量、⽤⼾评价和活动ROI。\n做了⼀段时间后，我发现商⼾市场分析、套餐设计、⽂案撰写和视觉⽣产都存在⼤量重复⼯\n作，因此开始构思并验证餐饮商⼾AI营销经营助⼿。\n我将⼀线业务中的共性问题拆成AI需求诊断、商圈竞品分析、套餐策略、⽂案与视觉⽣成、\n质量审核和经营复盘等模块，并推动真实商⼾试点和团队内部推⼴。\n所以字节这段经历对我最⼤的价值，⼀⽅⾯是让我深⼊理解了B端餐饮商⼾的经营链路，另\n⼀⽅⾯是让我完成了从单个商⼾运营到AI产品⽅案设计的转变。\n五、字节经历第⼀点：商务拓展与商⼾运营\n5.1 回答思路\n这⼀点要体现的不只是“跑商⼾”，⽽是：\n·如何找到⽬标商⼾；\n·如何识别商⼾需求；\n·如何设计合作及经营⽅案；\n·如何推动⼊驻和后续运营；\n·如何⽤数据持续调整策略。\n5.2 ⾯试官考察⽅向\n·B端客⼾需求挖掘能⼒；\n·商业谈判和客⼾关系能⼒；\n·是否理解商⼾⽣命周期；\n·是否有结果和数据意识；\n·能否将⼀线经验转化为产品洞察。\n5.3 注意事项\n不要把商务⼯作讲成只靠⼈脉和话术。\n要体现商⼾分层、数据分析、经营⽅案和跨团队协作。\n简历或原材料没有给出完整的商⼾总数、个⼈GMV等确切数据，因此不要临场编造。可以重点\n</pre></div>", "r2": "<div class=\"freq-summary\">⭐ 每场必问</div><h2>二、自我介绍 <span class=\"freq-badge freq-3\">每场必问</span></h2><div style=\"max-height:70vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">使⽤已⽀持的“独⽴负责2—3家中⼩型连锁商⼾”“接⼿1家本地⼤客⼾”等事实。\n5.4 逐字稿内容\n在商务拓展⽅⾯，我前期主要通过企查查、⼤众点评、公海线索、服务商推荐和线下商圈拜\n访寻找⽬标商⼾。\n我不会只看商⼾是否愿意⼊驻，还会结合⻔店规模、经营品类、当前平台基础、历史销量、\n是否有服务商，以及未来活动和付费潜⼒，对商⼾进⾏初步分层。\n在沟通中，我重点了解商⼾⽬前的经营⽬标。例如有的商⼾希望快速完成新店上线，有的商\n⼾希望通过团购套餐获取新客，有的连锁商⼾则更关注多⻔店管理和品牌统⼀。\n商⼾⼊驻后，我会继续协助完成⻔店资料、头图、菜品图、货盘和套餐设计，并根据经营⽬\n标协调达⼈、直播和平台资源。\n对于已经上线的商⼾，我会复盘销量、⽤⼾评价、核销和流量表现。如果套餐点击不错但下\n单不⾜，会进⼀步检查价格和菜品组合；如果下单不错但核销不⾜，则要检查使⽤规则、⻔\n店接待和活动周期。\n后期我能够独⽴负责2⾄3家中⼩型连锁商⼾，并接⼿本地⼤客⼾，参与制定⽉度运营计划、\n活动资源申请、投流⽅案和ROI测算。\n这段经历让我积累了⾮常直接的B端需求洞察，也为后续AI产品提供了真实业务场景和⽤⼾样\n本。\n5.5 ⾼频QA\nQ\u0000：你怎么判断⼀个商⼾是不是⾼价值商⼾？\n我会综合看商⼾规模、⻔店数量、历史销量、品类潜⼒、经营稳定性、平台合作意愿和后续\n活动空间。\n不能只看商⼾当前GMV。例如处于扩张阶段的连锁商⼾，当前单店数据可能⼀般，但多⻔店\n复制和⻓期合作价值较⾼；部分单店虽然规模不⼤，但品牌特⾊强，也可能适合做区域标\n杆。\nQ\u0000：商⼾最常⻅的拒绝理由是什么？\n常⻅原因包括对平台效果不确定、担⼼运营成本、缺少内容团队，以及认为已有其我平台渠\n道。\n我的处理⽅式不是单纯强调平台流量，⽽是结合商⼾当前问题提供具体⽅案。例如通过免费\n⽣成⻔店素材、优化套餐和安排达⼈案例，降低商⼾第⼀次尝试的⻔槛。\nQ\u0000：你如何维护商⼾关系？\n商⼾关系不能只停留在签约阶段。\n我会持续关注套餐上架、流量、核销和⽤⼾评价，出现问题后主动协调内部资源，并定期复\n盘经营结果。\n商⼾更关⼼的是问题能否真正解决，⽽不只是沟通态度。\nQ\u0000：你做商务的经验对AI产品有什么帮助？\n第⼀，我能判断客⼾说出来的需求和真正问题是否⼀致。\n第⼆，我能够理解B端客⼾为什么使⽤、为什么不使⽤，以及我们愿意为哪些结果投⼊。\n第三，我⽐较熟悉从⽅案、试点到持续使⽤的过程，这对AI产品的⽤⼾调研、产品运营和商\n业化都很重要。\n六、字节经历第⼆点：产品规划与需求拆解\n6.1 回答思路\n这⼀点重点证明⾃⼰有产品基本功：\n·梳理业务全流程；\n·找到关键问题；\n·定义⽤⼾和任务；\n·设计功能架构；\n·确定MVP；\n·明确AI、规则和⼈⼯边界。\n6.2 ⾯试官考察⽅向\n·能否从业务现象抽象产品问题；\n·功能是否围绕⽤⼾任务设计；\n·是否有MVP意识；\n·能否控制产品范围；\n·是否真正参与PRD和⽅案设计。\n6.3 注意事项\n不要说“设计了很多功能”，要解释为什么这样拆。\n不要把“完整产品⽅案”包装成所有功能均已开发上线。项⽬真实阶段是核⼼场景试点和产品\n⽅案设计。\n6.4 逐字稿内容\n在产品规划阶段，我⾸先没有从AI能⼒出发，⽽是把商⼾从⼊驻到经营复盘的流程完整梳理\n了⼀遍。\n整个流程主要包括商⼾资料收集、⻔店装修、竞品分析、货盘和套餐设计、营销内容⽣产、\n商⼾确认、内容上线以及数据复盘。\n我发现其中存在三类问题。\n第⼀类是需求理解问题。商⼾表达模糊，运营⼈员需要反复沟通。\n第⼆类是经营策略问题。竞品分析和套餐设计依赖个⼈经验。\n第三类是内容⽣产问题。⽂案和图⽚制作慢，⻛格和质量不稳定。\n因此，我将产品拆成商⼾项⽬管理、AI需求诊断、竞品分析、套餐策略、⽂案与视觉⽣成、\n质量审核和数据复盘⼏个模块。\n在MVP设计上，我没有直接做商⼾完全⾃助的平台，⽽是优先让内部商务和运营⼈员使⽤。\n因为内部⽤⼾熟悉商⼾信息和平台规则，也可以对AI结果进⾏⼈⼯审核。\n同时，我明确了AI、规则和⼈⼯的边界。AI负责理解、总结和⽣成；价格计算、事实字段和\n平台要求通过结构化数据及规则控制；运营和商⼾负责最终确认。\n核⼼功能通过真实商⼾和现有AI⼯具完成验证，完整项⽬管理、⾃动质检和数据接⼊则作为\n后续产品化⽅向。\n6.5 ⾼频QA\nQ\u0000：你如何确定MVP范围？\n我主要从需求频率、⽤⼾痛点、技术可⾏性和效果可衡量性四个⽅⾯判断。\n内容⽣产和需求沟通频率最⾼，也可以通过时间、修改轮次和采⽤率快速衡量，所以优先验\n证。\n⾃动竞品数据接⼊和完整经营分析价值较⾼，但依赖更多系统和数据资源，可以后置。\nQ\u0000：为什么项⽬管理也需要作为⼀个模块？\n因为⼀个商⼾可能有不同⻔店、不同活动和多个版本。如果只有⼀个⽣成⼊⼝，很容易出现\n商⼾资料、套餐、图⽚和⽂案版本混乱。\n项⽬管理⽤于统⼀保存需求、⽣成结果、审核和数据表现，是后续规模化协作的基础。\nQ\u0000：你产出了什么？\n我完成了业务流程、⽤⼾⻆⾊、核⼼痛点、产品功能架构、MVP范围、重点功能需求、\nPrompt框架、质量验收指标和试点复盘⽅案。\n其中完整系统化部分属于产品⽅案，需求采集、AIGC⽣成、套餐分析、商⼾确认和⼈⼯质检\n流程进⾏了真实业务验证。\n七、字节经历第三点：商⼾需求智能诊断\n7.1 回答思路\n按照“为什么难—怎样采集—AI怎样理解—怎样确认—怎样复⽤”展开。\n7.2 ⾯试官考察⽅向\n·是否理解AI产品中的输⼊质量；\n·如何处理模糊需求；\n·如何防⽌幻觉；\n·产品交互是否合理；\n·是否能将需求沉淀为结构化数据。\n7.3 注意事项\n不要声称AI可以完全⾃动理解商⼾。\n事实字段必须由商⼾或运营确认。\n7.4 逐字稿内容\n商⼾需求诊断是我认为⾮常关键的⼀个模块，因为很多⽣成质量问题，其实不是模型本⾝造\n成的，⽽是输⼊需求不清楚。\n商⼾通常会说“图⽚更⾼端”“套餐更有吸引⼒”，但是这类表达⽆法直接⽀撑稳定⽣成。\n因此，我将需求拆成商⼾基础信息、⽬标⽤⼾、消费场景、品牌视觉、菜品套餐和营销⽬标\n⼏类。\n⽤⼾可以通过表单填写菜系、客单价、⽬标⼈群和内容⽤途，同时上传菜单、菜品原图、\nLogo和参考图⽚。\n多模态能⼒⽤于识别菜单和图⽚中的菜品、⻝材、⾊调、构图和⻛格，⼤语⾔模型则负责将\n商⼾的⾃然语⾔需求转成结构化参数。\n如果关键信息不⾜，系统通过定向追问补⻬。例如⽣成套餐时重点追问⼈数、价格和核⼼菜\n品；⽣成图⽚时重点追问真实⻝材、⽤途和⻛格。\nAI提取的菜品、价格和营业时间只能作为候选信息，必须由运营确认。最终确认的内容形成\n需求基线，后续套餐、⽂案和图⽚都引⽤同⼀套信息。\n这样能够减少不同环节之间的信息偏差，也降低运营⼈员重复编写Prompt的成本。\n7.5 ⾼频QA\nQ\u0000：结构化表单会不会太复杂？\n所以不能⼀次性要求填写所有信息。\n系统应该根据任务动态展⽰字段。例如只⽣成头图时不需要录⼊成本；设计套餐时再补充成\n本和⽑利。\n还可以通过菜单和历史资料⾃动预填，让⽤⼾以确认和修改为主。\nQ\u0000：AI追问与普通问卷有什么区别？\n普通问卷的问题固定，⽽AI追问根据当前任务和已缺失的信息动态⽣成。\n例如两个商⼾都说“想做双⼈套餐”，⼀个缺少价格，⼀个缺少菜品，系统追问内容应该不\n同。\nQ\u0000：如何避免模型提取错误？\n事实信息必须展⽰来源并要求⼈⼯确认。\n如果菜单和活动海报中的价格不⼀致，系统要标记冲突，⽽不是⾃⾏选择⼀个结果。\n⼋、字节经历第四点：AI 内容⽣产设计\n8.1 回答思路\n重点讲：\n·⽣成哪些内容；\n·⽂案和图⽚怎样使⽤真实数据；\n·多模态具体作⽤；\n·如何⽀持多版本和批量⽣成；\n·与通⽤AIGC⼯具有什么不同。\n8.2 ⾯试官考察⽅向\n·是否理解多模态；\n·是否真正做产品，⽽不只是调⽤⼯具；\n·如何保证品牌和事实准确；\n·连锁商⼾如何复⽤；\n·是否考虑可编辑性。\n8.3 注意事项\nLogo、价格、套餐标题等重要⽂字不要说由图像模型稳定⽣成，应通过真实素材或可编辑排版\n处理。\n8.4 逐字稿内容\n内容⽣产包含⽂案和视觉两部分。\n⽂案⽀持⽣成套餐标题、套餐卖点、⻔店介绍、活动⽂案、达⼈脚本和直播卖点。\n在产品设计中，我会区分事实字段和创作字段。商⼾名称、菜品、套餐价格和活动时间只能\n引⽤已确认数据；表达结构、语⽓和卖点包装由⼤模型⽣成。\n每次默认提供多个策略版本，⽐如强调性价⽐、突出招牌菜或者突出聚餐场景，⽽不是简单\n替换⼏个形容词。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。多模态模型先理解真实菜品和参考\n图的⻝材、摆盘、⾊调、构图和光线，再将信息转化为⽣成参数。\n对连锁商⼾，可以通过品牌模板固定主⾊、Logo、字体、语⽓和强制元素，不同⻔店只替换\n地址、商圈和套餐信息。\n图⽚中的价格、套餐名称和Logo更适合通过可编辑图层添加，避免图像模型⽣成乱码或者错\n误信息。\n这个产品与通⽤⽣成⼯具的区别，是它能够调⽤商⼾资料、品牌规范、套餐数据和质量规\n则，并且有完整的确认和复盘流程。\n8.5 ⾼频QA\nQ\u0000：你使⽤过哪些⼯具？\n试点中主要结合DeepSeek、⾖包、即梦等⼯具验证⽂案、图⽚理解和图像⽣成能⼒，也了\n解Dify⼯作流以及Midjourney、Pika等⼯具的基本⽣产逻辑。\n我选择⼯具时不会只看⽣成效果，⽽会结合任务类型、中⽂理解、⻛格适配、⽣成稳定性、\n速度和使⽤成本判断。\nQ\u0000：多模态在项⽬中具体做什么？\n第⼀是识别菜单和菜品图；第⼆是理解商⼾参考图的⾊调、构图和⻛格；第三是辅助⽐较⽣\n成结果与真实菜品是否⼀致。\n它不仅⽤于⽣成图⽚，也参与需求理解和质量审核。\nQ\u0000：为什么不训练⾃⼰的模型？\n项⽬初期样本有限，直接训练或微调模型成本⾼，也缺少⾜够的授权数据。\n更合理的⽅式是先通过通⽤模型、参考图、Prompt和流程约束验证商业价值。等后续积累⾜\n够多的⾼质量标注数据后，再评估微调。\n九、字节经历第五点：Prompt 与质量体系\n9.1 回答思路\n必须讲清楚：\n·初期发⽣了什么问题；\n·如何分类；\n·测试了什么；\n·三层Prompt分别是什么；\n·如何定义质量；\n·最终结果怎样。\n9.2 ⾯试官考察⽅向\n·是否真正调试过；\n·是否会做AI评测；\n·是否能从失败中归因；\n·Prompt能否被团队复⽤；\n·是否理解Prompt的边界。\n9.3 注意事项\n不能只说“通过不断优化Prompt提升效果”。\n要讲具体结构和验收标准。\n9.4 逐字稿内容\n最初使⽤通⽤Prompt⽣成菜品图时，图⽚可能很好看，但经常存在核⼼⻝材变化、菜品分量\n失真、摆盘错误和不同批次⻛格不⼀致的问题。\n我先把问题分成真实性、视觉效果和品牌⼀致性三类，再测试了补充菜品描述、增加参考\n图、加⼊负向约束、拆分提⽰词层级和建⽴⻛格基准等5类⽅案。\n最终形成三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和尺⼨，解决“⽣成什么”。\n第⼆层是视觉⻛格，包括⾊调、构图、光线、背景、餐具和摆盘，解决“怎样呈现”。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌元素和常⻅变形，解决“哪些\n错误不能发⽣”。\n同时，批量⽣成之前先提供3版⻛格样⽚，让商⼾确认其中⼀版作为⻛格基准。\n在质量验收中，我们不只看美观，还检查菜品主体、核⼼⻝材、分量、烹饪状态、品牌⻛格\n和是否可上线。\n经过优化，菜品还原合格率从40%提升到85%，平均修改轮次由5轮下降到2⾄3轮。\n9.5 ⾼频QA\nQ\u0000：还原合格率怎么计算？\n试点阶段主要采⽤⼈⼯验收。\n每张图按照菜品主体是否正确、核⼼⻝材是否⽆明显新增或缺失、分量是否严重失真、烹饪\n状态是否⼀致，以及是否可以⽤于商⼾⻚⾯进⾏判断。\n合格图⽚数量除以参与验收的⽣成图⽚总数，得到还原合格率。\n后续如果系统化，我会将这些维度拆分成单项评分，并建⽴固定测试集。\nQ\u0000：为什么Prompt分层有效？\n因为不同问题对应不同层。\n⻝材错误时调整真实性层；⻛格不符时调整视觉层；内容⽤途改变时调整业务场景层。\n这样⽐⼀条不断加⻓的Prompt更容易维护、复⽤和定位问题。\nQ\u0000：Pr</pre></div>", "r3": "<div class=\"freq-summary\">⭐ 核心质疑</div><h2>三、转型逻辑 <span class=\"freq-badge freq-3\">核心质疑</span></h2><div style=\"max-height:70vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">容应该不\n同。\nQ\u0000：如何避免模型提取错误？\n事实信息必须展⽰来源并要求⼈⼯确认。\n如果菜单和活动海报中的价格不⼀致，系统要标记冲突，⽽不是⾃⾏选择⼀个结果。\n⼋、字节经历第四点：AI 内容⽣产设计\n8.1 回答思路\n重点讲：\n·⽣成哪些内容；\n·⽂案和图⽚怎样使⽤真实数据；\n·多模态具体作⽤；\n·如何⽀持多版本和批量⽣成；\n·与通⽤AIGC⼯具有什么不同。\n8.2 ⾯试官考察⽅向\n·是否理解多模态；\n·是否真正做产品，⽽不只是调⽤⼯具；\n·如何保证品牌和事实准确；\n·连锁商⼾如何复⽤；\n·是否考虑可编辑性。\n8.3 注意事项\nLogo、价格、套餐标题等重要⽂字不要说由图像模型稳定⽣成，应通过真实素材或可编辑排版\n处理。\n8.4 逐字稿内容\n内容⽣产包含⽂案和视觉两部分。\n⽂案⽀持⽣成套餐标题、套餐卖点、⻔店介绍、活动⽂案、达⼈脚本和直播卖点。\n在产品设计中，我会区分事实字段和创作字段。商⼾名称、菜品、套餐价格和活动时间只能\n引⽤已确认数据；表达结构、语⽓和卖点包装由⼤模型⽣成。\n每次默认提供多个策略版本，⽐如强调性价⽐、突出招牌菜或者突出聚餐场景，⽽不是简单\n替换⼏个形容词。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。多模态模型先理解真实菜品和参考\n图的⻝材、摆盘、⾊调、构图和光线，再将信息转化为⽣成参数。\n对连锁商⼾，可以通过品牌模板固定主⾊、Logo、字体、语⽓和强制元素，不同⻔店只替换\n地址、商圈和套餐信息。\n图⽚中的价格、套餐名称和Logo更适合通过可编辑图层添加，避免图像模型⽣成乱码或者错\n误信息。\n这个产品与通⽤⽣成⼯具的区别，是它能够调⽤商⼾资料、品牌规范、套餐数据和质量规\n则，并且有完整的确认和复盘流程。\n8.5 ⾼频QA\nQ\u0000：你使⽤过哪些⼯具？\n试点中主要结合DeepSeek、⾖包、即梦等⼯具验证⽂案、图⽚理解和图像⽣成能⼒，也了\n解Dify⼯作流以及Midjourney、Pika等⼯具的基本⽣产逻辑。\n我选择⼯具时不会只看⽣成效果，⽽会结合任务类型、中⽂理解、⻛格适配、⽣成稳定性、\n速度和使⽤成本判断。\nQ\u0000：多模态在项⽬中具体做什么？\n第⼀是识别菜单和菜品图；第⼆是理解商⼾参考图的⾊调、构图和⻛格；第三是辅助⽐较⽣\n成结果与真实菜品是否⼀致。\n它不仅⽤于⽣成图⽚，也参与需求理解和质量审核。\nQ\u0000：为什么不训练⾃⼰的模型？\n项⽬初期样本有限，直接训练或微调模型成本⾼，也缺少⾜够的授权数据。\n更合理的⽅式是先通过通⽤模型、参考图、Prompt和流程约束验证商业价值。等后续积累⾜\n够多的⾼质量标注数据后，再评估微调。\n九、字节经历第五点：Prompt 与质量体系\n9.1 回答思路\n必须讲清楚：\n·初期发⽣了什么问题；\n·如何分类；\n·测试了什么；\n·三层Prompt分别是什么；\n·如何定义质量；\n·最终结果怎样。\n9.2 ⾯试官考察⽅向\n·是否真正调试过；\n·是否会做AI评测；\n·是否能从失败中归因；\n·Prompt能否被团队复⽤；\n·是否理解Prompt的边界。\n9.3 注意事项\n不能只说“通过不断优化Prompt提升效果”。\n要讲具体结构和验收标准。\n9.4 逐字稿内容\n最初使⽤通⽤Prompt⽣成菜品图时，图⽚可能很好看，但经常存在核⼼⻝材变化、菜品分量\n失真、摆盘错误和不同批次⻛格不⼀致的问题。\n我先把问题分成真实性、视觉效果和品牌⼀致性三类，再测试了补充菜品描述、增加参考\n图、加⼊负向约束、拆分提⽰词层级和建⽴⻛格基准等5类⽅案。\n最终形成三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和尺⼨，解决“⽣成什么”。\n第⼆层是视觉⻛格，包括⾊调、构图、光线、背景、餐具和摆盘，解决“怎样呈现”。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌元素和常⻅变形，解决“哪些\n错误不能发⽣”。\n同时，批量⽣成之前先提供3版⻛格样⽚，让商⼾确认其中⼀版作为⻛格基准。\n在质量验收中，我们不只看美观，还检查菜品主体、核⼼⻝材、分量、烹饪状态、品牌⻛格\n和是否可上线。\n经过优化，菜品还原合格率从40%提升到85%，平均修改轮次由5轮下降到2⾄3轮。\n9.5 ⾼频QA\nQ\u0000：还原合格率怎么计算？\n试点阶段主要采⽤⼈⼯验收。\n每张图按照菜品主体是否正确、核⼼⻝材是否⽆明显新增或缺失、分量是否严重失真、烹饪\n状态是否⼀致，以及是否可以⽤于商⼾⻚⾯进⾏判断。\n合格图⽚数量除以参与验收的⽣成图⽚总数，得到还原合格率。\n后续如果系统化，我会将这些维度拆分成单项评分，并建⽴固定测试集。\nQ\u0000：为什么Prompt分层有效？\n因为不同问题对应不同层。\n⻝材错误时调整真实性层；⻛格不符时调整视觉层；内容⽤途改变时调整业务场景层。\n这样⽐⼀条不断加⻓的Prompt更容易维护、复⽤和定位问题。\nQ\u0000：Prompt是不是越⻓越好？\n不是。过⻓可能造成约束冲突，模型也可能忽略重点。\n关键是结构清晰、事实约束明确、优先级合理，并配合参考图和⼈⼯审核。\n⼗、字节经历第六点：竞品分析与套餐策略\n10.1 回答思路\n说明：\n·原来如何做；\n·数据从哪⾥来；\n·AI分析什么；\n·套餐怎样设计；\n·定价怎样控制⻛险；\n·最终结果是什么。\n10.2 ⾯试官考察⽅向\n·是否真正懂餐饮经营；\n·推荐是否有数据依据；\n·定价能否解释；\n·是否考虑成本和⽑利；\n·AI是否越权决策。\n10.3 注意事项\n19%是套餐、定价和视觉素材综合调整后的结果，不能全部归因于单个AI模块。\n10.4 逐字稿内容\n原来的竞品分析主要依靠运营⼈员在多个平台查询和⼿⼯整理，单商⼾的市场调研周期较\n⻓。\n我设计了标准化竞品档案，整理商⼾名称、距离、品类、客单价、套餐、价格、销量和⽤⼾\n评价。\nAI主要负责对⽤⼾评价进⾏分类和总结，并归纳商圈价格带、热销套餐结构和⽤⼾关注点。\n套餐策略分为引流款、主推款和利润款。引流款降低新客决策⻔槛，主推款承担主要成交，\n利润款提升客单和收益。\n价格不能完全交给⼤模型。菜品原价、成本、折扣和⽬标⽑利应通过结构化数据和规则测\n算，⼤模型主要负责说明市场差异、套餐定位和卖点。\n如果商⼾没有提供成本，就只能给市场参考区间，不能做利润承诺。\n通过标准化竞品档案和价格测算，单商⼾市场调研周期由约5天缩短到36⼩时内。套餐策略\n与视觉内容同步上线后，整体下单转化率较商⼾原有⾃定⽅案提升19%。\n10.5 ⾼频QA\nQ\u0000：竞品数据如何获得？\nMVP阶段主要通过运营⼈员在公开平台收集、商⼾提供资料、表格或截图导⼊，以及内部授\n权信息。\n没有默认使⽤未经授权的⾃动爬取。后续如果需要系统化接⼊，需要评估平台授权和接⼝能\n⼒。\nQ\u0000：套餐如何防⽌低于成本？\n录⼊成本后，通过规则计算价格下限和⽬标⽑利。\n如果缺少成本，则只输出市场价格参考，不显⽰确定性的⽑利结论。\n最终价格仍由商⼾和运营确认。\nQ\u0000：为什么内容产品要做套餐策略？\n因为⽤⼾是否下单不只取决于图⽚是否好看，也取决于套餐组合、价格和消费场景。\n如果只⽣成图⽚，可能得到⾼点击但低转化，所以经营策略和内容⽣产需要连接起来。\n⼗⼀、字节经历第七点：产品运营与内部推⼴\n11.1 回答思路\n重点说明：\n·如何把个⼈⽅法变成团队标准；\n·如何培训；\n·如何收集反馈；\n·如何判断产品是否被采⽤；\n·如何形成迭代。\n11.2 ⾯试官考察⽅向\n·是否具备产品运营能⼒；\n·能否推动内部使⽤；\n·是否关注采⽤率；\n·能否处理⽤⼾抵触；\n·是否形成模板资产。\n11.3 注意事项\n“约50⼈”应表述为团队推⼴和使⽤范围，不要说成稳定⽇活⽤⼾。\n11.4 逐字稿内容\n⽅案验证后，我将需求采集、⻛格标签、参考图、分层提⽰词、套餐分析和质量验收整理成\n标准化SOP。\n内部推⼴时，我没有只做⼯具操作培训，⽽是使⽤真实商⼾案例说明使⽤前后的时间、修改\n轮次和内容效果变化。\n因为很多运营⼈员已经有⾃⼰的⼯作⽅式，如果⼀开始要求完全按照标准流程执⾏，容易产\n⽣抵触，所以我保留了⼈⼯调整和个性化处理空间。\n使⽤过程中，我持续收集同事反馈，例如输⼊字段太多、不同菜系模板效果不同、连锁⻔店\n批量处理不⽅便等，再将⾼频问题转为产品迭代需求。\n后续⽅案在约50⼈的市场团队范围内进⾏普及和使⽤，并开始应⽤于中⼩型连锁商⼾的⻔店\n装修、⽂案、套餐和竞品分析。\n11.5 ⾼频QA\nQ\u0000：内部推⼴最⼤的阻⼒是什么？\n不是不会⽤，⽽是不愿改变原有⼯作⽅式。\n运营⼈员担⼼标准化⼯具⽆法处理个性商⼾，所以我先⽤真实案例证明⼯具可以减少重复劳\n动，同时保留⼈⼯修改空间。\nQ\u0000：如何衡量内部推⼴是否成功？\n不能只看培训⼈数。\n我会关注项⽬创建量、实际使⽤率、⽣成内容采⽤率、平均修改轮次、⽤⼾持续使⽤情况，\n以及是否真正减少交付时间。\nQ\u0000：使⽤反馈如何进⼊迭代？\n个别问题先作为项⽬修改处理，同类问题在多个⽤⼾中出现后，再提炼为产品需求。\n例如多个运营反馈资料录⼊成本⾼，就需要增加菜单⾃动解析；多个川菜商⼾出现⻝材失\n真，就需要调整⾏业Prompt和审核标准。\n⼗⼆、字节经历业务结果与反思\n12.1 回答思路\n结果分四类：\n·效率；\n·质量；\n·经营；\n·组织复⽤。\n反思重点：\n·不等于完整平台上线；\n·样本有限；\n·归因不够严格；\n·⾃动化不⾜。\n12.2 ⾯试官考察⽅向\n·数据真实性；\n·是否客观评价结果；\n·有没有夸⼤；\n·是否具备复盘能⼒；\n·下⼀步是否明确。\n12.3 逐字稿内容\n项⽬结果主要有四部分。\n第⼀是效率，单版素材平均⽣产时间从30分钟缩短到10分钟，修改轮次从5轮下降到2⾄3\n轮。\n第⼆是质量，菜品还原合格率从40%提升到85%。\n第三是经营效率，市</pre></div>", "r4": "<div class=\"freq-summary\">⭐ 核心证明</div><h2>四、字节经历7点拆解 <span class=\"freq-badge freq-3\">核心证明</span></h2><div style=\"max-height:70vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">悉从⽅案、试点到持续使⽤的过程，这对AI产品的⽤⼾调研、产品运营和商\n业化都很重要。\n六、字节经历第⼆点：产品规划与需求拆解\n6.1 回答思路\n这⼀点重点证明⾃⼰有产品基本功：\n·梳理业务全流程；\n·找到关键问题；\n·定义⽤⼾和任务；\n·设计功能架构；\n·确定MVP；\n·明确AI、规则和⼈⼯边界。\n6.2 ⾯试官考察⽅向\n·能否从业务现象抽象产品问题；\n·功能是否围绕⽤⼾任务设计；\n·是否有MVP意识；\n·能否控制产品范围；\n·是否真正参与PRD和⽅案设计。\n6.3 注意事项\n不要说“设计了很多功能”，要解释为什么这样拆。\n不要把“完整产品⽅案”包装成所有功能均已开发上线。项⽬真实阶段是核⼼场景试点和产品\n⽅案设计。\n6.4 逐字稿内容\n在产品规划阶段，我⾸先没有从AI能⼒出发，⽽是把商⼾从⼊驻到经营复盘的流程完整梳理\n了⼀遍。\n整个流程主要包括商⼾资料收集、⻔店装修、竞品分析、货盘和套餐设计、营销内容⽣产、\n商⼾确认、内容上线以及数据复盘。\n我发现其中存在三类问题。\n第⼀类是需求理解问题。商⼾表达模糊，运营⼈员需要反复沟通。\n第⼆类是经营策略问题。竞品分析和套餐设计依赖个⼈经验。\n第三类是内容⽣产问题。⽂案和图⽚制作慢，⻛格和质量不稳定。\n因此，我将产品拆成商⼾项⽬管理、AI需求诊断、竞品分析、套餐策略、⽂案与视觉⽣成、\n质量审核和数据复盘⼏个模块。\n在MVP设计上，我没有直接做商⼾完全⾃助的平台，⽽是优先让内部商务和运营⼈员使⽤。\n因为内部⽤⼾熟悉商⼾信息和平台规则，也可以对AI结果进⾏⼈⼯审核。\n同时，我明确了AI、规则和⼈⼯的边界。AI负责理解、总结和⽣成；价格计算、事实字段和\n平台要求通过结构化数据及规则控制；运营和商⼾负责最终确认。\n核⼼功能通过真实商⼾和现有AI⼯具完成验证，完整项⽬管理、⾃动质检和数据接⼊则作为\n后续产品化⽅向。\n6.5 ⾼频QA\nQ\u0000：你如何确定MVP范围？\n我主要从需求频率、⽤⼾痛点、技术可⾏性和效果可衡量性四个⽅⾯判断。\n内容⽣产和需求沟通频率最⾼，也可以通过时间、修改轮次和采⽤率快速衡量，所以优先验\n证。\n⾃动竞品数据接⼊和完整经营分析价值较⾼，但依赖更多系统和数据资源，可以后置。\nQ\u0000：为什么项⽬管理也需要作为⼀个模块？\n因为⼀个商⼾可能有不同⻔店、不同活动和多个版本。如果只有⼀个⽣成⼊⼝，很容易出现\n商⼾资料、套餐、图⽚和⽂案版本混乱。\n项⽬管理⽤于统⼀保存需求、⽣成结果、审核和数据表现，是后续规模化协作的基础。\nQ\u0000：你产出了什么？\n我完成了业务流程、⽤⼾⻆⾊、核⼼痛点、产品功能架构、MVP范围、重点功能需求、\nPrompt框架、质量验收指标和试点复盘⽅案。\n其中完整系统化部分属于产品⽅案，需求采集、AIGC⽣成、套餐分析、商⼾确认和⼈⼯质检\n流程进⾏了真实业务验证。\n七、字节经历第三点：商⼾需求智能诊断\n7.1 回答思路\n按照“为什么难—怎样采集—AI怎样理解—怎样确认—怎样复⽤”展开。\n7.2 ⾯试官考察⽅向\n·是否理解AI产品中的输⼊质量；\n·如何处理模糊需求；\n·如何防⽌幻觉；\n·产品交互是否合理；\n·是否能将需求沉淀为结构化数据。\n7.3 注意事项\n不要声称AI可以完全⾃动理解商⼾。\n事实字段必须由商⼾或运营确认。\n7.4 逐字稿内容\n商⼾需求诊断是我认为⾮常关键的⼀个模块，因为很多⽣成质量问题，其实不是模型本⾝造\n成的，⽽是输⼊需求不清楚。\n商⼾通常会说“图⽚更⾼端”“套餐更有吸引⼒”，但是这类表达⽆法直接⽀撑稳定⽣成。\n因此，我将需求拆成商⼾基础信息、⽬标⽤⼾、消费场景、品牌视觉、菜品套餐和营销⽬标\n⼏类。\n⽤⼾可以通过表单填写菜系、客单价、⽬标⼈群和内容⽤途，同时上传菜单、菜品原图、\nLogo和参考图⽚。\n多模态能⼒⽤于识别菜单和图⽚中的菜品、⻝材、⾊调、构图和⻛格，⼤语⾔模型则负责将\n商⼾的⾃然语⾔需求转成结构化参数。\n如果关键信息不⾜，系统通过定向追问补⻬。例如⽣成套餐时重点追问⼈数、价格和核⼼菜\n品；⽣成图⽚时重点追问真实⻝材、⽤途和⻛格。\nAI提取的菜品、价格和营业时间只能作为候选信息，必须由运营确认。最终确认的内容形成\n需求基线，后续套餐、⽂案和图⽚都引⽤同⼀套信息。\n这样能够减少不同环节之间的信息偏差，也降低运营⼈员重复编写Prompt的成本。\n7.5 ⾼频QA\nQ\u0000：结构化表单会不会太复杂？\n所以不能⼀次性要求填写所有信息。\n系统应该根据任务动态展⽰字段。例如只⽣成头图时不需要录⼊成本；设计套餐时再补充成\n本和⽑利。\n还可以通过菜单和历史资料⾃动预填，让⽤⼾以确认和修改为主。\nQ\u0000：AI追问与普通问卷有什么区别？\n普通问卷的问题固定，⽽AI追问根据当前任务和已缺失的信息动态⽣成。\n例如两个商⼾都说“想做双⼈套餐”，⼀个缺少价格，⼀个缺少菜品，系统追问内容应该不\n同。\nQ\u0000：如何避免模型提取错误？\n事实信息必须展⽰来源并要求⼈⼯确认。\n如果菜单和活动海报中的价格不⼀致，系统要标记冲突，⽽不是⾃⾏选择⼀个结果。\n⼋、字节经历第四点：AI 内容⽣产设计\n8.1 回答思路\n重点讲：\n·⽣成哪些内容；\n·⽂案和图⽚怎样使⽤真实数据；\n·多模态具体作⽤；\n·如何⽀持多版本和批量⽣成；\n·与通⽤AIGC⼯具有什么不同。\n8.2 ⾯试官考察⽅向\n·是否理解多模态；\n·是否真正做产品，⽽不只是调⽤⼯具；\n·如何保证品牌和事实准确；\n·连锁商⼾如何复⽤；\n·是否考虑可编辑性。\n8.3 注意事项\nLogo、价格、套餐标题等重要⽂字不要说由图像模型稳定⽣成，应通过真实素材或可编辑排版\n处理。\n8.4 逐字稿内容\n内容⽣产包含⽂案和视觉两部分。\n⽂案⽀持⽣成套餐标题、套餐卖点、⻔店介绍、活动⽂案、达⼈脚本和直播卖点。\n在产品设计中，我会区分事实字段和创作字段。商⼾名称、菜品、套餐价格和活动时间只能\n引⽤已确认数据；表达结构、语⽓和卖点包装由⼤模型⽣成。\n每次默认提供多个策略版本，⽐如强调性价⽐、突出招牌菜或者突出聚餐场景，⽽不是简单\n替换⼏个形容词。\n视觉部分⽀持菜品图、⻔店头图、套餐封⾯和活动海报。多模态模型先理解真实菜品和参考\n图的⻝材、摆盘、⾊调、构图和光线，再将信息转化为⽣成参数。\n对连锁商⼾，可以通过品牌模板固定主⾊、Logo、字体、语⽓和强制元素，不同⻔店只替换\n地址、商圈和套餐信息。\n图⽚中的价格、套餐名称和Logo更适合通过可编辑图层添加，避免图像模型⽣成乱码或者错\n误信息。\n这个产品与通⽤⽣成⼯具的区别，是它能够调⽤商⼾资料、品牌规范、套餐数据和质量规\n则，并且有完整的确认和复盘流程。\n8.5 ⾼频QA\nQ\u0000：你使⽤过哪些⼯具？\n试点中主要结合DeepSeek、⾖包、即梦等⼯具验证⽂案、图⽚理解和图像⽣成能⼒，也了\n解Dify⼯作流以及Midjourney、Pika等⼯具的基本⽣产逻辑。\n我选择⼯具时不会只看⽣成效果，⽽会结合任务类型、中⽂理解、⻛格适配、⽣成稳定性、\n速度和使⽤成本判断。\nQ\u0000：多模态在项⽬中具体做什么？\n第⼀是识别菜单和菜品图；第⼆是理解商⼾参考图的⾊调、构图和⻛格；第三是辅助⽐较⽣\n成结果与真实菜品是否⼀致。\n它不仅⽤于⽣成图⽚，也参与需求理解和质量审核。\nQ\u0000：为什么不训练⾃⼰的模型？\n项⽬初期样本有限，直接训练或微调模型成本⾼，也缺少⾜够的授权数据。\n更合理的⽅式是先通过通⽤模型、参考图、Prompt和流程约束验证商业价值。等后续积累⾜\n够多的⾼质量标注数据后，再评估微调。\n九、字节经历第五点：Prompt 与质量体系\n9.1 回答思路\n必须讲清楚：\n·初期发⽣了什么问题；\n·如何分类；\n·测试了什么；\n·三层Prompt分别是什么；\n·如何定义质量；\n·最终结果怎样。\n9.2 ⾯试官考察⽅向\n·是否真正调试过；\n·是否会做AI评测；\n·是否能从失败中归因；\n·Prompt能否被团队复⽤；\n·是否理解Prompt的边界。\n9.3 注意事项\n不能只说“通过不断优化Prompt提升效果”。\n要讲具体结构和验收标准。\n9.4 逐字稿内容\n最初使⽤通⽤Prompt⽣成菜品图时，图⽚可能很好看，但经常存在核⼼⻝材变化、菜品分量\n失真、摆盘错误和不同批次⻛格不⼀致的问题。\n我先把问题分成真实性、视觉效果和品牌⼀致性三类，再测试了补充菜品描述、增加参考\n图、加⼊负向约束、拆分提⽰词层级和建⽴⻛格基准等5类⽅案。\n最终形成三层提⽰词结构。\n第⼀层是业务场景，包括菜系、菜品、⽬标⽤⼾、图⽚⽤途和尺⼨，解决“⽣成什么”。\n第⼆层是视觉⻛格，包括⾊调、构图、光线、背景、餐具和摆盘，解决“怎样呈现”。\n第三层是真实性约束，包括核⼼⻝材、分量、烹饪状态、禁⽌元素和常⻅变形，解决“哪些\n错误不能发⽣”。\n同时，批量⽣成之前先提供3版⻛格样⽚，让商⼾确认其中⼀版作为⻛格基准。\n在质量验收中，我们不只看美观，还检查菜品主体、核⼼⻝材、分量、烹饪状态、品牌⻛格\n和是否可上线。\n经过优化，菜品还原合格率从40%提升到85%，平均修改轮次由5轮下降到2⾄3轮。\n9.5 ⾼频QA\nQ\u0000：还原合格率怎么计算？\n试点阶段主要采⽤⼈⼯验收。\n每张图按照菜品主体是否正确、核⼼⻝材是否⽆明显新增或缺失、分量是否严重失真、烹饪\n状态是否⼀致，以及是否可以⽤于商⼾⻚⾯进⾏判断。\n合格图⽚数量除以参与验收的⽣成图⽚总数，得到还原合格率。\n后续如果系统化，我会将这些维度拆分成单项评分，并建⽴固定测试集。\nQ\u0000：为什么Prompt分层有效？\n因为不同问题对应不同层。\n⻝材错误时调整真实性层；⻛格不符时调整视觉层；内容⽤途改变时调整业务场景层。\n这样⽐⼀条不断加⻓的Prompt更容易维护、复⽤和定位问题。\nQ\u0000：Prompt是不是越⻓越好？\n不是。过⻓可能造成约束冲突，模型也可能忽略重点。\n关键是结构清晰、事实约束明确、优先级合理，并配合参考图和⼈⼯审核。\n⼗、字节经历第六点：竞品分析与套餐策略\n10.1 回答思路\n说明：\n·原来如何做；\n·数据从哪⾥来；\n·AI分析什么；\n·套餐怎样设计；\n·定价怎样控制⻛险；\n·最终结果是什么。\n10.2 ⾯试官考察⽅向\n·是否真正懂餐饮经营；\n·推荐是否有数据依据；\n·定价能否解释；\n·是否考虑成本和⽑利；\n·AI是否越权决策。\n10.3 注意事项\n19%是套餐、定价和视觉素材综合调整后的结果，不能全部归因于单个AI模块。\n10.4 逐字稿内容\n原来的竞品分析主要依靠运营⼈员在多个平台查询和⼿⼯整理，单商⼾的市场调研周期较\n⻓。\n我设计了标准化竞品档案，整理商⼾名称、距离、品类、客单价、套餐、价格、销量和⽤⼾\n评价。\nAI主要负责对⽤⼾评价进⾏分类和总结，并归纳商圈价格带、热销套餐结构和⽤⼾关注点。\n套餐策略分为引流款、主推款和利润款。引流款降低新客决策⻔槛，主推款承担主要成交，\n利润款提升客单和收益。\n价格不能完全交给⼤模型。菜品原价、成本、折扣和⽬标⽑利应通过结构化数据和规则测\n算，⼤模型主要负责说明市场差异、套餐定位和卖点。\n如果商⼾没有提供成本，就只能给市场参考区间，不能做利润承诺。\n通过标准化竞品档案和价格测算，单商⼾市场调研周期由约5天缩短到36⼩时内。套餐策略\n与视觉内容同步上线后，整体下单转化率较商⼾原有⾃定⽅案提升19%。\n10.5 ⾼频QA\nQ\u0000：竞品数据如何获得？\nMVP阶段主要通过运营⼈员在公开平台收集、商⼾提供资料、表格或截图导⼊，以及内部授\n权信息。\n没有默认使⽤未经授权的⾃动爬取。后续如果需要系统化接⼊，需要评估平台授权和接⼝能\n⼒。\nQ\u0000：套餐如何防⽌低于成本？\n录⼊成本后，通过规则计算价格下限和⽬标⽑利。\n如果缺少成本，则只输出市场价格参考，不显⽰确定性的⽑利结论。\n最终价格仍由商⼾和运营确认。\nQ\u0000：为什么内容产品要做套餐策略？\n因为⽤⼾是否下单不只取决于图⽚是否好看，也取决于套餐组合、价格和消费场景。\n如果只⽣成图⽚，可能得到⾼点击但低转化，所以经营策略和内容⽣产需要连接起来。\n⼗⼀、字节经历第七点：产品运营与内部推⼴\n11.1 回答思路\n重点说明：\n·如何把个⼈⽅法变成团队标准；\n·如何培训；\n·如</pre></div>", "r5": "<div class=\"freq-summary\">⭐ 全量数据脱口而出</div><h2>五、业务结果 <span class=\"freq-badge freq-3\">数据必背</span></h2><div style=\"max-height:70vh;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><pre style=\"white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.8;margin:0\">场调研周期从约5天缩短到36⼩时内；套餐和视觉⽅案综合上线后，下\n单转化率提升19%。\n第四是组织复⽤，将原来依赖个⼈的商⼾需求理解、⽣成和验收过程，沉淀为团队可以复⽤\n的模板和SOP。\n项⽬也存在不⾜。⾸先，试点商⼾数量有限，结果属于⽅向验证，不是⼤规模统计结论。\n其次，竞品数据主要依靠⼈⼯整理，⾃动数据接⼊没有完成。\n第三，质检以⼈⼯为主，完整⾃动质检仍然属于产品规划。\n第四，套餐、视觉、达⼈和投流可能同时变化，因此19%的提升是综合结果，⽆法完全归因\n于某⼀个功能。\n如果重新做，我会从第⼀天建⽴固定测试集、内容版本绑定和A/B测试，并进⼀步收敛\nMVP，优先做好需求诊断、内容⽣成和质量审核。\n⼗三、本地⻘年社交平台经历整体介绍\n该经历有三项核⼼数据：\n·设计10余条主题社交线路；\n·周均参与⽤⼾超过1000⼈；\n·累计签约50余家优质商⼾；\n·带动相关业务流⽔突破150万元。\n⾯试中不要强⾏包装成AI项⽬，它的价值在于证明⽤⼾洞察、场景产品、B端商⼾⽅案和商业\n化能⼒。\n⼗四、本地⻘年社交平台第⼀点：⽤⼾洞察与场景设计\n14.1 回答思路\n·⽤⼾有什么问题；\n·如何收集数据；\n·如何分层；\n·如何设计线路；\n·如何验证效果。\n14.2 ⾯试官考察⽅向\n·⽤⼾研究能⼒；\n·产品场景设计；\n·是否具备数据意识；\n·能否把模糊需求转成产品⽅案。\n14.3 注意事项\n未说明具体平台名称、⽤⼾分层模型和详细转化指标，不要编造DAU、留存率等数据。\n14.4 逐字稿内容\n在本地⻘年社交平台，我主要负责⽤⼾需求分析、主题社交线路设计和线下活动运营。\n⽤⼾表⾯上会表达“想认识朋友”或者“想参加有意思的活动”，但这些需求⾮常宽泛。不同\n⽤⼾在兴趣、年龄、活动强度、社交⽬的和消费能⼒上差异较⼤。\n我通过⽤⼾报名信息、活动参与情况、现场反馈和后续评价，提炼不同⼈群的核⼼需求，并\n将需求拆成活动主题、参与⼈数、场地、匹配⽅式和互动环节。\n基于这些分析，我设计了10余条主题社交线路，并梳理从活动曝光、报名、筛选、参与到反\n馈的全流程，沉淀成可复⽤的场景化SOP。\n通过持续优化主题和流程，平台周均参与⽤⼾超过1000⼈。\n这段经历让我形成了将模糊⽤⼾需求转化成结构化场景⽅案的能⼒，这也是后来设计AI需求\n诊断的重要基础。\n14.5 ⾼频QA\nQ\u0000：你如何设计⼀条新的社交线路？\n先明确⽬标⽤⼾和社交⽬标，再确定场景和活动主题。\n例如⽤⼾是初⼊城市的年轻⼈，需求不只是参加活动，⽽是希望降低陌⽣⼈交流压⼒。因此\n流程中需要设计⼩组机制、破冰任务和⾃然互动环节，⽽不是简单把⼈聚到⼀个场地。\nQ\u0000：如何判断⼀条线路是否成功？\n需要综合看报名、到场、活动反馈和后续复购或推荐。\n原材料没有保留完整指标⼝径，所以正式⾯试时只能使⽤⾃⼰能够核实的数据。不能为了显\n得专业临时编造留存率和复购率。\nQ\u0000：⽤⼾反馈很主观，怎么处理？\n先将反馈按活动内容、场地、⼈员匹配、节奏和服务等主题分类，再结合实际参与数据判\n断。\n单个⽤⼾意⻅作为参考，多次重复出现的问题才进⼊标准流程优化。\n⼗五、本地⻘年社交平台第⼆点：商⼾合作与商业增⻓\n15.1 回答思路\n·商⼾为什么合作；\n·⽅案如何定制；\n·⽤⼾和商⼾如何形成闭环；\n·结果是什么。\n15.2 ⾯试官考察⽅向\n·B端⽅案能⼒；\n·商业化能⼒；\n·资源整合；\n·能否兼顾⽤⼾体验和商⼾价值。\n15.3 逐字稿内容\n平台开展线下社交活动，需要餐饮、休闲娱乐和场地类商⼾合作。\n我会先判断商⼾希望获得的是客流、曝光、活动内容还是⻓期年轻⽤⼾，然后根据商⼾类型\n设计不同合作⽅式。\n例如餐饮商⼾可以成为主题线路中的消费节点，活动场地可以通过联合活动获取稳定客流，\n消费品牌则可以通过赞助或权益植⼊实现曝光。\n我不只是销售固定资源，⽽是将⽤⼾活动、商⼾权益和平台收⼊组合成完整⽅案。\n最终累计签约50余家优质商⼾，带动平台相关业务流⽔突破150万元。\n这段经历提升了我将客⼾商业诉求转化为具体场景和产品⽅案的能⼒。\n15.4 ⾼频QA\nQ\u0000：如何说服商⼾合作？\n关键不是介绍平台有什么资源，⽽是说明商⼾能够获得什么结果。\n我会结合活动⽤⼾、商⼾位置、消费场景和合作成本，给出具体⽅案，并通过⼩规模活动先\n验证效果。\nQ\u0000：⽤⼾体验和商业化冲突怎么办？\n商⼾植⼊必须与⽤⼾场景⾃然匹配。\n如果为了商业收⼊强⾏增加与活动⽆关的消费环节，可能伤害⽤⼾体验，⻓期也会影响商⼾\n效果。\n所以我会优先选择能够增强活动体验的商⼾合作。\n⼗六、本地⻘年社交平台第三点：流程产品化\n16.1 回答思路\n从“依赖⼈”升级到“依赖流程”：\n·哪些环节容易出问题；\n·怎样标准化；\n·如何⽀持复制；\n·对AI产品有什么迁移价值。\n16.2 ⾯试官考察⽅向\n·流程抽象能⼒；\n·标准化能⼒；\n·是否具备产品思维；\n·能否减少个⼈依赖。\n16.3 逐字稿内容\n随着活动和商⼾数量增加，如果每⼀场活动都依靠个⼈经验，执⾏质量很难稳定。\n因此，我将流程拆成活动策划、⽤⼾报名、⼈员筛选、商⼾协调、现场执⾏和反馈复盘⼏个\n阶段，并明确每个阶段的输⼊、责任⼈、交付物和异常处理。\n同时，我将成功线路沉淀成模板，后续可以根据⽤⼾⼈群、场地和主题进⾏调整，⽽不是从\n零设计。\n这类经验后来可以直接迁移到AI产品中。AI⼯作流同样需要明确输⼊、节点、规则、异常和\n最终验收，⽽不是只调⽤⼀次模型。\n⼗七、拓浦集团经历整体介绍\n拓浦集团经历重点是流程标准化和数据化，不要把它讲成普通⾏政⼯作。\n已⽀持的结果为：\n·⼈⼒流程整体执⾏效率提升40%；\n·⼈⼒管理⻛险事件发⽣率降低30%。\n⼗⼋、拓浦集团第⼀点：流程诊断与标准化\n18.1 回答思路\n·原来流程有什么问题；\n·如何调研；\n·如何拆解；\n·输出什么；\n·效率如何改善。\n18.2 ⾯试官考察⽅向\n·复杂流程梳理能⼒；\n·需求调研能⼒；\n·规则意识；\n·是否真正改变业务。\n18.4 逐字稿内容\n在拓浦集团，我发现招聘、⼊职、考勤、绩效和⼈员变动等流程⽐较碎⽚化，不同部⻔的执\n⾏标准也不完全⼀致。\n我先访谈流程负责⼈和实际执⾏⼈员，梳理每个流程中的⻆⾊、输⼊资料、审批节点、状态\n和异常情况。\n之后将流程拆成标准步骤，明确每个环节由谁负责、需要提交什么、什么条件下可以进⼊下\n⼀步，以及异常时如何处理，并输出完整操作⼿册。\n通过统⼀表单、操作规范和任务节点，减少了重复确认和遗漏，使整体流程执⾏效率提升\n40%。\n这段经历让我建⽴了⽐较强的流程和规则意识，也让我理解产品设计不能只设计正常路径，\n还必须考虑异常路径。\n⼗九、拓浦集团第⼆点：数据看板与⻛险预警\n19.1 回答思路\n·数据为什么分散；\n·看板展⽰什么；\n·⻛险如何识别；\n·怎样形成处理闭环；\n·结果怎样。\n19.2 ⾯试官考察⽅向\n·数据产品意识；\n·指标设计；\n·⻛险管理；\n·看板是否真正被使⽤。\n19.3 逐字稿内容\n除了流程标准化，我还将⼈员状态、招聘进度、考勤异常和⻛险事件等数据进⾏集中整理，\n搭建⼈⼒运营看板。\n看板的价值不只是展⽰数据，⽽是帮助管理⼈员快速识别哪些任务超期、哪些资料缺失，以\n及哪些⼈员状态存在异常。\n我还为不同异常设置⻛险标记、责任⼈和处理状态，使问题从发现到跟进形成闭环。\n通过数据监控和预警，⼈⼒管理⻛险事件发⽣率降低30%。\n⼆⼗、拓浦集团第三点：对 AI 产品能⼒的迁移\n回答思路\n不要说⼈事经历直接就是AI经验，⽽要解释能⼒迁移：\n·流程节点；\n·规则判断；\n·状态流转；\n·异常预警；\n·⼈⼯确认。\n逐字稿内容\n这段经历虽然不是AI项⽬，但让我掌握了将线下业务拆成数据输⼊、规则判断、任务流转、\n异常预警和结果反馈的能⼒。\n后来设计AI产品时，我也会按照相同逻辑思考：哪些信息由⽤⼾输⼊，哪些内容由模型⽣\n成，哪些规则必须强校验，什么情况需要⼈⼯确认，以及失败后如何处理。\n因此，它为我后续做AI⼯作流和⼈机协同产品奠定了⽐较扎实的流程基础。\n⼆⼗⼀、菜⻦⽂化传媒创业经历整体介绍\n创业经历⽀持的事实包括：\n·聚焦“⼤学+⻘年⽂化”赛道；\n·从0到1落地线下⽂娱业务；\n·优化产品与运营策略；\n·单店⽉利润从1.5万元提升到5万元；\n·拓展校园社团、⾳乐节和消费品牌等资源。\n没有说明团队⼈数、总营收、融资和最终结束原因，不能补造。\n⼆⼗⼆、创业经历第⼀点：产品定位与 MVP 验证\n22.1 回答思路\n·为什么选这个市场；\n·⽤⼾问题是什么；\n·第⼀版怎么做；\n·如何验证；\n·如何迭代。\n22.2 ⾯试官考察⽅向\n·创业是否真实；\n·从0到1能⼒；\n·⽤⼾和市场判断；\n·是否有MVP意识；\n·是否只讲宏观故事。\n22.3 逐字稿内容\n创业阶段，我们聚焦⼤学⽣和⻘年⽂化市场，主要解决年轻⽤⼾线下娱乐和社交场景较单⼀\n的问题。\n前期通过⽤⼾沟通、活动反馈和实际消费观察，判断年轻⽤⼾不仅需要活动内容，也需要更\n加⾃然的社交和⽂化体验。\n我参与完成业务定位、活动产品、服务流程、定价和场地运营，并通过⼩规模活动验证⽤⼾\n参与和付费意愿，再根据反馈调整产品。\n这段经历让我较早建⽴了MVP意识。不是⼀开始投⼊⼤量资源做完整⽅案，⽽是先通过低成\n本⽅式验证需求和商业模式。\n22.4 ⾼频QA\nQ\u0000：创业中你具体负责什么？\n我主要参与产品与运营策略、⽤⼾需求、资源合作、活动落地和经营结果。\n正式⾯试时还需要根据真实分⼯补充团队⻆⾊，不能泛化成所有事情都由⾃⼰完成。\nQ\u0000：如何判断市场需求？\n不只看⽤⼾说感兴趣，⽽是看是否实际报名、参与和付费。\n创业项⽬最终需要通过真实消费和复购判断，⽽不是只依赖访谈态度。\n⼆⼗三、创业经历第⼆点：经营策略与利润增⻓\n23.1 回答思路\n·原来利润为什么低；\n·调整了什么；\n·怎样验证；\n·结果怎样。\n23.2 ⾯试官考察⽅向\n·商业敏感度；\n·是否理解利润；\n·是否有数据驱动；\n·能否对结果负责。\n23.4 逐字稿模板\n项⽬早期单店⽉利润约为1.5万元，主要问题是【请补充真实原因，例如活动产品单⼀、排期\n利⽤率不⾜、客单较低或获客成本较⾼】。\n我们随后从产品组合、活动排期、⽤⼾运营和定价等⽅⾯进⾏优化。\n具体包括【补充真实做法】，并根据不同产品的获客和利润作⽤进⾏分层，⽽不是所有活动使\n⽤相同定价和资源。\n经过持续调整，单店⽉利润由1.5万元提升到5万元。\n这段经历让我形成了⽐较强的商业结果意识，做产品时不仅关注⽤⼾使⽤，也会关注成本、\n收⼊和可持续性。\n⼆⼗四、创业经历第三点：资源整合与团队协作\n24.1 回答思路\n·需要哪些外部资源；\n·如何找到；\n·如何设计合作；\n·如何保证交付。\n24.2 逐字稿内容\n线下⽂娱项⽬需要校园社团、⾳乐节、消费品牌、活动场地和内容团队等多⽅资源。\n我会根据不同合作⽅的⽬标设计合作⽅式。校园社团更关注活动内容和学⽣参与，消费品牌\n关注⽤⼾曝光和转化，场地⽅关注客流和场地利⽤率。\n我的⼯作是将不同诉求组合成⼀套可执⾏⽅案，并协调权益、排期和现场交付。\n这段经历提升了我的商务谈判和跨组织协作能⼒，也让我习惯在资源有限、信息不完整的情\n况下推动项⽬落地。\n⼆⼗五、AI 及 AIGC 技能⾯试逐字稿\n简历中的技能包括：\n·结构化提⽰词和Few-shot；\n·DeepSeek、⾖包、即梦；\n·SOP、质量校验、Excel和⻜书；\n·Dify⼯作流；\n·对Midjourney、Pika等⼯具⽣产逻辑的了解。\n\u0000\u0000.\u0000 Prompt能⼒\n回答思路\n不能只说“会写Prompt”，要讲结构、变量、⽰例、约束和评测。\n逐字稿\n我理解的Prompt⼯程，不是单纯写⼀段很⻓的指令，⽽是将业务⽬标转换成稳定、可复⽤的\n输⼊结构。\n⼀般会包括⻆⾊和任务、业务上下⽂、输⼊数据、输出格式、强约束、负向约束和Few-shot\n⽰例。\n对餐饮图⽚，我使⽤业务场景、视觉⻛格和真实性约束三层结构；对⽂案，则会把商⼾名\n称、价格和菜品设置为固定事实字段，将语⽓和卖点作为可⽣成字段。\nPrompt是否有效，需要通过固定案例和验收指标测试，⽽不是只凭⼀次结果判断。\nQA：什么是Few-shot？\nFew-shot是在Prompt中提供少量⾼质量输⼊和输出⽰例，帮助模型理解任务格式和判断标\n准。\n它适合格式稳定、表达规则明确的任务，但⽰例需要有代表性，不能只放最理想案例。\n25.2 模型和⼯具选择\n回答思路\n体现任务适配，不要进⾏空泛⼯具排名。\n逐字稿\n选择模型或⼯具时，我会先看任务。\n⽂案和需求分析重点关注中⽂理解、逻辑和结构化输出；视觉⽣成重点关注参考图理解、⻛\n格稳定和局部编辑；⼯作流则关注节点编排、变量管理和失败重试。\n同时还要考虑速度、成本、稳定性、数据安全和团队使⽤⻔槛。\n我不会因为某个模型整体能⼒强，就默认所有任务都使⽤同⼀个模型，⽽是根据场景做组\n合。\n\u0000\u0000.\u0000 Dify及⼯作流\n逐字稿\n我了解Dify的基础⼯作流逻辑，包括输⼊变量、Prompt节点、模型调⽤、条件分⽀、知识检\n索和⼯具节点。\n在餐饮项⽬中，如果进⼀步系统化，可以将商⼾资料解析、缺失信息判断、套餐⽣成、⽂案\n⽣成和审核拆成不同节点。\n当前我的能⼒重点在⼯作流和产品⽅案层，复杂部署和底层开发仍需要研发⽀持，我不会将\n⾃⼰包装成能够独⽴完成完整⼯程实现。\n\u0000\u0000.\u0000 AI评测\n逐字稿\n我会将评测分成效率、质量和业务三个层⾯。\n效率包括⽣成时间和修改轮次；质量包括事实准确、菜品还原、⻛格⼀致和内容通过率；业\n务包括内容采⽤率、点击、下单和核销。\n对AI产品来说，模型⽣成结果并不是最终指标。只有输出被⽤⼾采⽤、通过审核并帮助完成\n业务任务，才说明产品有价值。\n\u0000 words\n</pre></div>", "q1": "<h2>Agent与工具调用</h2><ol><li><b>大模型 vs Agent</b>：前者只能说，后者能做。模型说完成≠真完成。</li><li><b>AI四层次</b>：内容生成→知识问答→辅助执行→自主执行。餐饮项目在第三层。</li><li><b>Agent 5要素</b>：目标、环境、行动、观察、持续执行。</li><li><b>API/FC/MCP/RPA</b>：API最稳定；FC结构化调用；MCP连接协议；RPA模拟点击(最后手段)。</li><li><b>金句</b>：确定性任务交程序，模糊理解交模型，高风险决策交人。</li></ol>", "q2": "<h2>RAG与企业知识库</h2><ol><li><b>RAG三环节</b>：检索→增强→生成。</li><li><b>Prompt vs RAG</b>：Prompt定怎么答，RAG提供答什么。</li><li><b>微调vs RAG</b>：常变知识用RAG，稳定模式才微调。</li><li><b>关键词vs向量</b>：精确用关键词，语义用向量，企业用混合。</li><li><b>权限</b>：检索前过滤，不能靠模型自觉。</li></ol>", "q3": "<h2>需求文档重点</h2><ol><li><b>产品定位</b>：需求理解→经营策略→内容生产→质量审核→数据优化闭环。</li><li><b>V1范围</b>：做了需求诊断/竞品/套餐/文案视觉/审核/确认/导出/复盘；没做自动爬取/发布/动态调价。</li></ol>", "q4": "<h2>🔴 两篇重合重点</h2><p>以下概念在产品逐字稿和简历逐字稿中同时出现，面试官在不同环节都可能追问。</p><table style=\"width:100%;font-size:12px;border-collapse:collapse\"><tr style=\"background:#f8fafc\"><th>概念</th><th>出现板块</th></tr><tr><td>入驻不等于经营</td><td>p1/p6/p7 + r2</td></tr><tr><td>三层Prompt+3版样片</td><td>p3/p7 + r2/r4</td></tr><tr><td>菜品真实性(40%→85%)</td><td>p3 + r2/r4</td></tr><tr><td>商务经理→AI产品负责人</td><td>p2 + r2/r4</td></tr><tr><td>全量数据四层结构</td><td>p4 + r5</td></tr><tr><td>内部推广(~50人)</td><td>p4 + r4</td></tr><tr><td>竞品分析+套餐三档</td><td>p3 + r4</td></tr><tr><td>为什么不用Agent/RAG</td><td>p5 + r4/r5</td></tr></table>", "q5": "<h2>AI产品设计方法</h2><ol><li><b>AI vs 传统软件</b>：传统=确定性规则；AI=概率性输出。</li><li><b>8阶段流程</b>：业务发现→AI适用性判断→任务拆解→能力分配→流程交互→能力建设→评测→MVP迭代。</li><li><b>分层评测</b>：数据层→模型层→检索层→Agent层→业务层。</li><li><b>MVP原则</b>：用最小范围验证完整价值闭环。</li></ol>"};
